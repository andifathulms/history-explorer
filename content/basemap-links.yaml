# Which snapshot polygon illustrates which polity.
#
# This is a claim and it lives in content rather than in code. The polygon is an
# illustration, never a measure: hard rule 5 forbids computing km2 from these
# shapes or reconciling them with the cited extent figures. They will disagree
# with the cited figures, and that is expected and correct.
#
# `snapshot` is the nearest available snapshot year to the polity's peak, not
# the peak. The difference is shown in the UI on every map, never in a footnote.
# BC snapshots carry the dataset's own `bc` prefix.
#
# scripts/trim-basemaps.mjs reads this file to decide what to fetch and what
# region of each snapshot to keep, so adding a link here and re-running
# `npm run basemaps` is the whole workflow.
#
# Polities with no entry:
#   akkadian, median, kushan, rashidun, tahirid, ghurid, tulunid, ikhshidid,
#   hamdanid, rustamid, karakhanid, zangid, ayyubid, rum, jin, majapahit
#
# Sixteen polities have no entry because no feature in any nearby snapshot
# names them. The dataset draws the large states of each period and folds the
# rest into whichever neighbour formally held the ground: the Tahirids and
# Rustamids appear inside the Abbasid and Aghlabid polygons, the Ayyubids and
# Zangids inside their neighbours, the Rashidun inside the Umayyad snapshot
# that follows them. That is the dataset being right about formal authority,
# and the map correctly has nothing of its own to draw.

links:
  - polity: egypt-new-kingdom
    snapshot: bc1500
    peak_year: -1450
    features: [Egypt]

