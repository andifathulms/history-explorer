           administration and much of its army; his house kept both running for
           three generations."
    source: chi-6
    contested: false

  - from: jalayirid
    to: karakoyunlu
    type: conquered by
    year: 1432
    note: "Qara Yusuf killed Sultan Ahmad in 1410 and took Baghdad and Tabriz;
           the remnant of the house held Basra until Husayn II was killed
           twenty-two years later."
    source: chi-6
    contested: false

  - from: karakoyunlu
    to: akkoyunlu
    type: conquered by
    year: 1468
    note: "Uzun Hasan defeated and killed Jahan Shah at Chapakchur in 1467, and
