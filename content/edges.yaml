# Every succession edge. This is the core object of the site: the thing that
# lives between the Wikipedia articles and that no reference work exposes.
#
# An edge is a claim about causation and is held to the same sourcing standard
# as prose. Where scholarship disagrees on the nature of a transition, both
# edges are recorded and both are marked contested, rather than one being
# picked. `note` is one sentence and must say what actually happened, not
# restate the type.
#
# Direction: `from` is the earlier polity, `to` is the later one. The type
# describes what `to` was or did with respect to `from`.

edges:
  # ---- What the conquests arrived in ----

  - from: sasanian
    to: rashidun
    type: conquered by
    year: 651
    note: "The Sasanian field army was broken at al-Qadisiyya in 636 and
           Ctesiphon fell, after which the empire was unwound province by
           province until Yazdegerd III was murdered at Merv."
    source: donner-1981
    contested: false

  - from: sasanian
    to: buyid
    type: claimed legitimacy of
    year: 962
    note: "The Buyid amirs, ruling Iraq and western Iran with the caliph in
           their keeping, revived the Sasanian title shahanshah as a claim on
           the Iranian monarchy the Arabs had ended."
    source: busse-1975
    contested: false

  # ---- Inside the caliphates: one office, three houses ----

  - from: medina-umma
    to: rashidun
    type: claimed legitimacy of
    year: 632
    note: "Abu Bakr was acclaimed khalifat rasul Allah, successor of the
           Messenger of God, taking his authority explicitly as the continuation
           of an office whose holder had died without naming anyone to it."
    source: madelung-1997
    contested: false

  - from: rashidun
    to: umayyad
    type: overthrew
    year: 661
    note: "Mu'awiya, Uthman's kinsman and governor of Syria for twenty years,
           fought Ali to a stalemate at Siffin and took the caliphate when Ali
           was murdered and his son Hasan came to terms."
    source: madelung-1997
    contested: false

  - from: rashidun
    to: umayyad
    type: claimed legitimacy of
    year: 661
    note: "Mu'awiya took the titles khalifa and amir al-mu'minin unchanged,
           presenting the Umayyad accession as the continuation of the Medinan
           caliphate rather than the founding of a dynasty."
    source: hawting-2000
    contested: false

  - from: rashidun
    to: abbasid
    type: claimed legitimacy of
    year: 750
    note: "The Abbasids justified their rising as the restoration of a rightly
           guided caliphate the Umayyads had usurped, claiming the Medinan
           office directly over the dynasty that had held it in between."
    source: kennedy-2004
    contested: false

  - from: umayyad
    to: abbasid
    type: overthrew
    year: 750
    note: "A Khurasani army raised for twenty years in the name of an unnamed
           member of the Prophet's house destroyed Marwan II at the Great Zab,
           after which the candidate was revealed to be an Abbasid."
    source: hawting-2000
    contested: false

  # ---- The caliphate delegates, and keeps delegating ----
  - from: abbasid
    to: tahirid
    type: vassal of
    year: 821
    note: >-
      Tahir b. al-Husayn was made governor of Khurasan as the reward for winning
      al-Ma'mun's civil war, and his family held the governorship for fifty
      years without ever formally ceasing to be governors.
    source: iranica-taherids
    contested: false

  - from: tahirid
    to: samanid
    type: vassal of
    year: 819
    note: >-
      The four grandsons of Saman Khuda received their Transoxianan
      governorships under Tahirid authority, so the Samanids began as vassals of
      the vassals.
    source: bosworth-1996
    contested: false

  # ---- 873: the Tahirid collapse opens the whole thread ----
  - from: tahirid
    to: saffarid
    type: overthrew
    year: 873
    note: >-
      Ya'qub b. al-Layth took Nishapur and captured Muhammad b. Tahir, having
      been refused the appointment he had asked Baghdad for and taken the
      province regardless.
    source: bosworth-1994
    contested: false

  - from: saffarid
    to: samanid
    type: conquered by
    year: 900
    note: >-
      Isma'il b. Ahmad defeated and captured Amr b. al-Layth at Balkh, after
      which the caliph transferred the governorship of Khurasan from the
      Saffarids to the Samanids.
    source: iranica-samanids
    contested: false

  # ---- The Samanid slave establishment produces its own successor ----
  - from: samanid
    to: ghaznavid
    type: slave-general of
    year: 962
    note: >-
      Alptigin, a Samanid Turkic slave-general who had backed the losing
      candidate at Bukhara, withdrew east and seized Ghazna, founding a line
      that outlasted his masters.
    source: bosworth-1963
    contested: false

  - from: samanid
    to: ghaznavid
    type: claimed legitimacy of
    year: 999
    note: >-
      After Bukhara fell the Ghaznavids kept Khurasan and presented themselves
      publicly as the rightful continuation of the Samanid state, inheriting its
      chancery, its administrative Persian and its slave-soldier system intact.
    source: bosworth-1963
    contested: false

  - from: samanid
    to: karakhanid
    type: conquered by
    year: 999
    note: >-
      The Karakhanids took Bukhara with little fighting and kept Transoxiana,
      claiming nothing from the dynasty they had ended.
    source: iranica-samanids
    contested: false

  # ---- The Buyids, arriving from outside the Khurasani sequence ----
  - from: abbasid
    to: buyid
    type: vassal of
    year: 945
    note: >-
      Ahmad b. Buya entered Baghdad, took the title amir al-umara and left the
      caliph on the throne, holding a formal grant for everything he had already
      taken by force.
    source: busse-1975
    contested: false

  # ---- Dandanaqan, and the sultanate changing hands ----
  - from: ghaznavid
    to: great-seljuk
    type: conquered by
    year: 1040
    note: >-
      A Ghaznavid army marched around Khurasan without adequate water broke
      against the Seljuk Turkmen at Dandanaqan, and the richest province in the
      eastern Islamic world changed hands in a single engagement.
    source: bosworth-1968
    contested: false

  - from: buyid
    to: great-seljuk
    type: overthrew
    year: 1055
    note: >-
      Tughril Beg entered Baghdad, arrested al-Malik al-Rahim and received the
      sultanate from the caliph — the same transaction in the same building as
      945, with the confession of the incoming power reversed.
    source: busse-1975
    contested: false

  # ---- The Ghurids: client house eats overlord ----
  - from: ghaznavid
    to: ghurid
    type: vassal of
    year: 1011
    note: >-
      Mahmud of Ghazna campaigned into Ghur and imposed vassalage on the
      Shansabani chiefs, whose conversion and political standing both date from
      that subordination.
    source: iranica-ghurids
    contested: false

  - from: ghaznavid
    to: ghurid
    type: overthrew
    year: 1186
    note: >-
      Mu'izz al-Din of Ghur took Lahore and ended the line, a hundred and
      seventy-five years after Ghazna had made his house its client.
    source: bosworth-1977
    contested: false

  - from: ghurid
    to: delhi-sultanate
    type: slave-general of
    year: 1206
    note: >-
      Mu'izz al-Din died without a son and his Turkish slave-generals kept the
      Indian conquests; Qutb al-Din Aibak held Delhi and Lahore, and the line
      that followed him ruled northern India for three centuries.
    source: jackson-1999
    contested: false

  # ---- Khwarazm: the appointment that outgrew the appointer ----
  - from: great-seljuk
    to: khwarazmian
    type: vassal of
    year: 1077
    note: >-
      Malik-Shah gave the governorship of Khwarazm to Anushtigin Gharchai, a
      Turkish slave of the royal household, and the post became hereditary
      within two generations.
    source: iranica-khwarazmshahs
    contested: false

  - from: great-seljuk
    to: khwarazmian
    type: overthrew
    year: 1194
    note: >-
      Ala al-Din Tekish killed Tughril III near Rayy, ending the Seljuk
      sultanate of Iran at the hands of an office the Seljuks had themselves
      created.
    source: bosworth-1968
    contested: false

  - from: great-seljuk
    to: khwarazmian
    type: claimed legitimacy of
    year: 1194
    note: >-
      Having extinguished the sultanate, the Khwarazmshahs took its titulature
      and chancery style and presented their rule as its continuation rather
      than its replacement.
    source: bosworth-1968
    contested: false

  - from: karakhanid
    to: khwarazmian
    type: conquered by
    year: 1212
    note: >-
      Ala al-Din Muhammad II took Samarkand and ended the western Karakhanid
      line, briefly reuniting Transoxiana with Khurasan under one power for the
      first time since 999.
    source: ei2-karakhanids
    contested: false

  - from: ghurid
    to: khwarazmian
    type: conquered by
    year: 1215
    note: >-
      Firuzkuh fell to Ala al-Din Muhammad of Khwarazm, nine years after Mu'izz
      al-Din's death had left the Ghurid state without a centre.
    source: iranica-ghurids
    contested: false

  # ---- 1231 ----
  - from: khwarazmian
    to: mongol
    type: conquered by
    year: 1220
    note: >-
      The Mongol invasion reduced Otrar, Bukhara, Samarkand and Gurganj in
      turn against an army its ruler had chosen to distribute rather than
      concentrate, and Ala al-Din Muhammad died on a Caspian island with no
      territory left.
    source: iranica-khwarazmshahs
    contested: false

  # ---- Contested: the Saffarid ending ----
  #
  # Two readings of the same century, both in the literature, neither of which
  # this site is in a position to adjudicate. Recorded as two edges, both
  # marked contested, per PRD section 5. Whether the imperial Saffarid state
  # ends at Balkh in 901 or the Saffarid polity ends at Mahmud's deposition of
  # Khalaf in 1003 depends on whether "the Saffarids" names the claimant to
  # Khurasan or the family that went on ruling Sistan.
  - from: saffarid
    to: samanid
    type: absorbed remnants of
    year: 901
    note: >-
      On one reading the Saffarid state ends with Amr's defeat and the Samanids
      absorb what was left of it, leaving the Sistani maliks as a local
      survival rather than a continuation of the same polity.
    source: iranica-saffarids
    contested: true

  - from: saffarid
    to: ghaznavid
    type: absorbed remnants of
    year: 1003
    note: >-
      On the other reading the Saffarids continue as the maliks of Nimruz for a
      further century and the dynasty ends only when Mahmud of Ghazna deposes
      Khalaf b. Ahmad.
    source: bosworth-1994
    contested: true

  # ---- The Islamic west leaves, and stays gone ----

  - from: umayyad
    to: cordoba
    type: claimed legitimacy of
    year: 929
    note: "Abd al-Rahman III took the titles caliph and amir al-mu'minin at
           Cordoba, asserting that the Umayyad house rather than the Abbasids
           held the office his ancestors had lost in 750."
    source: kennedy-1996
    contested: false

  - from: abbasid
    to: aghlabid
    type: vassal of
    year: 800
    note: "Harun al-Rashid granted Ifriqiya to Ibrahim ibn al-Aghlab as a
           hereditary governorship in exchange for tribute and the khutba,
           the first province converted into a client at the empire's height."
    source: abun-nasr-1987
    contested: false

  - from: aghlabid
    to: fatimid
    type: overthrew
    year: 909
    note: "The Kutama Berber army raised by the Isma'ili missionary Abu Abdallah
           al-Shi'i destroyed the Aghlabid emirate and delivered Ifriqiya to a
           caliph who had not yet arrived in it."
    source: halm-1996
    contested: false

  - from: rustamid
    to: fatimid
    type: conquered by
    year: 909
    note: "Tahert was taken by the same Kutama advance, ending the longest-lived
           Kharijite state."
    source: halm-1996
    contested: false

  - from: almoravid
    to: almohad
    type: overthrew
    year: 1147
    note: "Ibn Tumart's movement declared the Almoravids unbelievers on doctrinal
           grounds and took Marrakesh, replacing an enforcement of Maliki law
           with a caliphate founded on a claim to be the mahdi."
    source: bennison-2016
    contested: false

  # ---- Egypt, Syria and the Jazira: now two regions, one edge list ----

  - from: abbasid
    to: tulunid
    type: seceded from
    year: 868
    note: "Ahmad ibn Tulun, sent from Samarra as a deputy governor, took control
           of Egypt's revenue and stopped remitting it, while keeping the
           caliph's name on the coinage."
    source: petry-1998
    contested: false

  - from: tulunid
    to: ikhshidid
    type: absorbed remnants of
    year: 935
    note: "After thirty years of restored Abbasid rule, Muhammad ibn Tughj
           reassembled the Tulunid arrangement in Egypt under a new family and
           an old Central Asian title."
    source: petry-1998
    contested: false

  - from: ikhshidid
    to: fatimid
    type: conquered by
    year: 969
    note: "The Fatimids took Egypt at the fourth attempt, against a divided court
           and a failed harvest, a year after the death of the eunuch Kafur."
    source: brett-2017
    contested: false

  - from: fatimid
    to: ayyubid
    type: overthrew
    year: 1171
    note: "Saladin, appointed Fatimid vizier as the nephew of a Syrian
           expeditionary commander, dismantled the Isma'ili establishment and
           had the khutba in Cairo preached for the Abbasid caliph."
    source: humphreys-1977
    contested: false

  - from: zangid
    to: ayyubid
    type: absorbed remnants of
    year: 1174
    note: "Saladin took Damascus from Nur al-Din's heirs within months of his
           death, inheriting both the unified Syria and the counter-crusade
           programme built to use it."
    source: hillenbrand-1999
    contested: false

  - from: ayyubid
    to: mamluk-sultanate
    type: overthrew
    year: 1250
    note: "The Bahriyya regiment of Kipchak slave soldiers defeated a Crusade,
           then killed the sultan's heir Turanshah and took the sultanate."
    source: petry-1998
    contested: false

  - from: abbasid
    to: mamluk-sultanate
    type: claimed legitimacy of
    year: 1261
    note: "Baybars installed a survivor of the Abbasid house at Cairo as caliph
           and had himself invested by him, reviving three years after Baghdad
           an office with no territory and considerable value."
    source: el-hibri-2021
    contested: false

  - from: marwanid
    to: great-seljuk
    type: conquered by
    year: 1085
    note: "Fakhr al-Dawla ibn Jahir, the Marwanids' own former vizier, persuaded
           Malikshah that Diyar Bakr was worth taking and led the campaign that
           took it, sending a century's accumulated treasury to Isfahan."
    source: kennedy-2004
    contested: false

  - from: great-seljuk
    to: burid
    type: seceded from
    year: 1104
    note: "Toghtekin, atabeg to the Seljuk prince Duqaq of Damascus, kept the
           city on his ward's death instead of passing it to the heir, and
           married the prince's mother."
    source: el-azhari-1997
    contested: false

  - from: burid
    to: zangid
    type: absorbed remnants of
    year: 1154
    note: "Nur al-Din took Damascus after a six-year blockade and argument rather
           than a storming; the gates were opened from inside and Mujir al-Din
           Abaq was pensioned with Homs."
    source: el-azhari-1997
    contested: false

  - from: hamdanid
    to: uqaylid
    type: absorbed remnants of
    year: 996
    note: "The Banu Uqayl, settled in the Jazira by the Buyids as a counterweight
           to the Kurds, took Mosul instead and ended the Hamdanid line there
           six years after being hired to guard its approaches."
    source: kennedy-2004
    contested: false

  - from: mirdasid
    to: uqaylid
    type: absorbed remnants of
    year: 1080
    note: "Aleppo, unprotected against Turkmen raiding by its own emirs, invited
           Muslim ibn Quraysh of Mosul to take the city, and Sabiq ibn Mahmud
           gave it up without a siege."
    source: zakkar-1971
    contested: false

  - from: uqaylid
    to: great-seljuk
    type: conquered by
    year: 1096
    note: "Kerbogha took Mosul in the confusion after Malikshah's death and made
           himself its atabeg, two years before losing the relief army for
           Antioch to the First Crusade."
    source: wilson-2023
    contested: false

  - from: fatimid
    to: mirdasid
    type: vassal of
    year: 1025
    note: "Salih ibn Mirdas took Aleppo and had the khutba read for the Fatimid
           imam, receiving Cairo's recognition and a Fatimid title for it; the
           acknowledgement was renewed, withdrawn and sold again by his
           successors for the next forty-five years."
    source: zakkar-1971
    contested: false

  - from: great-seljuk
    to: mirdasid
    type: vassal of
    year: 1071
    note: "Alp Arslan besieged Aleppo on his way north to Manzikert and Mahmud
           ibn Nasr submitted, moving the khutba from the Fatimid imam to the
           Abbasid caliph and the Seljuk sultan."
    source: wilson-2023
    contested: false

  - from: great-seljuk
    to: rum
    type: partitioned from
    year: 1077
    note: "Suleyman ibn Qutalmish, from a Seljuk line that had lost a succession
           war against the main house, established himself in the Anatolia
           opened by Manzikert."
    source: peacock-yildiz-2013
    contested: false

  # ---- The three kingdoms Rome wound up, and one claim on Persia ----

  # None of these three has an edge to another polity in its own region. Each
  # ends against Rome and each does so differently, which is the point of
  # entering all three together: a monarchy abolished outright, a kingdom left
  # by will, and a king hunted to the Crimea.
  - from: antigonid
    to: roman
    type: conquered by
    year: -168
    note: >-
      Aemilius Paullus destroyed the army at Pydna. Rome abolished the monarchy
      rather than replacing the king, divided Macedonia into four republics
      forbidden to trade or intermarry across the new borders, and closed the
      mines.
    source: errington-1990
    contested: false

  # `absorbed remnants of` rather than `conquered by`: the kingdom was
  # bequeathed, and the four-year war that followed was against a pretender
  # rather than against this record.
  - from: attalid
    to: roman
    type: absorbed remnants of
    year: -133
    note: >-
      Attalus III died childless and left his kingdom to the Roman people in his
      will. Aristonicus claimed the throne as Eumenes III and held much of it
      until 129, after which Rome organised the province of Asia.
    source: allen-1983
    contested: false

  - from: pontus
    to: roman
    type: conquered by
    year: -63
    note: >-
      Pompey broke the last Pontic army at Nicopolis in 66 and Mithridates VI
      died in the Crimea three years later. The kingdom was divided between the
      new province of Bithynia et Pontus and a set of client rulers.
    source: mcging-1986
    contested: false

  # Crosses into Iran before Islam and is drawn by no thread. The oldest of the
  # three claims counted on the Achaemenid record, and the only one made by a
  # dynasty that was still ruling when it made it.
  - from: achaemenid
    to: pontus
    type: claimed legitimacy of
    year: -281
    note: >-
      The Mithridatic house asserted descent from Darius I continuously and in
      public, and Mithridates VI used the Achaemenid royal title king of kings
      alongside a second claimed descent from Alexander and Seleucus.
    source: mcging-1986
    contested: false

  # ---- Judaea: the region's first internal edge ----

  # The Eastern Mediterranean after Alexander had three records and no internal
  # edge, then five and still none: Ptolemaic Egypt is partitioned from a
  # Macedonian record filed under Iran before Islam, Palmyra and the two Arab
  # client dynasties all point outward to Rome or to Iran. This is the first
  # edge with both ends inside the region, and it is why it now draws a thread.
  # Judaea was a Seleucid province whose population revolted over the
  # interference with the Temple and never went back. `seceded from` is the
  # right word for once: the Maccabees were the king's subjects, they fought his
  # armies for two decades, and the independence was conceded rather than
  # declared in a single act.
  - from: seleucid
    to: hasmonean
    type: seceded from
    year: -142
    note: "Simon obtained the remission of tribute from a Seleucid claimant who
           needed Judaean support against a rival, which is the point at which
           the province stopped paying and started being a state. The revolt had
           begun twenty-five years earlier over a king's interference with the
           Temple, and neither side ever fought a decisive battle over the
           outcome."
    source: regev-2013
    contested: false

  - from: hasmonean
    to: herodian
    type: overthrew
    year: -37
    note: >-
      Herod took Jerusalem after a five-month siege with a Roman army under
      Sosius, and Antony had Antigonus II beheaded — the first time Rome
      executed a foreign king, which Josephus says was done because no Jew would
      otherwise accept the man replacing him.
    source: smallwood-1976
    contested: false

  # Out of the region and drawn by no thread. `absorbed remnants of` rather than
  # `conquered by` for the same reason as the Nabataean edge below: this was
  # three administrative acts across eighty-six years, on the deposition or the
  # death of a client, and no campaign was fought for any of them.
  - from: herodian
    to: roman
    type: absorbed remnants of
    year: 92
    note: >-
      Judaea proper became a province in AD 6 when Archelaus was deposed,
      Agrippa I held the whole kingdom again from 41 to 44, and the last
      Herodian territories passed to Rome on Agrippa II's death.
    source: smallwood-1976
    contested: false

  # ---- The Arab clients of Rome and Iran, and what Rome did with Petra ----

  # Neither of the two Arab client dynasties in this pass takes an edge to the
  # other. They were exact contemporaries and exact opposites, killed each
  # other's kings, and neither succeeded the other; the relation between them is
  # the whole subject of both pages and it is not succession. The Jafnid record
  # has no edge at all and this one has only the edge to the empire that ended
  # it.
  #
  # `overthrew` and not `conquered by`: Ctesiphon did not take al-Hira from an
  # enemy, it abolished its own client and put an official in the king's place,
  # which is what this record's `dynastic replacement` ending says. And the
  # from-is-earlier convention does not hold here, Sasanian Iran being older
  # than the dynasty it raised, for the same reason it does not hold on
  # `neo-elamite -> neo-assyrian`. The type carries the claim; the order of the
  # two foundations is not part of it.
  - from: nasrid-hira
    to: sasanian
    type: overthrew
    year: 602
    note: >-
      Khusrau II had al-Nu'man III seized and killed and replaced the client
      kingship with a Persian governor. Two years later an Arab coalition beat a
      Persian army at Dhu Qar, which the later tradition treats as the first
      time the Arabs defeated Iran and which the Nasrids were no longer there
      to have prevented.
    source: toral-niehoff-2014
    contested: false

  # `absorbed remnants of` rather than `conquered by`, and the difference is the
  # argument of the Nabataean record's last chapter: no source describes a war,
  # no triumph was held, and the province's own coinage says Arabia was acquired
  # rather than captured.
  - from: nabataean
    to: roman
    type: absorbed remnants of
    year: 106
    note: >-
      Trajan created the province of Arabia after Rabbel II died, took the
      Nabataean administrative apparatus over more or less intact, and moved the
      centre of it from Petra north to Bostra.
    source: bowersock-1983
    contested: false

  # ---- The wider world: contact rather than succession ----

  - from: sasanian
    to: byzantine
    type: absorbed remnants of
    year: 651
    note: "Byzantium outlived its four-century rival by eight centuries, but the
           war of 602-628 that exhausted the Sasanians exhausted it too, and both
           lost their southern provinces to the same conquest."
    source: treadgold-1997
    contested: true

  - from: northern-zhou
    to: sui
    type: overthrew
    year: 581
    note: "Yang Jian, regent for a child emperor and father-in-law to the one
           before him, took the Zhou throne for himself and exterminated its
           ruling family - the same family whose own throne it had taken
           from a Western Wei puppet a generation earlier."
    source: parker-1895
    contested: false

  - from: sui
    to: tang
    type: overthrew
    year: 618
    note: "Li Yuan, a Sui general related to the imperial house, took the
           throne with Turkic help after three ruinous invasions of Korea
           broke the dynasty he had served. He kept the canal, the granaries,
           the equal-field land system and the law code, and corrected almost
           everything else."
    source: twitchett-1979
    contested: false

  - from: tang
    to: five-dynasties
    type: overthrew
    year: 907
    note: "Zhu Wen, a general who had defected from Huang Chao's rebellion,
           spent the 890s eliminating his rivals, massacred the eunuchs in
           903, moved the emperor to Luoyang and had him murdered in 904,
           and deposed the boy who replaced him in 907."
    source: twitchett-1979
    contested: false

  - from: five-dynasties
    to: song
    type: overthrew
    year: 960
    note: "Zhao Kuangyin, a general who had served the Later Zhou's own
           reunification campaigns, was proclaimed emperor by his troops on
           campaign and returned to the capital to take the throne without a
           fight."
    source: boulger-1898
    contested: false

  - from: qin
    to: han
    type: overthrew
    year: -206
    note: "A minor local official named Liu Bang took the Qin capital, beat his
           rival Xiang Yu in four years of civil war, and kept almost the entire
           Qin administrative apparatus - the commanderies, the script, the
           roads, the standardised weights and measures - while rejecting the
           harshness that had run it."
    source: loewe-twitchett-1986

  - from: han
    to: cao-wei
    type: partitioned from
    year: 220
    note: "Emperor Xian abdicated to Cao Pi in a staged ceremony with three
           ritual refusals, and was given a fief and allowed to live; he
           outlived the man who took his throne. The empire had already been
           divided among the commanders for thirty years, and Wei held the
           recognised capital and most of its population when the ceremony
           made the division formal."
    source: loewe-twitchett-1986
    contested: false

  - from: cao-wei
    to: jin-sima
    type: overthrew
    year: 265
    note: "Three generations of the Sima family's loyal military service to
           the Cao house ended with Sima Yan deposing its last emperor
           without a battle, the same slow accumulation of indispensability
           Cao Pi's own father had once used against the Han."
    source: boulger-1898
    contested: false

  - from: liao
    to: jin
    type: overthrew
    year: 1125
    note: "Aguda's Jurchen revolt destroyed the empire that had ruled them within
           eleven years, and the Song alliance that helped it along replaced a
           tributary neighbour with a conquering one."
    source: franke-twitchett-1994
    contested: false

  - from: western-xia
    to: mongol
    type: conquered by
    year: 1227
    note: "A two-year campaign broke the Xia army on the frozen Yellow River
           and took its cities one by one. Its king submitted the same year
           Genghis Khan died on the Xia frontier - the conquest of Xia was the
           last military undertaking of his life."
    source: boulger-1898
    contested: false

  - from: jin
    to: mongol
    type: conquered by
    year: 1234
    note: "The Jin took the Mongols over twenty years to destroy, considerably
           longer than Khwarazm, and occupied Chinggis Khan and his successor for
           most of that time."
    source: morgan-2007
    contested: false

  - from: song
    to: yuan
    type: conquered by
    year: 1279
    note: "A Mongol fleet destroyed the last Song squadron at Yamen and a
           minister carried the child emperor into the sea rather than
           surrender him. It was the first time the whole of China had been
           ruled from the steppe."
    source: franke-twitchett-1994
    contested: false

  - from: abbasid
    to: mongol
    type: conquered by
    year: 1258
    note: "Hulegu took Baghdad, massacred its population over several days, and
           executed al-Musta'sim, ending five centuries of the office in Iraq."
    source: morgan-2007
    contested: false

  - from: rum
    to: ilkhanate
    type: vassal of
    year: 1243
    note: "After Kose Dag the sultanate continued for sixty years as a tributary
           whose sultans were installed and removed from Tabriz."
    source: peacock-yildiz-2013
    contested: false

  # ---- The Mongol inheritance, and what grew out of it ----

  - from: mongol
    to: ilkhanate
    type: partitioned from
    year: 1256
    note: "Hulegu was sent west by his brother Mongke and kept Iran and Iraq as
           an appanage, notionally deputy to a great khan who after 1260 was in
           China and no longer giving orders."
    source: jackson-2017
    contested: false

  - from: mongol
    to: golden-horde
    type: partitioned from
    year: 1242
    note: "Jochi's line took the western steppe as its share of the patrimony
           and governed the Rus principalities from Sarai without occupying
           them."
    source: halperin-1985
    contested: false

  - from: mongol
    to: chagatai
    type: partitioned from
    year: 1226
    note: "Chagatai's inheritance was Transoxiana and the Tarim, containing both
           the richest cities of Central Asia and the pasture that made settling
           in them politically impossible."
    source: biran-1997
    contested: false

  - from: rum
    to: ottoman
    type: absorbed remnants of
    year: 1299
    note: "Osman's beylik was one of a dozen principalities that replaced the
           Sultanate of Rum, and the one placed on the Byzantine frontier rather
           than among richer Anatolian neighbours."
    source: imber-2002
    contested: false

  - from: byzantine
    to: ottoman
    type: claimed legitimacy of
    year: 1453
    note: "Mehmed II took Constantinople and the title Kayser-i Rum, moved his
           capital into the city, and kept the Orthodox patriarchate in being
           under his protection."
    source: imber-2002
    contested: false

  - from: mamluk-sultanate
    to: ottoman
    type: conquered by
    year: 1517
    note: "Selim I took Egypt, Syria and the guardianship of Mecca and Medina,
           and with them the shadow Abbasid caliph the Mamluks had kept at Cairo
           since 1261."
    source: imber-2002
    contested: false

  - from: delhi-sultanate
    to: mughal
    type: conquered by
    year: 1526
    note: "Babur, a Timurid prince who had failed to hold Samarkand, beat the
           last Lodi sultan at Panipat with artillery and a smaller army."
    source: richards-1993
    contested: false

  # ---- After the Mongols ----

  - from: chagatai
    to: timurid
    type: seceded from
    year: 1370
    note: "Timur rose within the western Chagatai lands and took them, ruling as
           amir and keeping a Chinggisid puppet khan because he could not
           legitimately hold the title himself."
    source: manz-1989
    contested: false

  - from: ilkhanate
    to: timurid
    type: absorbed remnants of
    year: 1393
    note: "Timur took the Iranian and Iraqi territories that had fragmented
           among successor dynasties after the Ilkhanate collapsed in 1335."
    source: manz-1989
    contested: false

  - from: shirvanshah
    to: safavid
    type: conquered by
    year: 1538
    note: "Isma'il killed Farrukh Yasar in 1500 in the first campaign he ever
           fought — revenge for a father and a grandfather the Shirvanshahs had
           killed — and Tahmasp deposed the last of the line thirty-eight years
           later and governed Shirvan from Tabriz."
    source: newman-2006
    contested: false

  - from: golden-horde
    to: shaybanid
    type: partitioned from
    year: 1500
    note: "The Uzbek confederation was assembled in the eastern half of the
           Jochid ulus by descendants of Shiban, Jochi's fifth son, and took
           Transoxiana on the strength of a claim the Horde's fragmentation had
           left them still holding."
    source: di-cosmo-2009
    contested: false

  - from: golden-horde
    to: crimean-khanate
    type: partitioned from
    year: 1449
    note: "Haci Giray took the Crimean peninsula and its steppe approaches as a
           separate khanate, and his descendants outlasted every other Jochid
           line by two and a half centuries."
    source: di-cosmo-2009
    contested: false

  - from: golden-horde
    to: kazan-khanate
    type: partitioned from
    year: 1438
    note: "Ulugh Muhammad, beaten out of the Horde by his rivals, arrived on the
           middle Volga with a following and made a khanate out of the old Volga
           Bulgar country — the one Jochid successor with farmers, a fair and a
           fixed capital."
    source: di-cosmo-2009
    contested: false

  - from: golden-horde
    to: astrakhan-khanate
    type: partitioned from
    year: 1466
    note: "Mahmud b. Kuchuk lost the contest for the Horde's remnant to his
           brother and withdrew downriver to Hajji Tarkhan, founding a khanate
           that held one town and the mouth of the Volga."
    source: di-cosmo-2009
    contested: false

  - from: ottoman
    to: crimean-khanate
    type: vassal of
    year: 1475
    note: "An Ottoman fleet took Kefe and the Genoese coast and released Mengli
           Giray as khan on terms; thereafter the sultan confirmed and deposed
           the khans, and the Girays kept their own dynasty, their own coinage
           and their own wars."
    source: di-cosmo-2009
    contested: false

  - from: shaybanid
    to: bukhara
    type: absorbed remnants of
    year: 1599
    note: "When Abu'l-Khayr's line failed, the Uzbeks took a khan from a family
           that had married into it: Baqi Muhammad, whose mother was the sister
           of Abdullah Khan II, and who was in reality the first khan of Bukhara
           of the new dynasty."
    source: howorth-1880
    contested: false

  - from: astrakhan-khanate
    to: bukhara
    type: absorbed remnants of
    year: 1599
    note: "The Janid dynasty was the Astrakhan royal house in exile. A few years
           after the Russians took the delta, Yar Muhammad left the Volga for
           Bukhara and married his son to the Uzbek khan's daughter; his
           grandson took the throne and his descendants held it until 1785."
    source: howorth-1880
    contested: false

  - from: shaybanid
    to: khiva
    type: partitioned from
    year: 1511
    note: "Khwarazm fell to a different branch of the Shaybanids from the one
           that took Transoxiana, and the two lines stayed distinct and hostile
           for three centuries, with two weeks of desert between them."
    source: howorth-1880
    contested: false

  - from: bukhara
    to: kokand
    type: seceded from
    year: 1760
    note: "Fergana had been an appanage of Samarkand since Babur's day and
           emerged as its own state only when the beks of the valley accepted one
           of their number as head and sent tribute to Beijing over the heads of
           the emirs who claimed them."
    source: schuyler-1876
    contested: false

  - from: dzungar-khanate
    to: kokand
    type: absorbed remnants of
    year: 1760
    note: "The Qing destruction of the Dzungars opened the Tarim passes and
           removed the power that had governed Kashgar and Yarkand for eighty
           years. Kokandi merchants took the road and the trade, and the khanate
           grew on it."
    source: schuyler-1876
    contested: false

  - from: chagatai
    to: moghulistan
    type: partitioned from
    year: 1347
    note: "The Dughlat amirs raised an eighteen-year-old great-great-grandson of
           Chagatai over the eastern half of the ulus at Aksu; he converted to
           Islam at twenty-four and took the western half back thirteen years
           later, the last khan to hold both."
    source: rashidi-elias-ross
    contested: false

  - from: moghulistan
    to: kazakh-khanate
    type: conquered by
    year: 1522
    note: "Driven out of the Kipchak steppe, two hundred thousand Kazakhs came
           over into Moghulistan. Nobody could resist them, and within a decade
           the khan had brought every Moghul in the country down to Kashgar and
           left the horse-herds behind."
    source: rashidi-elias-ross
    contested: false

  - from: yuan
    to: northern-yuan
    type: absorbed remnants of
    year: 1368
    note: "Toghon Timur left Dadu and went north, and the dynasty went on issuing
           reign names from Karakorum. The Hongwu emperor told his court he had
           taken up arms against rebels rather than against the Yuan, and refused
           to sacrifice the captured Yuan prince because his own ancestors had
           been that house's subjects."
    source: howorth-1876
    contested: false

  - from: golden-horde
    to: nogai-horde
    type: seceded from
    year: 1481
    note: "The Manghit begs who had made and unmade khans at Sarai for eighty
           years finished the job: Musa and Yamgurchi rode into the camp of the
           Horde's last khan with Ibak of Tyumen and killed him, and thereafter
           ruled their own people as murzas because, not being Chinggisids, they
           could never rule them as khans."
    source: howorth-1880
    contested: false

  - from: golden-horde
    to: khanate-of-sibir
    type: partitioned from
    year: 1493
    note: "Shibanid princes out of the eastern half of the Jochid inheritance
           took the Taybugid country on the Tobol and the Irtysh, and the small
           wooden capital they settled on gave its name to a third of Asia."
    source: howorth-1880
    contested: false

  - from: golden-horde
    to: kazakh-khanate
    type: partitioned from
    year: 1465
    note: "Kerei and Janibek, Jochid princes of the eastern steppe, broke away
           from Abu'l-Khayr's Uzbek ulus and took shelter in Moghulistan; when he
           died most of his people walked over to them, and the word for a man
           who leaves his prince became the name of a nation."
    source: rashidi-elias-ross
    contested: false

  - from: timurid
    to: shaybanid
    type: conquered by
    year: 1507
    note: "Muhammad Shaybani took Samarkand in 1500 and Herat in 1507, ending
           Timurid rule in Central Asia and driving Babur to Kabul."
    source: di-cosmo-2009
    contested: false

  - from: safavid
    to: hotaki
    type: overthrew
    year: 1722
    note: "A Ghilzai force from Kandahar broke the Safavid field army at
           Gulnabad, blockaded Isfahan for six months until it starved, and took
           the crown from Shah Sultan Husayn in person."
    source: matthee-2012
    contested: false

  - from: safavid
    to: afsharid
    type: absorbed remnants of
    year: 1736
    note: "Nadir expelled the Afghans in the name of Tahmasp II, deposed him,
           ruled as regent for an infant, and then had himself elected shah at
           Mughan with the last Safavid claimant dead."
    source: axworthy-2006
    contested: false

  - from: hotaki
    to: afsharid
    type: conquered by
    year: 1738
    note: "Nadir drove the Afghans out of Persia in 1729 and took Kandahar after
           a year's siege nine years later, destroying the city."
    source: axworthy-2006
    contested: false

  - from: afsharid
    to: zand
    type: absorbed remnants of
    year: 1751
    note: "Karim Khan came out of the twelve-year war among Nadir's officers and
           rivals holding the centre and the south, and governed as deputy for a
           Safavid child rather than as Nadir's successor."
    source: perry-1979
    contested: false

  - from: zand
    to: qajar
    type: conquered by
    year: 1794
    note: "Agha Muhammad Khan, whom Karim Khan had kept in Shiraz as a hostage
           for sixteen years, hunted the last Zand for four years and had him
           blinded and killed at Bam."
    source: perry-1979
    contested: false

  - from: afsharid
    to: qajar
    type: conquered by
    year: 1796
    note: "Agha Muhammad Khan took Mashhad and tortured the blind Shahrukh, last
           of Nadir's line, to death to find where the treasure was buried."
    source: chi-7
    contested: false

  - from: timurid
    to: safavid
    type: absorbed remnants of
    year: 1501
    note: "Isma'il took Tabriz and then the Timurid east, replacing a Turco-Mongol
           patrimonial order with a state built on a Sufi order's following and
           an imposed confession."
    source: newman-2006
    contested: false

  - from: timurid
    to: mughal
    type: claimed legitimacy of
    year: 1526
    note: "Babur was Timur's descendant and styled his Indian state on that
           descent; the dynasty called itself Gurkani, from Timur's own title of
           royal son-in-law."
    source: richards-1993
    contested: false

  - from: mongol
    to: yuan
    type: partitioned from
    year: 1271
    note: "Kublai won the succession war of 1260, moved the centre of gravity to
           China and proclaimed a Chinese dynastic name for the eastern share of
           the patrimony."
    source: franke-twitchett-1994
    contested: false

  - from: jin
    to: yuan
    type: absorbed remnants of
    year: 1279
    note: "The Yuan completed what the campaigns against the Jin had begun,
           taking the Southern Song in 1279 and ruling all of China for the first
           time from the steppe."
    source: franke-twitchett-1994
    contested: false

  - from: yuan
    to: ming
    type: overthrew
    year: 1368
    note: "Rebellions across the Yuan south put a former mendicant monk on the
           throne, and the Mongol court withdrew to the steppe rather than being
           destroyed in China."
    source: mote-twitchett-1988
    contested: false

  - from: ming
    to: qing
    type: overthrew
    year: 1644
    note: "A Ming general facing a rebel army on one side and Manchu forces on
           the other invited the Manchus through Shanhaiguan to help him retake
           Beijing from the rebel who had just destroyed the dynasty he served.
           The Manchus took the capital as his allies and never left it."
    source: boulger-1898
    contested: false

  # Was `srivijaya -> majapahit`, `absorbed remnants of`, 1293, which asserted
  # the wrong thing: Majapahit did not absorb Srivijaya's remnants and 1293 is
  # the year it was founded, not the year anything passed between the two. What
  # actually happened is here in two steps, and the middle term is a record this
  # corpus did not carry until now.
  - from: srivijaya
    to: singhasari
    type: conquered by
    year: 1275
    note: >-
      Kertanegara's Pamalayu expedition crossed to Sumatra against Melayu, which
      had been carrying Srivijaya's position on the strait since the eleventh
      century, and after it no Sumatran polity appears in the records as an
      independent power.
    source: hall-2011
    contested: false

  - from: singhasari
    to: majapahit
    type: claimed legitimacy of
    year: 1293
    note: >-
      Raden Wijaya was Kertanegara's son-in-law, presented himself to the Mongol
      expedition as Singhasari's rightful heir, and had Kertanegara commemorated
      as the founding ancestor of the dynasty he then established.
    source: robson-1995
    contested: false

  # Ganter, 1222. The Kediri record's only turning point, from the other side.
  - from: kediri
    to: singhasari
    type: conquered by
    year: 1222
    note: >-
      Ken Arok of Tumapel defeated and killed Kertajaya at Ganter, and the centre
      of Javanese power moved from Daha to the polity he renamed Singhasari.
    source: hall-2011
    contested: false

  # And back the other way, seventy years later — but forward in time, which is
  # the only direction an edge on this site runs. `second-kediri` is a separate
  # record joined to `kediri` by `resumes` rather than by an edge, so this does
  # not close a loop.
  - from: singhasari
    to: second-kediri
    type: overthrew
    year: 1292
    note: >-
      Jayakatwang, lord of Kediri and Singhasari's own vassal, revolted while
      Kertanegara's army was in Sumatra and killed him, restoring the kingdom his
      predecessors had lost at Ganter.
    source: hall-2011
    contested: false

  - from: second-kediri
    to: majapahit
    type: conquered by
    year: 1293
    note: >-
      Raden Wijaya guided the Yuan expedition — sent to punish a king who was
      already dead — against Jayakatwang, and founded Majapahit out of the same
      campaign in the same year.
    source: hall-2011
    contested: false

  # The Majapahit record's last chapter has named Demak in prose since it was
  # written and could not name it in a field. `absorbed remnants of` rather than
  # `conquered by`, because that chapter's argument is that there was no siege,
  # no treaty and no last king killed.
  - from: majapahit
    to: demak
    type: absorbed remnants of
    year: 1527
    note: >-
      Demak took over what was left of the inland Javanese court, completing a
      process that had been running through the north-coast ports for a century
      and a half.
    source: ricklefs-2008
    contested: true

  # The Melakan record has carried this as a counted successor claim with no page
  # to point at. It has one now.
  - from: melaka
    to: johor
    type: claimed legitimacy of
    year: 1528
    note: >-
      Alauddin Riayat Shah II, second son of Melaka's last sultan, established
      the dynasty on the Johor river with the Melakan regalia, the Melakan court
      offices and a chronicle written to argue the continuity.
    source: brown-1970
    contested: false

  # The Demak record's last chapter called Pajang the smallest identifiable hole
  # in this region — one page that would close one `ended.by`. These are the two
  # edges that page brought with it, and between them Java's sequence on this
  # site now runs unbroken from 1042 to 1755.
  - from: demak
    to: pajang
    type: overthrew
    year: 1554
    note: >-
      Jaka Tingkir won the succession war that followed Trenggana's death, killed
      Arya Penangsang, and moved the centre of Javanese power inland to Pajang,
      claiming descent from Trenggana and from Majapahit's last king at once.
    source: ricklefs-2008
    contested: false

  - from: pajang
    to: mataram
    type: conquered by
    year: 1586
    note: >-
      Senapati, ruler of the vassal territory of Mataram and Hadiwijaya's own
      foster-brother, took Pajang and founded the kingdom that held Java until
      1755.
    source: ricklefs-2008
    contested: false

  # Banten was launched by a Demak expedition in 1527 and was a kingdom of its
  # own within a generation. `seceded from` is the only use of that type in this
  # region.
  - from: demak
    to: banten
    type: seceded from
    year: 1552
    note: >-
      Hasanuddin, whose father had led the Demak expedition that took Banten and
      Sunda Kelapa in 1527, ruled Banten as an independent sultanate from 1552
      while Demak itself was collapsing into civil war.
    source: ricklefs-2008
    contested: false

  - from: sunda
    to: banten
    type: conquered by
    year: 1579
    note: >-
      Banten destroyed Pakuan Pajajaran and the last Indic kingdom on Java ended,
      fifty-two years after Majapahit and at the other end of the island.
    source: ricklefs-2008
    contested: false

  # The Majapahit record's last chapter has always said that the Hindu-Buddhist
  # tradition of that court moved east to Bali and that the connection is claimed
  # in Balinese genealogies. That was prose with no page to point at. It has one
  # now, and the count on that record goes from one to two.
  - from: majapahit
    to: gelgel
    type: claimed legitimacy of
    year: 1527
    note: >-
      Priests, court literature and families of the Javanese aristocracy crossed
      to Bali as Majapahit ended, and the Balinese dynasties trace their descent
      and their ritual authority to that court.
    source: coedes-1968
    contested: true

  # ---- Mainland Southeast Asia ----
  #
  # The region's only internal edge so far, and its `thread` flag is still
  # `false`: the project's rule is that a region and its thread are not added in
  # the same pass. The flag gets flipped once this edge has been sitting here
  # through a pass that did not write it.
  - from: angkor
    to: ayutthaya
    type: conquered by
    year: 1431
    note: >-
      Ayutthaya took Angkor in 1431 and the Khmer court moved south to Phnom
      Penh, taking with it nothing of the ritual apparatus, which stayed and
      went to Siam.
    source: coedes-1968
    contested: false

  # What went to Aceh after 1511 was Melaka's business: the Muslim merchant
  # communities, the Malay court culture, and the trade that would not deal with
  # a Portuguese customs house. Not its authority — Aceh's sultans claimed
  # descent from their own line, which is why this is `absorbed remnants of` and
  # not `claimed legitimacy of`.
  - from: melaka
    to: aceh
    type: absorbed remnants of
    year: 1511
    note: >-
      Melakan merchants, scholars and shipping relocated to the northern
      Sumatran ports after the Portuguese took the city, and Aceh consolidated
      them into the sultanate that inherited Melaka's commercial position on the
      strait.
    source: reid-1988
    contested: false

  # Aceh took Pasai from the Portuguese in 1524, three years after they had taken
  # it, and absorbed its territory. The Aceh record has two incoming edges now
  # and they are the two halves of what it was built out of: Melaka's trade and
  # Pasai's coast.
  - from: pasai
    to: aceh
    type: conquered by
    year: 1524
    note: >-
      Ali Mughayat Syah drove the Portuguese out of Pasai and absorbed the
      sultanate into the one he was assembling forty miles up the same coast.
    source: reid-2005
    contested: false

  # Melaka's founder was a prince out of Palembang and the Malay Annals trace
  # his line through Srivijaya's kings. It is a claim made nearly six
  # centuries after the last Srivijayan ruler anybody can name, by a court
  # whose chronicle was written in exile after its own city had fallen.
  - from: srivijaya
    to: melaka
    type: claimed legitimacy of
    year: 1400
    note: >-
      The Sejarah Melayu routes the Melakan dynasty back through Palembang to
      the kings of Srivijaya, and beyond them to Alexander the Great. The
      Srivijayan half of that genealogy is a memory of something real: Melaka's
      founder came out of Palembang and rebuilt Srivijaya's position on the far
      side of the strait.
    source: brown-1970
    contested: true

  # The Solomonic dynasty's claim, and the reason the Aksumite record's
  # `successor_claims` field is no longer null. Yekuno Amlak overthrew the Zagwe
  # in 1270 asserting descent from the kings of Aksum through Solomon, and his
  # successors were crowned at Aksum Zion for centuries afterwards.
  - from: aksum
    to: ethiopia
    type: claimed legitimacy of
    year: 1270
    note: >-
      The Kebra Nagast makes the dynasty Solomon's line by way of Aksum, and the
      coronation at the church of Mary of Zion at Aksum is the ceremony that
      asserted it. The claim was maintained until 1974 and written into the 1955
      constitution.
    source: tamrat-1972
    contested: false

  # Crosses into South Arabia and is drawn by no thread. The queen of Sheba is
  # Saba, and the Sabaean record's own chapter on the alphabet already described
  # this claim before there was a record to attach it to.
  - from: saba
    to: ethiopia
    type: claimed legitimacy of
    year: 1270
    note: >-
      The Kebra Nagast holds that the queen of Sheba bore Solomon a son who
      became the first Ethiopian king, making the dynasty descendants of both a
      South Arabian queen and an Israelite king.
    source: tamrat-1972
    contested: true

  - from: ghana
    to: mali
    type: absorbed remnants of
    year: 1240
    note: >-
      Sosso had taken Kumbi around 1203; Sundiata destroyed Sosso at Kirina and
      Mali took what was left of Ghana's territory, its trade position and its
      royalty on gold nuggets, which the Malian mansas were still levying two
      centuries later.
    source: levtzion-1973
    contested: false

  - from: mali
    to: songhai
    type: absorbed remnants of
    year: 1468
    note: "Songhai rose at Gao as Mali receded and took Timbuktu and Djenne, the
           cities that carried the middle Niger's scholarship and its trade."
    source: hunwick-1999
    contested: false

  # ---- The Ancient Near East ----

  # The one internal edge this region has ever had that stayed in it. The
  # `neo-assyrian -> median` edge below is the same coalition and the same
  # siege, and it left the region when Media moved to Iran before Islam. Both
  # are drawn, and both are true: two powers took Nineveh together, and this
  # site now carries a record for each of them.
  - from: neo-assyrian
    to: neo-babylonian
    type: overthrew
    year: -612
    note: >-
      Nabopolassar had been fighting Assyria for Babylonia alone since 626; the
      alliance with Cyaxares took Ashur in 614 and Nineveh in 612, and Babylon
      inherited every Assyrian province west of the Euphrates.
    source: beaulieu-2018
    contested: false

  # Crosses out of the region, so no thread draws it.
  - from: neo-babylonian
    to: achaemenid
    type: conquered by
    year: -539
    note: >-
      Cyrus beat the Babylonian army at Opis and entered the city days later.
      The administration, the scribes and the tablet formulae continued
      unchanged under a Persian regnal date.
    source: beaulieu-2018
    contested: false

  # The oldest edge in the corpus. Ur-Nammu and Shulgi took the Akkadian royal
  # titles — king of Sumer and Akkad, king of the four quarters — a century
  # after Akkad fell and with the Gutian interval in between. It is a claim, not
  # a succession, and `claimed legitimacy of` is the type for exactly that.
  - from: akkadian
    to: ur-iii
    type: claimed legitimacy of
    year: -2112
    note: >-
      The Akkadian titulature was revived by the kings of Ur and carried for the
      whole dynasty, together with the Akkadian language in administration
      beside Sumerian.
    source: crawford-2013
    contested: false

  # Reads as a succession and is not one, which is why the note says so. Mursili
  # I ended the dynasty and kept nothing; Babylonia went to the Kassites, who
  # have no page here. The edge records what happened between these two and
  # nothing about what followed.
  - from: old-babylonian
    to: hittite
    type: conquered by
    year: -1595
    note: >-
      Mursili I came eight hundred kilometres down the Euphrates, took Babylon,
      ended the dynasty of Hammurabi and went home. He installed no governor and
      left no garrison, and was murdered on his return.
    source: beaulieu-2018
    contested: false

  # The edge the Mitanni record's `ended.by` was empty for. Its comment said the
  # conquerors were the Middle Assyrian kings and that this site's Assyrian entry
  # began three and a half centuries later; there are now two Assyrian entries
  # and this is the earlier one.
  - from: mitanni
    to: middle-assyrian
    type: conquered by
    year: -1260
    note: >-
      Adad-nirari I and Shalmaneser I took what Suppiluliuma had left of Mitanni
      and made Hanigalbat a group of Assyrian provinces under Assyrian
      governors.
    source: frahm-2023
    contested: false

  # The direction convention on this site is that `from` is the earlier polity.
  # It does not hold here and cannot: Assyria is older than the kingdom it
  # destroyed. `conquered by` says which of the two was conquered, which is the
  # claim being made, and the ordering of their foundations is not part of it.
  # The Hittite record has the mirror image of the same problem and solved it by
  # having no edge at all.
  - from: neo-elamite
    to: neo-assyrian
    type: conquered by
    year: -645
    note: >-
      Ashurbanipal broke the Elamite army at Til-Tuba in 653 and sacked Susa in
      646; Humban-haltash III surrendered a year or two later and Elam stopped
      being a state.
    source: potts-2016
    contested: false

  # Crosses into Iran before Islam, so no thread draws it, and it is the only
  # edge in the corpus of this type that runs from a polity to the empire that
  # conquered it a century after the claim was first made. Teispes and his
  # successors styled themselves kings of Anshan while Anshan was Elamite
  # ground.
  - from: neo-elamite
    to: achaemenid
    type: claimed legitimacy of
    year: -559
    note: >-
      Cyrus introduces himself on the Babylon cylinder as king of Anshan, son,
      grandson and descendant of kings of Anshan — an Elamite title, four
      generations deep, and the only royal style he claims before Babylon's own.
    source: potts-2016
    contested: false

  # ---- Iran before Islam ----

  - from: neo-assyrian
    to: median
    type: overthrew
    year: -612
    note: "A Median and Babylonian coalition took Nineveh in 612 BC and the
           Assyrian state was gone within three years."
