# Every succession edge. This is the core object of the site: the thing that
# lives between the Wikipedia articles and that no reference work exposes.
#
# An edge is a claim about causation and is held to the same sourcing standard
# as prose. Where scholarship disagrees on the nature of a transition, both
# edges are recorded and both are marked contested, rather than one being
# picked. `note` is one sentence and must say what actually happened, not
# restate the type.
#
# Direction: `from` is the earlier polity, `to` is the later one. The type
# describes what `to` was or did with respect to `from`.

edges:
  # ---- What the conquests arrived in ----

  - from: sasanian
    to: rashidun
    type: conquered by
    year: 651
    note: "The Sasanian field army was broken at al-Qadisiyya in 636 and
           Ctesiphon fell, after which the empire was unwound province by
           province until Yazdegerd III was murdered at Merv."
    source: donner-1981
    contested: false

  - from: sasanian
    to: buyid
    type: claimed legitimacy of
    year: 962
    note: "The Buyid amirs, ruling Iraq and western Iran with the caliph in
           their keeping, revived the Sasanian title shahanshah as a claim on
           the Iranian monarchy the Arabs had ended."
    source: busse-1975
    contested: false

  # ---- Inside the caliphates: one office, three houses ----

  - from: rashidun
    to: umayyad
    type: overthrew
    year: 661
    note: "Mu'awiya, Uthman's kinsman and governor of Syria for twenty years,
           fought Ali to a stalemate at Siffin and took the caliphate when Ali
           was murdered and his son Hasan came to terms."
    source: madelung-1997
    contested: false

  - from: rashidun
    to: umayyad
    type: claimed legitimacy of
    year: 661
    note: "Mu'awiya took the titles khalifa and amir al-mu'minin unchanged,
           presenting the Umayyad accession as the continuation of the Medinan
           caliphate rather than the founding of a dynasty."
    source: hawting-2000
    contested: false

  - from: rashidun
    to: abbasid
    type: claimed legitimacy of
    year: 750
    note: "The Abbasids justified their rising as the restoration of a rightly
           guided caliphate the Umayyads had usurped, claiming the Medinan
           office directly over the dynasty that had held it in between."
    source: kennedy-2004
    contested: false

  - from: umayyad
    to: abbasid
    type: overthrew
    year: 750
    note: "A Khurasani army raised for twenty years in the name of an unnamed
           member of the Prophet's house destroyed Marwan II at the Great Zab,
           after which the candidate was revealed to be an Abbasid."
    source: hawting-2000
    contested: false

  # ---- The caliphate delegates, and keeps delegating ----
  - from: abbasid
    to: tahirid
    type: vassal of
    year: 821
    note: >-
      Tahir b. al-Husayn was made governor of Khurasan as the reward for winning
      al-Ma'mun's civil war, and his family held the governorship for fifty
      years without ever formally ceasing to be governors.
    source: iranica-taherids
    contested: false

  - from: tahirid
    to: samanid
    type: vassal of
    year: 819
    note: >-
      The four grandsons of Saman Khuda received their Transoxianan
      governorships under Tahirid authority, so the Samanids began as vassals of
      the vassals.
    source: bosworth-1996
    contested: false

  # ---- 873: the Tahirid collapse opens the whole thread ----
  - from: tahirid
    to: saffarid
    type: overthrew
    year: 873
    note: >-
      Ya'qub b. al-Layth took Nishapur and captured Muhammad b. Tahir, having
      been refused the appointment he had asked Baghdad for and taken the
      province regardless.
    source: bosworth-1994
    contested: false

  - from: saffarid
    to: samanid
    type: conquered by
    year: 900
    note: >-
      Isma'il b. Ahmad defeated and captured Amr b. al-Layth at Balkh, after
      which the caliph transferred the governorship of Khurasan from the
      Saffarids to the Samanids.
    source: iranica-samanids
    contested: false

  # ---- The Samanid slave establishment produces its own successor ----
  - from: samanid
    to: ghaznavid
    type: slave-general of
    year: 962
    note: >-
      Alptigin, a Samanid Turkic slave-general who had backed the losing
      candidate at Bukhara, withdrew east and seized Ghazna, founding a line
      that outlasted his masters.
    source: bosworth-1963
    contested: false

  - from: samanid
    to: ghaznavid
    type: claimed legitimacy of
    year: 999
    note: >-
      After Bukhara fell the Ghaznavids kept Khurasan and presented themselves
      publicly as the rightful continuation of the Samanid state, inheriting its
      chancery, its administrative Persian and its slave-soldier system intact.
    source: bosworth-1963
    contested: false

  - from: samanid
    to: karakhanid
    type: conquered by
    year: 999
    note: >-
      The Karakhanids took Bukhara with little fighting and kept Transoxiana,
      claiming nothing from the dynasty they had ended.
    source: iranica-samanids
    contested: false

  # ---- The Buyids, arriving from outside the Khurasani sequence ----
  - from: abbasid
    to: buyid
    type: vassal of
    year: 945
    note: >-
      Ahmad b. Buya entered Baghdad, took the title amir al-umara and left the
      caliph on the throne, holding a formal grant for everything he had already
      taken by force.
    source: busse-1975
    contested: false

  # ---- Dandanaqan, and the sultanate changing hands ----
  - from: ghaznavid
    to: great-seljuk
    type: conquered by
    year: 1040
    note: >-
      A Ghaznavid army marched around Khurasan without adequate water broke
      against the Seljuk Turkmen at Dandanaqan, and the richest province in the
      eastern Islamic world changed hands in a single engagement.
    source: bosworth-1968
    contested: false

  - from: buyid
    to: great-seljuk
    type: overthrew
    year: 1055
    note: >-
      Tughril Beg entered Baghdad, arrested al-Malik al-Rahim and received the
      sultanate from the caliph — the same transaction in the same building as
      945, with the confession of the incoming power reversed.
    source: busse-1975
    contested: false

  # ---- The Ghurids: client house eats overlord ----
  - from: ghaznavid
    to: ghurid
    type: vassal of
    year: 1011
    note: >-
      Mahmud of Ghazna campaigned into Ghur and imposed vassalage on the
      Shansabani chiefs, whose conversion and political standing both date from
      that subordination.
    source: iranica-ghurids
    contested: false

  - from: ghaznavid
    to: ghurid
    type: overthrew
    year: 1186
    note: >-
      Mu'izz al-Din of Ghur took Lahore and ended the line, a hundred and
      seventy-five years after Ghazna had made his house its client.
    source: bosworth-1977
    contested: false

  - from: ghurid
    to: delhi-sultanate
    type: slave-general of
    year: 1206
    note: >-
      Mu'izz al-Din died without a son and his Turkish slave-generals kept the
      Indian conquests; Qutb al-Din Aibak held Delhi and Lahore, and the line
      that followed him ruled northern India for three centuries.
    source: jackson-1999
    contested: false

  # ---- Khwarazm: the appointment that outgrew the appointer ----
  - from: great-seljuk
    to: khwarazmian
    type: vassal of
    year: 1077
    note: >-
      Malik-Shah gave the governorship of Khwarazm to Anushtigin Gharchai, a
      Turkish slave of the royal household, and the post became hereditary
      within two generations.
    source: iranica-khwarazmshahs
    contested: false

  - from: great-seljuk
    to: khwarazmian
    type: overthrew
    year: 1194
    note: >-
      Ala al-Din Tekish killed Tughril III near Rayy, ending the Seljuk
      sultanate of Iran at the hands of an office the Seljuks had themselves
      created.
    source: bosworth-1968
    contested: false

  - from: great-seljuk
    to: khwarazmian
    type: claimed legitimacy of
    year: 1194
    note: >-
      Having extinguished the sultanate, the Khwarazmshahs took its titulature
      and chancery style and presented their rule as its continuation rather
      than its replacement.
    source: bosworth-1968
    contested: false

  - from: karakhanid
    to: khwarazmian
    type: conquered by
    year: 1212
    note: >-
      Ala al-Din Muhammad II took Samarkand and ended the western Karakhanid
      line, briefly reuniting Transoxiana with Khurasan under one power for the
      first time since 999.
    source: ei2-karakhanids
    contested: false

  - from: ghurid
    to: khwarazmian
    type: conquered by
    year: 1215
    note: >-
      Firuzkuh fell to Ala al-Din Muhammad of Khwarazm, nine years after Mu'izz
      al-Din's death had left the Ghurid state without a centre.
    source: iranica-ghurids
    contested: false

  # ---- 1231 ----
  - from: khwarazmian
    to: mongol
    type: conquered by
    year: 1220
    note: >-
      The Mongol invasion reduced Otrar, Bukhara, Samarkand and Gurganj in
      turn against an army its ruler had chosen to distribute rather than
      concentrate, and Ala al-Din Muhammad died on a Caspian island with no
      territory left.
    source: iranica-khwarazmshahs
    contested: false

  # ---- Contested: the Saffarid ending ----
  #
  # Two readings of the same century, both in the literature, neither of which
  # this site is in a position to adjudicate. Recorded as two edges, both
  # marked contested, per PRD section 5. Whether the imperial Saffarid state
  # ends at Balkh in 901 or the Saffarid polity ends at Mahmud's deposition of
  # Khalaf in 1003 depends on whether "the Saffarids" names the claimant to
  # Khurasan or the family that went on ruling Sistan.
  - from: saffarid
    to: samanid
    type: absorbed remnants of
    year: 901
    note: >-
      On one reading the Saffarid state ends with Amr's defeat and the Samanids
      absorb what was left of it, leaving the Sistani maliks as a local
      survival rather than a continuation of the same polity.
    source: iranica-saffarids
    contested: true

  - from: saffarid
    to: ghaznavid
    type: absorbed remnants of
    year: 1003
    note: >-
      On the other reading the Saffarids continue as the maliks of Nimruz for a
      further century and the dynasty ends only when Mahmud of Ghazna deposes
      Khalaf b. Ahmad.
    source: bosworth-1994
    contested: true

  # ---- The Islamic west leaves, and stays gone ----

  - from: umayyad
    to: cordoba
    type: claimed legitimacy of
    year: 929
    note: "Abd al-Rahman III took the titles caliph and amir al-mu'minin at
           Cordoba, asserting that the Umayyad house rather than the Abbasids
           held the office his ancestors had lost in 750."
    source: kennedy-1996
    contested: false

  - from: abbasid
    to: aghlabid
    type: vassal of
    year: 800
    note: "Harun al-Rashid granted Ifriqiya to Ibrahim ibn al-Aghlab as a
           hereditary governorship in exchange for tribute and the khutba,
           the first province converted into a client at the empire's height."
    source: abun-nasr-1987
    contested: false

  - from: aghlabid
    to: fatimid
    type: overthrew
    year: 909
    note: "The Kutama Berber army raised by the Isma'ili missionary Abu Abdallah
           al-Shi'i destroyed the Aghlabid emirate and delivered Ifriqiya to a
           caliph who had not yet arrived in it."
    source: halm-1996
    contested: false

  - from: rustamid
    to: fatimid
    type: conquered by
    year: 909
    note: "Tahert was taken by the same Kutama advance, ending the longest-lived
           Kharijite state."
    source: halm-1996
    contested: false

  - from: almoravid
    to: almohad
    type: overthrew
    year: 1147
    note: "Ibn Tumart's movement declared the Almoravids unbelievers on doctrinal
           grounds and took Marrakesh, replacing an enforcement of Maliki law
           with a caliphate founded on a claim to be the mahdi."
    source: bennison-2016
    contested: false

  # ---- Egypt, Syria and the Jazira ----

  - from: abbasid
    to: tulunid
    type: seceded from
    year: 868
    note: "Ahmad ibn Tulun, sent from Samarra as a deputy governor, took control
           of Egypt's revenue and stopped remitting it, while keeping the
           caliph's name on the coinage."
    source: petry-1998
    contested: false

  - from: tulunid
    to: ikhshidid
    type: absorbed remnants of
    year: 935
    note: "After thirty years of restored Abbasid rule, Muhammad ibn Tughj
           reassembled the Tulunid arrangement in Egypt under a new family and
           an old Central Asian title."
    source: petry-1998
    contested: false

  - from: ikhshidid
    to: fatimid
    type: conquered by
    year: 969
    note: "The Fatimids took Egypt at the fourth attempt, against a divided court
           and a failed harvest, a year after the death of the eunuch Kafur."
    source: brett-2017
    contested: false

  - from: fatimid
    to: ayyubid
    type: overthrew
    year: 1171
    note: "Saladin, appointed Fatimid vizier as the nephew of a Syrian
           expeditionary commander, dismantled the Isma'ili establishment and
           had the khutba in Cairo preached for the Abbasid caliph."
    source: humphreys-1977
    contested: false

  - from: zangid
    to: ayyubid
    type: absorbed remnants of
    year: 1174
    note: "Saladin took Damascus from Nur al-Din's heirs within months of his
           death, inheriting both the unified Syria and the counter-crusade
           programme built to use it."
    source: hillenbrand-1999
    contested: false

  - from: ayyubid
    to: mamluk-sultanate
    type: overthrew
    year: 1250
    note: "The Bahriyya regiment of Kipchak slave soldiers defeated a Crusade,
           then killed the sultan's heir Turanshah and took the sultanate."
    source: petry-1998
    contested: false

  - from: abbasid
    to: mamluk-sultanate
    type: claimed legitimacy of
    year: 1261
    note: "Baybars installed a survivor of the Abbasid house at Cairo as caliph
           and had himself invested by him, reviving three years after Baghdad
           an office with no territory and considerable value."
    source: el-hibri-2021
    contested: false

  - from: marwanid
    to: great-seljuk
    type: conquered by
    year: 1085
    note: "Fakhr al-Dawla ibn Jahir, the Marwanids' own former vizier, persuaded
           Malikshah that Diyar Bakr was worth taking and led the campaign that
           took it, sending a century's accumulated treasury to Isfahan."
    source: kennedy-2004
    contested: false

  - from: great-seljuk
    to: burid
    type: seceded from
    year: 1104
    note: "Toghtekin, atabeg to the Seljuk prince Duqaq of Damascus, kept the
           city on his ward's death instead of passing it to the heir, and
           married the prince's mother."
    source: el-azhari-1997
    contested: false

  - from: burid
    to: zangid
    type: absorbed remnants of
    year: 1154
    note: "Nur al-Din took Damascus after a six-year blockade and argument rather
           than a storming; the gates were opened from inside and Mujir al-Din
           Abaq was pensioned with Homs."
    source: el-azhari-1997
    contested: false

  - from: hamdanid
    to: uqaylid
    type: absorbed remnants of
    year: 996
    note: "The Banu Uqayl, settled in the Jazira by the Buyids as a counterweight
           to the Kurds, took Mosul instead and ended the Hamdanid line there
           six years after being hired to guard its approaches."
    source: kennedy-2004
    contested: false

  - from: mirdasid
    to: uqaylid
    type: absorbed remnants of
    year: 1080
    note: "Aleppo, unprotected against Turkmen raiding by its own emirs, invited
           Muslim ibn Quraysh of Mosul to take the city, and Sabiq ibn Mahmud
           gave it up without a siege."
    source: zakkar-1971
    contested: false

  - from: uqaylid
    to: great-seljuk
    type: conquered by
    year: 1096
    note: "Kerbogha took Mosul in the confusion after Malikshah's death and made
           himself its atabeg, two years before losing the relief army for
           Antioch to the First Crusade."
    source: wilson-2023
    contested: false

  - from: fatimid
    to: mirdasid
    type: vassal of
    year: 1025
    note: "Salih ibn Mirdas took Aleppo and had the khutba read for the Fatimid
           imam, receiving Cairo's recognition and a Fatimid title for it; the
           acknowledgement was renewed, withdrawn and sold again by his
           successors for the next forty-five years."
    source: zakkar-1971
    contested: false

  - from: great-seljuk
    to: mirdasid
    type: vassal of
    year: 1071
    note: "Alp Arslan besieged Aleppo on his way north to Manzikert and Mahmud
           ibn Nasr submitted, moving the khutba from the Fatimid imam to the
           Abbasid caliph and the Seljuk sultan."
    source: wilson-2023
    contested: false

  - from: great-seljuk
    to: rum
    type: partitioned from
    year: 1077
    note: "Suleyman ibn Qutalmish, from a Seljuk line that had lost a succession
           war against the main house, established himself in the Anatolia
           opened by Manzikert."
    source: peacock-yildiz-2013
    contested: false

  # ---- The wider world: contact rather than succession ----

  - from: sasanian
    to: byzantine
    type: absorbed remnants of
    year: 651
    note: "Byzantium outlived its four-century rival by eight centuries, but the
           war of 602-628 that exhausted the Sasanians exhausted it too, and both
           lost their southern provinces to the same conquest."
    source: treadgold-1997
    contested: true

  - from: liao
    to: jin
    type: overthrew
    year: 1125
    note: "Aguda's Jurchen revolt destroyed the empire that had ruled them within
           eleven years, and the Song alliance that helped it along replaced a
           tributary neighbour with a conquering one."
    source: franke-twitchett-1994
    contested: false

  - from: jin
    to: mongol
    type: conquered by
    year: 1234
    note: "The Jin took the Mongols over twenty years to destroy, considerably
           longer than Khwarazm, and occupied Chinggis Khan and his successor for
           most of that time."
    source: morgan-2007
    contested: false

  - from: abbasid
    to: mongol
    type: conquered by
    year: 1258
    note: "Hulegu took Baghdad, massacred its population over several days, and
           executed al-Musta'sim, ending five centuries of the office in Iraq."
    source: morgan-2007
    contested: false

  - from: rum
    to: ilkhanate
    type: vassal of
    year: 1243
    note: "After Kose Dag the sultanate continued for sixty years as a tributary
           whose sultans were installed and removed from Tabriz."
    source: peacock-yildiz-2013
    contested: false

  # ---- The Mongol inheritance, and what grew out of it ----

  - from: mongol
    to: ilkhanate
    type: partitioned from
    year: 1256
    note: "Hulegu was sent west by his brother Mongke and kept Iran and Iraq as
           an appanage, notionally deputy to a great khan who after 1260 was in
           China and no longer giving orders."
    source: jackson-2017
    contested: false

  - from: mongol
    to: golden-horde
    type: partitioned from
    year: 1242
    note: "Jochi's line took the western steppe as its share of the patrimony
           and governed the Rus principalities from Sarai without occupying
           them."
    source: halperin-1985
    contested: false

  - from: mongol
    to: chagatai
    type: partitioned from
    year: 1226
    note: "Chagatai's inheritance was Transoxiana and the Tarim, containing both
           the richest cities of Central Asia and the pasture that made settling
           in them politically impossible."
    source: biran-1997
    contested: false

  - from: rum
    to: ottoman
    type: absorbed remnants of
    year: 1299
    note: "Osman's beylik was one of a dozen principalities that replaced the
           Sultanate of Rum, and the one placed on the Byzantine frontier rather
           than among richer Anatolian neighbours."
    source: imber-2002
    contested: false

  - from: byzantine
    to: ottoman
    type: claimed legitimacy of
    year: 1453
    note: "Mehmed II took Constantinople and the title Kayser-i Rum, moved his
           capital into the city, and kept the Orthodox patriarchate in being
           under his protection."
    source: imber-2002
    contested: false

  - from: mamluk-sultanate
    to: ottoman
    type: conquered by
    year: 1517
    note: "Selim I took Egypt, Syria and the guardianship of Mecca and Medina,
           and with them the shadow Abbasid caliph the Mamluks had kept at Cairo
           since 1261."
    source: imber-2002
    contested: false

  - from: delhi-sultanate
    to: mughal
    type: conquered by
    year: 1526
    note: "Babur, a Timurid prince who had failed to hold Samarkand, beat the
           last Lodi sultan at Panipat with artillery and a smaller army."
    source: richards-1993
    contested: false

  # ---- After the Mongols ----

  - from: chagatai
    to: timurid
    type: seceded from
    year: 1370
    note: "Timur rose within the western Chagatai lands and took them, ruling as
           amir and keeping a Chinggisid puppet khan because he could not
           legitimately hold the title himself."
    source: manz-1989
    contested: false

  - from: ilkhanate
    to: timurid
    type: absorbed remnants of
    year: 1393
    note: "Timur took the Iranian and Iraqi territories that had fragmented
           among successor dynasties after the Ilkhanate collapsed in 1335."
    source: manz-1989
    contested: false

  - from: shirvanshah
    to: safavid
    type: conquered by
    year: 1538
    note: "Isma'il killed Farrukh Yasar in 1500 in the first campaign he ever
           fought — revenge for a father and a grandfather the Shirvanshahs had
           killed — and Tahmasp deposed the last of the line thirty-eight years
           later and governed Shirvan from Tabriz."
    source: newman-2006
    contested: false

  - from: golden-horde
    to: shaybanid
    type: partitioned from
    year: 1500
    note: "The Uzbek confederation was assembled in the eastern half of the
           Jochid ulus by descendants of Shiban, Jochi's fifth son, and took
           Transoxiana on the strength of a claim the Horde's fragmentation had
           left them still holding."
    source: di-cosmo-2009
    contested: false

  - from: timurid
    to: shaybanid
    type: conquered by
    year: 1507
    note: "Muhammad Shaybani took Samarkand in 1500 and Herat in 1507, ending
           Timurid rule in Central Asia and driving Babur to Kabul."
    source: di-cosmo-2009
    contested: false

  - from: safavid
    to: hotaki
    type: overthrew
    year: 1722
    note: "A Ghilzai force from Kandahar broke the Safavid field army at
           Gulnabad, blockaded Isfahan for six months until it starved, and took
           the crown from Shah Sultan Husayn in person."
    source: matthee-2012
    contested: false

  - from: safavid
    to: afsharid
    type: absorbed remnants of
    year: 1736
    note: "Nadir expelled the Afghans in the name of Tahmasp II, deposed him,
           ruled as regent for an infant, and then had himself elected shah at
           Mughan with the last Safavid claimant dead."
    source: axworthy-2006
    contested: false

  - from: hotaki
    to: afsharid
    type: conquered by
    year: 1738
    note: "Nadir drove the Afghans out of Persia in 1729 and took Kandahar after
           a year's siege nine years later, destroying the city."
    source: axworthy-2006
    contested: false

  - from: afsharid
    to: zand
    type: absorbed remnants of
    year: 1751
    note: "Karim Khan came out of the twelve-year war among Nadir's officers and
           rivals holding the centre and the south, and governed as deputy for a
           Safavid child rather than as Nadir's successor."
    source: perry-1979
    contested: false

  - from: zand
    to: qajar
    type: conquered by
    year: 1794
    note: "Agha Muhammad Khan, whom Karim Khan had kept in Shiraz as a hostage
           for sixteen years, hunted the last Zand for four years and had him
           blinded and killed at Bam."
    source: perry-1979
    contested: false

  - from: afsharid
    to: qajar
    type: conquered by
    year: 1796
    note: "Agha Muhammad Khan took Mashhad and tortured the blind Shahrukh, last
           of Nadir's line, to death to find where the treasure was buried."
    source: chi-7
    contested: false

  - from: timurid
    to: safavid
    type: absorbed remnants of
    year: 1501
    note: "Isma'il took Tabriz and then the Timurid east, replacing a Turco-Mongol
           patrimonial order with a state built on a Sufi order's following and
           an imposed confession."
    source: newman-2006
    contested: false

  - from: timurid
    to: mughal
    type: claimed legitimacy of
    year: 1526
    note: "Babur was Timur's descendant and styled his Indian state on that
           descent; the dynasty called itself Gurkani, from Timur's own title of
           royal son-in-law."
    source: richards-1993
    contested: false

  - from: mongol
    to: yuan
    type: partitioned from
    year: 1271
    note: "Kublai won the succession war of 1260, moved the centre of gravity to
           China and proclaimed a Chinese dynastic name for the eastern share of
           the patrimony."
    source: franke-twitchett-1994
    contested: false

  - from: jin
    to: yuan
    type: absorbed remnants of
    year: 1279
    note: "The Yuan completed what the campaigns against the Jin had begun,
           taking the Southern Song in 1279 and ruling all of China for the first
           time from the steppe."
    source: franke-twitchett-1994
    contested: false

  - from: yuan
    to: ming
    type: overthrew
    year: 1368
    note: "Rebellions across the Yuan south put a former mendicant monk on the
           throne, and the Mongol court withdrew to the steppe rather than being
           destroyed in China."
    source: mote-twitchett-1988
    contested: false

  - from: srivijaya
    to: majapahit
    type: absorbed remnants of
    year: 1293
    note: "Javanese power replaced Sumatran as the organiser of the archipelago's
           sea lanes, using the same oath-bound arrangements with coastal chiefs
           that Srivijaya had used."
    source: hall-2011
    contested: true

  - from: mali
    to: songhai
    type: absorbed remnants of
    year: 1468
    note: "Songhai rose at Gao as Mali receded and took Timbuktu and Djenne, the
           cities that carried the middle Niger's scholarship and its trade."
    source: hunwick-1999
    contested: false

  - from: abbasid
    to: songhai
    type: claimed legitimacy of
    year: 1496
    note: "Askia Muhammad obtained recognition as caliph of the Sudan from the
           shadow Abbasid caliph at Cairo, an office with no territory that was
           still worth crossing the Sahara for."
    source: hunwick-1999
    contested: false

  # ---- Iran before Islam ----

  - from: neo-assyrian
    to: median
    type: overthrew
    year: -612
    note: "A Median and Babylonian coalition took Nineveh in 612 BC and the
           Assyrian state was gone within three years."
    source: van-de-mieroop-2015
    contested: false

  - from: median
    to: achaemenid
    type: overthrew
    year: -549
    note: "Cyrus overthrew Astyages and took the Median lands, in a transfer the
           Achaemenids afterwards presented as a legitimate succession rather
           than a conquest."
    source: briant-2002
    contested: true

  - from: achaemenid
    to: macedonian
    type: conquered by
    year: -330
    note: "Alexander destroyed the Achaemenid field armies in three battles and
           took an administrative apparatus that continued functioning under new
           management."
    source: ab-bosworth-1988
    contested: false

  - from: macedonian
    to: seleucid
    type: partitioned from
    year: -312
    note: "Seleucus took the largest and most difficult share of Alexander's
           inheritance: Syria, Mesopotamia and the Iranian plateau."
    source: chi-3
    contested: false

  - from: byzantine
    to: jafnid
    type: vassal of
    year: 529
    note: "Justinian put every Roman Arab ally under al-Harith ibn Jabala and
           gave him patrician rank, paying and confirming a frontier authority
           that answered raids the regular army could not."
    source: fisher-2011
    contested: false

  - from: jafnid
    to: rashidun
    type: conquered by
    year: 636
    note: "The frontier the phylarchate had held was taken at the Yarmuk fifty-
           four years after Rome dismantled it; later Arabic tradition places a
           Jafnid on the Roman side of the battle."
    source: fisher-2011
    contested: true

  - from: roman
    to: palmyrene
    type: seceded from
    year: 270
    note: "Palmyrene forces took Egypt and Anatolia while still striking coins
           that named Aurelian, and in 271 dropped him from them; the authority
           Rome had granted Odaenathus personally was being exercised by his
           widow and son without a renewal."
    source: smith-2013
    contested: false

  - from: palmyrene
    to: roman
    type: conquered by
    year: 273
    note: "Aurelian beat the Palmyrene army at Immae and Emesa and took the city
           in 272; when it rose again the following year he returned, sacked it
           and dispersed its population."
    source: smith-2013
    contested: false

  - from: macedonian
    to: ptolemaic
    type: partitioned from
    year: -305
    note: "Ptolemy son of Lagos asked for Egypt in the division of 323, took the
           diadem eighteen years later when the last attempt to reassemble the
           empire had failed, and had by then buried Alexander's body in his own
           capital."
    source: holbl-2001
    contested: false

  - from: ptolemaic
    to: roman
    type: conquered by
    year: -30
    note: "Octavian took Alexandria the year after Actium and made Egypt his
           personal possession rather than a senatorial province, governed by an
           equestrian prefect and closed to senators."
    source: holbl-2001
    contested: false

  - from: seleucid
    to: parthian
    type: seceded from
    year: -247
    note: "The Arsacids took the Seleucid satrapy of Parthia and spent the next
           century working west into Media and Mesopotamia."
    source: chi-3
    contested: false

  - from: achaemenid
    to: parthian
    type: claimed legitimacy of
    year: -141
    note: "Arsacid rulers asserted Achaemenid descent in their titulature once
           they held the Iranian plateau, claiming a continuity the Seleucid
           interval had broken."
    source: chi-3
    contested: true

  - from: parthian
    to: sasanian
    type: overthrew
    year: 224
    note: "Ardashir, a Sasanian vassal in Fars, killed Artabanus IV at Hormizdgan
           and replaced a confederation of great houses with a centralised
           monarchy."
    source: daryaee-2009
    contested: false

  - from: achaemenid
    to: sasanian
    type: claimed legitimacy of
    year: 224
    note: "The Sasanians presented themselves as restoring the Achaemenid empire
           the Macedonians had destroyed, a claim their own inscriptions make
           and modern scholarship treats as constructed."
    source: daryaee-2009
    contested: true

  - from: kushan
    to: sasanian
    type: conquered by
    year: 230
    note: "Sasanian campaigns broke Kushan power in Bactria and Gandhara within a
           decade of the dynasty taking Iran, the one point where this site's
           Iranian and Indian regions touch directly."
    source: daryaee-2009
    contested: false

  # ---- Rome, and the people who wanted its name ----

  - from: roman
    to: byzantine
    type: partitioned from
    year: 395
    note: "The final administrative division into eastern and western halves; the
           east continued without a break in institutions, law or
           self-description for another thousand years."
    source: treadgold-1997
    contested: true

  - from: roman
    to: carolingian
    type: claimed legitimacy of
    year: 800
    note: "Charlemagne was crowned emperor at Rome on the argument that the
           eastern throne, then held by a woman, was vacant."
    source: mckitterick-2008
    contested: false

  - from: roman
    to: ottoman
    type: claimed legitimacy of
    year: 1453
    note: "Mehmed II took the title Kayser-i Rum on taking Constantinople,
           claiming the Roman office rather than merely the Byzantine city."
    source: imber-2002
    contested: false

  # ---- The steppe ----

  - from: gokturk
    to: uyghur-khaganate
    type: absorbed remnants of
    year: 744
    note: "The Uyghurs replaced the second Turk khaganate on the Mongolian
           steppe, inheriting both its ground and its runiform script."
    source: golden-1992
    contested: false

  - from: xiongnu
    to: gokturk
    type: absorbed remnants of
    year: 552
    note: "Steppe authority over the same ground passed through several
           confederations between the Xiongnu's dissolution and the Turks'
           revolt, and the Turks were the first to leave their own account of
           holding it."
    source: di-cosmo-2002
    contested: true

  # ---- The office after Baghdad ----

  - from: abbasid
    to: abbasid-cairo
    type: claimed legitimacy of
    year: 1261
    note: "Baybars found a survivor of the Abbasid house who had escaped the
           sack of Baghdad and invested him at Cairo, reviving the office the
           Mongols had extinguished three years earlier."
    source: banister-2021
    contested: false

  - from: mamluk-sultanate
    to: abbasid-cairo
    type: vassal of
    year: 1261
    note: "The caliphate was created by the sultanate, housed and paid by it,
           and its holders were chosen and deposed at the sultan's discretion
           for two and a half centuries."
    source: banister-2021
    contested: false

  - from: abbasid-cairo
    to: ottoman
    type: conquered by
    year: 1517
    note: "Selim I destroyed the Mamluk sultanate and removed al-Mutawakkil III
           to Constantinople with the rest of the state's moveable assets."
    source: banister-2021
    contested: false

  # ---- The Nizari separation ----

  - from: fatimid
    to: nizari
    type: partitioned from
    year: 1094
    note: "When a vizier put al-Musta'li on the Fatimid throne over his elder
           brother Nizar, Hasan-i Sabbah backed Nizar's line and took the
           eastern mission out of Cairo's obedience with him."
    source: daftary-2007
    contested: false

  - from: great-seljuk
    to: nizari
    type: seceded from
    year: 1090
    note: "Alamut stood inside the Seljuk sultanate and was held for it until
           its garrison converted; the fortresses taken afterwards were carved
           out of territory the sultans claimed and never recovered."
    source: daftary-2007
    contested: false

  # ---- The rival nobody calls a caliphate ----

  - from: umayyad
    to: zubayrid
    type: seceded from
    year: 683
    note: "Ibn al-Zubayr refused the oath to Yazid, held Mecca through the siege
           of 683, and took the title amir al-mu'minin after Yazid died, taking
           most of the empire's provinces into his obedience with him."
    source: hawting-2000
    contested: false

  - from: zubayrid
    to: umayyad
    type: conquered by
    year: 692
    note: "Abd al-Malik took Iraq at Maskin in 691 and al-Hajjaj besieged Mecca
           the following year, where Ibn al-Zubayr was killed fighting near the
           sanctuary."
    source: hawting-2000
    contested: false

  # ---- Ifriqiya keeps the doctrine the capital dropped ----

  - from: almohad
    to: hafsid
    type: seceded from
    year: 1229
    note: "When the Almohad caliph al-Ma'mun repudiated Ibn Tumart's mahdist
           doctrine, the family governing Ifriqiya declined to follow him and
           kept the province, arguing that the centre had left the movement
           rather than the province leaving the centre."
    source: abun-nasr-1987
    contested: false

  - from: hafsid
    to: ottoman
    type: conquered by
    year: 1574
    note: "The Ottomans took Tunis for the last time after four decades of
           installing and deposing Hafsids against the Spanish, and carried the
           final ruler to Constantinople."
    source: abun-nasr-1987
    contested: false

  # ---- The Isma'ili split at the moment of its first success ----

  - from: qarmatian
    to: fatimid
    type: claimed legitimacy of
    year: 909
    note: "Abd Allah's declaration as mahdi in Ifriqiya was a claim on the
           imamate the eastern Isma'ili communities had been taught to await,
           and the Qarmatians of Bahrayn rejected it and kept waiting — the
           edge runs this way because the Fatimids were claiming an authority
           the older Qarmati mission already held in trust."
    source: daftary-2007
    contested: true

  - from: fatimid
    to: sulayhid
    type: vassal of
    year: 1047
    note: "Ali al-Sulayhi rose in the Haraz mountains as a convert of the
           Fatimid mission and ruled Yemen in the Cairo caliph's name, at one
           point controlling the appointment of the amirs of Mecca on his
           behalf."
    source: daftary-2007
    contested: false

  - from: oman-imamate
    to: abbasid
    type: conquered by
    year: 893
    note: "A faction in the Ibadi civil war over the deposition of the imam
           al-Salt invited in the Abbasid governor of Bahrayn, whose army took
           Nizwa in 893 and killed the imam."
    source: wilkinson-1987
    contested: false

  # ---- The Liao, continued two thousand miles west ----

  - from: liao
    to: qara-khitai
    type: claimed legitimacy of
    year: 1124
    note: "Yelu Dashi, of the Liao imperial clan, kept the dynastic name, the
           reign names, the Chinese titles and the Chinese-form coinage after
           the Jin destroyed the state, and reconstituted them in the
           Semirechye."
    source: biran-2005
    contested: false

  - from: qara-khitai
    to: mongol
    type: conquered by
    year: 1218
    note: "Jebe's army arrived proclaiming the restoration of religious freedom
           against the usurper Kuchlug, and the Tarim oases treated it as a
           deliverance rather than an invasion."
    source: biran-2005
    contested: false

  # ---- The Caspian, and what came out of it ----

  - from: ziyarid
    to: buyid
    type: seceded from
    year: 934
    note: "The sons of Buya were officers in Mardavij's service; when his own
           slave soldiers killed him in 935 they kept the provinces they had
           been given to hold and stopped acknowledging his brother."
    source: chi-4
    contested: false

  - from: ziyarid
    to: nizari
    type: conquered by
    year: 1090
    note: "Isma'ili missionaries took the Ziyarid territory in the Alborz and
           Tabaristan at about the moment Hasan-i Sabbah took Alamut, in the
           same Caspian country the dynasty had come out of."
    source: bosworth-1996
    contested: false

  - from: mamunid
    to: ghaznavid
    type: conquered by
    year: 1017
    note: "Mahmud required his name in the Friday sermon at Gurganj; when
           Ma'mun II's own commanders killed him for considering it, Mahmud
           took the murder of his brother-in-law as the pretext, annexed the
           delta and carried its scholars to Ghazna."
    source: bosworth-1963
    contested: false

  - from: buyid
    to: kakuyid
    type: seceded from
    year: 1008
    note: "Sayyida Shirin, governing the Jibal for her Buyid son, gave Isfahan
           to her uncle's son; within fifteen years he held it and Hamadan in
           his own right and was dealing with the Buyids as a power."
    source: chi-4
    contested: false

  - from: kakuyid
    to: great-seljuk
    type: conquered by
    year: 1051
    note: "A year-long siege gave the Seljuks Isfahan, which became their
           capital; the family was transferred to Yazd and Abarkuh as fief-
           holders rather than destroyed."
    source: bosworth-1996
    contested: false

  # ---- Anatolia had two Turkish states ----

  - from: danishmendid
    to: rum
    type: conquered by
    year: 1178
    note: "Kilij Arslan II took the Sivas branch by 1175 and Malatya in 1178,
           after the realm had divided in 1142 and failed to reunite; the
           surviving Danishmendids entered Seljuk service."
