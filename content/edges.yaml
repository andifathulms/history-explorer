  - from: sarbadar
    to: timurid
    type: absorbed remnants of
    year: 1381
    note: "Ali Mu'ayyad invited Timur into Khurasan against his own neighbours
           and his own exiles, submitted without a siege, and entered his
           service."
    source: smith-1970
    contested: false

  - from: ilkhanate
    to: muzaffarid
    type: absorbed remnants of
    year: 1340
    note: "The Muzaffarids had governed Yazd for the Ilkhans; when the state
           stopped they kept the governorship, took Kerman and then Fars, and
           went on running the provincial administration they had been part
           of."
    source: chi-6
    contested: false

  - from: muzaffarid
    to: timurid
    type: conquered by
    year: 1393
    note: "Timur destroyed Shah Mansur outside Shiraz and then had the surviving
           princes of the house executed together, which is why nothing of the
           dynasty continued anywhere."
    source: chi-6
    contested: false

  - from: ilkhanate
    to: jalayirid
    type: absorbed remnants of
    year: 1336
    note: "Hasan Buzurg, leader of the Jalayir, raised the first of the puppet
           Ilkhans he ruled through and took over the Ilkhanate's Iraqi
           administration and much of its army; his house kept both running for
           three generations."
    source: chi-6
    contested: false

  - from: jalayirid
    to: karakoyunlu
    type: conquered by
    year: 1432
    note: "Qara Yusuf killed Sultan Ahmad in 1410 and took Baghdad and Tabriz;
           the remnant of the house held Basra until Husayn II was killed
           twenty-two years later."
    source: chi-6
    contested: false

  - from: karakoyunlu
    to: akkoyunlu
    type: conquered by
    year: 1468
    note: "Uzun Hasan defeated and killed Jahan Shah at Chapakchur in 1467, and
           the Black Sheep confederation lost Azerbaijan, Iraq and central Iran
           to the White within a year."
    source: bosworth-1996
    contested: false

  - from: akkoyunlu
    to: safavid
    type: conquered by
    year: 1508
    note: "Isma'il beat the remaining Ak Koyunlu at Nakhchivan in 1501 and took
           Diyarbakir by 1508, leading Qizilbash drawn from the same Turkmen
           tribes the confederation had been made of."
    source: newman-2006
    contested: false

  - from: trebizond
    to: akkoyunlu
    type: vassal of
    year: 1458
    note: "John IV married his daughter Theodora to Uzun Hasan in the hope that
           the Ak Koyunlu would come west if the Ottomans came east; the
           alliance bound Trebizond to a protector that did not arrive in
           1461."
    source: finkel-2005
    contested: true

  - from: great-seljuk
    to: artuqid
    type: seceded from
    year: 1102
    note: "Artuq held Jerusalem for the Seljuks of Damascus; his sons lost it to
           the First Crusade and kept the Jazira instead, dividing it into
           branches that acknowledged the sultanate and then everyone else."
    source: bosworth-1996
    contested: false

  - from: artuqid
    to: karakoyunlu
    type: conquered by
    year: 1409
    note: "The Mardin branch outlasted the other two by nearly two centuries as
           a vassal of whoever held Iraq, and fell when the Black Sheep took
           the city."
    source: bosworth-1996
    contested: false

  - from: rum
    to: aydinid
    type: absorbed remnants of
    year: 1308
    note: "One of the Turkmen principalities that formed in the marches the
           sultanate could no longer restrain, on the Aegean coast Byzantine
           authority had abandoned."
    source: peacock-yildiz-2013
    contested: false

  - from: aydinid
    to: ottoman
    type: conquered by
    year: 1426
    note: "Annexed by Bayezid I in 1390, restored by Timur after Ankara, and
           finished in 1426 when its last ruler had run out of Ottoman civil
           wars to change sides in."
    source: finkel-2005
    contested: false

  # ---- What was left of al-Andalus ----

  - from: almohad
    to: nasrid
    type: seceded from
    year: 1232
    note: "Ibn al-Ahmar was proclaimed at Arjona in the fragmentation that
           followed the Almohad collapse in al-Andalus, and moved to Granada
           six years later because it was defensible and near the sea."
    source: harvey-1990
    contested: false

  - from: almohad
    to: marinid
    type: overthrew
    year: 1269
    note: "Zenata pastoralists took Fez in 1248 and Marrakesh in 1269, ending
           Almohad rule in Morocco without ever advancing a religious claim of
           their own against it."
    source: abun-nasr-1987
    contested: false

  - from: almohad
    to: zayyanid
    type: seceded from
    year: 1235
    note: "Yaghmurasan was the Almohad governor of Tlemcen and stopped being
           one as the empire came apart, six years after the governor of Tunis
           had done the same and nine before the Zenata began taking Morocco."
    source: abun-nasr-1987
    contested: false

  - from: zayyanid
    to: ottoman
    type: conquered by
    year: 1551
    note: "The Ottomans took Tlemcen from the sea-based power they had built at
           Algiers; the last Zayyanid fled to Spanish Oran, was baptised, and
           died there as Carlos."
    source: abun-nasr-1987
    contested: false

  # ---- What Cordoba broke into, and what ended it ----

  - from: cordoba
    to: abbadid
    type: partitioned from
    year: 1023
    note: "The qadi of Seville took the city as the caliphate dissolved, one of
           some thirty taifa states formed out of it, and governed for a decade
           in the name of a man he presented as the vanished caliph Hisham II."
    source: kennedy-1996
    contested: false

  - from: abbadid
    to: almoravid
    type: conquered by
    year: 1091
    note: "Al-Mu'tamid invited the Almoravids across the strait against
           Castile; they won at Sagrajas, went home, returned, and deposed him
           on a legal opinion that rulers paying tribute to Christians had
           forfeited authority."
    source: kennedy-1996
    contested: false

  - from: fatimid
    to: zirid
    type: vassal of
    year: 972
    note: "When al-Mu'izz went east to Cairo he left Ifriqiya to the Sanhaja
           family that had held the central Maghreb for him, as viceroys with
           the whole western half of the caliphate under them."
    source: abun-nasr-1987
    contested: false

  - from: zirid
    to: almohad
    type: absorbed remnants of
    year: 1160
    note: "The Almohads took the Tunisian coast back from the Normans a decade
           after Mahdia fell, and the last Zirid died under their protection in
           1167."
    source: abun-nasr-1987
    contested: false

  - from: midrarid
    to: fatimid
    type: conquered by
    year: 909
    note: "The Kutama army marched west across the Maghreb after finishing the
           Aghlabids, took Sijilmasa and released the imprisoned Abd Allah, who
           was proclaimed caliph and mahdi; the town was annexed outright in
           976."
    source: halm-1996
    contested: false

  - from: midrarid
    to: almoravid
    type: absorbed remnants of
    year: 1055
    note: "The Almoravids took Sijilmasa from the Zanata clients who had held
           it since the Midrarids were removed, giving a Saharan movement the
           northern terminus of the gold road before it had a country."
    source: bennison-2016
    contested: false

  # ---- Morocco's last two dynasties, and the far end of the gold road ----

  - from: marinid
    to: wattasid
    type: overthrew
    year: 1472
    note: "Marinid kinsmen who had held the regency since 1420 stopped ruling
           in an infant's name and took the throne, seven years after a rising
           in Fez killed the last Marinid sultan."
    source: abun-nasr-1987
    contested: false

  - from: wattasid
    to: saadi
    type: overthrew
    year: 1554
    note: "A sharifian family that had organised the war against the Portuguese
           in the south took Fez, where the reigning dynasty had signed truces
           with the same enemy and latterly been installed by Ottoman troops."
    source: abun-nasr-1987
    contested: false

  - from: songhai
    to: saadi
    type: conquered by
    year: 1591
    note: "An army with firearms crossed the Sahara and destroyed a far larger
           Songhai force at Tondibi; Morocco held the Niger bend as a pashalik
           from Timbuktu, the first time a North African power took the
           southern end of the gold road rather than the northern."
    source: hunwick-1999
    contested: false

  # ---- Ancient Egypt: no conquest recorded, a king-list convention ----

  - from: egypt-early-dynastic
    to: egypt-old-kingdom
    type: claimed legitimacy of
    year: -2686
    note: "No source records a rupture between Khasekhemwy's reign and
           Djoser's: the balance of evidence favours Djoser as his son, and
           the change the record can actually show is institutional — stone
           building and the apparatus it required — rather than a change of
           army or capital. The edge is coded on the ancient king-list
           convention that divides the dynasties here, not on any recorded
           act of force."
    source: shaw-2000
    contested: true

  - from: egypt-middle-kingdom
    to: hyksos
    type: seceded from
    year: -1650
    note: >-
      A Levantine population long settled in the eastern Delta stopped
      deferring to the weakening Thirteenth Dynasty kingship well before any
      source describes a conquest, and by around 1650 was ruled from Avaris
      in its own right. The breakaway is dated only by convention: no single
      year marks it, because no single event does.
    source: shaw-2000
    contested: false

  - from: hyksos
    to: egypt-new-kingdom
    type: overthrew
    year: -1550
    note: >-
      A Levantine dynasty had ruled the Delta from Avaris for about a
      century, with the Theban kings as tributaries and Nubia allied
      against them. Ahmose took Avaris and drove them into Palestine, and
      the New Kingdom is what the Theban house became after winning that
      war.
    source: breasted-1912
    contested: false

  - from: egypt-new-kingdom
    to: egypt-third-intermediate
    type: partitioned from
    year: -1077
    note: >-
      The kingdom did not fall to anybody. It divided: a Ramesside line at
      Tanis in the Delta holding the title, and the High Priest of Amun at
      Thebes holding the south with an army and the temple estates. Wenamun
      sailed for Byblos under that arrangement, with letters from the High
      Priest and no authority behind them.
    source: breasted-1912
    contested: false

  - from: egypt-third-intermediate
    to: kush
    type: conquered by
    year: -728
    note: >-
      Piye moved north from Napata against a country split among at least
      four rival kings and received the personal submission of every one
      of them; his own Gebel Barkal stela names them individually, coming
      to him one by one. He returned to Napata rather than ruling Egypt
      directly, and most of the Delta kinglets he had beaten kept their
      local thrones as his tributaries.
    source: shaw-2000
    contested: false

  - from: neo-assyrian
    to: egypt-saite
    type: seceded from
    year: -656
    note: >-
      Esarhaddon took Egypt in 671 and Ashurbanipal sacked Thebes in 663,
      leaving local Delta princes, the strongest of them at Sais, to govern
      as nominal vassals. Psamtik I used hired Greek and Carian mercenaries
      to beat the rival princes and, while Assyria's own attention was
      consumed by a civil war against its governor in Babylon, simply
      stopped behaving as anyone's tributary. No source records a battle
      against Assyria itself.
    source: shaw-2000
    contested: false

  - from: egypt-saite
    to: achaemenid
    type: conquered by
    year: -525
    note: >-
      Cambyses crossed the Sinai with Arabian help securing the water his
      army needed, broke the Egyptian line at Pelusium, and took Memphis
      after a siege. Psamtik III, six months on the throne, was captured
      and later executed after an apparent plot to raise a revolt.
    source: shaw-2000
    contested: false

  - from: achaemenid
    to: egypt-native-restoration
    type: seceded from
    year: -404
    note: >-
      Darius II's death set off a Persian succession dispute that gave a
      Delta rebel leader, Amyrtaeus, the opening to expel the Persian
      garrison from Memphis and proclaim himself pharaoh. No Persian
      expedition attempted to retake Egypt for the better part of a decade.
    source: shaw-2000
    contested: false

  - from: egypt-native-restoration
    to: achaemenid
    type: conquered by
    year: -343
    note: >-
      Artaxerxes III's invasion took the Delta fortresses in sequence
      rather than bypassing them and broke Nectanebo II's mixed
      Egyptian-and-mercenary army in the field. Nectanebo withdrew to
      Nubia rather than negotiate terms, and no native Egyptian-born king
      ever again held the office he had just lost.
    source: shaw-2000
    contested: false

  # ---- Indian sultanates: the regional courts Timur's 1398 sack let loose ----

  - from: delhi-sultanate
    to: jaunpur
    type: seceded from
    year: 1394
    note: "Malik Sarvar, a eunuch governor Delhi had sent east to restore
           order after Timur's sack, was left in Jaunpur with an army and no
           sultan strong enough to recall it, and took the title Malik
           al-Sharq for himself."
    source: haig-1928
    contested: false

  - from: jaunpur
    to: delhi-sultanate
    type: conquered by
    year: 1489
    note: "Husain Shah's second attempt to retake Delhi failed as badly as
           his first; Bahlul Lodi's forces broke the Sharqi kingdom for good
           some time before Bahlul's own death that year."
    source: haig-1928
    contested: false

  - from: delhi-sultanate
    to: bengal-sultanate
    type: seceded from
    year: 1338
    note: "Bengal was already too distant a province for Delhi to hold once
           Muhammad bin Tughluq's own authority began to fray, and it broke
           away decades before Timur's invasion made the pattern general."
    source: haig-1928
    contested: false

  - from: kashmir-sultanate
    to: mughal
    type: conquered by
    year: 1586
    note: "Yusuf Shah Chak travelled to Akbar's camp to honour a peace his
           own general had negotiated and was detained on arrival; Akbar
           annexed the valley rather than ratify the treaty."
    source: haig-1928
    contested: false

  - from: delhi-sultanate
    to: gujarat-sultanate
    type: seceded from
    year: 1396
    note: "Zafar Khan, a governor Delhi's own succession crisis left with no
           sultan worth deferring to, simply stopped rendering allegiance to
           the capital and kept the province he already effectively ruled."
    source: haig-1928
    contested: false

  - from: gujarat-sultanate
    to: mughal
    type: conquered by
    year: 1572
    note: "A decade of noble factionalism left Gujarat's own regent inviting
           Akbar to invade against his rivals; the kingdom fell to the
           Mughals almost without a battle."
    source: haig-1928
    contested: false

  - from: khandesh
    to: mughal
    type: conquered by
    year: 1601
    note: "Bahadur Faruqi surrendered himself in person after a nine-month
           siege of Asirgarh, but had ordered his African commander Yaqut
           to hold the fortress regardless; it fell only after Yaqut's
           suicide."
    source: haig-1937
    contested: false

  - from: delhi-sultanate
    to: malwa
    type: seceded from
    year: 1392
    note: "Dilawar Khan Ghuri governed Malwa for a Delhi that Timur's 1398
           sack left with nothing left to enforce its authority, and ruled
           the province as an independent prince in all but title for the
           rest of his life."
    source: haig-1928
    contested: false

  - from: malwa
    to: gujarat-sultanate
    type: conquered by
    year: 1531
    note: "Bahadur Shah of Gujarat captured Mandu and extinguished the
           Khalji dynasty of Malwa, a kingdom whose own king had exhausted
           his neighbours' patience through repeated acts of bad faith."
    source: haig-1928
    contested: false

  - from: malwa
    to: mughal
    type: conquered by
    year: 1561
    note: "Baz Bahadur, already discredited by a defeat at the hands of
           Rani Durgavati, was driven from Mandu by Akbar's officers with
           little serious resistance."
    source: haig-1928
    contested: false

  - from: muscovy
    to: tsardom-of-russia
    type: claimed legitimacy of
    year: 1547
    note: "Ivan IV's coronation with the title of Tsar did not change the
           ruling house, the capital, or the territory at a stroke. It
           changed the office the same Rurikid line now claimed to hold -
           no longer merely the senior of the Rus' princes, but an
           anointed autocrat in the Byzantine mould his grandfather Ivan
           III had already spent a reign building the ceremonial and
           genealogical case for."
    source: kliuchevsky-1912
    contested: false
