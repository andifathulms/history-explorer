    source: porter-1992
    contested: false

  # ---- The Liao, continued two thousand miles west ----

  - from: liao
    to: qara-khitai
    type: claimed legitimacy of
    year: 1124
    note: "Yelu Dashi, of the Liao imperial clan, kept the dynastic name, the
           reign names, the Chinese titles and the Chinese-form coinage after
