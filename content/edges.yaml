    contested: false

  - from: rum
    to: karamanid
    type: absorbed remnants of
    year: 1277
    note: "Karaman took Konya while the sultanate was an Ilkhanid tributary and
           put a claimed Seljuk on its throne; the attempt failed within weeks
           and the claim to be the heirs of Rum was asserted for two centuries
           afterwards."
    source: peacock-yildiz-2013
    contested: true

  - from: karamanid
    to: ottoman
    type: conquered by
    year: 1487
    note: "Annexed by Mehmed II in 1468, restored under rival Karamanids backed
           by the Akkoyunlu and the Mamluks, and finished by Bayezid II in 1487
           when there was nobody left to supply it."
    source: finkel-2005
    contested: false

  # ---- What 1204 broke into ----

  - from: byzantine
    to: trebizond
    type: partitioned from
    year: 1204
    note: "Two grandsons of Andronikos I took the Pontic coast with Georgian
           troops in the month the Fourth Crusade was sacking Constantinople,
           and claimed the imperial title along with Nicaea and Epirus."
    source: treadgold-1997
    contested: false

  - from: trebizond
    to: ottoman
    type: conquered by
    year: 1461
    note: "Mehmed II brought an army overland and a fleet along the coast; the
           city held about a month and David surrendered on 15 August, eight
           years after Constantinople."
    source: finkel-2005
    contested: false

  - from: cilician-armenia
    to: mamluk-sultanate
    type: conquered by
    year: 1375
    note: "Raided at intervals from 1266 for having ridden with the Mongols,
           reduced to tribute by 1285, and finished when Sis fell in April
           1375; the last king died in exile in Paris."
    source: petry-1998
    contested: false

  - from: byzantine
    to: nicaea
    type: partitioned from
    year: 1204
    note: "The Fourth Crusade took Constantinople and the imperial government
           reconstituted itself in western Anatolia, one of three Greek states
           claiming to be the empire."
    source: treadgold-1997
    contested: false

  - from: nicaea
    to: byzantine
    type: claimed legitimacy of
    year: 1261
    note: "Nicaea retook Constantinople and did not present itself as a
           successor state but as the empire resuming its capital; the restored
           regime is recorded on this site as the same Byzantine polity."
    source: treadgold-1997
    contested: false

  # ---- The two sheep ----

  - from: ilkhanate
    to: sarbadar
    type: seceded from
    year: 1337
    note: "A landowner killed a tax official at Bashtin near Sabzavar two years
           after the Ilkhanate stopped functioning; the district rose, took the
           town and went on collecting the tax itself."
    source: smith-1970
    contested: false

  - from: sarbadar
    to: timurid
    type: absorbed remnants of
    year: 1381
    note: "Ali Mu'ayyad invited Timur into Khurasan against his own neighbours
           and his own exiles, submitted without a siege, and entered his
           service."
    source: smith-1970
    contested: false

  - from: ilkhanate
    to: muzaffarid
    type: absorbed remnants of
    year: 1340
    note: "The Muzaffarids had governed Yazd for the Ilkhans; when the state
           stopped they kept the governorship, took Kerman and then Fars, and
           went on running the provincial administration they had been part
           of."
    source: chi-6
    contested: false

  - from: muzaffarid
    to: timurid
    type: conquered by
    year: 1393
    note: "Timur destroyed Shah Mansur outside Shiraz and then had the surviving
           princes of the house executed together, which is why nothing of the
           dynasty continued anywhere."
