           the caliph's name in the khutba for two hundred years without ever
           declaring itself anything but a governorship."
    source: bosworth-1996
    contested: false

  - from: sulayhid
    to: zurayid
    type: partitioned from
    year: 1080
    note: "Two cousins of the Banu Zuray' held Aden and its customs as Sulayhid
