    type: conquered by
    year: 580
    note: "The last of the three Caucasian crowns to be removed by the same
           empire, and replaced eight years later by a presiding prince chosen
           from among the noble houses — which made explicit what had always
           been the case."
    source: suny-1994
    contested: false

  - from: shaddadid
    to: georgia
    type: conquered by
    year: 1199
    note: "Georgian forces under Tamar's Zakarid generals took Ani from the last
           Shaddadid emir, a hundred and twenty-six years after the Seljuks had
           granted the Armenian royal capital to his family."
    source: minorsky-1953
    contested: false

  - from: derbend
    to: great-seljuk
    type: conquered by
    year: 1077
    note: "The pass built by a Sasanian emperor to keep Turkic peoples out of
           the countries south of the Caucasus was taken by Turkic peoples who
           had come round it, out of Central Asia by way of Iran, and arrived
           from the south."
    source: minorsky-1958
    contested: false

  - from: bagratid-armenia
    to: byzantine
    type: conquered by
    year: 1045
    note: "Hovhannes-Smbat had undertaken in 1022 to leave Ani to the emperor;
           Constantinople produced the document when he died, invaded when the
           Armenians crowned Gagik II instead, and detained the king until he
           surrendered the city."
    source: hovannisian-1997
    contested: false

  - from: bagratid-armenia
    to: cilician-armenia
    type: absorbed remnants of
    year: 1080
    note: "The Armenian nobility dispersed west after Ani fell to the Seljuks in
           1064, and a family connected to the last Bagratid court established
           itself in the Taurus, where its descendants built a second Armenian
           kingdom three hundred miles from the first."
    source: hovannisian-1997
    contested: false

  - from: diriyah
    to: nejd
    type: absorbed remnants of
    year: 1824
    note: "Six years after Ibrahim Pasha demolished Diriyah and beheaded the
           imam at Istanbul, a cousin who had escaped the deportation took
           Riyadh and reconstituted the state with the same doctrine and the
           same compact."
    source: al-rasheed-2010
    contested: false

  - from: nejd
    to: rashidi
    type: conquered by
    year: 1891
    note: "The Rashidis of Ha'il, installed as Saudi clients in 1836, arbitrated
           the war between Faysal's sons in their own favour, took Riyadh in
           1887, and beat the last Saudi attempt to recover it at Mulayda."
    source: al-rasheed-1991
    contested: false

  - from: himyar
    to: hujrid
    type: vassal of
    year: 480
    note: "Himyar installed and paid a family of the Kinda to hold the tribes of
           central Arabia, in the same way Rome paid the Jafnids to hold the
           Syrian steppe and Iran paid the Nasrids to hold the Euphrates."
    source: fisher-2011
    contested: false

  - from: saba
    to: himyar
    type: absorbed remnants of
    year: 275
    note: "The highland kingdom at Zafar came out of three centuries of
           competition for the same crown holding it: by the late third century
           its ruler styled himself king of Saba' and of dhu-Raydan, and Saba'
           was not a separate polity again."
    source: fisher-2015
    contested: false

  - from: himyar
    to: aksum
    type: conquered by
    year: 525
    note: "Kaleb of Aksum crossed the Red Sea with Byzantine encouragement after
           the killings at Najran, defeated and killed the Jewish king Yusuf,
           and installed a Christian client at Zafar."
    source: bowersock-2013
    contested: false

  - from: yaariba
    to: al-busaid
    type: absorbed remnants of
    year: 1744
    note: "Ahmad bin Sa'id, the Ya'ariba governor of Sohar, held his town
           through a siege, negotiated and fought the Persian occupation out of
           Oman, and was elected imam by the scholars in place of the house that
           had invited it in."
    source: risso-1986
    contested: false

  - from: ayyubid
    to: rasulid
    type: seceded from
    year: 1229
    note: "The last Ayyubid prince of Yemen left for Syria and appointed a
           deputy from a family that had come south in his family's service;
           the deputy had the khutba read in his own name instead."
    source: smith-1974
    contested: false

  - from: fatimid
    to: sulayhid
    type: vassal of
    year: 1047
    note: "Ali al-Sulayhi rose in the Haraz mountains as a convert of the
           Fatimid mission and ruled Yemen in the Cairo caliph's name, at one
           point controlling the appointment of the amirs of Mecca on his
           behalf."
    source: daftary-2007
    contested: false

  - from: oman-imamate
    to: abbasid
    type: conquered by
    year: 893
    note: "A faction in the Ibadi civil war over the deposition of the imam
           al-Salt invited in the Abbasid governor of Bahrayn, whose army took
           Nizwa in 893 and killed the imam."
    source: wilkinson-1987
    contested: false

  # ---- Sicily, and the Balkans ----

  # Fills a field that has been empty since the Zirid record was written: its
  # `ended.by` was `[]` with a comment saying the vocabulary could not name the
  # power that took Mahdia in 1148 because that power had no page.
  - from: zirid
    to: norman-sicily
    type: conquered by
    year: 1148
    note: >-
      Roger II's fleet took Mahdia and the Tunisian ports, which the Sicilian
      kingdom held as tributaries for about a decade before the Almohads took
      them.
    source: matthew-1992
    contested: false

  # Internal to the Latin West, and its third. Henry VI claimed through his
  # wife, Roger II's posthumous daughter, against the man the Sicilian barons
  # had elected instead.
  - from: norman-sicily
    to: holy-roman-empire
    type: conquered by
    year: 1194
    note: >-
      Henry VI entered Palermo with an army financed by the ransom of Richard I
      of England and was crowned on Christmas Day. The kingdom's administration
      continued and his son Frederick II was raised in it.
    source: matthew-1992
    contested: false

  # Both Bulgarian records point outward, at Byzantium and at the Ottomans, and
  # the relation between them is the `resumes` field rather than an edge. The
  # Balkans therefore enters this corpus with `thread: false`, which is the
  # ordinary state and what the workflow rule requires.
  - from: first-bulgarian
    to: byzantine
    type: conquered by
    year: 1018
    note: >-
      Basil II finished a war that had run since 976, four years after Kleidion.
      Bulgaria was annexed and administered directly for a hundred and
      sixty-seven years, with its patriarchate reduced to an archbishopric at
      Ohrid.
    source: fine-1983
    contested: false

  - from: serbia
    to: ottoman
    type: conquered by
    year: 1459
    note: >-
      Smederevo surrendered in June 1459, seventy years after Kosovo and six
      years after Constantinople. Serbia had been an Ottoman vassal for most of
      the interval and had supplied troops to Mehmed II's army at the siege of
      the city.
    source: cirkovic-2004
    contested: false

  - from: second-bulgarian
    to: ottoman
    type: conquered by
    year: 1396
    note: >-
      Tarnovo fell in 1393 and Vidin, the last of the divided Bulgarian
      territories, in 1396 after the crusade at Nicopolis was destroyed.
    source: fine-1987
    contested: false

  # ---- What the western provinces became ----

  # The four post-Roman kingdoms all take an edge from the Roman record and all
  # of them cross out of the Latin West into Rome and Byzantium, so none is
  # drawn by either thread. That is the split working as intended: these are
  # states assembled out of a dead empire's provinces, not states that succeeded
  # it in the sense a thread draws.
  - from: roman
    to: visigothic
    type: absorbed remnants of
    year: 418
    note: >-
      The Goths were settled in Aquitaine as federates by treaty in 418 and
      converted the arrangement into a kingdom over the following two
      generations, taking most of Spain after 476.
    source: heather-1996
    contested: false

  - from: roman
    to: vandal
    type: absorbed remnants of
    year: 439
    note: >-
      Geiseric took Carthage and with it the African provinces that supplied
      Rome's grain and a large share of the western empire's revenue.
    source: merrills-miles-2010
    contested: false

  - from: roman
    to: ostrogothic
    type: absorbed remnants of
    year: 493
    note: >-
      Theodoric was sent from Constantinople to remove Odoacer, killed him at
      Ravenna, and governed Italy through the surviving Roman administration
      with the eastern emperor's recognition.
    source: heather-1996
    contested: false

  # Both ends in Rome and Byzantium's region? No — the conquered records are in
  # the Latin West and Byzantium is not, so these cross as well. Justinian's
  # reconquest joins the two regions three times and is drawn by neither, which
  # is a fair statement of what it achieved.
  - from: vandal
    to: byzantine
    type: conquered by
    year: 534
    note: >-
      Belisarius landed with about sixteen thousand men and took the kingdom in
      a single campaigning season.
    source: merrills-miles-2010
    contested: false

  - from: ostrogothic
    to: byzantine
    type: conquered by
    year: 553
    note: >-
      Eighteen years of war ending at Taginae and Mons Lactarius, after which no
      Gothic army existed and Italy was a province neither power could pay to
      defend.
    source: heather-1996
    contested: false

  # The one internal edge the four of them produce, and the Latin West's second.
  - from: lombard
    to: carolingian
    type: conquered by
    year: 774
    note: >-
      Charlemagne besieged Pavia, banished Desiderius for life and drove his son
      Adalgis out of Italy, and added king of the Lombards to his own title. The
      kingdom's laws, duchies and administration continued, and the conqueror
      installed his own son as its king — a dynasty replaced rather than a state
      destroyed.
    source: christie-1995
    contested: false

  # Crosses into the caliphates. The Visigothic record's ending is the event
  # every page in this corpus's Islamic west points at, and until now nothing
  # was on the other end of it.
  - from: visigothic
    to: umayyad
    type: conquered by
    year: 711
    note: >-
      An army under Tariq ibn Ziyad landed from Tangier, destroyed the royal
      army and killed Roderic, and the peninsula was held within four years — a
      great deal of it by surrender treaty rather than by fighting.
    source: collins-2004
    contested: false

  # ---- The title, and the city, change hands again ----

  # Two claims on the same idea two hundred years apart, and this site counts
  # both on the Roman record. The Ottonian one also runs through Charlemagne —
  # Otto I was crowned in explicit revival of his empire — so it appears twice.
  - from: carolingian
    to: holy-roman-empire
    type: claimed legitimacy of
    year: 962
    note: >-
      Otto I, a Saxon from the people Charlemagne had conquered and baptised at
      spearpoint, was crowned emperor at Rome seventy-four years after the last
      Carolingian emperor was deposed, in explicit revival of the empire.
    source: wilson-2016
    contested: false

  - from: roman
    to: holy-roman-empire
    type: claimed legitimacy of
    year: 962
    note: >-
      The doctrine of translatio imperii held that the Roman empire had passed
      to the Greeks, then to the Franks, then to the Germans, and that the
      German king who was crowned at Rome held it. The name was Sacrum Romanum
      Imperium from the twelfth century.
    source: wilson-2016
    contested: false

  - from: byzantine
    to: latin-empire
    type: conquered by
    year: 1204
    note: >-
      A crusade Venice had contracted to carry took Constantinople and installed
      a Latin emperor. The partition treaty divided the empire between the
      crusaders and Venice; three Greek governments claiming to be the empire
      survived elsewhere, at Nicaea, at Trebizond and in Epirus.
    source: van-tricht-2011
    contested: false

  - from: latin-empire
    to: nicaea
    type: conquered by
    year: 1261
    note: >-
      A Nicaean force of about eight hundred found the garrison away raiding and
      the Venetian fleet absent, and entered the city. The last Latin emperor
      took ship for Italy and spent the rest of his life trying to raise a
      crusade to get it back.
    source: treadgold-1997
    contested: false

  # ---- The lagoon lets go of Constantinople ----

  # Venice began as a Byzantine province. Its dukes were imperial officials with
  # Greek court titles, and the emancipation has no date, no declaration and no
  # war — the Pax Nicephori of 812, in which Byzantium and the Franks agreed
  # whose the lagoon was, is the conventional peg and is a treaty between two
  # other powers about it. `contested` records that nobody seceded from
  # anything; a province stopped being governed and went on paying compliments.
  #
  # The Genoese record entering alongside this one has no edge in either
  # direction. Its origin is a commune emancipating itself from a bishop and a
  # kingdom of Italy, neither of which is in this corpus, and hard rule 7 makes
  # that a finished state.
  - from: byzantine
    to: venice
    type: seceded from
    year: 812
    note: >-
      The duchy of Venetia was Byzantine territory and its doges were imperial
      officials; by the ninth century they were choosing themselves, minting,
      and treating with the Franks, while continuing to accept Byzantine court
      titles for another two hundred years.
    source: lane-1973
    contested: true

  # ---- The Franks in the Levant ----
  #
  # Both of these states were founded by an expedition from outside this corpus
  # and inherited by nobody, so each has one edge and it is the one that ended
  # it. There is deliberately no edge from Jerusalem to the Ayyubids: 1187 took
  # the kingdom's capital and nine-tenths of its ground and did not end it, and
  # `conquered by` would assert that it did. That year is a turning point on the
  # Jerusalem page instead.

  - from: fatimid
    to: jerusalem
    type: conquered by
    year: 1099
    note: "The Fatimids had retaken Jerusalem from the Seljuks the year before
           and held it for eleven months; the First Crusade stormed it in July
           1099 and the garrison surrendered the citadel to Raymond of
           Toulouse."
    source: barber-2012
    contested: false

  - from: edessa
    to: zangid
    type: conquered by
    year: 1144
    note: "Zengi took Edessa in four weeks over Christmas 1144 while the count
           was west of the Euphrates, destroying the first Frankish state to be
           founded and the first to be lost."
    source: barber-2012
    contested: false

  - from: jerusalem
    to: mamluk-sultanate
    type: conquered by
    year: 1291
    note: "Al-Ashraf Khalil took Acre in six weeks with artillery brought from
           Damascus and Baalbek, after which Tyre, Sidon, Beirut and Tortosa
