# Provenance for every image file under public/flags.
#
# This file credits drawings, not scholarship. Nothing here is a source: none of
# these images is evidence about the past, and none may be cited as one. What a
# chronicler says about a banner's colour lives in a polity's `banner.attested`
# and cites sources.yaml; what is drawn in an SVG lives here and cites the person
# who drew it.
#
# The reason it exists at all is that the licences oblige it. CC BY-SA requires
# attribution in a form the reader can see, so the author and licence are
# rendered under every image rather than kept in a comment.
#
# `drawn_from` records what the uploader says the drawing was based on, and it is
# the field to read first. Most flag SVGs in circulation for these polities trace
# back to Pinterest boards, wikis, blogs and in one case a Reddit thread; those
# were found during this pass and rejected, and the rejections are listed at the
# foot of this file so the next pass does not have to rediscover them.

credits:
  - id: abbasid-caliphal-banner
    file: abbasid.svg
    author: MWahaiibii
    licence: CC BY-SA 4.0
    licence_url: https://creativecommons.org/licenses/by-sa/4.0/
    url: https://commons.wikimedia.org/wiki/File:Abbasid_Caliphate_Caliphal_Banner.svg
    retrieved: 2026-09-05
    drawn_from: >-
      David Nicolle, Armies of the Muslim Conquest, and Jane Hathaway, A Tale of
      Two Factions — both real works, which is what separates this file from
      every other Abbasid banner on Commons. Wikimedia itself tags the result
      "fictitious"; so does this repository, in the polity data rather than only
      here, so that the label travels with the picture onto the page.

