# Denominators for era-normalised mode. Both series must come from cited
# sources. Where a denominator is missing for a date, era-normalised mode shows
# a gap for that polity rather than falling back to the absolute figure —
# see lib/ratings.ts.
#
# world_land_under_state_control_km2 is null throughout. No dataset in
# sources.yaml carries that series, and deriving it by summing the polities in
# this file would be a computation presented as a measurement. The axis
# therefore shows a gap in era-normalised mode until a source for it is added,
# which is the correct behaviour rather than a missing feature.
world_denominators:
  - { year: 800,  world_population: { value: 220000000, source: mcevedy-jones-1978 }, world_land_under_state_control_km2: null }
  - { year: 900,  world_population: null, world_land_under_state_control_km2: null }
  - { year: 1000, world_population: { value: 265000000, source: mcevedy-jones-1978 }, world_land_under_state_control_km2: null }
  - { year: 1100, world_population: null, world_land_under_state_control_km2: null }
  - { year: 1200, world_population: { value: 360000000, source: mcevedy-jones-1978 }, world_land_under_state_control_km2: null }
  - { year: 1300, world_population: null, world_land_under_state_control_km2: null }
