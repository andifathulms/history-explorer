# Reference backdrop. Numbers only: no prose, no pages, not browsable. These
# exist so that a percentile is a true statement about world history rather
# than a comparison against eight things.
#
# Hard rule 2 applies here as hard as anywhere. Where a figure is not carried by
# one of the cited datasets it is null, and the polity simply does not
# participate in that axis's percentile. It is not estimated from a neighbour,
# not interpolated, not carried over from a different date.
#
# reach_km2 is Taagepera, converted from megametres squared as published
# (1 Mm2 = 1,000,000 km2). The conversion is a unit change, not a computation.
# peak_population is McEvedy & Jones. Most entries here are null: the Atlas is
# a regional series, and reading an empire total out of it would be exactly the
# interpolation hard rule 2 forbids.

polities:
