# Regions group polities for browsing, and give a continuity thread its scope.
#
# A region is a browsing convenience and the boundary of a succession thread. It
# is NOT a claim that the polities inside it were one civilisation, one people,
# or one story.
#
# Crucially, a region need not carry a thread at all. Succession is a property
# that some polities have and others do not: a polity that seceded from nothing
# and was inherited by nobody still gets a page, still enters the rankings, and
# simply has no thread to stand in. `thread: false` is an ordinary, expected
# state, not an unfinished one — see PRD section 3.
#
# `group` is a browsing shelf above the region and nothing else: it has no page,
# no route and no thread. Succession is scoped to a region and never wider, and
# the code enforces that by simply not having a group equivalent of
# `edgesInRegion`. The axis is geography, deliberately — grouping by
# civilisation would assert one level up exactly what the paragraph above
# refuses. The closed list and the reasoning are in lib/types.ts.
#
# Two group ids were renamed once the Ancient Near East reached thirteen
# records. `iran` was the only one of the seven named after a modern country
# while the rest are physical geography, and it carries a region of Christian
# kingdoms oriented on Byzantium and Russia; it is now `iranian-plateau`.
# `fertile-crescent` stopped being true when Hatti, Urartu and both Elams
# entered, none of which is in the Fertile Crescent; it is now `near-east`.
# Renaming a group costs nothing because a group has no page and no route,
# which is the whole point of the paragraph above.
regions:

  # Split from `ancient-near-east`, which had reached thirteen records and eight
  # disconnected clusters. Egypt is the cleanest piece to lift out: it is a
  # river valley with its own chronology, its own script and its own list of
  # dynasties, and it was joined to Assyria and Elam on one shelf only because
  # all three are old.
  - id: ancient-egypt
    name: Ancient Egypt
    blurb: >-
      Three thousand years of one country, kept together by a river that floods
      on schedule. Egypt is the state that other ancient states are measured
      against — the earliest with a bureaucracy, a surveyed tax base and a
      settled idea of what a king was for — and it broke apart and reassembled
      on roughly the same ground more than once.
    group: near-east
    thread: false

  - id: mesopotamia
    name: Mesopotamia
    blurb: >-
      The land between the rivers, where the territorial empire was invented and
      then rebuilt about once a millennium on the same two hundred miles of
      alluvium. Akkad, Ur, Babylon and Assyria each claimed the last one's
      titles; the argument over which of them was an empire at all is older than
      most of the states in this collection.
    group: near-east
    thread: true

  # The third piece of the old `ancient-near-east`. Hatti sat on the Anatolian
  # plateau and Urartu around Lake Van — mountain powers that fought the
  # lowland empires and were not of them.
  - id: hatti-and-the-highlands
    name: Hatti and the Highlands
    blurb: >-
      The powers of the high country north and east of the plain: a chariot
      empire on the Anatolian plateau that treated with Egypt as an equal, and a
      kingdom around Lake Van that outlasted the Assyrian army sent to end it.
      Both were written out of history until their own archives were dug up.
    group: near-east
    thread: false

  # Membership rule, stated because it is not obvious and was not being
  # applied: this region holds polities whose whole basis was a claim on the
  # universal Islamic office. That is why Cordoba and the Fatimids are here and
  # the Almohads and Ottomans are not — both of those claimed the title too,
  # and both are filed where the rest of their history sits, with the claim
  # recorded as a count and an edge instead.
  - id: caliphates
    name: The Caliphates
    blurb: >-
      One office, and the polities that existed to claim it. The line from
      Medina to Damascus to Baghdad is the one usually meant by the word, and
      it spent its whole length contracting while the claim stayed universal —
      but from the tenth century it was not the only claimant, and a rival
      caliphate in Cairo and a restored Umayyad one in Cordoba are here on the
      same terms. Succession runs inside the line and stops at its edge:
      a polity that says the office was usurped is not its heir, and no edge
      joins them.
    group: near-east
    thread: true

  # Split from a single `central-lands` region that had grown to fifteen
  # polities and drew one thread over five disconnected clusters.
  #
  # The cut follows where each polity's succession actually ran, which is what
  # a region is the boundary of. That is not the same as where its capital
  # stood, and two members show it: the Zangids held Mosul as well as Aleppo,
  # and the county of Edessa sat east of the Euphrates, so a purely
  # cartographic rule would put both in the Jazira. Both are here, because
  # Burid to Zangid to Ayyubid and Edessa to Zangid are one chain and cutting
  # it would hide the counter-crusade in a list of outward edges.
  #
  # The name is the one the Ayyubids and the Mamluks used for their own state.
  - id: egypt-and-syria
    name: Egypt and Syria
    blurb: >-
      Egypt's grain and the Syrian coast, and the long argument over whether
      they were one country. The provinces that left the caliphate earliest
      because they were richest, the Turkish atabegs who reunited them against
      an invasion from Europe, and the four Frankish states that held the shore
      for a hundred and ninety-two years and were removed from it in
      twenty-three.
    group: near-east
    thread: true

  - id: jazira
    name: The Jazira
    blurb: >-
      The country between the Euphrates and the Tigris, and Aleppo at the end
      of the road west — held in turn by Arab, Kurdish and Turkmen dynasties
      who mostly did not inherit from each other. Succession here is thin on
      purpose: the Jazira's transfers of power ran through Baghdad and then
      through Isfahan, and its two unattached polities each have an edge that
      leaves the region because the Seljuk sultanate is what stood between one
      and the next.
    group: near-east
    thread: true

  # Also split out of `ancient-near-east`, and filed on the Iranian plateau
  # rather than in the Near East, because that is where it is. Elam is
  # Khuzestan and the Zagros valleys above it — the same country, and in places
  # the same cities, that the Achaemenids later governed from.
  - id: elam
    name: Elam
    blurb: >-
      The oldest state on the Iranian side of the Zagros, and the one the rest
      of Iran was built on top of: Susa was an administrative capital for two
      thousand years before Cyrus, and the Achaemenids kept its language, its
      scribes and its clay.
    group: iranian-plateau
    thread: false

  # Blurb widened. The four imperial records are still the spine, but the
  # region also holds the polities that took pieces of the plateau and did not
  # claim to be continuing anything — a Greek kingdom in Bactria and a steppe
  # confederation that killed a Sasanian king of kings — and a blurb naming only
  # the succession described the thread rather than the region.
  - id: pre-islamic-iran
    name: Iran before Islam
    blurb: >-
      Twelve centuries before the Arab conquests. Four empires held roughly the
      same plateau and each claimed, in different terms, to be continuing the
      last — Achaemenid, Seleucid, Parthian, Sasanian — and around them are the
      powers that took pieces of it and claimed nothing: a Greek kingdom on the
      Oxus, and the steppe confederation that broke the Sasanian frontier from
      the one direction the Roman wars make invisible.
    group: iranian-plateau
    thread: true

  - id: iranian-intermezzo
    name: The Iranian Intermezzo
    blurb: >-
      The Persianate dynasties between the fading of direct Abbasid rule and the
      Mongol arrival — Khurasan, Transoxiana and the Iranian plateau. Dense with
      succession: slave-generals taking their masters' provinces, vassals
      swallowing overlords, governors inheriting the empire that appointed them.
    group: iranian-plateau
    thread: true

  # Extended past 1736. The blurb previously ended at "the dynasty that made it
  # Shi'i", which described the corpus rather than the country: the Safavid
  # record's own `ended.by` was empty and pointed at men with no pages. The
  # region now runs from the Ilkhanate's collapse to the last Qajar.
  - id: later-iran
    name: Iran after the Mongols
    blurb: >-
      Six centuries between the Ilkhanate and the twentieth century: the
      provincial officers who kept the pieces of a Mongol state working, the
      Turkmen confederations that fought over the pastures, the dynasty that
      made Iran Shi'i, and what followed it — an Afghan occupation, a conqueror
      who took Delhi, a regent who refused the title of shah, and a century
      spent between two European empires.
    group: iranian-plateau
    thread: true

  # Added with thread: false for a single polity, and flipped once real sourced
  # edges joined members of it, per the workflow rule. There is exactly one
  # internal edge — shaddadid -> georgia, 1199 — and the thread draws it and
  # nothing else. That is not a thin result waiting to be filled: five polities
  # and one succession between any two of them is what this ground produced.
  # Everything else here goes outward, to Byzantium, to Cilicia, to the Seljuks,
  # to the Safavids, which is the whole argument of the region's blurb.
  - id: caucasus
    name: The Caucasus
    blurb: >-
      The isthmus between the Black Sea and the Caspian: a corridor every empire
      on either side wanted, none could cheaply hold, and all of them marched
      through — where local houses survived by being expensive to take and
      useful to leave alone.
    group: iranian-plateau
    thread: true

  # Split three ways from a single `arabia` region. That region had fifteen
  # polities and five edges arranged in three clusters with nothing joining
  # them: Saba' to Himyar in the south, the Ya'ariba to the Al Bu Sa'id in
  # Oman, and Diriyah to Nejd to the Rashidis in the interior. A thread is the
  # scope of a succession claim, and one thread drawn over three disconnected
  # graphs asserts a peninsula-wide sequence that no source supports and no
  # edge in this corpus draws. Three regions draw exactly what is there.
  #
  # The peninsula is still one place, and the connections between these three
  # are real — Himyar made the Kindite kings, the Qarmatians took the Black
  # Stone out of Mecca, Ottoman and Egyptian armies came for all three. Those
  # are cross-region edges, rendered beside each thread rather than inside it,
  # which is the honest place for them under hard rule 7.
  - id: south-arabia
    name: South Arabia
    blurb: >-
      Yemen and the incense country: highland kingdoms that grew rich carrying
      frankincense north, and the confessional states that later held the same
      mountains. Ground where a caravan route, a monsoon port and a terrace
      wall each supported a polity, and where the imperial armies that came for
      them — Aksumite, Ayyubid, Ottoman — could take the coast and not the
      highlands.
    group: arabia
    thread: true

  - id: oman
    name: Oman
    blurb: >-
      The Ibadi imamate behind the Hajar mountains, and the two dynasties that
      grew out of it and went to sea. Oman is the one part of Arabia where an
      elected imamate was the normal form of the state for a thousand years,
      and the only one whose rulers ended up governing an African coast.
    group: arabia
    thread: true

  - id: central-arabia
    name: The Najd, the Hijaz and the Gulf
    blurb: >-
      The interior and the two coasts it kept reaching. Central Arabia produced
      no lasting state of its own until the eighteenth century, but it produced
      the men who took the others: a Kindite kingship made in Yemen, a
      Qarmatian state on the Gulf that carried the Black Stone away, sharifs
      holding Mecca for nine hundred years under whoever was paying, and
      finally a movement out of the Najd that took the lot.
    group: arabia
    thread: true

  # Added with thread: false, per the workflow rule. Ptolemaic Egypt had
  # nowhere to go: "Iran before Islam" holds the Macedonians and the Seleucids
  # because they held the plateau, and Egypt never did; "The Ancient Near East"
  # is a period that conventionally stops at Alexander; and "Egypt, Syria and
  # the Jazira" is defined by proximity to Baghdad, which did not exist.
  #
  # Flipped to true on exactly one edge, `hasmonean -> herodian` in 37 BC, once
  # the two Judaean records were added. It took seven polities to get there and
  # it is still the only one at ten, which is the region's own subject rather
  # than a shortfall: these are mostly powers that grew in the space between two
  # empires, and a polity defined by that space is succeeded by one of the
  # empires rather than by its neighbour. Nine of the ten records point outward
  # — seven of them at Rome — and are drawn by nothing.
  #
  # A geographic strain is worth flagging here as well as on the page that
  # carries it. Al-Hira is eight hundred kilometres from the Mediterranean, in a
  # region named for it. The region is a political space rather than a
  # coastline, and keeping the two mirror-image Arab client dynasties together
  # was judged worth more to a reader than tidiness; nasrid-hira/01 sets the
  # decision out so it can be reversed.
  - id: eastern-mediterranean
    name: The Eastern Mediterranean after Alexander
    blurb: >-
      Between Alexander's death and the Arab conquests: the Successor kingdoms
      and the smaller monarchies that grew in their gaps, a Jewish state that
      made itself and was unmade, and the Arab powers that held the desert
      between Rome and Iran. Seven of the ten end against Rome, which is most of
      what the region has to say.
    group: mediterranean
    thread: true

  # Split out of `byzantium-and-the-latin-west`, which held both of these and
  # was named after four of its eight records. The name had been wrong for a
  # while — it carried the Roman empire, which precedes both halves of it, and
  # the Holy Roman Empire, which is neither Byzantium nor Latin in the sense the
  # name intended — and it was about to get worse, because the post-Roman
  # kingdoms are none of those things either.
  #
  # The cost was measured before the split rather than after: of the nine
  # internal edges the old region had, six survive here and in the Latin West,
  # and the three that do not are precisely the three that crossed between the
  # two halves — `roman -> carolingian`, `roman -> holy-roman-empire` and
  # `byzantine -> venice`. Those are claims and secessions across a boundary
  # rather than sequences within one, which is what a thread is a picture of.
  # They are still in edges.yaml and still on both pages; they are simply not
  # drawn.
  #
  # Five internal edges here. Three of the four records carry `election` in
  # their succession or legitimation fields, and the same is true of the Latin
  # West — the old region's six of eight, which survives the split evenly, and
  # the two records that do not carry it are the two hereditary ones.
  - id: rome-and-byzantium
    name: Rome and Byzantium
    blurb: >-
      The Roman empire, the eastern half that outlived it by a thousand years,
      and the two governments that held or claimed Constantinople in the
      fifty-seven years the Fourth Crusade took it away. One continuous object
      that this site is obliged to cut into four records, and every page here
      says so.
    group: mediterranean
    thread: true

  # Membership is the peninsula, not a lineage. That needs saying because the
  # blurb previously described the Sultanate of Rum and nothing else, in a
  # region where the Ottomans account for six hundred and twenty-three of the
  # eight hundred and forty-five years.
  - id: anatolia
    name: Anatolia
    blurb: >-
      The peninsula after Manzikert, which took four hundred years to stop
      being contested. A Seljuk branch organised the plateau and was broken by
      the Mongols; the marches it could no longer hold filled with Turkmen
      principalities; Greek and Armenian states survived on the coasts and in
      the mountains, one of them outlasting Constantinople itself. The polity
      that eventually took all of it began as the smallest of the
      principalities and is the reason the rest are usually left out.
    group: mediterranean
    thread: true

  # Split from `latin-west`, which held nine records in six disconnected pieces
  # and was doing three jobs. This is the first: the kingdoms the western
  # provinces turned into. They have no edges between them because they had no
  # succession between them — every one of them takes its predecessor edge from
  # Rome, and Rome is a region away.
  - id: post-roman-west
    name: The Post-Roman West
    blurb: >-
      What the western provinces became when there was no longer anyone in
      Ravenna to send taxes to: Gothic, Vandal and Lombard kingdoms governing
      Roman populations with Roman law and their own armies, none of them
      claiming to have replaced the empire and all of them behaving as though
      they had.
    group: mediterranean
    thread: false

  - id: frankish-world
    name: The Frankish World
    blurb: >-
      The one western kingdom that did claim to have replaced the empire, and
      the thing it turned into. A Frankish king was crowned emperor in Rome in
      800 and the title outlived his dynasty, his kingdom and the division of
      his inheritance by a thousand years.
    group: mediterranean
    thread: true

  # The third piece of `latin-west`. Two merchant republics and a Norman
  # kingdom is a thin start, but it is the right shape: these are states whose
  # power came from ports and fleets rather than from land, which is the thing
  # that separates them from everything else on the shelf.
  - id: italy
    name: Italy and the Sea Republics
    blurb: >-
      The peninsula that the empire was named after and never governed again,
      and the cities on it that grew rich carrying other people's wars. Venice
      and Genoa held quarters in every port that mattered from the Black Sea to
      Alexandria, fought each other for two centuries over the right to do it,
      and outlasted most of the kingdoms they supplied.
    group: mediterranean
    thread: false

  # Added with `thread: false` for the two Bulgarian records, per the workflow
  # rule in CLAUDE.md: a region enters with the flag off and it is flipped only
  # once real sourced edges join two of its polities. There are none here and
  # there may never be: the two records are one state seen twice across a
  # hundred and sixty-seven years of Byzantine rule, and that relation is the
  # `resumes` field rather than an edge. Both Bulgarias end against powers
  # outside the region, Byzantium in 1018 and the Ottomans in 1396.
  #
  # Bulgaria was named in the prose of eight records before it had one of its
  # own, which is what brought it in. Serbia is named on three and belongs
  # here when it comes. The Rus were once planned for this region too, but a
  # four-polity, thousand-year arc from Kyiv to Moscow overloads a region
  # blurbed around smaller neighbouring states, so it split out on its own —
  # see `rus-and-muscovy` below, the same reasoning that split maritime
  # Southeast Asia into three.
  - id: the-balkans
    name: The Balkans
    blurb: >-
      The states between the Danube and the Aegean that Constantinople converted
      and then had to live beside: powers in their own right for stretches of
      two or three generations, and the ground every empire on either side
      needed to hold and could not.
    group: northern-and-eastern-europe
    thread: false

  - id: eastern-europe
    name: Eastern Europe
    blurb: >-
      The country between the Latin west and the steppe, where the frontier ran
      the wrong way: these were states with open grassland on one side and
      forest on the other, taking their letters and their liturgy from
      Constantinople and their politics from whoever was riding out of the east
      that century.
    group: northern-and-eastern-europe
    thread: false

  # Added with `thread: false`, per the standing rule: a region enters with
  # the flag off and it is flipped only once real sourced edges join two of
  # its own polities. Kievan Rus', Novgorod, Muscovy and the Tsardom/Empire
  # of Russia are one continuous political throughline rather than a
  # scatter of unrelated states, which is the reason it gets its own region
  # instead of sharing `eastern-europe` with Serbia and its neighbours.
  #
  # Named for its two centres of gravity rather than for "Russia" outright:
  # Kievan Rus' and Novgorod never called themselves that, the same
  # reasoning that keeps `medang` separate from the later Mataram sultanate
  # elsewhere in this corpus.
  - id: rus-and-muscovy
    name: Rus' and Muscovy
    blurb: >-
      The river road from the Baltic to the Black Sea, and the
      principalities built along it: a federation of trading cities
      converted from Constantinople, shattered by the Mongols, and
      reassembled — over two centuries as a tribute-collecting vassal — by
      the one city among them that outlasted its own masters.
    group: northern-and-eastern-europe
    thread: false

  - id: islamic-west
    name: The Islamic West
    blurb: >-
      The Maghreb and al-Andalus — the provinces that left the caliphate
      earliest and stayed gone, and the Berber empires that later ruled both
      shores of the strait.
    group: africa-maghreb
    thread: true

  - id: the-nile-and-the-horn
    name: The Nile and the Horn
    blurb: >-
      Two Christian worlds either side of the Red Sea's southern end — Kush,
      Makuria and Alodia on the middle Nile, Aksum and its successor in the
      Ethiopian highlands — which outlasted the empires that converted them and
      were reached by Islam last.
    group: africa-maghreb
    thread: true

  # `africa` was one region with twelve records and three internal edges, and
  # the argument for splitting it was written on this file for several passes
  # before it was acted on: the clusters had nothing to do with each other, no
  # edge crossed between them, and none ever could, because Aksum and Mali have
  # nothing to do with each other.
  #
  # It is now three regions. The split cost zero edges — all three internal
  # edges are inside one of the new regions, and the three edges that leave
  # Africa (`saba -> ethiopia`, `himyar -> aksum`, `songhai -> saadi`) already
  # crossed a region boundary and were already not drawn by any thread.
  #
  # What the split does not fix is the thinness, and it makes it easier to see
  # rather than harder: West Africa has five records for a region that should
  # have Benin, Oyo, the Hausa city-states, the Sokoto caliphate and Kongo, and
  # the Zimbabwe plateau and its coast have two. Hard rule 8 exists so that
  # entries like these are not second-class once they arrive; what the rule
  # cannot do is get them written.
  #
  # Nine of the twelve records still have an empty `ended.by`, and that fact
  # belongs to the continent rather than to any of the three regions, which is
  # why the Asante and Kanem-Bornu chapters that count it now count it across
  # all three.
  - id: west-africa
    name: West Africa
    blurb: >-
      The Sahel and the forest below it: states that lived on the crossing
      charge for gold going north and salt coming south, from Ghana on the
      upper Senegal to Asante on the Volta, over a thousand years of the same
      trade changing hands.
    group: africa-maghreb
    thread: true

  - id: central-africa
    name: Central Africa
    blurb: >-
      The kingdoms of the equatorial forest and the savanna south of it, along
      the Congo and its tributaries — states with capitals of tens of thousands
      of people, and almost no written record of their own until outsiders
      arrived with one.
    group: africa-maghreb
    thread: false

  # `thread: false` and ordinary. Two records with no edge between them, and
  # there is no edge to draw: Kilwa sold the gold that Great Zimbabwe's plateau
  # produced, which is a trading relationship and not a succession. Hard rule 7
  # says a region without a thread is a normal region, and this is what one
  # looks like.
  - id: zimbabwe-and-the-coast
    name: The Zimbabwe Plateau and the Swahili Coast
    blurb: >-
      One inland stone capital and one island port, four hundred miles and a
      river apart, joined by a single commodity: the gold of the plateau, which
      left Africa through Sofala and Kilwa and paid for both of them.
    group: africa-maghreb
    thread: false

  # Was `inner-asia`. Renamed and narrowed when Tibet was lifted out: a plateau
  # empire with its own script, religion and agriculture is not a steppe power
  # and shared no succession with one. What is left is a single connected
  # tradition — the Ashina khaganates and what claimed descent from them — which
  # is what the edges in this collection actually draw, from Mongolia to the
  # Volga.
  - id: turkic-steppe
    name: The Turkic Steppe
    blurb: >-
      The grassland from Manchuria to the Danube, and the confederations that
      governed it by being able to leave. A khaganate on the Orkhon could put
      more cavalry in the field than any settled state and could not hold a
      city; the ones that lasted longest were the ones that learned to tax a
      trade route instead.
    group: steppe-east-asia
    thread: true

  - id: tibet
    name: Tibet and the Himalaya
    blurb: >-
      The plateau, which is high enough that the empires around it could not
      campaign on it and cold enough that it fed itself. For a century and a
      half Tibet took territory from Tang China and the caliphate at the same
      time, and then turned into something no other polity here became: a
      country governed by its monasteries.
    group: steppe-east-asia
    thread: false

  - id: mongol-world
    name: The Mongol World
    blurb: >-
      The largest contiguous land empire ever assembled, the four successor
      khanates it broke into within two generations, and the Chinggisid houses
      still ruling on the strength of that descent three centuries later.
    group: steppe-east-asia
    thread: true

  # Was `east-asia`, which was a continental name over six Chinese dynasties.
  # Korea and Japan have their own shelf now and are empty on it, which is
  # honest; the old name implied they were covered.
  - id: china
    name: China
    blurb: >-
      The longest continuous imperial tradition anywhere, and the argument about
      whether it is one state seen many times or many states using one name.
      Every dynasty here inherited a bureaucracy, a script and a claim to a
      mandate that could be lost — including the ones that arrived from the
      steppe and governed two populations under two administrations.
    group: steppe-east-asia
    thread: true

  - id: korea-and-japan
    name: Korea and Japan
    blurb: >-
      The two states that took Chinese writing, Chinese law and Chinese
      Buddhism and stayed separate anyway. Both produced dynastic lines longer
      than anything on the mainland — one court on the Korean peninsula ruled
      for five hundred years, and the Japanese imperial house has never been
      replaced, only sidelined.
    group: steppe-east-asia
    thread: false

  - id: classical-india
    name: Classical India
    blurb: >-
      Maurya, Kushan and Gupta — the subcontinental empires that carried
      Buddhism out of India and set the terms of its classical culture.
    group: south-asia
    thread: false

  - id: northern-india
    name: Northern India
    blurb: >-
      The Gangetic plain between the classical empires and the sultanates, and
      the powers that fought over it: three great kingdoms contending for one
      city for two centuries, and the regional states that outlived all three.
    group: south-asia
    thread: false

  - id: the-deccan
    name: The Deccan and the South
    blurb: >-
      Peninsular India, which was never governed from the north for long and
      spent most of its history under dynasties the north barely recorded — a
      Tamil empire that sent fleets to Sumatra, a city on the Tungabhadra that
      Persian visitors compared to Rome, and a sultanate that broke into five.
    group: south-asia
    thread: false

  - id: indian-sultanates
    name: The Indian Sultanates
    blurb: >-
      Turkic and Afghan rule in northern India, founded by a Ghurid
      slave-general and outlasting every polity that produced it.
    group: south-asia
    thread: true

  # New in this pass, and `thread: false` deliberately.
  #
  # There is already a sourced internal edge here — `angkor -> ayutthaya`,
  # `conquered by`, 1431 — which means the flag could be flipped today and the
  # build would accept it. The project's own instructions say not to: add a
  # region with `thread: false`, add its polities one at a time, and flip the
  # flag in a later pass once the edges are real. The rule exists because a
  # thread added in the same breath as its region is a picture drawn before
  # anybody has checked whether there is anything to draw. It is being followed
  # here even though the edge is already sitting in edges.yaml.
  #
  # The region exists because the old single Maritime Asia region — since split
  # into three — could not hold these. Its blurb said its polities lived on
  # controlling straits instead of territory,
  # which is exactly what Angkor, Pagan and Dai Viet did not do — they were rice
  # states on four river systems, and the largest of them never touched the sea
  # route at all. Champa is the exception that shows the boundary is real: it
  # sat on the coast between them, lived on the passing trade like a maritime
  # polity, and was eaten by a land one.
  - id: mainland-southeast-asia
    name: Mainland Southeast Asia
    blurb: >-
      The rice states of the peninsula — the Irrawaddy, the Chao Phraya, the
      Mekong and the Red River — which built on a scale nothing in the islands
      matched and mostly ignored the sea route that made the islands rich, plus
      the coast between them that did not.
    group: southeast-asia
    thread: false

  # `maritime-asia` was one region and reached twenty-two records, which made it
  # the largest on this site by eight — the next is fourteen. It is now three.
  #
  # The split cost one edge of fifteen: `srivijaya -> singhasari`, the Pamalayu
  # of 1275, which is the only edge that ever crossed between Sumatra and Java
  # and which the Medang record's second chapter already described as the one
  # connection between two halves that barely touch, three centuries late. It
  # stays in edges.yaml and is now drawn by no thread, like every other edge on
  # this site whose ends fall in different regions.
  #
  # Java keeps ten edges and the peninsula four. The eastern archipelago has
  # none and never had any — Ternate and Tidore are contemporaries whose
  # relationship runs sideways, Makassar was ended by a polity with no page,
  # Brunei and Sulu succeeded nothing here. `thread: false` on it is the
  # ordinary state hard rule 7 describes and not a defect.
  #
  # What the split does not change is the count of things that are true about
  # the archipelago rather than about a region: ten records carrying Sunni Islam
  # in one movement from Pasai outward, fourteen with an empty `ended.by`, nine
  # coded `client-levy` for sea peoples nobody commanded, and not one carrying a
  # reach figure. Those were always facts about a corpus and a sea, and the
  # chapters that count them now say so.
  - id: sumatra-and-the-peninsula
    name: Sumatra and the Peninsula
    blurb: >-
      The strait, and the states that lived on it: a thousand years of one
      passage between the Indian Ocean and the South China Sea changing hands,
      from Srivijaya to the sultanates that inherited its position and its sea
      peoples.
    group: southeast-asia
    thread: true

  - id: java-and-bali
    name: Java and Bali
    blurb: >-
      One island's rice, and the seven hundred years of kingdoms that lived on
      it — an unbroken sequence from the Brantas valley to the division of
      Mataram, plus the western kingdom that was never part of it and the
      Balinese court that inherited what Java gave up.
    group: southeast-asia
    thread: true

  - id: the-eastern-archipelago
    name: The Eastern Archipelago
    blurb: >-
      Sulawesi, Maluku, Borneo and Sulu: the far side of the sea route, where
      the cloves grew on five islands, the last open port was destroyed for
      being open, and Islam reached its eastern and northern limits.
    group: southeast-asia
    thread: false

  - id: mesoamerica
    name: Mesoamerica
    blurb: >-
      The states of the Mexican highlands and the Maya lowlands: cities of a
      hundred thousand people, a writing system, a calendar accurate over
      millennia, and no draught animals, no wheeled transport and no iron.
    group: the-americas
    thread: false

  - id: the-andes
    name: The Andes
    blurb: >-
      Empire built vertically, on a mountain range where a day's walk changes
      the crop — and administered without writing, by a state that ran a road
      network of thousands of miles and kept its accounts on knotted cord.
    group: the-americas
    thread: false
