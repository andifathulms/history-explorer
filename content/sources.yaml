  # ---- Encyclopaedia of Islam ----
  - id: ei2-karakhanids
    kind: encyclopaedia
    author: C. E. Bosworth and others
    title: "Ilek-Khans or Karakhanids"
    container: "Encyclopaedia of Islam, 2nd edition"
    publisher: Brill

  # ---- Quantitative datasets ----
  - id: taagepera-1997
    kind: dataset
    author: Rein Taagepera
    title: "Expansion and Contraction Patterns of Large Polities: Context for Russia"
    container: International Studies Quarterly 41(3), 475-504
    year: 1997
    note: >-
      Source for peak territorial extent. Taagepera reports in megametres
      squared; this repository stores km2 as given, without rescaling beyond
      the unit conversion.

  - id: taagepera-1979
    kind: dataset
    author: Rein Taagepera
    title: "Size and Duration of Empires: Growth-Decline Curves, 600 B.C. to 600 A.D."
    container: Social Science History 3(3/4), 115-138
    year: 1979

  - id: taagepera-1978b
    kind: dataset
    author: Rein Taagepera
    title: "Size and Duration of Empires: Systematics of Size"
    container: Social Science Research 7(2), 108-127
    year: 1978

  - id: mcevedy-jones-1978
    kind: dataset
    author: Colin McEvedy and Richard Jones
    title: "Atlas of World Population History"
    publisher: Penguin Books
    year: 1978
    note: >-
      Source for peak population and for the world-population denominators used
      by era-normalised mode.

  - id: donner-1981
    kind: book
    author: Fred M. Donner
    title: The Early Islamic Conquests
    publisher: Princeton University Press
    year: 1981
    note: >-
      The standard study of the Rashidun conquests, and the reason the Rashidun
      chapters here are about tribal mobilisation and garrison towns rather than
      battles.

  - id: walker-2009
    kind: book
    author: Paul E. Walker
    title: "Caliph of Cairo: Al-Hakim bi-Amr Allah, 996-1021"
    publisher: American University in Cairo Press
    year: 2009
    note: >-
      The full-length study of the Fatimid caliph the sources cannot agree
      about. Used because the chapter drafted from it is as much about the
      historiography as about the reign: Walker's point that the mad tyrant and
      the divinely ordained imam are two constituencies' portraits of the same
      man is the reason this site declines to pick one.

  - id: goitein-1967
    kind: book
    author: S. D. Goitein
    title: "A Mediterranean Society: The Jewish Communities of the Arab World as Portrayed in the Documents of the Cairo Geniza"
    publisher: University of California Press
    year: 1967
    note: >-
      Six volumes published between 1967 and 1993; cited by the first. Used for
      the Fatimid chapter on the Geniza, which is the one place in this corpus
      where a polity's ordinary economic life is documented by its own paper
      rather than reconstructed from chronicles written afterwards.

  - id: gutas-1998
    kind: book
    author: Dimitri Gutas
    title: "Greek Thought, Arabic Culture: The Graeco-Arabic Translation Movement in Baghdad and Early 'Abbasid Society"
    publisher: Routledge
    year: 1998
    note: >-
      The standard account, and used here for its argument rather than for its
      booklist: that the translation movement was a state-sponsored social
      phenomenon serving Abbasid ideological needs, sustained for two centuries
      by demand and patronage, rather than the work of a few enlightened
      individuals or of Christian translators acting alone.

  - id: kennedy-2007
    kind: book
    author: Hugh Kennedy
    title: "The Great Arab Conquests: How the Spread of Islam Changed the World We Live In"
    publisher: Weidenfeld & Nicolson
    year: 2007
    note: >-
      Used for the second wave of conquest under al-Walid I — Transoxiana, Sind
      and al-Andalus in the same decade — which is the campaign that produced
      this site's second-largest reach figure and which the Umayyad page had no
      chapter for.

  - id: blankinship-1994
    kind: book
    author: Khalid Yahya Blankinship
    title: "The End of the Jihad State: The Reign of Hisham Ibn 'Abd al-Malik and the Collapse of the Umayyads"
    container: SUNY Series in Medieval Middle East History
    publisher: State University of New York Press
    year: 1994
    note: >-
      The argument that the Umayyad state was structurally financed by
      continuing conquest and could not survive its stopping. Cited here for
      the Umayyad revenue coding — it is the source that treats campaign
      proceeds as structural income rather than as something armies did — and
      for the second siege of Constantinople as the point the expansion met a
      limit it never passed.

  - id: crone-hinds-1986
    kind: book
    author: Patricia Crone and Martin Hinds
    title: "God's Caliph: Religious Authority in the First Centuries of Islam"
    container: University of Cambridge Oriental Publications 37
    publisher: Cambridge University Press
    year: 1986
    note: >-
      Argues from early poetry, coinage and epigraphy that the Umayyads styled
      themselves khalifat Allah, deputy of God, and claimed a religious
      authority the later Sunni tradition reserved for the scholars. The thesis
      is contested and the Umayyad chapter drafted from it says so; it is cited
      because the legitimation coding on that page has to rest on what the
      dynasty claimed rather than on what its successors said it claimed.

  - id: hinds-1972
    kind: chapter
    author: Martin Hinds
    title: "The Murder of the Caliph 'Uthman"
    container: International Journal of Middle East Studies 3(4), 450-469
    year: 1972
    note: >-
      Used for Uthman's caliphate, which this site previously recorded only as a
      corpse. Hinds reads the killing as the outcome of a distributional
      quarrel — fiscal centralisation over the conquered crown lands, Umayyad
      kinsmen in the governorships, and precedence in Islam used as a claim on
      stipend rank — rather than as a moral episode. The Rashidun chapter on
      Uthman follows him, including his argument that the pious rallying-cry
      was a cloak for material grievance.

  - id: hoyland-1997
    kind: book
    author: Robert G. Hoyland
    title: "Seeing Islam as Others Saw It: A Survey and Evaluation of Christian, Jewish and Zoroastrian Writings on Early Islam"
    container: Studies in Late Antiquity and Early Islam 13
    publisher: Darwin Press
    year: 1997
    note: >-
      The survey of roughly 120 non-Muslim texts bearing on the first century
      and a half of Islam. Used for the Rashidun chapter on the evidence, which
      is the one place this site says plainly that its most important polity is
      reconstructed from sources written a century and more after the events,
      and what independent contemporaries do and do not confirm.

  - id: sinai-2017
    kind: book
    author: Nicolai Sinai
    title: "The Qur'an: A Historical-Critical Introduction"
    container: The New Edinburgh Islamic Surveys
    publisher: Edinburgh University Press
    year: 2017
    note: >-
      Used for the Uthmanic standardisation of the Qur'anic text: the
      traditional account of the committee and the copies sent to the garrison
      towns, and what the early manuscript evidence does and does not settle.
      Cited for a chapter that is about a state act and its distribution
      network, not about scripture.

  - id: madelung-1997
    kind: book
    author: Wilferd Madelung
    title: "The Succession to Muhammad: A Study of the Early Caliphate"
    publisher: Cambridge University Press
    year: 1997
    note: >-
      Used for the succession disputes and the first fitna. Madelung argues a
      minority position on the legitimacy question; the chapters follow him on
      sequence and chronology, not on that argument.

  - id: hawting-2000
    kind: book
    author: G. R. Hawting
    title: "The First Dynasty of Islam: The Umayyad Caliphate AD 661-750"
    publisher: Routledge
    edition: 2nd
    year: 2000
    note: >-
      The standard Umayyad monograph, and the source for the Sufyanid/Marwanid
      split and for the argument that the hostile Abbasid-era sources shape most
      of what is written about the dynasty.

  - id: el-hibri-2021
    kind: book
    author: Tayeb El-Hibri
    title: "The Abbasid Caliphate: A History"
    publisher: Cambridge University Press
    year: 2021
    note: >-
      Used for the Abbasid arc after Harun al-Rashid, in particular the fourth
      fitna and the Samarra period.

  - id: daryaee-2009
    kind: book
    author: Touraj Daryaee
    title: "Sasanian Persia: The Rise and Fall of an Empire"
    publisher: I.B. Tauris
    year: 2009
    note: >-
      Used for the Sasanian state, its Zoroastrian establishment, and the
      collapse of 628-651.

  - id: chi-3
    kind: book
    author: Ehsan Yarshater (ed.)
    title: "The Cambridge History of Iran, Volume 3: The Seleucid, Parthian and Sasanian Periods"
    publisher: Cambridge University Press
    year: 1983

  - id: morgan-2007
    kind: book
    author: David Morgan
    title: The Mongols
    publisher: Blackwell
    edition: 2nd
    year: 2007
    note: >-
      Used for the Mongol campaigns and for the sceptical handling of the
      casualty figures the medieval sources give.

  - id: golden-1992
    kind: book
    author: Peter B. Golden
    title: An Introduction to the History of the Turkic Peoples
    publisher: Otto Harrassowitz
    year: 1992
    note: >-
      Used for the steppe polities: Karakhanid, Uyghur, Khazar.

  - id: brett-2017
    kind: book
    author: Michael Brett
    title: The Fatimid Empire
    publisher: Edinburgh University Press
    year: 2017

  - id: halm-1996
    kind: book
    author: Heinz Halm
    title: "The Empire of the Mahdi: The Rise of the Fatimids"
    publisher: Brill
    year: 1996

  - id: harvey-1990
    kind: book
    author: L. P. Harvey
    title: "Islamic Spain, 1250 to 1500"
    publisher: University of Chicago Press
    year: 1990
    note: >-
      The standard account of the two and a half centuries between the fall of
      Seville and the fall of Granada, covering the Nasrid emirate and the
      Muslim communities living under Christian rule alongside it. Cited for
      the Nasrid record, which needed a source that treats the period as
      something other than an epilogue.

  - id: kennedy-1996
    kind: book
    author: Hugh Kennedy
    title: "Muslim Spain and Portugal: A Political History of al-Andalus"
    publisher: Longman
    year: 1996

  - id: thapar-2004
    kind: book
    author: Romila Thapar
    title: "Somanatha: The Many Voices of a History"
    publisher: Penguin
    year: 2004
    note: >-
      Reconstructs the raid of 1026 and, more to the point, what was
      subsequently made of it — from Sanskrit inscriptions, merchant and royal
      biographies, court epics and popular narrative, set against the Persian
      and Arabic accounts. Cited for the Ghaznavid chapter on the Indian
      campaigns, because the afterlife of that event is a larger historical
      object than the event.

  - id: flood-2009
    kind: book
    author: Finbarr Barry Flood
    title: 'Objects of Translation: Material Culture and Medieval "Hindu-Muslim" Encounter'
    publisher: Princeton University Press
    year: 2009
    note: >-
      Reads the material culture of the eighth to thirteenth centuries in what
      is now Afghanistan, Pakistan and north India against the standard account
      of the period as unbroken hostility between two monolithic religious
      cultures. Cited for the Ghurid chapter on what the dynasty built, which
      is very nearly all it left.

  - id: frye-1965
    kind: book
    author: Richard N. Frye
    title: "Bukhara: The Medieval Achievement"
    container: The Centers of Civilization Series
    publisher: University of Oklahoma Press
    year: 1965
    note: >-
      A short book about one city at its height, by the translator of
      Narshakhi's History of Bukhara. Cited for the Samanid capital as a place
      rather than as a seat of government: the agrarian base, the caravan
      trade, the bureaucracy and the literary culture that made the identity
      line on that page true.

  - id: dresch-1989
    kind: book
    author: Paul Dresch
    title: "Tribes, Government, and History in Yemen"
    publisher: Clarendon Press
    year: 1989
    note: >-
      Combines ethnography with history to describe the tribal system of the
      northern Yemeni highlands over roughly a thousand years, and the relation
      of the tribes to Islamic learning and to the Zaydi imamate. Cited here
      for why an office that had to be claimed rather than inherited lasted so
      much longer than the states around it.

  - id: wilkinson-1987
    kind: book
    author: John C. Wilkinson
    title: The Imamate Tradition of Oman
    container: Cambridge Middle East Library
    publisher: Cambridge University Press
    year: 1987
    note: >-
      Traces regional identity, tribal organisation and political authority in
      south-eastern Arabia across some twelve hundred years. Cited for the
      first Ibadi imamate, and for the distinction between an imamate as an
      office repeatedly reconstituted and a dynasty that persists.

  - id: daftary-2007
    kind: book
    author: Farhad Daftary
    title: "The Isma'ilis: Their History and Doctrines"
    edition: 2nd
    publisher: Cambridge University Press
    year: 2007
    note: >-
      The standard survey of Isma'ili history across twelve centuries, and the
      source for the Nizari state on this site. Used particularly for its
      insistence that the Nizaris be read from Isma'ili material rather than
      from the hostile chronicles and Crusader traveller-tales that supplied
      almost everything Europe believed about them.

  - id: banister-2021
    kind: book
    author: Mustafa Banister
    title: "The Abbasid Caliphate of Cairo, 1261-1517: Out of the Shadows"
    container: Edinburgh Studies in Classical Islamic History and Culture
    publisher: Edinburgh University Press
    year: 2021
    note: >-
      The full-length study of the line this site counted as the Abbasids' only
      successor claim while describing it nowhere. Its argument is against the
      dismissal in its own subtitle — that a caliphate with no territory, army
      or revenue was nonetheless doing work, and that reading these men purely
      as figureheads is a judgement inherited from hostile brevity rather than
      one made from the record.

  - id: safran-2013
    kind: book
    author: Janina M. Safran
    title: "Defining Boundaries in al-Andalus: Muslims, Christians, and Jews in Islamic Iberia"
    publisher: Cornell University Press
    year: 2013
    note: >-
      Reads the ninth- and tenth-century Andalusi jurists on the practical
      problem of keeping communal boundaries legible in a society where
      conversion, intermarriage and a shared language kept dissolving them.
      Cited for the Cordoba chapter on the three communities, which is
      deliberately not a chapter about tolerance — and it is the second work
      cited on that page, which until now rested entirely on one book.

  - id: abun-nasr-1987
    kind: book
    author: Jamil M. Abun-Nasr
    title: A History of the Maghrib in the Islamic Period
    publisher: Cambridge University Press
    year: 1987

  - id: bennison-2016
    kind: book
    author: Amira K. Bennison
    title: The Almoravid and Almohad Empires
    publisher: Edinburgh University Press
    year: 2016

  - id: petry-1998
    kind: book
    author: Carl F. Petry (ed.)
    title: "The Cambridge History of Egypt, Volume 1: Islamic Egypt 640-1517"
    publisher: Cambridge University Press
    year: 1998

  - id: humphreys-1977
    kind: book
    author: R. Stephen Humphreys
    title: "From Saladin to the Mongols: The Ayyubids of Damascus 1193-1260"
    publisher: State University of New York Press
    year: 1977

  - id: hillenbrand-1999
    kind: book
    author: Carole Hillenbrand
    title: "The Crusades: Islamic Perspectives"
    publisher: Edinburgh University Press
    year: 1999

  - id: peacock-yildiz-2013
    kind: book
    author: A. C. S. Peacock and Sara Nur Yildiz (eds)
    title: "The Seljuks of Anatolia: Court and Society in the Medieval Middle East"
    publisher: I.B. Tauris
    year: 2013

  - id: treadgold-1997
    kind: book
    author: Warren Treadgold
    title: A History of the Byzantine State and Society
    publisher: Stanford University Press
    year: 1997

  - id: whittow-1996
    kind: book
    author: Mark Whittow
    title: "The Making of Orthodox Byzantium, 600-1025"
    publisher: Macmillan
    year: 1996

  - id: lewis-2009
    kind: book
    author: Mark Edward Lewis
    title: "China's Cosmopolitan Empire: The Tang Dynasty"
    publisher: Harvard University Press
    year: 2009

  - id: twitchett-1979
    kind: book
    author: Denis Twitchett (ed.)
    title: "The Cambridge History of China, Volume 3: Sui and T'ang China, 589-906, Part 1"
    publisher: Cambridge University Press
    year: 1979

  - id: franke-twitchett-1994
    kind: book
    author: Herbert Franke and Denis Twitchett (eds)
    title: "The Cambridge History of China, Volume 6: Alien Regimes and Border States, 907-1368"
    publisher: Cambridge University Press
    year: 1994

  - id: beckwith-1987
    kind: book
    author: Christopher I. Beckwith
    title: The Tibetan Empire in Central Asia
    publisher: Princeton University Press
    year: 1987

  - id: mckitterick-2008
    kind: book
    author: Rosamond McKitterick
    title: "Charlemagne: The Formation of a European Identity"
    publisher: Cambridge University Press
    year: 2008

  - id: hall-2011
    kind: book
    author: Kenneth R. Hall
    title: "A History of Early Southeast Asia: Maritime Trade and Societal Development, 100-1500"
    publisher: Rowman and Littlefield
    year: 2011

  - id: munro-hay-1991
    kind: book
    author: Stuart Munro-Hay
    title: "Aksum: An African Civilisation of Late Antiquity"
    publisher: Edinburgh University Press
    year: 1991

  - id: levtzion-1973
    kind: book
    author: Nehemia Levtzion
    title: Ancient Ghana and Mali
    publisher: Methuen
    year: 1973

  - id: finkel-2005
    kind: book
    author: Caroline Finkel
    title: "Osman's Dream: The Story of the Ottoman Empire 1300-1923"
    publisher: John Murray
    year: 2005
    note: >-
      The standard single-volume narrative across the whole span. Cited here
      because imber-2002 stops at 1650 and this site's Ottoman record runs to
      1922 — the later chapters had no source until this was added.

  - id: tezcan-2010
    kind: book
    author: Baki Tezcan
    title: "The Second Ottoman Empire: Political and Social Transformation in the Early Modern World"
    container: Cambridge Studies in Islamic Civilization
    publisher: Cambridge University Press
    year: 2010
    note: >-
      Argues against the decline narrative: that the late sixteenth and
      seventeenth centuries were a socio-economic transformation producing a
      second, differently constituted state rather than the beginning of a
      long failure. Cited for the chapter on that period, which this site would
      otherwise have had to write in the vocabulary of decline by default.

  - id: reid-1969
    kind: monograph
    author: Anthony Reid
    title: "The Contest for North Sumatra: Atjeh, the Netherlands and Britain, 1858-1898"
    publisher: Oxford University Press / University of Malaya Press
    year: 1969
    url: https://archive.org/details/anthony-john-stanhope-reid-1969-the-contest-for-north-sumatra-atjeh-the-netherla
    note: >-
      Scanned in full and readable at the URL. Its introduction carries the
      eighteenth and early nineteenth centuries in Aceh — the decline of the
      sultanate into a symbol, the rise of the uleebalang as hereditary
      territorial chiefs, the pepper coast, Penang, and the Anglo-Dutch treaties
      — which is the period the Acehnese chapters here previously jumped over.
      Reid's own preface is candid about the evidence: no Atjehnese state records
      have ever been found, so the Acehnese view survives directly only in a few
      popular epics, and the account rests on British and Dutch documents.

  - id: reid-1969b
    kind: article
    author: Anthony Reid
    title: "Sixteenth Century Turkish Influence in Western Indonesia"
    container: "Journal of Southeast Asian History"
    volume: "10/3"
    pages: "395-414"
    year: 1969
    url: https://archive.org/details/sixteenth-century-turkish-influence-in-western-indonesia
    note: >-
      Reid sets the Turkish, Acehnese and Portuguese accounts of the embassy
      side by side and shows how far they disagree. His most useful observation
      for this site is that the strongest version of the story — Aceh submitting
      as a vassal — is a late Turkish retelling, and that the reading of the
      mission as tribute rather than alliance "may owe something to the events
      of 1873, when the Atjehnese attempted to portray their country as under
      Turkish suzerainty."

  - id: reid-2006
    kind: edited volume
    author: Anthony Reid (ed.)
    title: "Verandah of Violence: The Background to the Aceh Problem"
    publisher: Singapore University Press / NUS Press
    year: 2006
    url: https://archive.org/details/anthony-john-stanhope-reid-et-al.-2006-verandah-of-violence-the-background-to-the-aceh-problem
    note: >-
      Scanned in full and readable at the URL. Carries Aceh from the sultanate
      to the 2005 Helsinki settlement, with a dated chronology and chapters by
      M. Isa Sulaiman on the destruction of the uleebalang and the origins of
      Acehnese nationalism, and by Edward Aspinall on violence and identity
      under Indonesian rule. The source for what happened to Aceh after 1903.

  - id: hill-1960
    kind: article
    author: A. H. Hill
    title: "Hikayat Raja-Raja Pasai"
    container: "Journal of the Malayan Branch of the Royal Asiatic Society"
    volume: "33/2"
    pages: "1-215"
    year: 1960
    url: https://archive.org/details/hikayat-raja-raja-pasai
    note: >-
      The Pasai chronicle in romanised Malay with an English translation and a
      long introduction, scanned in full and readable at the URL. Hill sets out
      the north Sumatran background from the Chinese records and Marco Polo,
      argues against Snouck Hurgronje's dismissal of the text as a children's
      tale, and traces the single surviving manuscript from a Javanese regent's
      library in Demak to the Royal Asiatic Society in London.

  - id: st-john-1863
    kind: primary
    author: Spenser St John
    title: "Life in the Forests of the Far East, or Travels in Northern Borneo"
    edition: 2nd, revised
    publisher: Smith, Elder and Co.
    year: 1863
    url: https://archive.org/details/in.ernet.dli.2015.31668
    note: >-
      St John was Britain's consul-general in Borneo and an ally of James Brooke,
      and his twelfth chapter, "The Kingdom of Borneo Proper", is the fullest
      contemporary description of the Brunei government there is. It is also a
      brief. His account of Brunei's misrule was written while Britain and the
      Brookes were acquiring the sultanate's territory, and it argues for exactly
      the conclusion that acquisition needed. Read it for the detail — the offices
      and their holders, the parishes and their trades, the numbers — and read
      the judgements as an interested party's.

  - id: imber-2002
    kind: book
    author: Colin Imber
    title: "The Ottoman Empire, 1300-1650: The Structure of Power"
    publisher: Palgrave Macmillan
    year: 2002

  - id: richards-1993
    kind: book
    author: John F. Richards
    title: "The Mughal Empire (The New Cambridge History of India, I.5)"
    publisher: Cambridge University Press
    year: 1993

  - id: jackson-2017
    kind: book
    author: Peter Jackson
    title: "The Mongols and the Islamic World: From Conquest to Conversion"
    publisher: Yale University Press
    year: 2017

  - id: halperin-1985
    kind: book
    author: Charles J. Halperin
    title: "Russia and the Golden Horde: The Mongol Impact on Medieval Russian History"
    publisher: Indiana University Press
    year: 1985

  - id: biran-2005
    kind: book
    author: Michal Biran
    title: "The Empire of the Qara Khitai in Eurasian History: Between China and the Islamic World"
    container: Cambridge Studies in Islamic Civilization
    publisher: Cambridge University Press
    year: 2005
    note: >-
      The first monograph in a Western language on a dynasty four chapters of
      this site were already leaning on. Used for the whole Qara Khitai record:
      the Chinese imperial forms retained two thousand miles from China, the
      indirect rule through Muslim vassals, and the religious policy that its
      last ruler reversed.

  - id: biran-1997
    kind: book
    author: Michal Biran
    title: "Qaidu and the Rise of the Independent Mongol State in Central Asia"
    publisher: Curzon Press
    year: 1997

  - id: manz-1989
    kind: book
    author: Beatrice Forbes Manz
    title: The Rise and Rule of Tamerlane
    publisher: Cambridge University Press
    year: 1989

  - id: newman-2006
    kind: book
    author: Andrew J. Newman
    title: "Safavid Iran: Rebirth of a Persian Empire"
    publisher: I.B. Tauris
    year: 2006

  - id: mote-twitchett-1988
    kind: book
    author: Frederick W. Mote and Denis Twitchett (eds)
    title: "The Cambridge History of China, Volume 7: The Ming Dynasty, 1368-1644, Part 1"
    publisher: Cambridge University Press
    year: 1988

  - id: hunwick-1999
    kind: book
    author: John O. Hunwick
    title: "Timbuktu and the Songhay Empire"
    publisher: Brill
    year: 1999

  - id: briant-2002
    kind: book
    author: Pierre Briant
    title: "From Cyrus to Alexander: A History of the Persian Empire"
    publisher: Eisenbrauns
    year: 2002

  - id: ab-bosworth-1988
    kind: book
    author: A. B. Bosworth
    title: "Conquest and Empire: The Reign of Alexander the Great"
    publisher: Cambridge University Press
    year: 1988
    note: >-
      A. B. Bosworth, the Alexander historian, not C. E. Bosworth, whose works
      on the Islamic dynasties are also cited here.

  - id: woolf-2012
    kind: book
    author: Greg Woolf
    title: "Rome: An Empire's Story"
    publisher: Oxford University Press
    year: 2012

  - id: loewe-twitchett-1986
    kind: book
    author: Denis Twitchett and Michael Loewe (eds)
    title: "The Cambridge History of China, Volume 1: The Ch'in and Han Empires, 221 BC-AD 220"
    publisher: Cambridge University Press
    year: 1986

  - id: di-cosmo-2002
    kind: book
    author: Nicola Di Cosmo
    title: "Ancient China and Its Enemies: The Rise of Nomadic Power in East Asian History"
    publisher: Cambridge University Press
    year: 2002

  - id: thapar-2002
    kind: book
    author: Romila Thapar
    title: "Early India: From the Origins to AD 1300"
    publisher: University of California Press
    year: 2002

  - id: van-de-mieroop-2015
    kind: book
    author: Marc Van De Mieroop
    title: "A History of the Ancient Near East, ca. 3000-323 BC"
    publisher: Wiley-Blackwell
    edition: 3rd
    year: 2015

  - id: shaw-2000
    kind: book
    author: Ian Shaw (ed.)
    title: The Oxford History of Ancient Egypt
    publisher: Oxford University Press
    year: 2000

  - id: edde-2011
    kind: book
    author: "Anne-Marie Eddé, trans. Jane Marie Todd"
    title: Saladin
    publisher: Belknap Press of Harvard University Press
    year: 2011
    note: >-
      The full-length modern biography, and the corrective this site needed for
      a page whose only Saladin source was a book about how Europe read him.
      Eddé works from the Arabic chancery and chronicle material on the parts
      the legend has no use for — the Egyptian fiscal reorganisation, the iqta'
      assignments, the twelve years spent fighting other Muslims — and is
      unsentimental about the propaganda apparatus Saladin's own secretaries
      ran.

  - id: irwin-1986
    kind: book
    author: Robert Irwin
    title: "The Middle East in the Middle Ages: The Early Mamluk Sultanate 1250-1382"
    publisher: Croom Helm
    year: 1986
    note: >-
      The political history of the Bahri period at the length the Cambridge
      volume's single chapter cannot give it. Cited for the factional mechanics
      — how a household actually took a sultanate, and why the Qalawunids are
      the exception that proves the sultanate had no succession rule.

  - id: zakkar-1971
    kind: book
    author: Suhayl Zakkar
    title: "The Emirate of Aleppo, 1004-1094"
    publisher: Dar al-Amanah
    year: 1971
    note: >-
      The monograph on the ninety years between the Hamdanids and the Seljuks,
      which is the century this region's record skipped. Zakkar is the standard
      account of the Mirdasid emirate and of the Kilab, and is quoted in every
      later treatment for the judgement that the tribe "served those who paid
      most and often, at a time of crisis, would sell their employer to the
      highest bidder" — which is a description of a revenue basis, not a moral
      complaint.

  - id: wilson-2023
    kind: book
    author: James Wilson
    title: "Medieval Syria and the Onset of the Crusades: The Political World of Bilad al-Sham 1050-1128"
    publisher: Edinburgh University Press
    year: 2023
    note: >-
      Reads the Seljuk arrival and the First Crusade from inside Syria rather
      than from either invading direction, and takes the local Arab, Kurdish
      and urban powers seriously as the actors they were rather than as the
      furniture two invasions rearranged. Cited for the polities this site
      added to close the gap between 1004 and 1102.

  - id: barber-2012
    kind: book
    author: Malcolm Barber
    title: "The Crusader States"
    publisher: Yale University Press
    year: 2012
    note: >-
      A political history of the four Frankish states of the Levant as states —
      how they were governed, paid for and defended — rather than as episodes
      in the history of the crusading movement. The spine for the Jerusalem and
      Edessa records here, and the work this site relies on for the distinction
      between the kingdom that ended in 1187 and the one that ended in 1291.

  - id: macevitt-2008
    kind: book
    author: Christopher MacEvitt
    title: "The Crusades and the Christian World of the East: Rough Tolerance"
    container: The Middle Ages Series
    publisher: University of Pennsylvania Press
    year: 2008
    note: >-
      Argues that the Frankish states governed populations that were mostly
      Eastern Christian rather than Muslim, and that the arrangement they
      arrived at was neither the persecution of the older accounts nor
      convivencia but an unarticulated practical accommodation. Edessa is the
      central case, which is why this site cites it there rather than on the
      Jerusalem page.

  - id: asbridge-2000
    kind: book
    author: Thomas S. Asbridge
    title: "The Creation of the Principality of Antioch, 1098-1130"
    publisher: Boydell Press
    year: 2000
    note: >-
      How the principality was actually assembled in its first three decades —
      its frontiers, its lordships, its relations with the Armenian and Greek
      population it governed — as against the narrative of the First Crusade
      that usually stands in for it. Cited here for the formation chapters and
      for the argument that Antioch was a going concern before Jerusalem was.

  - id: lilie-1993
    kind: book
    author: Ralph-Johannes Lilie, trans. J. C. Morris and Jean E. Ridings
    title: "Byzantium and the Crusader States 1096-1204"
    publisher: Clarendon Press
    year: 1993
    note: >-
      The standard treatment of the imperial claim on Antioch: the oath at
      Constantinople in 1097, the treaty of Devol in 1108, and the two
      occasions on which an emperor came in person to collect what those
      documents said was his. Cited for the one edge in this corpus that makes
      a Frankish state a Byzantine vassal.

  - id: ripper-2000
    kind: book
    author: Thomas Ripper
    title: "Die Marwaniden von Diyar Bakr: eine kurdische Dynastie im islamischen Mittelalter"
    container: Mitteilungen zur Sozial- und Kulturgeschichte der islamischen Welt
    publisher: Ergon Verlag
    year: 2000
    note: >-
      The only monograph on the Marwanids, in German, and cited here for the one
      argument this site takes from it directly: that the eleventh-century
      emirate began the westward Kurdish settlement that made Diyar Bakr a
      Kurdish country. The narrative chapters on that page are drafted from
      kennedy-2004, which is what this site could actually read against.

  - id: el-azhari-1997
    kind: book
    author: Taef Kamal El-Azhari
    title: "The Saljuqs of Syria During the Crusades, 463-549 A.H./1070-1154 A.D."
    container: Islamkundliche Untersuchungen 211
    publisher: Klaus Schwarz Verlag
    year: 1997
    note: >-
      The study of the Syrian Seljuk principalities and the atabeg houses that
      replaced them, which is the institution this site had described five times
      — Zangi at Mosul, Nur al-Din, the Burids at Damascus — without ever citing
      a work about it. Ends in 1154, the year Damascus falls to Nur al-Din, which
      is where the region's record picks up again.

  - id: holbl-2001
    kind: book
    author: "Günther Hölbl, trans. Tina Saavedra"
    title: A History of the Ptolemaic Empire
    publisher: Routledge
    year: 2001
    note: >-
      The standard narrative of the dynasty from Alexander's death to Actium,
      and the first general history of the Ptolemies since Bevan in 1928.
      Hölbl is an Egyptologist rather than a classicist, which is why the
      pharaonic half of the arrangement — the temple decrees, the ruler cult,
      the titulary — is present at all.

  - id: manning-2010
    kind: book
    author: J. G. Manning
    title: "The Last Pharaohs: Egypt Under the Ptolemies, 305-30 BC"
    publisher: Princeton University Press
    year: 2010
    note: >-
      Reads the Ptolemaic state as a state rather than as a Greek episode in
      Egyptian history or an Egyptian episode in Greek history. Its argument —
      "bargained incorporation", a political economy negotiated between the
      ruler and the constituencies who could withhold cooperation, and a dynasty
      that ruled through Egyptian society rather than over it — is what this
      site's institutions fields for the polity are coded from.

  - id: smith-2013
    kind: book
    author: Andrew M. Smith II
    title: "Roman Palmyra: Identity, Community, and State Formation"
    publisher: Oxford University Press
    year: 2013
    note: >-
      Reads Palmyra from its own inscriptions and archaeology as a community
      that built a state, rather than as the backdrop to thirteen famous years.
      The emphasis matters for this site: the caravan city is the polity, and
      Zenobia is what it did once.

  - id: fisher-2011
    kind: book
    author: Greg Fisher
    title: "Between Empires: Arabs, Romans, and Sasanians in Late Antiquity"
    container: Oxford Classical Monographs
    publisher: Oxford University Press
    year: 2011
    note: >-
      The study of the Arab clients of Rome and Iran in the century before
      Islam, and the reason this site's page is called Jafnid rather than
      Ghassanid. Fisher separates the ruling families — Jafnids, Nasrids,
      Hujrids — from the confederacies later tradition attached to them
      (Ghassan, Lakhm, Kinda), and argues that the empires' agreements were with
      individuals rather than with peoples. That distinction is a claim about
      what kind of object a polity is, which is this site's own question.

  - id: wilhelm-1989
    kind: book
    author: "Gernot Wilhelm, trans. Jennifer Barnes"
    title: The Hurrians
    container: Ancient Near East Series
    publisher: Aris & Phillips
    year: 1989
    note: >-
      The survey of the Hurrian-speaking world by the principal authority on the
      language, with a chapter on the archaeology by Diana L. Stein. Cited here
      because Mitanni cannot be written from a political narrative alone: no
      archive of the kingdom survives, and what is known about how it worked
      comes from Hurrian material found at the places it ruled rather than from
      the place it ruled them from.

  - id: chi-6
    kind: book
    author: Peter Jackson and Laurence Lockhart (eds)
    title: "The Cambridge History of Iran, Volume 6: The Timurid and Safavid Periods"
    publisher: Cambridge University Press
    year: 1986
    note: >-
      Contains H. R. Roemer's chapters on the Türkmen dynasties and the
      successors of Timur, which are the standard English narrative of the
      fifteenth century in Iran and Azerbaijan. This site had been running two
      Turkmen pages off a genealogical manual.

  - id: woods-1999
    kind: book
    author: John E. Woods
    title: "The Aqquyunlu: Clan, Confederation, Empire"
    publisher: University of Utah Press
    edition: revised and expanded
    year: 1999
    note: >-
      The monograph on the White Sheep, and the book that made the fifteenth
      century in this region an argument rather than an interval. Woods reads
      the confederation through its own genealogical ideology — the descent
      from Bayandur Khan, the Oghuz past invoked as a right to rule — and
      through the three-stage movement his subtitle names, which is how this
      page's legitimation field came to be coded.

  - id: minorsky-1954
    kind: article
    author: Vladimir Minorsky
    title: "Jihan-shah Qara-qoyunlu and his Poetry (Turkmenica 9)"
    container: Bulletin of the School of Oriental and African Studies
    volume: "16/2"
    pages: "271-297"
    year: 1954
    note: >-
      Edits a selection of Jahan Shah's divan from manuscript and discusses the
      Azerbaijani Turkic he wrote it in. Cited because this site's page had
      asserted that a Kara Koyunlu ruler wrote Turkic poetry under a pen-name
      on the authority of a genealogical manual, which does not carry the
      claim.

  - id: manz-2007
    kind: book
    author: Beatrice Forbes Manz
    title: "Power, Politics and Religion in Timurid Iran"
    container: Cambridge Studies in Islamic Civilization
    publisher: Cambridge University Press
    year: 2007
    note: >-
      The successor volume to this site's Tamerlane source, on Shahrukh's Iran
      rather than Timur's conquests. Its question is the one the corpus keeps
      running into: how a government with no monopoly of force controlled a
      heterogeneous society, and why that arrangement was stable for decades at
      a time. Cited for the half of the Timurid century this site's page had
      compressed into a sentence.

  - id: lentz-lowry-1989
    kind: book
    author: Thomas W. Lentz and Glenn D. Lowry
    title: "Timur and the Princely Vision: Persian Art and Culture in the Fifteenth Century"
    publisher: "Los Angeles County Museum of Art and Arthur M. Sackler Gallery, Smithsonian Institution"
    year: 1989
    note: >-
      The exhibition catalogue that is still the standard treatment of Timurid
      art as a court programme rather than as a collection of objects. Cited
      because this site had been asserting that the Herat and Samarkand
      workshops set the standard three later empires worked from, on the
      authority of a political biography.

  - id: babayan-2002
    kind: book
    author: Kathryn Babayan
    title: "Mystics, Monarchs, and Messiahs: Cultural Landscapes of Early Modern Iran"
    container: Harvard Middle Eastern Monographs 35
    publisher: Harvard University Press
    year: 2002
    note: >-
      On what the Safavid movement was before it was a state: Persianate
      Sufism and Alid messianism, and rulers whose followers expected the end
      of the world rather than a government. It is the source for the
      `divine-sanction` on this site's Safavid record, which had been coded off
      a general history that describes the outcome rather than the claim.

  - id: matthee-2012
    kind: book
    author: Rudi Matthee
    title: "Persia in Crisis: Safavid Decline and the Fall of Isfahan"
    container: International Library of Iranian Studies
    publisher: I.B. Tauris
    year: 2012
    note: >-
      Argues against the moral-decline account of the seventeenth century — the
      weak shahs, the harem, the wine — and for a structural one: a small
      economic base, a tribal composition that had to be renegotiated
      continuously, and an environment that would not support the revenue the
      state needed. Cited because this site had disposed of a hundred years and
      the fall of a capital in one sentence.

  - id: smith-1970
    kind: book
    author: "John Masson Smith, Jr."
    title: "The History of the Sarbadar Dynasty 1336-1381 A.D. and its Sources"
    container: "Publications in Near and Middle East Studies, Series A, 11"
    publisher: Mouton
    year: 1970
    note: >-
      The monograph on a polity that is hard to write about because its own
      records do not survive and the chronicles that describe it were written
      by people who disapproved. Smith works the coins and the inscriptions
      alongside the literary sources, which matters here: the numismatic
      evidence is most of what establishes who was actually ruling in a state
      that changed rulers a dozen times in forty-four years.

  - id: chi-7
    kind: book
    author: Peter Avery, Gavin Hambly and Charles Melville (eds)
    title: "The Cambridge History of Iran, Volume 7: From Nadir Shah to the Islamic Republic"
    publisher: Cambridge University Press
    year: 1991
    note: >-
      The last volume of the series, covering 1722 to 1979, and the spine of
      this region's extension past the Safavids. It carries the political
      narrative of the Afghan interlude, the Afsharids, the Zands and the
      Qajars, together with the parts this site's institutions fields need —
      land tenure, revenue administration, and the tribes.

  - id: axworthy-2006
    kind: book
    author: Michael Axworthy
    title: "The Sword of Persia: Nader Shah, from Tribal Warrior to Conquering Tyrant"
    publisher: I.B. Tauris
    year: 2006
    note: >-
      The first full study of Nader in English since Lockhart in 1938, and
      unusually good on the military question this corpus keeps running into:
      how an army was actually raised, paid and made to fight, and what it cost
      the country underneath it to keep one in the field.

  - id: perry-1979
    kind: book
    author: John R. Perry
    title: "Karim Khan Zand: A History of Iran, 1747-1779"
    container: Publications of the Center for Middle Eastern Studies 12
    publisher: University of Chicago Press
    year: 1979
    note: >-
      The monograph on the one ruler in this region's six hundred years whom
      Iranians remember warmly, and on the thirty years of recovery he ran from
      Shiraz while declining to call himself shah.

  - id: amanat-2017
    kind: book
    author: Abbas Amanat
    title: "Iran: A Modern History"
    publisher: Yale University Press
    year: 2017
    note: >-
      A thousand pages from the Safavid revolution to 2009 by a specialist in
      the nineteenth century, layering ideology, economy and the arts over the
      dynastic narrative. Cited for the Qajar record, where the political
      history alone would make the century look like a list of concessions.

  - id: di-cosmo-2009
    kind: book
    author: Nicola Di Cosmo, Allen J. Frank and Peter B. Golden (eds)
    title: "The Cambridge History of Inner Asia: The Chinggisid Age"
    publisher: Cambridge University Press
    year: 2009
    note: >-
      Covers the Mongol empire, its Chinggisid successor states and the
      non-Chinggisid dynasties that followed them, from the twelfth century to
      Russian and Chinese hegemony. Cited for the Uzbek khanate, which this
      corpus had been naming in prose on two pages while leaving the field that
      should point at it empty.

  - id: minorsky-1958
    kind: book
    author: Vladimir Minorsky
    title: "A History of Sharvan and Darband in the 10th-11th Centuries"
    publisher: W. Heffer & Sons
    year: 1958
    note: >-
      An edition, translation and commentary of the local chronicle that is
      almost the only narrative source for the eastern Caucasus in these two
      centuries. It exists because Minorsky reconstructed the text from a later
      compilation; without it the Shirvanshahs would be a king-list with dates.

  - id: haykel-2003
    kind: book
    author: Bernard Haykel
    title: "Revival and Reform in Islam: The Legacy of Muhammad al-Shawkani"
    container: Cambridge Studies in Islamic Civilization
    publisher: Cambridge University Press
    year: 2003
    note: >-
      An intellectual biography and an account of how a society dominated by
      Zaydi Shi'ism was reoriented towards Sunni reformism in the eighteenth
      and nineteenth centuries, and how that reorientation served the imamate's
      own political needs. Cited for the tension this site's Zaydi record kept
      naming without a source for it: an office open to any qualified Alid that
      had become hereditary in one house.

  - id: thackston-1986
    kind: book
    author: "Nasir-i Khusraw, trans. W. M. Thackston, Jr."
    title: "Naser-e Khosraw's Book of Travels (Safarnama)"
    container: Persian Heritage Series 36
    publisher: Bibliotheca Persica
    year: 1986
    note: >-
      The eleventh-century traveller's own account, in translation. Cited so
      that the description of al-Hasa on this site's Qarmatian page — the
      untaxed residents, the state granaries, the interest-free loans, the
      mosque with no Friday prayer — is attributed to the man who wrote it
      rather than to a modern survey quoting him. He was an Isma'ili himself,
      which is a reason to cite him directly and to say so.

  - id: vallet-2010
    kind: book
    author: Éric Vallet
    title: "L'Arabie marchande: État et commerce sous les sultans rasulides du Yémen (626-858/1229-1454)"
    publisher: Publications de la Sorbonne
    year: 2010
    note: >-
      The study of the Rasulid state as a commercial one, worked from the
      dynasty's own administrative and fiscal archives — material that only
      came to light recently and that almost no medieval Islamic polity has
      left. It is why this site can code a Yemeni dynasty's revenue basis from
      something better than inference.

  - id: smith-1974
    kind: book
    author: G. Rex Smith
    title: "The Ayyubids and Early Rasulids in the Yemen (567-694/1173-1295)"
    container: "E. J. W. Gibb Memorial, New Series XXVI"
    publisher: "Trustees of the E. J. W. Gibb Memorial"
    year: 1974
    note: >-
      An edition, translation and study of Ibn Hatim's chronicle, which is the
      fullest source for Yemen from Turanshah's conquest to the point where the
      Ayyubids' own followers had replaced them. Two volumes, 1974 and 1978.

  - id: golden-2000
    kind: book
    author: Peter B. Golden (ed.), trans. Tibor Halasi-Kun and others
    title: "The King's Dictionary: The Rasulid Hexaglot — Fourteenth Century Vocabularies in Arabic, Persian, Turkic, Greek, Armenian and Mongol"
    container: "Handbook of Oriental Studies, Section 8"
    publisher: Brill
    year: 2000
    note: >-
      The edition of a six-language glossary compiled by a Rasulid sultan, with
      introductory essays by Golden and Thomas Allsen. Cited here for the object
      itself, which is a better piece of evidence about what fourteenth-century
      Aden was than any figure this site could print.

  - id: kay-1892
    kind: book
    author: Henry Cassels Kay (ed. and trans.)
    title: "Yaman: Its Early Mediaeval History"
    publisher: Edward Arnold
    year: 1892
    note: >-
      Edition and translation of Umara al-Hakami's history of Yemen, written in
      the twelfth century by a man who had served the courts he describes,
      with supplementary extracts from Ibn Khaldun and others. It is the
      narrative spine for the Ziyadids, Najahids, Sulayhids and Zurayids —
      the dynasties for which no modern monograph exists — and it is cited here
      as what it is: a Victorian translation of a partisan contemporary, useful
      for sequence and detail and to be read against Bosworth for dates.

  - id: porter-1992
    kind: thesis
    author: Venetia Porter
    title: "The History and Monuments of the Tahirid Dynasty of the Yemen 858-923/1454-1517"
    container: PhD thesis, University of Durham
    year: 1992
    note: >-
      The only sustained study of the last independent Yemeni dynasty before
      the Ottomans, and it works from the buildings as much as the chronicles —
      the mosques and madrasas the Tahirids put up across the southern
      highlands are better evidence of where their authority actually reached
      than any account of their campaigns.

  - id: meloy-2010
    kind: book
    author: John L. Meloy
    title: "Imperial Power and Maritime Trade: Mecca and Cairo in the Later Middle Ages"
    container: Chicago Studies on the Middle East
    publisher: Middle East Documentation Center
    year: 2010
    note: >-
      Reads the sharifate as a polity with a political economy rather than as a
      religious appendage of somebody else's empire: its alliances in the
      Hejaz, its relations with Cairo, and its dependence on the Indian Ocean
      traffic through Jeddah. Written partly from sources composed by Meccan
      scholars rather than only from the Egyptian material, which is why the
      city has agency in it.

  - id: peters-1994
    kind: book
    author: F. E. Peters
    title: "Mecca: A Literary History of the Muslim Holy Land"
    publisher: Princeton University Press
    year: 1994
    note: >-
      A collage of primary accounts across the whole span, Muslim and Western,
      with Peters' commentary between them. Cited for the long view this site
      needed on a polity that lasted nine and a half centuries and for which no
      single political narrative exists in English.

  - id: risso-1986
    kind: book
    author: Patricia Risso
    title: "Oman and Muscat: An Early Modern History"
    publisher: Croom Helm
    year: 1986
    note: >-
      On how an Arabian principality came to project political and commercial
      power into both East Africa and India, and on the tribal politics and the
      religious office underneath that. Cited for the two Omani records this
      site added after its own Ibadi imamate page had listed the later
      imamates by name to explain why it stopped in 893.

  - id: sheriff-1987
    kind: book
    author: Abdul Sheriff
    title: "Slaves, Spices and Ivory in Zanzibar: Integration of an East African Commercial Empire into the World Economy, 1770-1873"
    container: Eastern African Studies
    publisher: James Currey and Ohio University Press
    year: 1987
    note: >-
      An economic history of the Zanzibar empire from the East African side
      rather than the Arabian one, and the standard account of the two
      transformations it turned on: slaves used to grow cloves for export
      instead of being the export, and an ivory frontier pushed to the Great
      Lakes. It is cited here so that the Omani empire's economy is described
      by somebody writing about the people it was imposed on.

  - id: fisher-2015
    kind: book
    author: Greg Fisher (ed.)
    title: Arabs and Empires before Islam
    publisher: Oxford University Press
    year: 2015
    note: >-
      Nearly two hundred and fifty translated extracts from Greek, Latin,
      Syriac, Persian and Arabic sources and from inscriptions in several
      alphabets, with commentary by more than twenty specialists. It is a
      sourcebook rather than a narrative, which suits a corpus whose rules are
      about what a source will actually carry: for pre-Islamic Arabia the
      evidence is inscriptions and other people's accounts, and this is where
      both are assembled.

  - id: bowersock-2013
    kind: book
    author: G. W. Bowersock
    title: "The Throne of Adulis: Red Sea Wars on the Eve of Islam"
    container: Emblems of Antiquity
    publisher: Oxford University Press
    year: 2013
    note: >-
      Reconstructs the sixth-century war between Jewish Arabia and Christian
      Ethiopia from two inscriptions on a monument that no longer exists, known
      only because a sixth-century traveller copied them. Cited for the Himyar
      record, and for the Aksumite invasion of 525 that ends it.

  - id: al-rasheed-2010
    kind: book
    author: Madawi Al-Rasheed
    title: A History of Saudi Arabia
    publisher: Cambridge University Press
    edition: 2nd
    year: 2010
    note: >-
      The standard single-volume history, by an anthropologist from a family the
      Saudi state displaced, which is worth knowing and does not make the book
      partisan — it makes it unusually attentive to the regional powers the
      national narrative absorbs. Cited for the three Saudi states and for the
      Rashidi record alongside her own monograph on them.

  - id: al-rasheed-1991
    kind: book
    author: Madawi Al-Rasheed
    title: "Politics in an Arabian Oasis: The Rashidi Tribal Dynasty"
    container: Society and Culture in the Modern Middle East
    publisher: I.B. Tauris
    year: 1991
    note: >-
      The monograph on the dynasty that beat the Saudis in the nineteenth
      century and lost to them in the twentieth, and on the wider question it
      raises: why a camel-herding confederation became susceptible to political
      centralisation at that particular moment, and why the result did not last.

  - id: hovannisian-1997
    kind: book
    author: Richard G. Hovannisian (ed.)
    title: "The Armenian People from Ancient to Modern Times"
    publisher: St. Martin's Press
    year: 1997
    note: >-
      Two volumes covering antiquity to the twentieth century, and the most
      comprehensive treatment of the whole span in English. Cited because
      Armenia is named on eighteen pages of this corpus — from the Sasanians to
      the Safavids — and had no record of its own.

  - id: suny-1994
    kind: book
    author: Ronald Grigor Suny
    title: The Making of the Georgian Nation
    publisher: Indiana University Press
    edition: 2nd
    year: 1994
    note: >-
      The standard account of Georgian history in English, from the first
      millennium BC to 1991. Cited for the same reason as the Armenian volumes:
      the corpus had been referring to Georgia on eight pages without carrying
      it.

  - id: minorsky-1953
    kind: book
    author: Vladimir Minorsky
    title: "Studies in Caucasian History: New Light on the Shaddadids of Ganja; The Shaddadids of Ani; Prehistory of Saladin"
    container: Cambridge Oriental Series 6
    publisher: Cambridge University Press
    year: 1953
    note: >-
      Three studies and an appendix on the Musafirids and Rawwadids, which
      between them are the scholarship on the Muslim dynasties of the eastern
      Caucasus. The third essay is on Saladin's family before it was famous,
      which is worth noting on a site whose Ayyubid record begins in Egypt: the
      Ayyubids came out of Shaddadid service at Dvin.

  - id: toumanoff-1963
    kind: book
    author: Cyril Toumanoff
    title: Studies in Christian Caucasian History
    publisher: Georgetown University Press
    year: 1963
    note: >-
      Six hundred pages on the dynastic and social structure of Armenia, Iberia
      and Albania before the Bagratids, and the foundation of the field in
      English. Toumanoff's subject is the nakharar and eristavi houses rather
      than the kings — which is what this site's `client-levy` coding on three
      Caucasian records rests on.

  - id: gippert-2008
    kind: book
    author: Jost Gippert, Wolfgang Schulze, Zaza Aleksidze and Jean-Pierre Mahé
    title: The Caucasian Albanian Palimpsests of Mount Sinai
    container: "Monumenta Palaeographica Medii Aevi: Series Ibero-Caucasica 2"
    publisher: Brepols
    year: 2008
    note: >-
      The first edition of the only substantial texts in Caucasian Albanian,
      recovered from the erased under-layers of two Georgian manuscripts at St
      Catherine's on Sinai — identified by Aleksidze in 1996 and read by an
      international project over the following decade. Cited for the chapter on
      a script that was lost for a thousand years, because the manner of its
      recovery is the evidence and not an anecdote about it.

  - id: gammer-1994
    kind: book
    author: Moshe Gammer
    title: "Muslim Resistance to the Tsar: Shamil and the Conquest of Chechnia and Daghestan"
    publisher: Frank Cass
    year: 1994
    note: >-
      The standard study, worked from Russian, Arabic and Turkish archives, of a
      polity that held out against an empire for a quarter of a century in
      country the empire could reach and could not hold. Its subject is as much
      the state Shamil built as the war he fought with it, which is what this
      site needs: the institutions are the reason the resistance lasted.

  - id: kosmin-2014
    kind: book
    author: Paul J. Kosmin
    title: "The Land of the Elephant Kings: Space, Territory, and Ideology in the Seleucid Empire"
    publisher: Harvard University Press
    year: 2014
    note: >-
      Asks what a dynasty does when it rules an enormous territory to which it
      has no historic claim, and answers it from the city foundations, the royal
      progresses, the frontier treaties and the geography the Seleucids
      commissioned. It is the modern argument this site needed for a polity
      whose page had been drafted from a volume published in 1983.

  - id: overtoom-2020
    kind: book
    author: Nikolaus Leo Overtoom
    title: "Reign of Arrows: The Rise of the Parthian Empire in the Hellenistic Middle East"
    container: Oxford Studies in Early Empires
    publisher: Oxford University Press
    year: 2020
    note: >-
      The first full study of early Parthian history since 1938, and the first
      to treat it as Hellenistic political history rather than as a prologue to
      the Roman wars. Cited because the Parthians are the least-served major
      polity in this corpus and the older literature reaches them almost
      entirely through Roman defeats.

  - id: mairs-2014
    kind: book
    author: Rachel Mairs
    title: "The Hellenistic Far East: Archaeology, Language, and Identity in Greek Central Asia"
    publisher: University of California Press
    year: 2014
    note: >-
      Works the archaeology, the coins and the documents of Greek Bactria
      against the question of what the people there thought they were — which
      is the right question for a polity that survives almost entirely as
      objects, and the wrong one to answer from the two paragraphs the classical
      historians give it. Ai-Khanoum is the book's centre and is the only
      extensively excavated Hellenistic city in Central Asia.

  - id: litvinsky-1996
    kind: book
    author: B. A. Litvinsky, Zhang Guang-da and R. Shabani Samghabadi (eds)
    title: "History of Civilizations of Central Asia, Volume III: The Crossroads of Civilizations, A.D. 250 to 750"
    publisher: UNESCO Publishing
    year: 1996
    note: >-
      The reference volume for the five centuries between the Kushans and the
      Arabs in Central Asia, written by scholars from the countries the
      territory is now in and covering the material — Bactrian documents,
      coinage, seals, archaeology — that the Greek, Chinese and Persian
      narratives do not. Cited for the Hephthalites, who are named on this
      site's Sasanian record as the people who killed a king of kings and were
      not otherwise here.

  - id: wiesehofer-1996
    kind: book
    author: "Josef Wiesehöfer, trans. Azizeh Azodi"
    title: "Ancient Persia: From 550 BC to 650 AD"
    publisher: I.B. Tauris
    year: 1996
    note: >-
      A survey of the whole twelve hundred years built on Persian written,
      archaeological and numismatic evidence rather than on the Greek and Roman
      accounts the Western tradition has usually reached it through — which is
      the argument this site's Achaemenid and Parthian records already make and
      had been making from other books. Cited here for the small dynasties the
      imperial narratives leave out.

  - id: lanfranchi-2003
    kind: book
    author: Giovanni B. Lanfranchi, Michael Roaf and Robert Rollinger (eds)
    title: "Continuity of Empire (?): Assyria, Media, Persia"
    container: History of the Ancient Near East Monographs V
    publisher: S.a.r.g.o.n.
    year: 2003
    note: >-
      The proceedings of the Padua meeting of 2001, and the volume in which the
      case against the Median empire was assembled: that the Assyrian and
      Babylonian records describe Median chiefs rather than a Median state, that
      the archaeology supplies no administration, and that the empire Herodotus
      describes may be a Greek and Achaemenid construction. The question mark in
      the title is the argument. Cited on the one page in this corpus where what
      is disputed is not the polity's dates or its institutions but whether it
      was a polity.

  - id: foster-2016
    kind: book
    author: Benjamin R. Foster
    title: "The Age of Agade: Inventing Empire in Ancient Mesopotamia"
    publisher: Routledge
    year: 2016
    note: >-
      The first book-length study of the Akkadian period, drawing together forty
      years of work by a Yale Assyriologist and covering statecraft, army,
      cities, economy and daily life — which is what this site's fields ask for
      and what a general history of the ancient Near East cannot give at the
      necessary depth. Its last chapter is on how the empire has been presented
      by modern historians since the decipherment, including the Soviet
      literature summarised in English for the first time.

  - id: frahm-2023
    kind: book
    author: Eckart Frahm
    title: "Assyria: The Rise and Fall of the World's First Empire"
    publisher: Basic Books
    year: 2023
    note: >-
      A full history from the city on the Tigris to the empire and its
      afterlife, by an Assyriologist at Yale. Cited here for the institutional
      material this site's Assyrian record was asserting without a source
      addressing it — the standing army, the provincial system, the succession
      oaths — and for the royal women, who are absent from the older narratives.

  - id: kemp-2018
    kind: book
    author: Barry J. Kemp
    title: "Ancient Egypt: Anatomy of a Civilization"
    publisher: Routledge
    edition: 3rd
    year: 2018
    note: >-
      Not a narrative history but an account of how the Egyptian state actually
      worked — the redistributive economy, the temple estates, the mentality
      that held a uniform style across three thousand years. Kemp directs the
      excavation at Amarna, and this is the book the institutions on this site's
      Egyptian record are coded from, because a political narrative cannot
      supply them.

  - id: beaulieu-2018
    kind: book
    author: Paul-Alain Beaulieu
    title: "A History of Babylon, 2200 BC - AD 75"
    container: Blackwell History of the Ancient World
    publisher: Wiley-Blackwell
    year: 2018
    note: >-
      The narrative spine of this site's Neo-Babylonian record. Beaulieu is a
      professor of Assyriology at Toronto and the standard modern authority on
      the period's last king; the book's virtue for this corpus is that it
      treats Babylon as one continuous object across seventeen centuries, which
      is what makes it possible to say precisely which Babylon this page is.

  - id: beaulieu-1989
    kind: book
    author: Paul-Alain Beaulieu
    title: "The Reign of Nabonidus, King of Babylon 556-539 B.C."
    container: Yale Near Eastern Researches 10
    publisher: Yale University Press
    year: 1989
    note: >-
      The monograph on the ten years the king spent at Tayma. Cited here for the
      dates of the departure and return and for the argument that the quarrel
      was political and economic before it was religious, against the older
      reading that made Nabonidus a heretic.

  - id: jursa-2010
    kind: book
    author: Michael Jursa
    title: >-
      Aspects of the Economic History of Babylonia in the First Millennium BC:
      Economic Geography, Economic Mentalities, Agriculture, the Use of Money
      and the Problem of Economic Growth
    container: Alter Orient und Altes Testament 377
    publisher: Ugarit-Verlag
    year: 2010
    note: >-
      Built on more than 21,500 dated tablets from Babylon, Borsippa, Nippur,
      Sippar and Uruk. This site's Neo-Babylonian revenue and military bases are
      coded from it rather than from a political narrative, because it is the
      only work in this corpus's bibliography that can say what a state's income
      actually consisted of from primary accounts rather than from a chronicler.

  - id: bryce-2005
    kind: book
    author: Trevor Bryce
    title: The Kingdom of the Hittites
    publisher: Oxford University Press
    edition: new
    year: 2005
    note: >-
      The narrative history of Bronze Age Anatolia in English, revised from the
      1998 first edition. Dates on this site's Hittite record follow Bryce's
      middle chronology; the absolute dates are not secure and the page says so.

  - id: bryce-2002
    kind: book
    author: Trevor Bryce
    title: Life and Society in the Hittite World
    publisher: Oxford University Press
    year: 2002
    note: >-
      The companion volume to bryce-2005, on how the state and the household
      worked rather than on what the kings did. This site's Hittite institutions
      are coded from it, for the same reason kemp-2018 rather than a campaign
      narrative supplies the Egyptian ones.

  - id: beckman-1999
    kind: book
    author: Gary Beckman
    title: Hittite Diplomatic Texts
    container: Writings from the Ancient World 7
    publisher: Scholars Press
    edition: 2nd
    year: 1999
    note: >-
      Translations of twenty-one treaties, eighteen diplomatic letters and
      eighteen edicts from the Hittite chancery, including the Shattiwaza treaty
      this corpus's Mitanni record is largely reconstructed from and the Hittite
      text of the 1259 treaty with Egypt. A source of documents rather than of
      argument, and cited where a page quotes or dates one.

  - id: crawford-2013
    kind: book
    author: Harriet Crawford (ed.)
    title: The Sumerian World
    container: Routledge Worlds
    publisher: Routledge
    year: 2013
    note: >-
      Thirty-two specialists on southern Mesopotamia from 3000 to 2000 BC,
      organised by theme rather than by reign. This site's Ur III institutions
      are coded from it, because the questions the institution fields ask —
      what an army was paid with, what a state's income consisted of — are
      answered in this corpus by thematic handbooks and almost never by a
      narrative of kings.

  - id: michalowski-2011
    kind: book
    author: Piotr Michalowski
    title: >-
      The Correspondence of the Kings of Ur: An Epistolary History of an Ancient
      Mesopotamian Kingdom
    container: Mesopotamian Civilizations 15
    publisher: Eisenbrauns
    year: 2011
    note: >-
      The letters between the kings of Ur and their officials, collated across
      more than a hundred manuscripts. Cited here for the last years of the
      dynasty, which these letters describe from inside as they are happening,
      and for the standing warning Michalowski attaches to them: they survive as
      school copies, and a school copy of a royal letter is a literary object
      before it is a document.

  - id: roth-1997
    kind: book
    author: Martha T. Roth
    title: Law Collections from Mesopotamia and Asia Minor
    container: Writings from the Ancient World 6
    publisher: Scholars Press
    edition: 2nd
    year: 1997
    note: >-
      Translations of the Mesopotamian and Hittite law collections in one volume
      — the laws of Ur-Nammu, of Lipit-Ishtar, of Eshnunna, of Hammurabi, the
      Middle Assyrian laws and the Hittite laws. Cited on this site wherever a
      page quotes or dates one of them, which is on four records in the Ancient
      Near East and nowhere else in the corpus.

  - id: van-de-mieroop-2005
    kind: book
    author: Marc Van De Mieroop
    title: "King Hammurabi of Babylon: A Biography"
    container: Blackwell Ancient Lives
    publisher: Blackwell
    year: 2005
    note: >-
      The institutions on this site's Old Babylonian record are coded from it.
      Van De Mieroop's argument is that Hammurabi's reputation as a lawgiver has
      obscured a career that was mostly diplomacy and a state that mostly did
      not outlive him, which is the shape that record takes.

  - id: postgate-2013
    kind: book
    author: Nicholas Postgate
    title: >-
      Bronze Age Bureaucracy: Writing and the Practice of Government in Assyria
    publisher: Cambridge University Press
    year: 2013
    note: >-
      Ten Middle Assyrian government archives from Ashur and the provinces, many
      previously unedited, read for what the practice of writing did to the
      practice of governing. This site's Middle Assyrian institutions are coded
      from it; the Neo-Assyrian record three hundred years later is coded from
      frahm-2023, and the two together are the closest this corpus comes to
      watching one state's machinery across a long interruption.

  - id: potts-2016
    kind: book
    author: D. T. Potts
    title: >-
      The Archaeology of Elam: Formation and Transformation of an Ancient
      Iranian State
    container: Cambridge World Archaeology
    publisher: Cambridge University Press
    edition: 2nd
    year: 2016
    note: >-
      The standard account, revised from 1999 with more than eight hundred
      additional sources. Potts is an archaeologist and the book is organised
      around material evidence, which is why this site's two Elamite records
      carry one coded institution each: what survives is monuments, royal
      inscriptions and other people's descriptions, not administration.

  - id: zimansky-1985
    kind: book
    author: Paul E. Zimansky
    title: "Ecology and Empire: The Structure of the Urartian State"
    container: Studies in Ancient Oriental Civilization 41
    publisher: Oriental Institute of the University of Chicago
    year: 1985
    note: >-
      An argument that the Urartian state was a superstructure of royal
      fortresses and state agriculture imposed on a landscape that could not
      have produced it unaided, built as a response to the Assyrian army. This
      site's Urartian institutions are coded from it, and its `revenue_basis`
      turns on Zimansky's account of how the fortress estates were stocked.

  - id: zimansky-1998
    kind: book
    author: Paul E. Zimansky
    title: "Ancient Ararat: A Handbook of Urartian Studies"
    container: Anatolian and Caucasian Studies
    publisher: Caravan Books
    year: 1998
    note: >-
      The reference handbook: kings, chronology, sites, inscriptions and the
      state of the arguments. Cited here for the dynasty, the script and the
      ending, which is the part of the record where a handbook's willingness to
      say that nothing is known is worth more than a narrative.

  - id: toral-niehoff-2014
    kind: book
    author: Isabel Toral-Niehoff
    title: "Al-Hira: Eine arabische Kulturmetropole im spätantiken Kontext"
    container: Islamic History and Civilization 104
    publisher: Brill
    year: 2014
    note: >-
      The monograph on the Nasrid capital, and the reason this site can code a
      religion carried on that record. Toral-Niehoff's subject is al-Hira as a
      city rather than the dynasty as a client: the churches and monasteries,
      the Church of the East hierarchy seated there, the poets, and the argument
      that the Arab urban culture assembled at al-Hira passed more or less
      directly into Kufa, its Islamic successor a few kilometres away.

  - id: bowersock-1983
    kind: book
    author: G. W. Bowersock
    title: Roman Arabia
    publisher: Harvard University Press
    year: 1983
    note: >-
      The history of the country between the Negev and the Hawran from the
      fourth century BC to Constantine, and still the standard account of the
      Nabataean kingdom and of what Rome did with it in 106. Bowersock's case
      that the annexation was carried out without a war is the reason this
      site's Nabataean record does not code `conquest`.

  - id: healey-2001
    kind: book
    author: John F. Healey
    title: "The Religion of the Nabataeans: A Conspectus"
    container: Religions in the Graeco-Roman World 136
    publisher: Brill
    year: 2001
    note: >-
      Built from Nabataean Aramaic inscriptions, iconography and archaeology
      rather than from literary sources, which is what makes it usable for a
      coded field: it can say what the kings claimed because it is reading what
      they had carved. Cited here for the divinisation of Nabataean kings and
      for the script, Healey having also edited the Nabataean tomb inscriptions
      of Mada'in Salih.

  - id: smallwood-1976
    kind: book
    author: E. Mary Smallwood
    title: >-
      The Jews under Roman Rule: From Pompey to Diocletian. A Study in Political
      Relations
    container: Studies in Judaism in Late Antiquity 20
    publisher: Brill
    year: 1976
    note: >-
      Fifty years old and still the standard political narrative of Judaea from
      63 BC to the third century. Its subject is the relationship rather than
      the religion, which is what a corpus of polities needs: it is precise
      about who held which territory under what arrangement, in a period where
      that changed constantly and where most accounts are organised around
      something else.

  - id: regev-2013
    kind: book
    author: Eyal Regev
    title: "The Hasmoneans: Ideology, Archaeology, Identity"
    container: Journal of Ancient Judaism Supplements 10
    publisher: Vandenhoeck & Ruprecht
    year: 2013
    note: >-
      Reads the dynasty's self-presentation off its coins, its palaces at
      Jericho and its use of the Temple rather than off the books of Maccabees
      alone, and argues that the Hasmonean state was not a conventionally
      Hellenistic monarchy. This site's Hasmonean legitimation and succession
      fields are coded from it, because the question those fields ask — on what
      public ground was the right to rule asserted — is the question the book is
      about.

  - id: richardson-1996
    kind: book
    author: Peter Richardson
    title: "Herod: King of the Jews and Friend of the Romans"
    container: Studies on Personalities of the New Testament
    publisher: University of South Carolina Press
    year: 1996
    note: >-
      The standard biography, built from Josephus read against the archaeology
      of the building programme and the coinage. Cited here for the institutions
      of the Herodian kingdom, and for the argument the title makes: that the
      two halves of Herod's position were a single arrangement rather than a
      contradiction he managed.

  - id: allen-1983
    kind: book
    author: R. E. Allen
    title: "The Attalid Kingdom: A Constitutional History"
    publisher: Clarendon Press
    year: 1983
    note: >-
      Built from the inscriptions rather than from the literary sources, which
      for a dynasty this poorly served by narrative historians is the only way
      to get at how the kingdom worked. This site's Attalid institutions are
      coded from it, and its account of the settlement of 188 is why that
      record's second turning point is a treaty rather than a battle.

  - id: mcging-1986
    kind: book
    author: B. C. McGing
    title: "The Foreign Policy of Mithridates VI Eupator, King of Pontus"
    container: Mnemosyne Supplements 89
    publisher: Brill
    year: 1986
    note: >-
      On diplomacy, strategy, propaganda and support rather than on battles,
      which suits a record whose most consequential single act was a massacre
      organised by correspondence. McGing is also careful about the dynasty's
      double descent claim, which this site counts on the Achaemenid record.

  - id: errington-1990
    kind: book
    author: R. Malcolm Errington
    title: A History of Macedonia
    container: Hellenistic Culture and Society
    publisher: University of California Press
    year: 1990
    note: >-
      Translated by Catherine Errington from the German of 1986. Its emphasis is
      the structure of the Macedonian state and how it worked rather than the
      campaigns, which is what this site's Antigonid institutions need — and its
      caution about the constitutional role of the Macedonian army assembly is
      the reason that record's succession field is null.

  - id: garnsey-saller-2014
    kind: book
    author: Peter Garnsey and Richard Saller
    title: "The Roman Empire: Economy, Society and Culture"
    publisher: University of California Press
    edition: 2nd
    year: 2014
    note: >-
      Not a narrative of emperors: a structural account of how the empire was
      paid for, governed, supplied and stratified, with chapters by Elsner,
      Goodman, Gordon and Woolf added to the second edition. This site's Roman
      institutions are coded from it, for the same reason kemp-2018 rather than
      a campaign history supplies the Egyptian ones.

  - id: millar-1977
    kind: book
    author: Fergus Millar
    title: "The Emperor in the Roman World (31 BC - AD 337)"
    publisher: Duckworth
    year: 1977
    note: >-
      The book that reframed the emperor as a man who mostly answered letters.
      Millar's method is to ask what emperors demonstrably did rather than what
      the constitution said they were, and the answer — hearing embassies,
      judging cases, replying to cities — is why this site's Roman legitimation
      field carries `election` rather than something grander.

  - id: haldon-1997
    kind: book
    author: John F. Haldon
    title: "Byzantium in the Seventh Century: The Transformation of a Culture"
    publisher: Cambridge University Press
    edition: revised
    year: 1997
    note: >-
      On the century in which the eastern Roman empire lost two-thirds of its
      revenue and rebuilt its army, its taxation and its administration around
      what was left. This site's Byzantine institutions are coded from it,
      because the state the fields describe is the one that came out of this
      century rather than the one that went into it.

  - id: kaldellis-2015
    kind: book
    author: Anthony Kaldellis
    title: "The Byzantine Republic: People and Power in New Rome"
    publisher: Harvard University Press
    year: 2015
    note: >-
      Argues that the eastern Roman empire was a republican monarchy rather than
      a theocracy: the emperor held power on behalf of a res publica that could
      and did withdraw its acceptance, and the frequency of depositions is
      evidence of a constitution rather than of chaos. Contested, and cited on
      this site where a coded field turns on it, with the disagreement stated.

  - id: wickham-2009
    kind: book
    author: Chris Wickham
    title: "The Inheritance of Rome: A History of Europe from 400 to 1000"
    container: The Penguin History of Europe
    publisher: Allen Lane
    year: 2009
    note: >-
      Written against the idea of a dark age, and structural rather than
      narrative: what changed between the Roman world and the early medieval one
      was above all the disappearance of the land tax, and Wickham's account of
      what a state without taxation can and cannot do is why this site's
      Carolingian revenue field reads as it does.

  - id: lane-1973
    kind: book
    author: Frederic C. Lane
    title: "Venice: A Maritime Republic"
    publisher: Johns Hopkins University Press
    year: 1973
    note: >-
      Fifty years old and still the reference account, from the fifth century to
      the eighteenth. Lane was an economic historian and the book's centre of
      gravity is the shipping, the money and the constitution rather than the
      art, which is why this site's Venetian institutions are coded from it.

  - id: epstein-1996
    kind: book
    author: Steven A. Epstein
    title: "Genoa and the Genoese, 958-1528"
    publisher: University of North Carolina Press
    year: 1996
    note: >-
      The first comprehensive history of the republic in English, and unusually
      willing to say that the Genoese constitution did not work — which is the
      finding this site's Genoese succession field is coded around, and the
      reason the two maritime republics carry the same value with opposite
      results.

  - id: wilson-2016
    kind: book
    author: Peter H. Wilson
    title: "Heart of Europe: A History of the Holy Roman Empire"
    publisher: Belknap Press of Harvard University Press
    year: 2016
    note: >-
      Published in Britain as The Holy Roman Empire: A Thousand Years of
      Europe's History. Organised thematically rather than by reign — one
      section on the imperial ideal, one on territory, one on governance, one on
      society — which is what a record with eight hundred and forty-four years
      and no narrative spine requires, and why this site's institutions for it
      are coded from Wilson rather than from a chronicle.

  - id: van-tricht-2011
    kind: book
    author: Filip Van Tricht
    title: >-
      The Latin Renovatio of Byzantium: The Empire of Constantinople
      (1204-1228)
    container: The Medieval Mediterranean 90
    publisher: Brill
    year: 2011
    note: >-
      Translated by Peter Longbottom. Argues against reading the Latin empire as
      a foreign occupation that never governed: Van Tricht's case is that its
      emperors presented themselves as legitimate Roman emperors and
      substantially continued Byzantine institutions, which is why this site's
      record for it codes `titulature` and why the Byzantine record now counts a
      successor claim it did not.

  - id: heather-1996
    kind: book
    author: Peter Heather
    title: The Goths
    container: The Peoples of Europe
    publisher: Blackwell
    year: 1996
    note: >-
      Covers both Gothic successor kingdoms in one account, which is why this
      site's Visigothic and Ostrogothic records share it: Heather's argument is
      that Gothic identity was assembled in the fourth and fifth centuries out
      of several groups rather than carried out of Scandinavia, and both records
      are coded on that reading.

  - id: merrills-miles-2010
    kind: book
    author: Andy Merrills and Richard Miles
    title: The Vandals
    container: The Peoples of Europe
    publisher: Wiley-Blackwell
    year: 2010
    note: >-
      The first book in English on the North African kingdom, and explicitly a
      reinterpretation: against the reading of the Vandals as a raiding band
      that destroyed a province, Merrills and Miles describe a state with a
      fiscal apparatus, a court literature and a foreign policy. This site's
      Vandal institutions are coded from it.

  - id: christie-1995
    kind: book
    author: Neil Christie
    title: "The Lombards: The Ancient Longobards"
    container: The Peoples of Europe
    publisher: Blackwell
    year: 1995
    note: >-
      History and archaeology together, from the invasion of 568 to Charlemagne
      taking the kingdom in 774. Christie is unusually useful for a record whose
      central difficulty is that the written sources are two centuries later
      than the events and were written to justify what had happened.

  - id: collins-2004
    kind: book
    author: Roger Collins
    title: "Visigothic Spain, 409-711"
    container: A History of Spain
    publisher: Blackwell
    year: 2004
    note: >-
      Combines chronology and theme, and argues against a good deal of the
      received account — of how the kingdom was governed, of its law, and of the
      Arab conquest. Collins had already written a book on that conquest, which
      is why this site's Visigothic record is drafted from him: its ending is
      the part every other page in the corpus points at.

  - id: matthew-1992
    kind: book
    author: Donald Matthew
    title: The Norman Kingdom of Sicily
    container: Cambridge Medieval Textbooks
    publisher: Cambridge University Press
    year: 1992
    note: >-
      Strongest on administration, which is what this record needs: the Sicilian
      kingdom's interest is that it ran an Arabic fiscal bureau, a Greek
      chancery and a Latin court at once, and Matthew is the account that
      explains how rather than simply noting it.

  - id: fine-1983
    kind: book
    author: John V. A. Fine
    title: >-
      The Early Medieval Balkans: A Critical Survey from the Sixth to the Late
      Twelfth Century
    publisher: University of Michigan Press
    year: 1983
    note: >-
      The standard English narrative of the Balkans before 1200 and the source
      for this site's First Bulgarian record. Fine is careful about the
      difference between what the Byzantine sources say happened in Bulgaria and
      what can be established, which matters on a record where almost all the
      written evidence is the enemy's.

  - id: fine-1987
    kind: book
    author: John V. A. Fine
    title: >-
      The Late Medieval Balkans: A Critical Survey from the Late Twelfth Century
      to the Ottoman Conquest
    publisher: University of Michigan Press
    year: 1987
    note: >-
      The companion volume, covering 1185 to the Ottoman conquest, and the
      source for this site's Second Bulgarian record. The two books together are
      why this corpus can carry Bulgaria twice with the same evidentiary
      footing on both sides of the interruption.

  - id: obolensky-1971
    kind: book
    author: Dimitri Obolensky
    title: "The Byzantine Commonwealth: Eastern Europe 500-1453"
    container: History of Civilization
    publisher: Weidenfeld and Nicolson
    year: 1971
    note: >-
      The book that coined the phrase this site's Balkan and Rus material keeps
      needing: a cultural and religious sphere held together by liturgy, script
      and a shared idea of empire rather than by any polity's authority. Cited
      here for what went out of Bulgaria to Serbia and the Rus, which is the
      substance of the First Bulgarian record's one influence count.

  - id: cirkovic-2004
    kind: book
    author: Sima M. Ćirković
    title: The Serbs
    container: The Peoples of Europe
    publisher: Blackwell
    year: 2004
    note: >-
      A one-volume history from the Slav settlement to the end of Yugoslavia,
      deliberately weighted towards socio-economic development rather than
      dynastic politics — which is why this site's Serbian institutions are
      coded from it. Ćirković is the authority on the medieval Serbian mining
      economy, and that is the field this record turns on.

  - id: phillipson-2012
    kind: book
    author: David W. Phillipson
    title: >-
      Foundations of an African Civilisation: Aksum and the Northern Horn,
      1000 BC - AD 1300
    publisher: James Currey
    year: 2012
    note: >-
      An archaeologist's account, running four centuries past the kingdom's end
      in order to argue for continuity into Christian Ethiopia rather than for a
      collapse. Cited here alongside munro-hay-1991 for the material evidence —
      the stelae, the settlement pattern, the Adulis trade — which is most of
      what this record has, since Aksum left inscriptions and coins and almost
      no administration.

  - id: gomez-2018
    kind: book
    author: Michael A. Gomez
    title: >-
      African Dominion: A New History of Empire in Early and Medieval West
      Africa
    publisher: Princeton University Press
    year: 2018
    note: >-
      The major recent revision, built from Arabic manuscripts, oral tradition
      and archaeology together, and unusually direct about slavery, caste and
      gender in the Niger empires. Cited on this site's Mali and Songhai records
      where Gomez departs from the older narratives, and the departures are
      stated rather than smoothed over.

  - id: levtzion-hopkins-1981
    kind: book
    author: N. Levtzion and J. F. P. Hopkins (eds)
    title: Corpus of Early Arabic Sources for West African History
    container: Fontes Historiae Africanae, Series Arabica IV
    publisher: Cambridge University Press
    year: 1981
    note: >-
      Translations of what Arabic writers from the ninth to the fifteenth
      century said about West Africa, with the apparatus for judging it. It is
      the reason this site's Ghana record can be written at all: every field on
      that page comes from men who mostly had not been there, and a sourcebook
      that prints them side by side is the only way to see how much of the
      account is one author copying another.

  - id: tamrat-1972
    kind: book
    author: Taddesse Tamrat
    title: "Church and State in Ethiopia, 1270-1527"
    container: Oxford Studies in African Affairs
    publisher: Clarendon Press
    year: 1972
    note: >-
      The book that established the field, on the two and a half centuries in
      which the Solomonic dynasty, the monasteries and the expansion into the
      south were all one process. This site's Ethiopian institutions are coded
      from it for the medieval period, and its account of the gult and the
      itinerant court is why that record's `capitals` field carries a comment.

  - id: marcus-2002
    kind: book
    author: Harold G. Marcus
    title: A History of Ethiopia
    publisher: University of California Press
    edition: updated
    year: 2002
    note: >-
      A one-volume survey to the present, used here for the four centuries
      tamrat-1972 does not reach — Gondar, the Zemene Mesafint, Tewodros,
      Menelik and Adwa, and the ending. Marcus is brisk about the nineteenth
      century's imperial expansion in a way older Ethiopian historiography was
      not, which matters for a record whose peak reign doubled the state at the
      expense of its neighbours.

  - id: horton-middleton-2000
    kind: book
    author: Mark Horton and John Middleton
    title: "The Swahili: The Social Landscape of a Mercantile Society"
    container: The Peoples of Africa
    publisher: Blackwell
    year: 2000
    note: >-
      An archaeologist and an anthropologist writing together, which is what the
      Swahili coast requires: the documentary record is thin and late and the
      excavated one is enormous. Their central argument — that Swahili society
      is African and coastal rather than a colony of anybody — is the one this
      site's Kilwa record's `legitimation` field is coded against.

  - id: welsby-2002
    kind: book
    author: Derek A. Welsby
    title: >-
      The Medieval Kingdoms of Nubia: Pagans, Christians and Muslims along the
      Middle Nile
    publisher: British Museum Press
    year: 2002
    note: >-
      The standard account of the three Christian Nubian kingdoms, by an
      excavator who has spent twenty years on them. Cited here for the
      narrative, the conversion, the baqt and the ending; Ruffini supplies the
      inside of the state.

  - id: ruffini-2012
    kind: book
    author: Giovanni R. Ruffini
    title: "Medieval Nubia: A Social and Economic History"
    publisher: Oxford University Press
    year: 2012
    note: >-
      Built from the Old Nubian documents excavated at Qasr Ibrim — land sales,
      accounts, letters, much of it still unpublished — and the reason this
      site's Makurian institutions can be coded at all. Ruffini's finding is a
      monetised economy with exchange rates connected to the wider world, in a
      kingdom whose external reputation rests entirely on archery and a treaty.

  - id: welsby-1996
    kind: book
    author: Derek A. Welsby
    title: "The Kingdom of Kush: The Napatan and Meroitic Empires"
    publisher: British Museum Press
    year: 1996
    note: >-
      The companion to welsby-2002 and by the same excavator, covering the
      thousand years upstream of it. Built from the archaeology as much as from
      the Egyptian and classical notices, which matters for a kingdom whose own
      language nobody can read.

  - id: levtzion-pouwels-2000
    kind: book
    author: Nehemia Levtzion and Randall L. Pouwels (eds)
    title: The History of Islam in Africa
    publisher: Ohio University Press
    year: 2000
    note: >-
      Two dozen specialists on Islam in Africa region by region, and the only
      general work in this bibliography that treats Kanem-Bornu at length. This
      site's Kanem-Bornu institutions are coded from it, alongside the early
      Arabic notices in levtzion-hopkins-1981.

  - id: pikirayi-2001
    kind: book
    author: Innocent Pikirayi
    title: >-
      The Zimbabwe Culture: Origins and Decline of Southern Zambezian States
    container: African Archaeology Series
    publisher: AltaMira Press
    year: 2001
    note: >-
      A synthesis of the whole Zimbabwe culture — Mapungubwe, Great Zimbabwe,
      Khami, Mutapa — by a Zimbabwean archaeologist, and the reason this site can
      carry a record for a polity that left no writing of any kind. Every field
      on that page comes from stonework, imported ceramics, radiocarbon and
      faunal remains, which is why so many of them are empty.

  - id: wilks-1975
    kind: book
    author: Ivor Wilks
    title: >-
      Asante in the Nineteenth Century: The Structure and Evolution of a
      Political Order
    container: African Studies Series 13
    publisher: Cambridge University Press
    year: 1975
    note: >-
      Eight hundred pages on how one African state actually worked — the
      bureaucracy, the roads, the treasury, the succession, the factions in
      council — and still the fullest institutional account of any sub-Saharan
      polity in this bibliography. It is why the Asante record can code three
      fields with confidence and why the fourth is empty for a reason the
      vocabulary cannot fix.

  - id: kulke-2009
    kind: book
    author: Hermann Kulke, K. Kesavapany and Vijay Sakhuja (eds)
    title: >-
      Nagapattinam to Suvarnadwipa: Reflections on the Chola Naval Expeditions
      to Southeast Asia
    publisher: Institute of Southeast Asian Studies
    year: 2009
    note: >-
      Twenty specialists on one event — Rajendra Chola's raid of 1025 on the
      ports of the Melaka strait — from the Indian side, the Southeast Asian
      side and the archaeology. Cited here because it is the only sustained
      treatment of the single most consequential thing that happened to
      Srivijaya, and because the Chola state that launched it has no record on
      this site.

  - id: robson-1995
    kind: book
    author: Mpu Prapanca, translated by Stuart Robson
    title: "Desawarnana (Nagarakrtagama)"
    container: KITLV Verhandelingen 169
    publisher: KITLV Press
    year: 1995
    note: >-
      The Majapahit court poem of 1365 in translation with commentary, by the
      superintendent of Buddhist affairs at the court he is describing. It is
      the principal internal source for that record and the reason its fourth
      chapter is about how to read a list.

  - id: ricklefs-2008
    kind: book
    author: M. C. Ricklefs
    title: "A History of Modern Indonesia since c.1200"
    publisher: Palgrave Macmillan
    edition: 4th
    year: 2008
    note: >-
      The standard general history, beginning at exactly the point this corpus's
      Majapahit record does. Cited here for the fifteenth century — the Paregreg
      war, the Islamisation of the north Java ports and the shift of trade to
      Melaka — which hall-2011 covers as trade history and Ricklefs as politics.

  - id: reid-1988
    kind: book
    author: Anthony Reid
    title: >-
      Southeast Asia in the Age of Commerce, 1450-1680. Volume One: The Lands
      below the Winds
    publisher: Yale University Press
    year: 1988
    note: >-
      The first volume of the standard account of the region's commercial
      centuries, on environment, material life, social organisation and law
      rather than on dynasties. This site's Melakan institutions are coded from
      it, because the questions the fields ask are the ones Reid organised the
      book around.

  - id: brown-1970
    kind: book
    author: Translated by C. C. Brown
    title: "Sejarah Melayu, or Malay Annals"
    container: Oxford in Asia Historical Reprints
    publisher: Oxford University Press
    year: 1970
    note: >-
      The Malay Annals in translation — the court chronicle of Melaka, composed
      after the sultanate had fallen and the dynasty was in exile at Johor. It
      is the principal internal source for that record and, like the Timbuktu
      chronicles on this site's Songhai page, it is elegy written by the
      survivors of the thing it describes.

  - id: reid-2005
    kind: book
    author: Anthony Reid
    title: "An Indonesian Frontier: Acehnese and Other Histories of Sumatra"
    publisher: Singapore University Press
    year: 2005
    note: >-
      Forty years of work on Sumatra, weighted toward Aceh, and the source this
      site's Aceh record is coded from. It is a collection of studies rather
      than a continuous narrative, which is why the span dates on that record
      come from it only where it states them.

  - id: andaya-1993
    kind: book
    author: Leonard Y. Andaya
    title: "The World of Maluku: Eastern Indonesia in the Early Modern Period"
    publisher: University of Hawaii Press
    year: 1993
    note: >-
      The standard account of the north Moluccas, built on Iberian and Dutch
      records read against Malukan categories rather than through them. Its
      organising argument — that Maluku was structured by a dualism between
      Ternate and Tidore rather than by a single centre — is why this site's
      Ternate record is written the way it is.

  - id: coedes-1968
    kind: book
    author: George Coedes, edited by Walter F. Vella, translated by Susan Brown Cowing
    title: "The Indianized States of Southeast Asia"
    publisher: University of Hawaii Press
    year: 1968
    note: >-
      The translation of the third French edition of 1964. It is the work that
      assembled the epigraphy of mainland and island Southeast Asia into one
      narrative, and it is old enough that its organising idea — a set of states
      formed by the reception of Indian models — has been argued with ever since.
      This site uses it for chronology and for inscriptions, and takes the
      framework as a position rather than as a background.

  - id: higham-2001
    kind: book
    author: Charles Higham
    title: "The Civilization of Angkor"
    publisher: University of California Press
    year: 2001
    note: >-
      Angkor from the archaeology rather than from the temple inscriptions
      alone, by the excavator whose work on the pre-Angkorian Mekong is the
      reason the Khmer state is no longer explained as an import.

  - id: aung-thwin-1985
    kind: book
    author: Michael Aung-Thwin
    title: "Pagan: The Origins of Modern Burma"
    publisher: University of Hawaii Press
    year: 1985
    note: >-
      Built on the Old Burmese donative inscriptions, and the source of the
      argument this site's Pagan record is coded around: that the kingdom was
      undone by the accumulation of tax-exempt monastic land rather than by the
      Mongols. It is a contested reading and the record says so.

  - id: baker-pasuk-2017
    kind: book
    author: Chris Baker and Pasuk Phongpaichit
    title: "A History of Ayutthaya: Siam in the Early Modern World"
    publisher: Cambridge University Press
    year: 2017
    note: >-
      The first full-length history of Ayutthaya in English, and the reason this
      site's Ayutthaya record carries the revenue coding of a port rather than of
      a rice kingdom: its central argument is that Ayutthaya lived on trade and
      on the products of forest and water, not on an agrarian surplus.

  - id: taylor-2013
    kind: book
    author: K. W. Taylor
    title: "A History of the Vietnamese"
    publisher: Cambridge University Press
    year: 2013
    note: >-
      Weighted toward the premodern centuries that most surveys of Vietnam
      hurry through, and written against the national narrative of a single
      continuous people resisting the north. This site's Dai Viet record follows
      it in treating the Ly and the Tran as a specific thing with a beginning and
      an end rather than as an early chapter of a country.

  - id: andaya-1975
    kind: book
    author: Leonard Y. Andaya
    title: "The Kingdom of Johor, 1641-1728: Economic and Political Developments"
    publisher: Oxford University Press
    year: 1975
    note: >-
      Built on the Dutch company records at The Hague, which are the fullest
      external archive anybody kept on a Malay court in this period. It covers
      eighty-seven of this site's Johor record's hundred and seventy-one years,
      including the killing of 1699, and the record's span dates outside that
      window come from elsewhere.

  - id: gibb-battuta
    kind: primary
    author: Ibn Battuta, translated by H. A. R. Gibb and C. F. Beckingham
    title: "The Travels of Ibn Battuta, A.D. 1325-1354"
    container: Works issued by the Hakluyt Society, Second Series
    publisher: The Hakluyt Society
    year: 1994
    note: >-
      The complete four-volume Hakluyt translation, finished in 1994 by
      Beckingham decades after Gibb began it. Ibn Battuta reached a striking
      number of the polities on this site — Delhi, Mali, Kilwa, Pasai — and this
      is the first record here to cite him. He is an eyewitness who wrote
      afterwards from memory and from other people's books, and the record that
      uses him says which of his claims it is relying on.

  - id: andaya-1981
    kind: book
    author: Leonard Y. Andaya
    title: "The Heritage of Arung Palakka: A History of South Sulawesi (Celebes) in the Seventeenth Century"
    container: Verhandelingen van het Koninklijk Instituut voor Taal-, Land- en Volkenkunde, 91
    publisher: Martinus Nijhoff
    year: 1981
    note: >-
      Written around the Bugis prince who fought for the Dutch company against
      Makassar and won South Sulawesi for himself, and therefore an account of
      the fall of Makassar from the side of the Sulawesi allies rather than from
      the company's. This site's Makassar record is coded from it and from Reid.

  - id: saunders-1994
    kind: book
    author: Graham Saunders
    title: "A History of Brunei"
    publisher: Oxford University Press
    year: 1994
    note: >-
      The only full-length history of the sultanate from its beginnings, and
      careful about the difference between what the European sources record and
      what the Brunei genealogies claim. This site's Brunei record follows it in
      both.

  - id: majul-1973
    kind: book
    author: Cesar Adib Majul
    title: "Muslims in the Philippines"
    publisher: University of the Philippines Press
    year: 1973
    note: >-
      Published for the Asian Center at Quezon City, and the standard account of
      the Sulu and Maguindanao sultanates written from Philippine Muslim sources
      alongside the Spanish ones. This site's Sulu record is coded from it.

  - id: hagerdal-2001
    kind: book
    author: Hans Hagerdal
    title: "Hindu Rulers, Muslim Subjects: Lombok and Bali in the Seventeenth and Eighteenth Centuries"
    publisher: White Lotus
    year: 2001
    note: >-
      Balinese and Sasak material read against the Dutch company's records, on
      the period when Bali's kingdoms projected power across the strait to
      Lombok. This site's Gelgel record uses it for the seventeenth century and
      Coedes and Ricklefs for what comes before.

  - id: teeuw-wyatt-1970
    kind: primary
    author: Edited and translated by A. Teeuw and D. K. Wyatt
    title: "Hikayat Patani: The Story of Patani"
    container: Bibliotheca Indonesica 5, Koninklijk Instituut voor Taal-, Land- en Volkenkunde
    publisher: Martinus Nijhoff
    year: 1970
    note: >-
      The Patani court chronicle in Malay with an English translation and a
      commentary that is longer than the text. It is the internal source for a
      sultanate whose archive was destroyed twice, and like the Sejarah Melayu on
      this site's Melaka record it was written by people arguing about a
      succession while it was still open.

  - id: historical-basemaps
    kind: dataset
    author: Andre Ourednik and contributors
    title: "historical-basemaps: Historical country boundary GeoJSON"
    url: https://github.com/aourednik/historical-basemaps
    licence: CC-BY-4.0
    note: >-
      Map polygons only. Never a source for a measure. See hard rule 5: areas
      computed from these polygons are not published as figures.

  - id: graaf-pigeaud-1974
    kind: book
    author: H. J. de Graaf and Th. G. Th. Pigeaud
    title: "De eerste Moslimse vorstendommen op Java: studiën over de staatkundige geschiedenis van de 15de en 16de eeuw"
    container: Verhandelingen van het Koninklijk Instituut voor Taal-, Land- en Volkenkunde 69
    publisher: Martinus Nijhoff
    year: 1974
    note: >-
      The standard study of the first Muslim states on Java, and the first to
      work systematically from the Javanese babad and the Sadjarah Banten rather
      than from Portuguese and Dutch reports alone. Read here in the Indonesian
      translation, Kerajaan-Kerajaan Islam di Jawa, published in the Seri
      Terjemahan Javanologi. The authors are consistently explicit about which
      of their statements rest on chronicle, which on European report, and which
      on inference, which is what makes it usable for a sixteenth century whose
      documentation is this thin.

  - id: raffles-1817
    kind: book
    author: Thomas Stamford Raffles
    title: The History of Java
    publisher: Black, Parbury and Allen
    year: 1817
    note: >-
      Written by the Lieutenant-Governor who had just administered Java for the
      British, and to be read as such: the account of a province's disorder is
      also the case for the government that came in to settle it. Cited here for
      the Banten of 1808 to 1813, which Raffles describes at first hand and
      with figures, including the pension for which the last sultan gave up the
      administration of the country.

  - id: baladhuri-futuh
    kind: book
    author: Ahmad ibn Yahya al-Baladhuri
    title: "The Origins of the Islamic State (Kitab Futuh al-Buldan)"
    translator: Philip K. Hitti
    publisher: Columbia University
    year: 1916
    note: >-
      Compiled in the ninth century from earlier authorities, and organised as a
      province-by-province account of how each place came under Muslim rule and
      on what terms. Its interest is that it is not written as a story: it is
      written as a dossier, because the tax status of a district in the ninth
      century depended on what had been agreed in the seventh, and Baladhuri
      records the competing versions, the documents, and the objections to them.
      Hitti's translation of the first part is out of copyright and complete.

  - id: wellhausen-1927
    kind: book
    author: Julius Wellhausen
    title: The Arab Kingdom and its Fall
    translator: Margaret Graham Weir
    publisher: University of Calcutta
    year: 1927
    note: >-
      The 1902 Das arabische Reich und sein Sturz in English. It is the study
      that established the Umayyad period as a subject in its own right rather
      than as the prelude to the Abbasids, and it is unusually explicit about
      which Arabic authority each statement rests on and how far that authority
      can be pressed. A century of scholarship has revised it; its judgements
      about the sources are still worth reading, and it is cited here for the
      dynasty's fall and for what happened to its survivors.

  - id: lestrange-1900
    kind: book
    author: Guy Le Strange
    title: "Baghdad during the Abbasid Caliphate, from contemporary Arabic and Persian sources"
    publisher: Clarendon Press
    year: 1900
    note: >-
      A topographical reconstruction rather than a narrative history: Le Strange
      works from Ya'qubi, Ibn Serapion, Khatib al-Baghdadi, Yaqut, Ibn Jubayr and
      the Persian historians of the Mongol conquest to establish where in Baghdad
      each gate, canal, market and palace actually stood. Cited here for the plan
      of al-Mansur's Round City, for the measurements the Arabic authorities give
      and disagree about, and for the siege of 1258 and what became of the city
      afterwards. Out of copyright.

  - id: maqqari-gayangos
    kind: book
    author: Ahmed ibn Mohammed al-Makkari
    title: "The History of the Mohammedan Dynasties in Spain"
    translator: Pascual de Gayangos
    publisher: Oriental Translation Fund
    year: 1843
    note: >-
      A seventeenth-century Maghribi compilation that preserves long verbatim
      extracts from Andalusi historians whose own works are lost, which is what
      makes it usable: Gayangos translates the quotations and names the authority
      for each. Cited here for the destruction of Cordoba and Madinat al-Zahra in
      the civil war after 1009, where the eyewitness testimony comes through Ibn
      al-Raqiq. Out of copyright.

  - id: lane-poole-1901
    kind: book
    author: Stanley Lane-Poole
    title: A History of Egypt in the Middle Ages
    publisher: Methuen
    year: 1901
    note: >-
      A narrative history built largely on al-Maqrizi, with the numismatic and
      documentary detail of a curator who had catalogued the coins himself. The
      judgements are of their period and are sometimes contemptuous of their
      subjects; the detail is checkable and carefully attributed. Cited here for
      the Fatimid library and for the abolition of the caliphate in 1171. Out of
      copyright.

  - id: suyuti-jarrett
    kind: book
    author: Jalal al-Din al-Suyuti
    title: "History of the Caliphs (Tarikh al-Khulafa')"
    translator: H. S. Jarrett
    publisher: Asiatic Society of Bengal
    year: 1881
    note: >-
      Written in Cairo in the 1490s by a scholar who had grown up in the
      household of one of the caliphs he describes and whose father drafted their
      documents. It is the only history of the caliphate written from inside the
      Cairo Abbasid establishment, and it quotes the paperwork. Out of copyright.

  - id: alexiad-dawes
    kind: book
    author: Anna Komnene
    title: The Alexiad
    translator: Elizabeth A. S. Dawes
    publisher: Routledge, Kegan Paul
    year: 1928
    note: >-
      The emperor Alexios I's daughter writing about her father's reign, hostile
      to the Normans throughout and open about it. Its unique value for the
      crusader states is documentary: Anna transcribes the treaty of Devol of
      1108 at length, apparently from the chancery text, so Bohemond's
      submission survives in the words he agreed to. Dawes' translation is out
      of copyright.

  - id: ibn-al-qalanisi
    kind: book
    author: Ibn al-Qalanisi
    title: "The Damascus Chronicle of the Crusades"
    translator: H. A. R. Gibb
    publisher: Luzac
    year: 1932
    note: >-
      A Damascene administrator's year-by-year chronicle, contemporary with
      everything it describes down to 1160, and the closest thing to a
      newspaper record of the crusading century from the Syrian side. Gibb
      translates the portion covering the crusades and annotates the
      identifications. Out of copyright.

  - id: usama-hitti
    kind: book
    author: Usama ibn Munqidh
    title: "An Arab-Syrian Gentleman and Warrior in the Period of the Crusades (Kitab al-I'tibar)"
    translator: Philip K. Hitti
    publisher: Columbia University Press
    year: 1929
    note: >-
      The memoirs of a Syrian nobleman of Shayzar who spent his long life among
      the Franks as neighbour, enemy, guest and occasional ally, written in old
      age as a book of instruction and full of anecdotes he found funny,
      alarming or instructive. It is the closest thing to an ordinary Muslim
      view of the crusader states from inside them, and it is unusually careful
      to distinguish what its author saw himself from what he was told. Out of
      copyright.

  - id: ibn-khallikan
    kind: book
    author: Ibn Khallikan
    title: "Ibn Khallikan's Biographical Dictionary (Wafayat al-A'yan)"
    translator: Bn Mac Guckin de Slane
    publisher: Oriental Translation Fund
    year: 1843
    note: >-
      Some eight hundred lives of notable men of the Islamic world, compiled in
      thirteenth-century Cairo and Damascus by a judge who names his authority
      for each anecdote and says when he does not believe it. Its value here is
      that it preserves the small things chronicles discard — what a prince paid
      for a couplet, what was written on the wall of an abandoned castle, what a
      man asked to have buried with him. De Slane's translation is out of
      copyright.

  - id: breasted-1906
    kind: book
    author: James Henry Breasted
    title: "Ancient Records of Egypt, Volume I: The First to the Seventeenth Dynasties"
    publisher: University of Chicago Press
    year: 1906
    note: >-
      Every historical inscription then known from Egypt down to the Seventeenth
      Dynasty, translated and numbered in sequence, with the damaged passages
      marked and the conjectures flagged as conjectures. The translations have
      been revised many times since; the apparatus is what makes it usable here,
      because it shows on the page how much of any Old Kingdom text is actually
      standing. Out of copyright.

  - id: king-1910
    kind: book
    author: Leonard William King
    title: "A History of Sumer and Akkad"
    publisher: Chatto and Windus
    year: 1910
    note: >-
      A survey of Mesopotamian history to the fall of Babylon by the British
      Museum's keeper of Egyptian and Assyrian antiquities, written when the
      subject was sixty years old. Much of its reconstruction is superseded —
      King was not certain that Sargon of Agade and the king he calls
      Shar-Gani-sharri were the same man. Cited here for exactly that: it records
      what was known, and how it came to be known, at a moment when the
      difference between the legend and the evidence was still being worked out.
      Out of copyright.

  - id: king-hammurabi
    kind: book
    author: Leonard William King
    title: "The Letters and Inscriptions of Hammurabi, King of Babylon, Volume III"
    publisher: Luzac
    year: 1900
    note: >-
      The cuneiform texts, transliterations and translations of Hammurabi's own
      administrative correspondence — most of it addressed to Sin-idinnam,
      governor of Larsa — with a long introduction classifying what the king
      wrote to his governors about. It is the ordinary paperwork of the man whose
      law collection is the most famous document of the ancient world, and it is
      out of copyright.

  - id: harper-1904
    kind: book
    author: Robert Francis Harper
    title: "The Code of Hammurabi, King of Babylon, about 2250 B.C."
    publisher: University of Chicago Press
    year: 1904
    note: >-
      The autographed text, transliteration and translation of the Susa stele,
      published two years after it was dug up, with an introduction describing
      the object and its condition. Its chronology is five centuries out and its
      framing is frankly biblical — both of which make it a good record of what
      the discovery meant at the moment it was made. Out of copyright.

  - id: sayce-1888
    kind: book
    author: Archibald Henry Sayce
    title: "The Hittites: The Story of a Forgotten Empire"
    publisher: Religious Tract Society
    year: 1888
    note: >-
      Written eighteen years before Hattusa was excavated and twenty-seven
      before Hittite was deciphered, by the Assyriologist who had argued the
      empire's existence into scholarly acceptance from Egyptian and biblical
      evidence alone. Almost every particular in it has since been corrected;
      what it records exactly is the moment when a great power had been
      recovered as a name and not yet as a language, a capital or a history.
      Out of copyright.

  - id: breasted-1912
    kind: book
    author: James Henry Breasted
    title: A History of Egypt from the Earliest Times to the Persian Conquest
    publisher: Charles Scribner's Sons
    year: 1912
    note: >-
      The narrative companion to Breasted's Ancient Records, quoting the
      documents at length in his own translations. Cited here for the Report of
      Wenamun, which he prints nearly in full. Out of copyright.

  - id: layard-1849
    kind: book
    author: Austen Henry Layard
    title: "Nineveh and its Remains"
    publisher: John Murray
    year: 1849
    note: >-
      The account of the excavations at Nimrud and Nineveh by the man who dug
      them, written for a general audience and enormously popular in its day. It
      is a period piece about the Ottoman provinces as much as an archaeological
      report, and its value here is that it records what the Assyrian capitals
      looked like before anybody knew what they were. Out of copyright.

  - id: luckenbill-1927
    kind: book
    author: Daniel David Luckenbill
    title: "Ancient Records of Assyria and Babylonia, Volume II"
    publisher: University of Chicago Press
    year: 1927
    note: >-
      The Assyrian royal inscriptions in translation, arranged by reign, with
      the formulaic passages given in full rather than summarised. Cited here
      for Ashurbanipal's account of the sack of Susa, which is one of the most
      detailed descriptions of a deliberate obliteration written by the person
      who ordered it. Out of copyright.

  - id: herodotus-macaulay
    kind: book
    author: Herodotus
    title: The History of Herodotus
    translator: G. C. Macaulay
    publisher: Macmillan
    year: 1890
    note: >-
      Written about a century after Babylon became a Persian province, by a
      Greek who reports what he was told there. It is not a source for what the
      Neo-Babylonian empire was; it is the best surviving source for what people
      in the fifth century believed about it, which is a different and equally
      useful thing. Out of copyright.

  - id: king-thompson-1907
    kind: book
    author: L. W. King and R. C. Thompson
    title: "The Sculptures and Inscription of Darius the Great on the Rock of Behistun in Persia"
    publisher: British Museum
    year: 1907
    note: >-
      A fresh collation of the three versions of the Behistun inscription made
      on the rock itself, with the Old Persian, Elamite and Babylonian texts
      printed together and a full index of proper names in all three. Its use
      here is that index, which is where the Babylonian name for the province
      the Persians called Armina can be read off directly. Out of copyright.

  - id: arrian-chinnock
    kind: book
    author: Arrian
    title: The Anabasis of Alexander
    translator: E. J. Chinnock
    publisher: Hodder and Stoughton
    year: 1884
    note: >-
      Written some four hundred and fifty years after the events, by a Roman
      senator and provincial governor working principally from Ptolemy and
      Aristobulus, both of whom were on the campaign and neither of whose books
      survives. It is the soberest of the five surviving narratives and the only
      one that consistently says which of its lost sources a statement comes
      from. Chinnock's translation carries notes identifying where Diodorus,
      Curtius and Plutarch differ. Out of copyright.

  - id: plutarch-clough
    kind: book
    author: Plutarch
    title: Lives of the Noble Grecians and Romans
    translator: John Dryden
    editor: Arthur Hugh Clough
    year: 1859
    note: >-
      Biography rather than history, and Plutarch says so; his interest is
      character, and he selects for it. Two things make it useful here anyway.
      The last chapters of the Life of Alexander quote the court diary of the
      final illness almost day by day, and the Roman lives record what later
      generals did with Alexander's memory — which is a fact about the Romans
      and reliably reported. Out of copyright.

  - id: lestrange-1905
    kind: book
    author: Guy Le Strange
    title: "The Lands of the Eastern Caliphate: Mesopotamia, Persia, and Central Asia, from the Moslem Conquest to the Time of Timur"
    publisher: Cambridge University Press
    year: 1905
    note: >-
      A province-by-province topography of the Islamic east built out of the
      Arabic and Persian geographers — Ibn Khurdadbih, Ibn Hawkal, Istakhri,
      Muqaddasi, Yaqut, Mustawfi and the Fars Namah — quoted and dated
      individually. Its use here is for what happened to old places after the
      polities that built them stopped: it records what a tenth-century traveller
      found at a Sasanian fire sanctuary, how large a former capital still was
      when a given geographer saw it, and what later inhabitants believed the
      ruins in front of them had been. Out of copyright.

  - id: wigram-1910
    kind: book
    author: W. A. Wigram
    title: "An Introduction to the History of the Assyrian Church, or The Church of the Sassanid Persian Empire, 100-640 A.D."
    publisher: Society for Promoting Christian Knowledge
    year: 1910
    note: >-
      The standard English narrative of the Church of the East for a long
      generation, and it has to be read with two things in front of you. Wigram
      was an Anglican missionary to the Assyrians and writes as an advocate; and
      for the early centuries his principal authority is Mshikha-Zkha's History
      of the Bishops of Adiabene, a sixth-century compilation whose authenticity
      has been seriously disputed since. He accepts it more readily than a modern
      reader should. Cited here for what that tradition contains — the bishops of
      Arbela, who persecuted them and on whose authority, and the position of
      Adiabene as a refuge for Christians from the Roman side — with the
      provenance stated in the chapter. Out of copyright.

  - id: rhys-davids-1890
    kind: book
    author: T. W. Rhys Davids
    title: "The Questions of King Milinda"
    translator: T. W. Rhys Davids
    series: "Sacred Books of the East, vols XXXV-XXXVI"
    publisher: Clarendon Press
    year: 1890
    note: >-
      A translation of the Pali Milinda-panha with a long introduction on the
      identification of Milinda with the Greek king Menander. Its value here is
      that introduction, which assembles in one place every surviving classical
      notice of Menander — four of them — alongside the numismatic evidence, and
      is unusually careful about what the material will and will not support: it
      accepts that the coin epithets show Buddhist subjects, denies that they
      show a Buddhist king, and treats the text's own account of Menander's
      conversion as a literary ending rather than a historical report. Out of
      copyright.

  - id: karaka-1884
    kind: book
    author: Dosabhai Framji Karaka
    title: "History of the Parsis, including their manners, customs, religion and present position"
    publisher: Macmillan
    year: 1884
    volume: I
    note: >-
      Written by a Parsi member of the Bombay legislative council for a Victorian
      readership, and partisan about its own community in the way that implies.
      Its value is that it prints and discusses the Qissa-i Sanjan, the only
      substantial account of the migration to Gujarat, which was composed in 1600
      — some nine hundred years after the events — and that Karaka is candid
      about its chronology: he sets out in a footnote why the traditional date of
      716 does not reconcile with the Hindu and Parsi dates given, and concludes
      that the first and later emigrations have been confused. Cited here with
      that provenance stated. Out of copyright.

  - id: kartlis-tskhovreba
    kind: book
    title: "Kartlis Tskhovreba: A History of Georgia"
    editor: Roin Metreveli and Stephen Jones
    publisher: Artanuji
    year: 2014
    note: >-
      The Georgian national chronicle in English. It is a compilation assembled
      over centuries out of older material, and for the pre-Christian period it
      is not a historical source in the ordinary sense: it has Alexander
      conquering Kartli, which he never entered, and builds its chronology
      backwards from his death. Cited here for what it is — the account the
      Georgians themselves kept — and specifically for the regime Parnavaz is
      remembered as overthrowing, the eight eristavis and the spaspet he is said
      to have appointed, and the chronicle's own remark that the arrangement was
      modelled on Persian practice.

  - id: dasxuranci-dowsett
    kind: book
    author: Movses Dasxuranci
    title: "The History of the Caucasian Albanians"
    translator: C. J. F. Dowsett
    series: London Oriental Series, vol. 8
    publisher: Oxford University Press
    year: 1961
    note: >-
      The only surviving history of Caucasian Albania, written in Armenian and
      compiled in stages between the seventh and the tenth centuries. It is the
      source for almost everything known about the Mihranid princes, and its
      third book carries the events the country's own literature stops at: the
      murder of the last Mihranid, the transfer of the principality to the
      Eranshahik house, the raid on Partaw. Dowsett's edition prints the variant
      readings and the chronological disputes rather than smoothing them.

  - id: wardrop-1888
    kind: book
    author: Oliver Wardrop
    title: "The Kingdom of Georgia: notes of travel in a land of woman, wine and song"
    publisher: Sampson Low
    year: 1888
    note: >-
      A young Englishman's travel book, written eighty-seven years after the
      Russian annexation, with appended sketches of Georgian history and
      literature and a bibliography. The framing is entirely of its period — the
      subtitle is a fair warning, and the passages about Georgia's neighbours are
      worse — and it is used here for the two things it is a first-hand witness
      to: what a traveller found on the ground under Russian administration in
      the 1880s, and what Georgians themselves told him about Rustaveli and what
      they did with his poem. Out of copyright.

  - id: baddeley-1908
    kind: book
    author: John F. Baddeley
    title: "The Russian Conquest of the Caucasus"
    publisher: Longmans, Green
    year: 1908
    note: >-
      The standard English narrative of the Murid wars, written from the Russian
      military archives and from travel over the ground. Baddeley is a
      sympathetic outsider to both sides: he refuses the Russian literature's
      account of the movement as fanaticism, refuses equally to romanticise
      Shamil, and presses the charge of cruelty. His closing assessment — that
      Muridism was in the long run the instrument rather than the enemy of
      Russian rule, an argument he credits to Shamil's own claim in captivity —
      is the reason he is cited here. Out of copyright.

  - id: ibn-isfandiyar-browne
    kind: book
    author: Ibn Isfandiyar
    title: "An Abridged Translation of the History of Tabaristan"
    translator: Edward G. Browne
    series: "E. J. W. Gibb Memorial Series, vol. II"
    publisher: Luzac
    year: 1905
    note: >-
      A local history of one province, written in Persian about 1216 by a man
      whose father had served the Bavand court and who had been at that court
      himself. It is the principal source for almost everything known about the
      dynasty, and it is not a neutral one — Browne's translation is abridged and
      says where it abridges. A later hand carried the chronicle on to 1349,
      which is why it also contains the close account of how the house ended:
      the murder in the bath at Amul, the sons who were sheltered by the
      ustandar of Rustamdar, and the last attempt to put them back. Out of
      copyright.

  - id: browne-1902
    kind: book
    author: Edward G. Browne
    title: "A Literary History of Persia, Volume I: From the Earliest Times until Firdawsi"
    publisher: T. Fisher Unwin
    year: 1902
    note: >-
      A survey of Persian letters from the Achaemenids to about 1000, written by
      a Cambridge orientalist working through the Persian and Arabic anthologies
      — Awfi, Dawlatshah, Nizami-i-Arudi — and quoting them at length in his own
      verse translations. Its value here is that it prints the whole surviving
      early material rather than a selection: it is how one can see that the
      entire Persian poetic output of the Tahirid period, as the anthologists
      knew it, is two couplets by one man. Browne is candid about which of his
      anecdotes are late and unreliable, and says so before quoting them. Out of
      copyright.

  - id: juzjani-raverty
    kind: book
    author: Minhaj al-Din Abu Umar-i Uthman al-Juzjani
    title: "Tabakat-i-Nasiri: A General History of the Muhammadan Dynasties of Asia"
    translator: H. G. Raverty
    publisher: Asiatic Society of Bengal
    year: 1881
    note: >-
      A general history written at Delhi in the 1260s by a man from a family of
      scholars in the Ghurid highlands, dedicated to a grandson of Iltutmish and
      paid for with a village in the Punjab. That biography is also its bias: it
      is warm about the Ghurids and warmer about the Delhi sultans, and Raverty's
      notes are combative about the errors of earlier translators. Its value here
      is as a near-contemporary witness on two things the Persian and Arabic
      chronicles cover thinly — the purchase and manumission of Iltutmish, which
      Juzjani had from the court that descended from him, and the manoeuvring
      between the Khwarazmshah, the Qara Khitai and the last Karakhanid of
      Samarkand. Out of copyright.

  - id: browne-1906
    kind: book
    author: Edward G. Browne
    title: "A Literary History of Persia, Volume II: From Firdawsi to Sa'di"
    publisher: T. Fisher Unwin
    year: 1906
    note: >-
      The continuation of Browne's survey, covering roughly 1000 to 1290. Its
      use here is source-critical rather than literary: Browne works through the
      later Persian anthologists — Dawlatshah above all — and shows, item by
      item, which of their celebrated stories were lifted without acknowledgement
      from earlier books, which anecdotes have been reassigned to more famous men
      than the ones they happened to, and which are simply invented. He is
      equally careful about Sultan Mahmud, whose reputation as a patron he treats
      as a thing the sultan bought and Firdawsi destroyed. Out of copyright.

  - id: browne-1920
    kind: book
    author: Edward G. Browne
    title: "A Literary History of Persia, Volume III: The Tartar Dominion (1265-1502)"
    publisher: Cambridge University Press
    year: 1920
    note: >-
      The third volume of Browne's survey, covering the period between the
      Mongols and the Safavids — the one for which the Persian biographical
      tradition is richest and least reliable. He is cited here for three things
      the chronicles handle badly: the Sarbadar revolt, where he prints the
      founder's own reported words and Lane-Poole's count of twelve chiefs and
      nine violent deaths; the loss of Ibn-i Yamin's divan at Zawa and what that
      makes unknowable; and the invitations Hafez received and declined, with the
      verses he sent instead. Browne says throughout which of his anecdotes rest
      on late authorities and which do not. Out of copyright.

  - id: babur-beveridge
    kind: book
    author: Zahir al-Din Muhammad Babur
    title: "The Babur-nama in English (Memoirs of Babur)"
    translator: Annette S. Beveridge
    publisher: Luzac
    year: 1922
    note: >-
      The autobiography of the founder of the Mughal empire, written in Chaghatay
      Turkish and translated here from the Haydarabad codex rather than from the
      Persian version made for Akbar. It is the only substantial first-person
      memoir left by any ruler of the Islamic world before the modern period, and
      its value is that it records the unimpressive parts: the provinces lost,
      the winters without money, the walking barefoot in the hills. Beveridge's
      notes are exhaustive about where the manuscript has gaps, which matters,
      because several years of Babur's life are missing entirely. Out of
      copyright.

  - id: krusinski-1728
    kind: book
    author: Judasz Tadeusz Krusiński
    title: "The History of the Revolution of Persia, taken from the memoirs of Father Krusinski, Procurator of the Jesuits at Ispahan"
    translator: Jean-Antoine du Cerceau
    publisher: Printed for J. Pemberton
    year: 1728
    note: >-
      An eyewitness account of the fall of Isfahan by a Jesuit who had lived in
      the city for years, spoke the language, knew the court, and was inside the
      walls for the whole of the six-month siege. He despised the Safavid
      government and says so, so his explanations of the decline — the princes
      raised in the harem, the eunuchs, the ministers — should be read as the
      judgement of a hostile and extremely well-placed observer rather than as
      analysis. On what happened during the siege itself he is the fullest
      testimony that exists, and it is not pleasant. Out of copyright.

  - id: hanway-1753
    kind: book
    author: Jonas Hanway
    title: "An Historical Account of the British Trade over the Caspian Sea, with a Journal of Travels, to which are added the Revolutions of Persia"
    publisher: Printed for Mr. Dodsley
    year: 1753
    note: >-
      Written by an English merchant of the Russia Company who went to Persia in
      the 1740s to open a Caspian trade, lost his goods in a rebellion, and came
      home and explained why the venture had failed. It is not scholarship and
      does not claim to be; its value is that it is contemporary, that Hanway
      talked to people who had been in the room, and that his interest was
      commercial rather than dynastic — so he records the condition of the
      country and the collection of revenue in a way the court chronicles do
      not. Out of copyright.

  - id: francklin-1790
    kind: book
    author: William Francklin
    title: "Observations Made on a Tour from Bengal to Persia in the Years 1786-7"
    publisher: Printed for T. Cadell
    year: 1790
    note: >-
      An East India Company officer who spent eight months at Shiraz in 1787,
      living in a Persian household and learning the language, seven years after
      Karim Khan Zand's death and in the middle of the wars that followed it. He
      is a soldier and describes walls and ditches with a professional eye; he is
      also writing before the outcome was known, which is why his account of the
      Qajar escape from Shiraz is reported flatly rather than as the beginning of
      anything. Out of copyright.

  - id: browne-1910
    kind: book
    author: Edward G. Browne
    title: "The Persian Revolution of 1905-1909"
    publisher: Cambridge University Press
    year: 1910
    note: >-
      The standard English account of the Constitutional Revolution for most of a
      century, written by the Cambridge professor of Persian while the events
      were still going on, by a man who was simultaneously campaigning in England
      on behalf of the constitutionalists and against the Anglo-Russian Agreement
      of 1907. He declines to call it a history, says in the preface that his
      purpose is to arouse sympathy for the Persians, and prints the
      constitutional documents in full as appendices so that a reader can check
      him. Cited here as a partisan source that declares itself. Out of
      copyright.

  - id: periplus-schoff
    kind: book
    author: Anonymous
    title: "The Periplus of the Erythraean Sea: Travel and Trade in the Indian Ocean by a Merchant of the First Century"
    translator: Wilfred H. Schoff
    publisher: Longmans, Green
    year: 1912
    note: >-
      A working sailing handbook written in Greek in the middle of the first
      century AD by somebody who had made the voyages, listing the ports of the
      Red Sea, the East African coast, South Arabia and India with what could be
      bought and sold at each and who governed them. It is not a history and has
      no interest in being one, which is what makes it useful: it names the
      rulers of South Arabia in passing, as facts a merchant needed, at a moment
      no other outside source describes. Schoff's translation and notes are of
      their period and the notes are freer with speculation than the text.
      Out of copyright.

  - id: bury-1915
    kind: book
    author: G. Wyman Bury
    title: "Arabia Infelix, or the Turks in Yamen"
    publisher: Macmillan
    year: 1915
    note: >-
      A British traveller and political agent who lived in Yemen and Aden and
      knew the country and its languages, writing while the Ottoman vilayet
      still existed and Imam Yahya was in the middle of his career. He is
      valuable for the sequence of events between the Egyptian occupation and
      the 1911 settlement, which he sets out compactly and had partly witnessed.
      He is also a wartime propagandist with a low opinion of the people he is
      describing — the passages on Islamic law and on tribal religion are
      contemptuous, and his judgements are not to be borrowed. Cited here for
      what he reports, not for what he thinks of it. Out of copyright.

  - id: khazraji-redhouse
    kind: book
    author: Ali ibn al-Hasan al-Khazraji
    title: "The Pearl-Strings: A History of the Resuliyy Dynasty of Yemen"
    translator: James W. Redhouse
    publisher: "E. J. W. Gibb Memorial Series"
    year: 1906
    note: >-
      The Rasulid dynasty's own chronicle, by a man who lived at the court of
      its seventh sultan alongside Firuzabadi, the chief judge of the kingdom
      and author of the great Arabic dictionary. It is a court history and
      reads like one — the sultan is divinely aided on every page — but it is
      also a dated register of a working state: revenue circuits, appointments,
      the court's seasonal move between Ta'izz and Zabid, famines and revolts,
      often day by day. It stops in 1400, sixty years before the dynasty fell,
      because the author died in 1409. Translated from what was then a unique
      manuscript by a British lexicographer who says in his preface that his
      interest was Aden's bygone fortunes as the empire's coaling station.
      Out of copyright.

  - id: albuquerque-birch
    kind: book
    author: Afonso de Albuquerque the younger
    title: "The Commentaries of the Great Afonso Dalboquerque, Second Viceroy of India, Part IV"
    translator: Walter de Gray Birch
    publisher: Hakluyt Society
    year: 1884
    note: >-
      The commander's own son compiled these from his father's papers, and they
      are a defence of him as much as a record. What they are unusually good at
      is the texture of an operation going wrong: the failed assault on Aden in
      1513 is described in detail the author had no motive to invent, down to
      whose ladders broke and why. Read for the mechanics rather than the
      judgements, which are those of a man arguing his father's case against the
      Portuguese court. Out of copyright.

  - id: procopius-dewing
    kind: book
    author: Procopius of Caesarea
    title: "History of the Wars, Books I-II: The Persian War"
    translator: H. B. Dewing
    publisher: Loeb Classical Library
    year: 1914
    note: >-
      The secretary of Belisarius, writing in the 540s about a war he was
      present at, with a long digression on the Red Sea and the Arabian
      interior that is the only contemporary outside account of Roman dealings
      with Himyar and the tribes of central Arabia. He is well informed on what
      Constantinople decided and much less so on what happened at the far end
      of it, which is itself worth knowing. Out of copyright.

  - id: lyall-1885
    kind: book
    author: Charles James Lyall
    title: Translations of Ancient Arabian Poetry, Chiefly Pre-Islamic
    publisher: Williams and Norgate
    year: 1885
    note: >-
      A scholarly selection of pre-Islamic odes with an introduction on how the
      poetry reached us: the institution of the rawi, the eighth-century
      collectors, and the specific grounds for doubting some of what they
      transmitted. Cited here for the transmission rather than for the verse.
      Out of copyright.

  - id: miskawayh-margoliouth
    kind: book
    author: Miskawayh and Abu Shuja al-Rudhrawari
    title: "The Eclipse of the 'Abbasid Caliphate: Original Chronicles of the Fourth Islamic Century"
    translator: "H. F. Amedroz and D. S. Margoliouth"
    publisher: Basil Blackwell
    year: 1921
    note: >-
      Two Baghdad chronicles of the tenth century in translation, written by men
      with government careers who knew how the administration worked and say so
      in a register no court panegyric uses: what a campaign cost, what a
      negotiation was really about, which official was afraid of whom. Cited
      here for the Qarmatians as Baghdad experienced them. Out of copyright.

  - id: philby-1928
    kind: book
    author: H. St. John Philby
    title: Arabia of the Wahhabis
    publisher: Constable
    year: 1928
    note: >-
      The diaries of a British political officer attached to Ibn Sa'ud in 1918,
      published a decade later once the outcome was known. Philby had by then
      become a partisan of the man he was reporting on and an opponent of the
      Hashemite policy his own government had adopted, so his judgements of the
      sharifs should be read as advocacy. What he records verbatim — a
      conversation in a majlis, his own explanation of British motives to an
      Arabian court — is the value. Out of copyright.

  - id: burckhardt-1830
    kind: book
    author: John Lewis Burckhardt
    title: "Notes on the Bedouins and Wahábys, Collected During His Travels in the East"
    publisher: Henry Colburn and Richard Bentley
    year: 1830
    note: >-
      Published posthumously from the notebooks of a Swiss traveller who spent
      years in Arabia in Muslim dress and reached Mecca and Medina, gathering
      material on the Wahhabi state while it still existed and while the
      Egyptian war against it was being fought. He never got to the Najd, so
      the Diriyah material is second-hand — but it is collected from people who
      had been there, at the time, by somebody with no interest in the outcome,
      and it records the tax rates and the libraries as readily as the wars.
      Out of copyright.

  - id: palgrave-1865
    kind: book
    author: William Gifford Palgrave
    title: "Narrative of a Year's Journey Through Central and Eastern Arabia, 1862-63"
    publisher: Macmillan
    year: 1865
    note: >-
      A Jesuit of Jewish descent travelling under a false identity as a Syrian
      doctor, who reached Ha'il and Riyadh and spent weeks at the court of
      Faysal ibn Turki. He is the only detailed eyewitness of the second Saudi
      state at its height. He also detested Wahhabism, wrote to be read in
      London, and has been accused since of embroidering; his descriptions of
      places and arrangements are worth much more than his verdicts on people,
      which are frequently vicious. Out of copyright.

  - id: blunt-1881
    kind: book
    author: Lady Anne Blunt
    title: "A Pilgrimage to Nejd, the Cradle of the Arab Race"
    publisher: John Murray
    year: 1881
    note: >-
      Lady Anne and Wilfrid Blunt crossed the Nafud to Ha'il in the winter of
      1878-79 and stayed as guests of Muhammad ibn Rashid at the height of his
      power. They had gone to buy mares. She keeps the journal, records what
      people told her rather than what she concluded, and is explicit where the
      local account contradicts Palgrave's. Out of copyright.

  - id: cia-1963-yemen
    kind: report
    author: Central Intelligence Agency, Office of Current Intelligence
    title: "Current Intelligence Memorandum: The Situation in Yemen"
    year: 1963
    note: >-
      A four-page assessment written on 9 September 1963, declassified and
      released through the CIA's reading room. It is a working memorandum for
      American policymakers rather than a history: it says what the analysts
      thought was happening in the first year of the civil war, including where
      they were relying on UN estimates they doubted. Its judgements are those
      of a party with an interest in the outcome and its figures are estimates
      it labels as such. Cited for what the war looked like from outside while
      it was going on. A United States government work, in the public domain.

  - id: badger-1871
    kind: primary
    author: Salil ibn Razik
    title: "History of the Imâms and Seyyids of 'Omân, from A.D. 661-1856"
    translator: George Percy Badger
    publisher: Hakluyt Society
    year: 1871
    note: >-
      The Omani chronicle, in a translation with a long editorial introduction.
      Its provenance is part of its interest: the original manuscript was given
      to Badger at Muscat in 1860 by Sayyid Thuwayni, while Badger was sitting
      on the British commission that was about to divide Thuwayni's father's
      empire between him and his brother. Salil ibn Razik writes as an Ibadi
      partisan and calls the Portuguese polytheists; Badger annotates him as a
      Victorian churchman who thinks the sect fanatical. Read past both and it
      is the fullest continuous narrative any Arabian polity of this period
      left. Out of copyright.

  - id: polybius-shuckburgh
    kind: primary
    author: Polybius
    title: The Histories of Polybius
    translator: Evelyn S. Shuckburgh
    publisher: Macmillan
    year: 1889
    note: >-
      An Achaean statesman deported to Italy after Pydna as one of the thousand
      hostages, who spent seventeen years in Rome, became a friend of the
      Scipios, and wrote to explain to Greeks how the Romans had conquered the
      world in fifty-three years. He is a participant, a detainee and an admirer
      at once, which is why his account of Roman diplomacy is so much colder
      than his account of Roman virtue. Out of copyright.

  - id: appian-white
    kind: primary
    author: Appian of Alexandria
    title: "The Roman History of Appian of Alexandria, Volume II: The Foreign Wars"
    translator: Horace White
    publisher: Macmillan
    year: 1899
    note: >-
      A second-century Alexandrian who wrote Rome's history arranged by enemy
      rather than by year, so that each conquered people gets a continuous
      narrative from beginning to end. That structure makes him the best single
      source for the Mithridatic wars: he follows Pontus for forty-two years
      without cutting away. He is working from earlier accounts, mostly hostile
      ones, and preserves their figures without much scrutiny. Out of copyright.

  - id: josephus-whiston
    kind: primary
    author: Flavius Josephus
    title: "The Complete Works of Flavius Josephus"
    translator: William Whiston
    year: 1895
    note: >-
      A Jerusalem priest of Hasmonean descent who commanded in Galilee against
      Rome, surrendered, predicted Vespasian's accession, and spent the rest of
      his life in Rome writing the history of his own people for a Roman
      audience under Flavian patronage. Every one of those facts shows. He is
      the only continuous narrative source for the Hasmoneans and the Herods,
      and he is settling scores throughout. Whiston's eighteenth-century
      translation is the one that circulated. Out of copyright.

  - id: ammianus-yonge
    kind: primary
    author: Ammianus Marcellinus
    title: The Roman History of Ammianus Marcellinus
    translator: C. D. Yonge
    publisher: Bohn
    year: 1902
    note: >-
      A Greek-speaking staff officer of the Roman army writing in Latin in the
      380s, the last major historian of the empire before its western half went.
      His geographical digressions describe the provinces as an officer saw them
      — which cities were fortified, what the country produced, how it had been
      acquired — and are cited here for what the Nabataean kingdom had become
      two and a half centuries after it stopped existing. Out of copyright.

  - id: zosimus-1814
    kind: primary
    author: Zosimus
    title: The History of Count Zosimus
    publisher: "Printed for J. Davis"
    year: 1814
    note: >-
      A pagan Greek official of the imperial treasury writing about 500, whose
      declared purpose is the reverse of Polybius's: Polybius showed how Rome
      gained an empire in fifty-three years, and Zosimus means to show how it
      lost one. He blames the abandonment of the old rites and reads omens into
      everything, which is worth knowing before using him. What he preserves,
      including a circumstantial account of Aurelian's Palmyrene campaign that
      exists nowhere else in this form, is better than his explanations of it.
      This anonymous 1814 English translation is out of copyright.

  - id: villehardouin-smith
    kind: primary
    author: Geoffrey de Villehardouin
    title: "The Chronicle of Geoffry de Villehardouin, Marshal of Champagne and Romania, Concerning the Conquest of Constantinople"
    translator: T. Smith
    publisher: William Pickering
    year: 1829
    note: >-
      The marshal of Champagne was one of the six envoys who negotiated the
      shipping contract with Venice, was present at every stage of the Fourth
      Crusade, and dictated this account afterwards in French. It is the first
      substantial prose narrative in the language and the fullest eyewitness
      record of the conquest — written by a man who had been personally
      responsible for the decisions he is describing and who never once suggests
      that the expedition should have gone to Egypt as agreed. Out of copyright.

  - id: pears-1903
    kind: book
    author: Edwin Pears
    title: "The Destruction of the Greek Empire and the Story of the Capture of Constantinople by the Turks"
    publisher: Longmans, Green
    year: 1903
    note: >-
      A British barrister who lived in Constantinople for forty years and read
      the Greek, Italian and Turkish accounts against each other. He is
      thorough on the sources and closely translated from Kritovoulos and
      Sphrantzes, which is what he is used for here. His interpretative
      chapters are Victorian in the worst sense — sweeping judgements about
      races and churches — and are not borrowed from. Out of copyright.

  - id: procopius-vandalic
    kind: primary
    author: Procopius of Caesarea
    title: "History of the Wars, Books III-IV: The Vandalic War"
    translator: H. B. Dewing
    publisher: Loeb Classical Library
    year: 1916
    note: >-
      Belisarius's secretary was on the expedition that destroyed the Vandal
      kingdom, and this is the account of somebody who was standing there. He
      opens with a hundred years of Vandal history from Roman sources and then
      shifts into eyewitness reporting, and the change of register is visible.
      Out of copyright.

  - id: cassiodorus-hodgkin
    kind: primary
    author: Cassiodorus
    title: "The Letters of Cassiodorus, Being a Condensed Translation of the Variae Epistolae"
    translator: Thomas Hodgkin
    publisher: Henry Frowde
    year: 1886
    note: >-
      The official correspondence of the Ostrogothic kingdom, written by the man
      who ran it and published by him afterwards to demonstrate that his
      influence had always been exerted on the side of good government. It is
      therefore both the best source for how that state actually worked and a
      defence brief. Hodgkin condenses and paraphrases some letters and
      translates others in full, and his long biographical introduction is
      itself the standard account of Cassiodorus's career. Out of copyright.

  - id: gregory-brehaut
    kind: primary
    author: Gregory of Tours
    title: History of the Franks
    translator: Ernest Brehaut
    publisher: Columbia University Press
    year: 1916
    note: >-
      A Gallo-Roman bishop writing in the 580s about events partly within
      living memory. He is a Catholic writing about Arians and a partisan of the
      Frankish house, and the bias is not concealed: Goths flee "as was their
      custom" and city walls fall down when Clovis looks at them. What he
      preserves of what people said and did is worth having anyway, and the
      partisanship is itself evidence about the period. Out of copyright.

  - id: scott-1910
    kind: primary
    author: "The Visigothic Code (Forum Judicum)"
    title: "The Visigothic Code (Forum Judicum)"
    translator: S. P. Scott
    publisher: Boston Book Company
    year: 1910
    note: >-
      The Visigothic law in English, with a preface by its translator. Scott is
      an enthusiast whose admiration for his subject runs well past the
      evidence, and his rhapsodies about the Code's influence on all modern
      systems of government should be discounted heavily. His concrete
      statements about where and when the laws were still being applied are
      another matter, and are what is used here. Out of copyright.

  - id: paul-deacon-foulke
    kind: primary
    author: Paul the Deacon
    title: History of the Langobards
    translator: William Dudley Foulke
    publisher: University of Pennsylvania
    year: 1907
    note: >-
      The only narrative of the Lombard kingdom written by a Lombard, composed
      at Monte Cassino in the 780s by a man who had served the last king's
      daughter and then spent years at the court of the king who deposed her
      father. It breaks off at 744 and never reaches the end it was written
      after. Paul is two centuries from his early chapters and repeats saga
      where he has nothing better; Foulke's footnotes are relentless about
      saying so and are as useful as the text. Out of copyright.

  - id: einhard-turner
    kind: primary
    author: Einhard
    title: Life of Charlemagne
    translator: Samuel Epes Turner
    publisher: Harper and Brothers
    year: 1880
    note: >-
      A courtier's biography of an emperor he had served for over twenty years,
      written in the 820s on the frame of Suetonius and borrowing Suetonius's
      sentences outright in places. It is the source of nearly every familiar
      image of Charlemagne and it is a defence of the dynasty by a man with a
      position in it, which shows most in the opening pages on the kings the
      family displaced. Out of copyright.

  - id: trevelyan-1923
    kind: monograph
    author: G. M. Trevelyan
    title: Manin and the Venetian Revolution of 1848
    publisher: Longmans, Green
    year: 1923
    note: >-
      Trevelyan wrote it as the third of his Italian Risorgimento books and it
      is frankly a partisan's account, warm about Manin and cold about Austria.
      Its value here is the documentary work behind it: he read the Venetian
      municipal archive, the diaries and the Austrian side, and he cites them
      line by line, so the detail can be used even where the verdicts cannot.
      Out of copyright.

  - id: bryce-1889
    kind: monograph
    author: James Bryce
    title: The Holy Roman Empire
    publisher: Macmillan
    year: 1889
    note: >-
      Written as a prize essay in 1862 and expanded over forty years, with a
      supplementary chapter on the German empire of 1871 added while that empire
      was new. Bryce's constitutional judgements have been overtaken and his
      certainty that the medieval empire's failure was its failure to become a
      nation is exactly the reading later historians set out to overturn; he is
      used here for what he saw and reported, and his 1871 chapter is itself a
      piece of the story rather than an account of it. Out of copyright.

  - id: curtis-1912
    kind: monograph
    author: Edmund Curtis
    title: "Roger of Sicily and the Normans in Lower Italy, 1016-1154"
    publisher: G. P. Putnam's Sons
    year: 1912
    note: >-
      A narrative of the Hauteville conquest and Roger II's reign built directly
      on Amari and the Arabic sources alongside the Latin chroniclers, and
      unusually careful about saying which of them is being followed and where
      they disagree. It stops at Roger's death, so it carries nothing about the
      kingdom's last forty years. Out of copyright.

  - id: bent-1881
    kind: monograph
    author: J. Theodore Bent
    title: "Genoa: How the Republic Rose and Fell"
    publisher: C. Kegan Paul
    year: 1881
    note: >-
      A Victorian narrative history, and an openly partisan one: Bent finds the
      Genoese factions squalid, the Jacobins contemptible, and the republic's
      last three centuries a period he wishes could be struck from the record.
      Read past the verdicts and he is detailed and specific about the events of
      1796-97 and 1814-15, which are the years used here, and he prints what the
      participants said. Out of copyright.

  - id: forbes-1915
    kind: chapter
    author: Nevill Forbes
    title: Bulgaria
    container: "The Balkans: A History of Bulgaria, Serbia, Greece, Rumania, Turkey"
    publisher: Clarendon Press
    year: 1915
    note: >-
      Forbes wrote the Bulgarian and Serbian sections of a wartime Oxford
      volume, and the date shows: the book was published to explain the Balkans
      to a British public whose government was fighting in them, and its
      judgements about national character should be left alone. What it is good
      for is the sequence of the nineteenth-century revival, which Forbes sets
      out concretely — who funded the schools, when the church broke with
      Constantinople, what the Exarchate was — and the aftermath of 1018, where
      he is specific about what happened to the see at Ohrid. Out of copyright.

  - id: seton-watson-ballads
    kind: primary
    author: Serbian oral tradition
    title: Serbian Ballads
    translator: R. W. Seton-Watson
    publisher: Published for the Kossovo Day Committee
    year: 1916
    note: >-
      A threepenny pamphlet of the Kosovo and Marko Kraljević cycles, translated
      by a historian of the Habsburg lands and issued in London in June 1916 by
      a committee organising a British commemoration of the battle's five
      hundred and twenty-seventh anniversary while Serbia was under occupation.
      The ballads are centuries of oral tradition rather than evidence about
      1389; the pamphlet itself is evidence about 1916, which is why it is used
      here. Seton-Watson says frankly that they are untranslatable and that he
      has aimed at something recitable. Out of copyright.

  - id: ibn-battuta-lee
    kind: primary
    author: Ibn Battuta
    title: The Travels of Ibn Batuta
    translator: Samuel Lee
    publisher: Oriental Translation Committee
    year: 1829
    note: >-
      The earliest full English version, made from an abridgement rather than
      the complete Arabic text, so it is shorter and looser than the modern
      translations and its transliterations are eccentric. It is used here for
      the Anatolian chapters, where Ibn Battuta is describing what he walked
      through in about 1332 — a different sultan in every town, and the akhi
      brotherhoods that fed him in all of them. Out of copyright.

  - id: polo-yule
    kind: primary
    author: Marco Polo
    title: The Book of Ser Marco Polo
    translator: Henry Yule
    publisher: John Murray
    year: 1903
    note: >-
      Yule's third edition, revised by Henri Cordier. Polo's own text on Lesser
      Armenia and Turcomania is a page each and reads like a merchant's briefing
      note, which is what makes it useful: he says what was traded and who was
      paying tribute to whom. Yule's annotation is several times the length of
      the text and carries the nineteenth-century scholarship on the Cilician
      kingdom, including where its last king ended up. Out of copyright.

  - id: rumi-nicholson-1898
    kind: primary
    author: Jalal al-Din Rumi
    title: Selected Poems from the Divani Shamsi Tabriz
    translator: Reynold A. Nicholson
    publisher: Cambridge University Press
    year: 1898
    note: >-
      Nicholson's first book, with the Persian and the English facing and a
      commentary he later thought too free. The poems are the ghazals Rumi wrote
      under the name of Shams of Tabriz, at Konya, in the decades on either side
      of the Mongol conquest of the sultanate. Out of copyright.

  - id: ramsay-1890
    kind: monograph
    author: W. M. Ramsay
    title: The Historical Geography of Asia Minor
    publisher: John Murray, for the Royal Geographical Society
    year: 1890
    note: >-
      An attempt to fix the sites of every ancient city in Anatolia against the
      roads, the bishopric lists and the ground, by a man who had walked a great
      deal of it. His identifications have been revised in many places. What
      does not date is the incidental observation — which villages had which
      names in whose mouths in the 1880s — because he was recording it while it
      was still there to record. Out of copyright.

  - id: clavijo-markham
    kind: primary
    author: Ruy Gonzalez de Clavijo
    title: Narrative of the Embassy to the Court of Timour at Samarcand
    translator: Clements R. Markham
    publisher: Hakluyt Society
    year: 1859
    note: >-
      The journal of a Castilian embassy sent to Timur in 1403, kept by one of
      the ambassadors, who had no particular literary ambition and therefore
      wrote down what he was told and what things cost. He is used here for
      Trebizond, where the party wintered and where he reports the court gossip
      of a small empire without appearing to realise how damaging it is.
      Markham's notes are Victorian and occasionally wrong. Out of copyright.

  - id: nutuk-1929
    kind: primary
    author: Mustafa Kemal
    title: "A Speech Delivered by Ghazi Mustapha Kemal, President of the Turkish Republic, October 1927"
    publisher: K. F. Koehler
    year: 1929
    note: >-
      Thirty-six hours of speech delivered over six days to the congress of his
      own party, published in English two years later. It is the founder's
      account of how the Ottoman state was ended and the republic made, composed
      at the height of his power, and it is a work of self-justification by a man
      with no surviving rivals: everyone he quarrelled with is in it, and their
      side is not. Used here for what he says he did and why he says he did it,
      which is documentary regardless of whether the reasons are the real ones.
      Out of copyright.

  - id: burckhardt-nubia
    kind: primary
    author: John Lewis Burckhardt
    title: Travels in Nubia
    publisher: John Murray, for the African Association
    year: 1819
    note: >-
      Burckhardt went up the Nile in 1813 and 1814 disguised as a poor Syrian
      trader, on very little money, and wrote down the stages, the prices and the
      ruins. He had no interest in Christian Nubia and did not know what he was
      looking at when he passed it: the churches he notes on the hills are
      recorded as Greek because they were Christian and looked Byzantine to him.
      That incuriosity is what makes the observations useful, since he had no
      thesis to fit them to. Published posthumously. Out of copyright.

  - id: kebra-nagast-budge
    kind: primary
    author: "The Kebra Nagast"
    title: The Queen of Sheba and Her Only Son Menyelek
    translator: E. A. Wallis Budge
    publisher: Medici Society
    year: 1922
    note: >-
      The Ethiopian national epic, in the form assembled at Aksum in the early
      fourteenth century by a scribe named Isaac, with Budge's introduction and
      his summary of what Isaac believed he was doing. It is not evidence about
      Solomon or about the tenth century BC. It is first-rate evidence about what
      a fourteenth-century Ethiopian court wanted its dynasty's title to rest on,
      which is what it is used for here. Budge's translation is dated and his
      commentary more so. Out of copyright.

  - id: leo-africanus-pory
    kind: primary
    author: Leo Africanus
    title: The History and Description of Africa
    translator: John Pory
    publisher: Hakluyt Society
    year: 1896
    note: >-
      A Granada-born Moroccan diplomat, captured by corsairs and presented to
      Pope Leo X, who wrote his account of Africa in Italian in the 1520s from
      journeys made a decade or so earlier. Pory's 1600 English is the version
      given here. Leo is excellent on what he saw — prices, buildings, court
      protocol, what the caravans carried — and unreliable where he is repeating
      what he was told, which includes most of what he says about the religion
      of places he did not enter; his Bornu chapter describes as heathen a
      kingdom that had been Muslim for four centuries. Out of copyright.

  - id: bowdich-1819
    kind: primary
    author: T. Edward Bowdich
    title: Mission from Cape Coast Castle to Ashantee
    publisher: John Murray
    year: 1819
    note: >-
      The African Company's mission to Kumasi in 1817, written up by a
      twenty-six-year-old who spent several months there and drew and measured
      everything. He was negotiating on behalf of a trading company with an
      interest in the outcome, and his judgements about Asante intentions should
      be read with that in front of you. His descriptions are unusually exact,
      including of the human sacrifice he witnessed and would not soften. Out of
      copyright.

  - id: ibn-khaldun-de-slane
    kind: primary
    author: Ibn Khaldun
    title: >-
      Histoire des Berbères et des dynasties musulmanes de l'Afrique
      septentrionale
    translator: William MacGuckin de Slane
    publisher: Imprimerie du Gouvernement, Algiers
    year: 1852
    note: >-
      The narrative half of the work whose introduction is the Muqaddima, in the
      four-volume French translation made for the French army in Algeria. Cited
      here for the Almoravids, the Almohads and the Hafsids, where it is the
      fullest connected account there is and often the only one: Ibn Khaldun held
      office under the Hafsids, his own great-grandfather sat on the council that
      governed Seville in 1248, and for the fourteenth century he is a witness
      rather than a compiler. He is correspondingly partial — his Hafsid patrons
      are "our lord the sultan", the Arab tribes of the interior are wolves and
      dogs — and his transcribed dates go wrong often enough that de Slane
      corrects them in the notes. Out of copyright.

  - id: rousseau-1864
    kind: book
    author: Alphonse Rousseau
    title: "Annales tunisiennes, ou aperçu historique sur la régence de Tunis"
    publisher: Bastide, Algiers
    year: 1864
    note: >-
      A French consular interpreter's history of Ottoman Tunis, compiled from the
      Tunisian chroniclers Ibn Abi Dinar, al-Wazir and Hajj Husayn Khoja, whom he
      names as he goes. Cited here for the Ottoman capture of Tunis and the
      administration Sinan Pasha left behind it. Written in Algiers under the
      French occupation by a man in the service of it, and the contempt for what
      he is describing is on the surface rather than hidden; his figures come
      from his chroniclers and he prints the ones that disagree. Out of
      copyright.

  - id: ifrani-houdas
    kind: primary
    author: Muhammad al-Saghir al-Ifrani
    title: "Nozhet-elhâdi: histoire de la dynastie saadienne au Maroc, 1511-1670"
    translator: Octave Houdas
    publisher: Ernest Leroux, Paris
    year: 1889
    note: >-
      A Moroccan scholar's history of the Saadis, written at Marrakesh around
      1720 under the dynasty that replaced them, in Houdas's French. It is the
      fullest Moroccan account of the sixteenth century and the only connected
      one for several stretches of it, and it is a court history twice over —
      al-Ifrani admires the Saadis and serves the Alawis, so the Wattasids are
      usurpers, the Alawis arrive as deliverance, and sultans are addressed in
      the vocabulary of lions and eagles. He is also a biographer of scholars
      and saints before he is a chronicler of campaigns, which is why the best
      material in him is what jurists said to sultans. Out of copyright.

  - id: tarikh-es-soudan-houdas
    kind: primary
    author: Abd al-Rahman al-Sadi
    title: Tarikh es-Soudan
    translator: Octave Houdas
    publisher: Ernest Leroux, Paris
    year: 1900
    note: >-
      A Timbuktu chronicle finished about 1655 by a man who held office under
      the Moroccan pashalik and whose family lived through its arrival. For the
      Songhai empire and the Moroccan conquest of 1591 it is the central
      source and a local one: al-Sadi is writing about the destruction of his
      own city's world by a government he then worked for, which shows in what
      he chooses to record and in what he declines to say plainly. Out of
      copyright.

  - id: barbosa-dames
    kind: primary
    author: Duarte Barbosa
    title: The Book of Duarte Barbosa
    translator: Mansel Longworth Dames
    publisher: Hakluyt Society
    year: 1918
    note: >-
      A Portuguese official who spent years in India as a factor and interpreter
      and compiled, about 1518, a description of every coast from the Cape to
      China. He is very good on what a port contained, what it traded and who
      it obeyed, and for the East African towns he is the first outsider to
      describe them after the Portuguese arrival — which is also the limit of
      him: the sackings are reported as the just consequence of a king's
      arrogance, and the interior he gives at second hand from the Sofala
      traders. Dames's notes are a separate authority and are cited as his where
      used. Out of copyright.

  - id: theal-records-vi
    kind: primary
    title: "Records of South-Eastern Africa, volume VI"
    author: George McCall Theal
    publisher: Government of the Cape Colony
    year: 1900
    note: >-
      A nine-volume collection of Portuguese and Dutch documents on the region,
      translated and printed for the Cape government; volume VI opens with the
      extracts from Joao de Barros's Da Asia that contain the earliest written
      description of a zimbabwe, published in 1552 from reports Barros never saw
      himself. Theal is a colonial historiographer of the 1890s and his own
      commentary carries the assumptions of that office, which is a reason to
      use the documents he printed rather than the frame he printed them in.
      Out of copyright.

  - id: orkhon-ross
    kind: primary
    author: Bilge Qaghan and Yolig Tegin
    title: "The Orkhon Inscriptions"
    translator: E. Denison Ross
    publisher: "Bulletin of the School of Oriental Studies, vol. V"
    year: 1930
    note: >-
      The memorial stones raised in the Orkhon valley in 732 and 735 for Kul
      Tegin and Bilge Qaghan, in Ross's English of Thomsen's final Danish
      rendering. They are the oldest substantial texts in any Turkic language
      and the only place a steppe empire of this period speaks at length in its
      own voice — which is exactly what has to be watched: the text is a
      qaghan's address to his own people, justifying his house, blaming its
      subjects for its collapse and warning them off the Chinese, and every
      campaign in it is a victory. Thomsen's readings carry a good many
      bracketed queries and they are kept here. Out of copyright.

  - id: bretschneider-1888
    kind: primary
    author: Emil Bretschneider
    title: "Mediaeval Researches from Eastern Asiatic Sources, volume I"
    publisher: Trubner
    year: 1888
    note: >-
      A Russian legation physician in Peking who translated the Chinese sources
      on Inner Asia in full and annotated them against the Persian and Arabic
      ones. Cited here for his complete rendering of the Liao shi's account of
      Yelu Dashi, which is the Qara Khitai founding as the dynasty's own
      successor state told it. Bretschneider is a translator rather than an
      interpreter and says so; his identifications of tribal names are
      nineteenth-century guesses and are flagged as such in his notes. Out of
      copyright.

  - id: bushell-1880
    kind: primary
    author: S. W. Bushell
    title: "The Early History of Tibet, from Chinese Sources"
    publisher: "Journal of the Royal Asiatic Society, new series vol. XII"
    year: 1880
    note: >-
      A translation of the Tibetan chapters of the Tang histories, with the
      embassies, campaigns and treaty texts in full. It is the fullest
      continuous narrative of the empire in any language other than Tibetan and
      it is entirely a Chinese court's account of a rival: Tibetan victories
      appear as frontier disturbances, Tibetan envoys arrive to submit, and the
      chronology follows the reign years of the dynasty being attacked. Out of
      copyright.

  - id: masudi-meynard
    kind: primary
    author: al-Masudi
    title: "Les Prairies d'or, volume II"
    translator: Barbier de Meynard and Pavet de Courteille
    publisher: Imprimerie Impériale, Paris
    year: 1863
    note: >-
      A Baghdadi geographer and traveller writing in 943, in the French
      translation printed with the Arabic. His chapter on the Caucasus and the
      Caspian is the fullest contemporary description of the Khazar state there
      is: the capital, the confessional courts, the Muslim guard and the terms
      of its service. He did not go to Atil himself and says where he is
      reporting rather than observing; he is also a compiler who prints what he
      was told and leaves inconsistencies standing. Out of copyright.
