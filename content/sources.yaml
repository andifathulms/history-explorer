# Every source cited anywhere in this repository. A `source:` field elsewhere
# must be an id in this file. Hard rule 1: no invented citations. If a work is
# not listed here and the author cannot open it, the value it would have
# supported is null and the gap renders.
#
# `kind` drives nothing in the UI yet; it is here so a later pass can separate
# reference works from monographs from datasets.

sources:
  # ---- Reference works, general ----
  - id: bosworth-1996
    kind: reference
    author: C. E. Bosworth
    title: "The New Islamic Dynasties: A Chronological and Genealogical Manual"
    publisher: Edinburgh University Press
    year: 1996
    note: >-
      The spine for regnal dates and dynastic spans throughout. Where this
      repository gives a span as a single year, it is usually Bosworth's.

  - id: chi-4
    kind: reference
    author: R. N. Frye (ed.)
    title: "The Cambridge History of Iran, Volume 4: From the Arab Invasion to the Saljuqs"
    publisher: Cambridge University Press
    year: 1975

  - id: chi-5
    kind: reference
    author: J. A. Boyle (ed.)
    title: "The Cambridge History of Iran, Volume 5: The Saljuq and Mongol Periods"
    publisher: Cambridge University Press
    year: 1968

  - id: kennedy-2004
    kind: monograph
    author: Hugh Kennedy
    title: "The Prophet and the Age of the Caliphates: The Islamic Near East from the Sixth to the Eleventh Century"
    edition: 2nd
    publisher: Pearson Longman
    year: 2004

  # ---- Monographs, per dynasty ----
  - id: bosworth-1963
    kind: monograph
    author: C. E. Bosworth
    title: "The Ghaznavids: Their Empire in Afghanistan and Eastern Iran, 994-1040"
    publisher: Edinburgh University Press
    year: 1963

  - id: bosworth-1977
    kind: monograph
    author: C. E. Bosworth
    title: "The Later Ghaznavids: Splendour and Decay. The Dynasty in Afghanistan and Northern India, 1040-1186"
    publisher: Edinburgh University Press
    year: 1977

  - id: bosworth-1994
    kind: monograph
    author: C. E. Bosworth
    title: "The History of the Saffarids of Sistan and the Maliks of Nimruz (247/861 to 949/1542-3)"
