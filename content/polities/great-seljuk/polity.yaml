id: great-seljuk
region: iranian-intermezzo
name:
  latin: Great Seljuk Empire
  script: سلجوقیان بزرگ
  script_lang: fa

span:
  start: { min: 1037, max: 1040, source: bosworth-1996, max_source: iranica-saljuqs }
  end: { min: 1194, max: 1194, source: bosworth-1968 }

identity: >-
  A Turkmen dynasty out of the Oghuz steppe that took Iran and Iraq, held the
  Abbasid caliph as the Buyids had, and made the sultanate a durable institution.

capitals:
  - { name: Nishapur, from: 1037, to: 1043, source: iranica-saljuqs }
  - { name: Rayy, from: 1043, to: 1051, source: iranica-saljuqs }
  - { name: Isfahan, script: اصفهان, from: 1051, source: bosworth-1968 }

core_region: Iran, Iraq and Anatolia

rulers:
  founder:
    name: Tughril I
    script: طغرل بیگ
    reign: [1037, 1063]
    source: bosworth-1996
  peak:
    name: Malik-Shah I
    script: ملکشاه
    reign: [1072, 1092]
    source: bosworth-1968
  last:
    name: Tughril III
    script: طغرل سوم
    reign: [1176, 1194]
    source: bosworth-1996

scripts_and_languages:
  administration: [Persian, Arabic]
  writing_system: Perso-Arabic

ended:
  type: conquest
  by: [khwarazmian]
  year: 1194
  source: bosworth-1968

institutions:
  military_basis: { values: [tribal-levy, land-grant], source: bosworth-1968 }
  revenue_basis: { values: [land-tax], source: bosworth-1968 }
  # Territory appanaged to brothers, sons and nephews, each young prince with
  # an atabeg as guardian running the province in his name. It worked while a
  # strong sultan could arbitrate and inverted with total predictability when
  # one could not: the Zangids, Eldiguzids and Salghurids all begin as
  # guardians of Seljuk children.
  succession_rule: { values: [appanage], source: bosworth-1968 }
  # The caliph's grant, and under the Seljuks it stopped being an honorific
  # attached to a particular strongman: the sultanate became a standing office
  # with a chancery and a defined relationship to the caliphate, each party
  # legitimating the other.
  legitimation: { values: [caliphal-investiture], source: bosworth-1968 }

turning_points:
  - year: 1040
    type: battle
    name: "Dandanaqan"
    changed: >-
      One battle transferred the richest province in the eastern Islamic world
      from a dynasty at the height of its administrative sophistication to a
      confederation with none, and Tughril Beg was proclaimed ruler of
      Khurasan. The Ghaznavid state did not fail with it; it went on
      functioning in India for another century and a half.
    source: iranica-saljuqs
    contested: false

  - year: 1055
    type: reform
    name: "Tughril takes the sultanate"
    changed: >-
      The caliph granted a title to the man who had just taken his city, which
      had happened before — but under the Seljuks sultan stopped being an
      honorific attached to a strongman and became a standing office with a
      chancery, a succession and a settled division of labour: religious
      authority to the caliph, temporal power to the sultan, each legitimating
      the other. That arrangement outlived every polity that used it.
    source: bosworth-1968
    contested: false
  - year: 1071
    type: battle
    name: "Manzikert"
    changed: >-
      Alp Arslan destroyed a Byzantine army and captured the emperor in a
      battle he had not sought, while campaigning the other way. What followed
      was not the loss of an army but the collapse of the Anatolian frontier
      settlement during a decade of Byzantine civil war, into which the Turkmen
      already pressing on it moved — producing a Turkish sultanate at Nicaea
      within twenty years, a Byzantine appeal west that became the First
      Crusade, and an Anatolia that has been Turkish-speaking since.
    source: bosworth-1968
    contested: false
  - year: 1092
    type: succession-crisis
    name: "Nizam al-Mulk and Malik-Shah die a month apart"
    changed: >-
      The vizier who had built and run the administration for thirty years was
      assassinated, and the sultan he had managed died within the month. An
      empire held as a family possession, with no rule for choosing between
      claimants and a generation of princes each with an atabeg of his own,
      never had a single undisputed ruler again.
    source: bosworth-1968
    contested: false

measures:
  reach_km2: { value: 3900000, at: 1080, source: taagepera-1997 }
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: iranica-saljuqs }
    religions_carried:
      count: 1
      items: [Sunni Islam]
      source: bosworth-1968
    # Two polities publicly styled themselves the continuation of the Seljuk
    # sultanate: the Rum branch in Anatolia, and the Khwarazmshahs, who took the
    # sultanate's titulature after destroying its holder. Both are claims in the
    # coding rules' sense, and the second is a claim on a polity the claimant
    # had just extinguished.
    successor_claims:
      count: 2
      items: [Sultanate of Rum, khwarazmian]
      source: bosworth-1968
