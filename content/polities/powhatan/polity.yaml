id: powhatan
region: eastern-woodlands

name:
  latin: Powhatan Confederacy
  script: null
  script_lang: null

span:
  # smith-1624 finds Powhatan already ruling an established paramount
  # chiefdom over some thirty subject tribes when the English arrive
  # in 1607; the confederacy's own founding predates the source's own
  # narrative, which begins with Smith's own capture and presentation
  # before Powhatan that same year.
  start: { min: 1607, max: 1607, source: smith-1624 }
  # campbell-virginia-1860 dates the October 1646 treaty with
  # Necotowance, Opechancanough's successor, which subordinated the
  # confederacy to the English crown - the point this record treats
  # as the end of its own independence.
  end: { min: 1646, max: 1646, source: campbell-virginia-1860 }

identity: >-
  A paramount chiefdom of some thirty Tidewater tribes that answered a
  colony's arrival with a captive's ransom, a daughter's marriage, and
  two coordinated mornings of killing a generation apart, before its
  last ruler died a captive's death and his successor bought peace
  with tribute and the crown's own authority.

capitals:
  - { name: Werowocomoco, to: 1609, source: smith-1624 }

core_region: The Tidewater region of Virginia, between the James and Potomac rivers

rulers:
  founder: { name: "Powhatan", source: smith-1624 }
  peak: { name: "Powhatan", source: smith-1624 }
  # campbell-virginia-1860 dates Opechancanough's capture by Sir
  # William Berkeley, his death at Jamestown about a fortnight later,
  # shot by one of his own guards, and the treaty his successor
  # Necotowance signed that October - all to 1646, though the source
  # gives no more precise date for the capture or death themselves.
  last: { name: "Opechancanough", source: campbell-virginia-1860 }

scripts_and_languages:
  administration: [Powhatan]
  writing_system: null

institutions:
  military_basis: { values: [tribal-levy], source: smith-1624 }
  revenue_basis: { values: [tribute], source: smith-1624 }
  # smith-1624 records Powhatan succeeded by his brother Itopatin, and
  # then by another brother, Opechancanough - descent through
  # brothers rather than sons, consistent with the matrilineal
  # succession customary among the Powhatan's own royal line.
  succession_rule: { values: [matrilineal], source: smith-1624 }
  legitimation: { values: [descent], source: smith-1624 }

preceded_by_external: []

succeeded_by_external:
  - name: Necotowance's tributary chieftainship
    type: vassal of
    year: 1646
    note: >-
      Styled "King of the Indians" rather than the confederacy's own
      paramount title, Necotowance agreed by treaty to hold his
      authority from the English crown, cede the land between the
      York and James rivers, and pay an annual tribute of twenty
      beaver skins - a subordinate chieftainship rather than the
      independent confederacy it replaced.
    source: campbell-virginia-1860

ended:
  type: conquest
  by: []
  year: 1646
  source: campbell-virginia-1860

turning_points:
  - year: 1607
    type: capital-move
    name: "Smith brought before Powhatan at Werowocomoco"
    changed: >-
      Captured while exploring the Chickahominy and brought before
      Powhatan's court, John Smith was, by his own account, saved from
      execution by Powhatan's daughter Pocahontas - the first
      sustained direct contact between the paramount chiefdom's own
      ruler and the new English colony, and the beginning of a
      relationship neither side would manage to keep settled for long.
    source: smith-1624
    contested: true
  - year: 1613
    type: siege
    name: "Pocahontas taken captive"
    changed: >-
      Lured aboard an English ship and held for ransom during a war
      that had already run for several years, Pocahontas gave the
      colony a hostage valuable enough to force Powhatan to the
      negotiating table, ending the fighting even though Powhatan
      himself refused to appear in person to settle the terms.
    source: smith-1624
    contested: false
  - year: 1614
    type: treaty
    name: "Pocahontas married to John Rolfe"
    changed: >-
      Powhatan's rapid consent to his daughter's marriage - he sent
      an uncle and two of his own sons within ten days to stand as his
      deputies at the wedding - secured a peace confirmed by both
      Powhatan and Opechancanough and brought the neighbouring
      Chickahominy into alliance with the colony as well.
    source: smith-1624
    contested: false
  - year: 1618
    type: succession-crisis
    name: "Powhatan dies; Itopatin succeeds"
    changed: >-
      Powhatan died in April 1618, and his brother Itopatin succeeded
      him with Opechancanough's own confirmation of the English
      league - but it was Opechancanough, not the new nominal
      paramount chief, who held the real initiative in the
      confederacy's dealings with the colony from this point on.
    source: smith-1624
    contested: false
  - year: 1622
    type: catastrophe
    name: "The massacre of March 22"
    changed: >-
      After weeks of deliberately maintained trust following the
      killing of the warrior Nemattanow, Opechancanough's warriors
      struck every outlying plantation on the same morning, killing
      three hundred and forty-seven English men, women and children in
      a single coordinated attack that ended a decade of uneasy peace
      and opened a war Smith's own narrative does not live to see the
      end of.
    source: smith-1624
    contested: false
  - year: 1644
    type: catastrophe
    name: "The second massacre"
    changed: >-
      On the 18th of April, Opechancanough's warriors struck the
      colony a second time; the attack's first advantage went
      unfollowed, and the colonists rallied, gathered their cattle,
      and organized a war of reprisal that gave the now-ancient
      Opechancanough no chance to strike a third time.
    source: campbell-virginia-1860
    contested: false
  - year: 1646
    type: treaty
    name: "Necotowance's treaty subordinates the confederacy"
    changed: >-
      Captured by Sir William Berkeley too infirm to walk and shot dead
      in custody by one of his own guards a fortnight later,
      Opechancanough was succeeded by Necotowance, who that October
      agreed by treaty to hold his authority from the English crown,
      cede the land between the York and James rivers, and pay an
      annual tribute - ending the confederacy's own independence.
    source: campbell-virginia-1860
    contested: false

