id: basotho-kingdom
region: southern-african-kingdoms

name:
  latin: Basotho Kingdom
  # casalis-basutos-1861 gives the Sesotho terms Mosuto (one person),
  # Basuto (the people), Lesuto (the country) and Sesuto (the
  # language) in Latin transliteration only; no source consulted for
  # this record supplies an original script.
  script: null
  script_lang: null

# casalis-basutos-1861 dates the collapse of the old order among the
# Sotho chiefdoms - the point at which scattered, loosely federated
# communities became, under pressure of the wider Difaqane, a single
# kingdom built around Moshoeshoe's own leadership - to 1820.
span:
  start: { min: 1820, max: 1820, source: casalis-basutos-1861 }
  # theal-1908-v4 dates Moshoeshoe's death at Thaba Bosiu to 11 March
  # 1870, two years after the 12 March 1868 proclamation that made the
  # Basuto British subjects - the last point either source consulted
  # here reaches.
  end: { min: 1870, max: 1870, source: theal-1908-v4 }

identity: >-
  A federation of Sotho chiefdoms shattered by wars Shaka's conquests
  set loose, rebuilt around one mountain stronghold by a chief who
  suppressed cannibalism with a sentence rather than an army, and who
  secured his people's survival, in old age, by trading sovereignty
  for a British protectorate.

capitals:
  - { name: Thaba Bosiu, source: casalis-basutos-1861 }

core_region: The Caledon River valley and Maloti mountains of present-day Lesotho

rulers:
  founder: { name: Moshoeshoe, source: casalis-basutos-1861 }
  peak: { name: Moshoeshoe, source: casalis-basutos-1861 }
  # theal-1908-v4 records that in his final years Moshoeshoe's own
  # power had already passed to his sons Letsie, Molapo and Masupha,
  # who governed their own followers without reference to him; he
  # died at Thaba Bosiu on 11 March 1870, four months after sending
  # Queen Victoria a kaross as thanks for the protectorate.
  last: { name: Moshoeshoe, source: theal-1908-v4 }

scripts_and_languages:
  administration: [Sesotho]
  writing_system: null

institutions:
  military_basis: { values: [tribal-levy], source: casalis-basutos-1861 }
  revenue_basis: { values: [tribute], source: casalis-basutos-1861 }
  succession_rule: null
  legitimation: { values: [descent], source: casalis-basutos-1861 }

preceded_by_external: []

succeeded_by_external: []

# Neither source narrates an institutional end. The kingdom became a
# British protectorate, Basutoland, on 12 March 1868, continued under
# it long past Moshoeshoe's own 1870 death, and survives today as the
# independent Kingdom of Lesotho - a continuation, not an ending.
ended: null

turning_points:
  - year: 1820
    type: catastrophe
    name: "The old order collapses"
    changed: >-
      Shaka's own conquests in Natal drove the defeated Matiwane west
      with thousands of followers, setting off a chain of displacement
      that turned the settled, loosely federated Sotho chiefdoms into
      a landscape of war and eventual famine - the crisis around which
      Moshoeshoe built a single kingdom out of what had been scattered
      chiefdoms.
    source: casalis-basutos-1861
    contested: false
  - year: 1833
    type: conversion
    name: "Missionaries arrive at Moshoeshoe's own request"
    changed: >-
      Having sent oxen with a standing request for "a man of prayer,"
      Moshoeshoe received the first Paris Evangelical Missionary
      Society delegates at Thaba Bosiu - opening a direct channel
      between the Basotho kingdom and the colonial world whose
      encroachment would define the rest of his reign.
    source: casalis-basutos-1861
    contested: false
  - year: 1868
    type: treaty
    name: "Basutoland proclaimed British territory"
    changed: >-
      After years of Moshoeshoe's own repeated requests, and with Free
      State commandos still in the field against him, the high
      commissioner proclaimed the Basuto British subjects and their
      country British territory on the 12th of March - trading the
      independence the kingdom had defended since its founding for
      protection against a war it could no longer contain alone.
    source: theal-1908-v4
    contested: false
  - year: 1870
    type: catastrophe
    name: "Death of Moshoeshoe"
    changed: >-
      Four months after sending Queen Victoria a kaross of panther
      skins as thanks for the protectorate, Moshoeshoe died at Thaba
      Bosiu on the 11th of March, his own authority over his people
      already passed in practice to his sons - a death colonial
      newspapers scarcely noticed, though the Basotho themselves
      turned within moments toward regarding him as a protecting
      ancestral spirit.
    source: theal-1908-v4
    contested: false

measures:
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: casalis-basutos-1861 }
    religions_carried: { count: 1, items: [Christianity], source: casalis-basutos-1861 }
