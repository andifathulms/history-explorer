turning_points:
  - year: 1501
    type: conversion
    name: "The Shi’i decree at Tabriz"
    changed: >-
      Twelver Shi'ism was declared the religion of an overwhelmingly Sunni
      country and enforced, changing the confession of a large settled
      population within roughly a century by importing a clergy that did not
      previously exist there — and making the wars that followed the first
      sustained confessional conflict between two great Muslim powers.
    source: newman-2006
    contested: false

