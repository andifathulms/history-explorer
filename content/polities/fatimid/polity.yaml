id: fatimid
region: caliphates

name:
  latin: Fatimid Caliphate
  script: الخلافة الفاطمية
  script_lang: ar

span:
  start: { min: 909, max: 909, source: halm-1996 }
  end: { min: 1171, max: 1171, source: brett-2017 }

identity: >-
  The Isma'ili Shi'i counter-caliphate: the only rival that claimed the office
  itself rather than a province, and held Egypt for two centuries doing it.

