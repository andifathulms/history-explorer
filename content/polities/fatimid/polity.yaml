id: fatimid
region: caliphates

name:
  latin: Fatimid Caliphate
  script: الخلافة الفاطمية
  script_lang: ar

span:
  start: { min: 909, max: 909, source: halm-1996 }
  end: { min: 1171, max: 1171, source: brett-2017 }

identity: >-
  The Isma'ili Shi'i counter-caliphate: the only rival that claimed the office
  itself rather than a province, and held Egypt for two centuries doing it.

capitals:
  - { name: Mahdiyya, from: 921, to: 973, source: halm-1996 }
  - { name: Cairo, script: القاهرة, from: 973, source: brett-2017 }

core_region: Ifriqiya, then Egypt

rulers:
  founder: { name: Abd Allah al-Mahdi, reign: [909, 934], source: halm-1996 }
  peak: { name: al-Mustansir, reign: [1036, 1094], source: brett-2017 }
  last: { name: al-Adid, reign: [1160, 1171], source: brett-2017 }

scripts_and_languages:
  administration: [Arabic]
  writing_system: Arabic

ended:
  type: internal usurpation
  by: [ayyubid]
  year: 1171
  source: humphreys-1977

institutions:
  # Kutama Berber tribal contingents raised by the da'wa took Ifriqiya and then
  # Egypt; from the eleventh century the army was Turkish and Sudanese
  # regiments recruited separately and loyal separately, which is what fought
  # itself through Cairo during the shidda.
  military_basis: { values: [tribal-levy, slave-soldier], source: brett-2017 }
  # The Nile, and a Red Sea and Indian Ocean trade deliberately cultivated as
  # an alternative to the Gulf routes running through Abbasid Iraq. The Geniza
  # chapter is that second half of the coding documented from the inside.
  revenue_basis: { values: [land-tax, trade-toll], source: brett-2017 }
  # Nass: the imam designates his successor, and the designation is doctrine
  # rather than practice. That is why the disputed succession of 1094 did not
  # merely divide a dynasty but split the mission permanently.
  succession_rule: { values: [nomination], source: halm-1996 }
  # Descent from Fatima and Ali, and the imamate that descent carries. Not
  # caliphal-investiture and not election: the whole Fatimid claim is that the
  # office belongs to a line by right and that Baghdad holds it by usurpation.
  legitimation: { values: [descent, divine-sanction], source: halm-1996 }

turning_points:
  - year: 969
    type: capital-move
    name: "The founding of Cairo"
    changed: >-
      Moving the centre from Ifriqiya to Egypt reoriented the whole
      enterprise: a state that had spent sixty years fighting westward, into
      the Maghreb and against Kharijite revolt, became one whose interests ran
      east and north instead, toward Syria, the Hijaz and the Indian Ocean
      trade. Ifriqiya, the dynasty's own birthplace, was left to a hereditary
      governor and drifted out of the caliph's name within a century.
    source: brett-2017
    contested: false

  - year: 1065
    type: catastrophe
    name: "The shidda"
    changed: >-
      For the first time since 909 the caliphate could not govern itself out
      of its own resources or its own household: what broke was not a
      province or an army defeated in the field but the state's own capacity
      to pay and control the men who worked for it. Every later Fatimid
      crisis, down to 1171, is a version of the same failure recurring in the
      same city.
    source: brett-2017
    contested: false
  - year: 1074
    type: reform
    name: "Badr al-Jamali's vizierate"
    changed: >-
      What Badr took was not just the government but the mission itself — the
      da'wa answered to his household from this point on, which meant the one
      thing that had always separated this caliphate from a captive Abbasid
      one, an independent religious authority propagating its own claim, now
      ran through the same office that ran the army and the courts. The
      caliph kept his life and his title. He did not keep the thing that made
      the title worth having.
    source: brett-2017
    contested: false
  - year: 1094
    type: succession-crisis
    name: "The Nizari schism"
    changed: >-
      This was not a succession dispute in the ordinary sense, settled once
      one side held the throne. The claim was doctrinal — which line of
      descent actually carried the imamate — which is why the losing side did
      not simply lose and go home: it kept the belief and organised around
      it. The Nizari Ismailis who trace themselves to the losing claimant
      still exist today, led by an unbroken line of hereditary imams.
    source: brett-2017
    contested: false
  - year: 1099
    type: siege
    name: "The loss of Jerusalem"
    changed: >-
      This is also the last time a Fatimid army fought to hold ground rather
      than to slow its loss. Every later campaign in this dynasty's history is
      a defensive one, aimed at the ports and the delta rather than at
      recovering anything, and the vizier who commanded that defence is the
      office the dynasty's last crisis runs through.
    source: brett-2017
    contested: false

measures:
  reach_km2: { value: 4100000, at: 969, source: taagepera-1997 }
  peak_population: null
  influence:
    descendant_scripts: { count: null, items: [], source: null }
    religions_carried:
      count: 1
      items: [Isma'ili Shi'ism]
      source: brett-2017
    # The Sulayhids of Yemen ruled in the Fatimid caliph's name and the Nizari
    # and Musta'li lines both continue the imamate, but neither is a later
    # polity publicly claiming a predecessor's legitimacy: the first is
    # subordination to a living contemporary and the second is a continuing
    # religious hierarchy rather than a state. Null, because no consulted
    # source addresses the question in the terms the coding rules require.
    successor_claims: { count: null, items: [], source: null }
