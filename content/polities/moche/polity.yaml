turning_points:
  - year: 300
    type: reform
    name: Two pyramids on the plain
    changed: >-
      On a dry plain between the Cerro Blanco hill and the Moche river,
      a few kilometers from the Pacific, the site's builders raised the
      Huaca del Sol, a massive freestanding earthen pyramid, and the
      smaller, terraced Huaca de la Luna against the hillside. Max Uhle's
      1899 excavations there, and the type collection of pottery he
      recovered, gave the whole culture its modern name.
    source: kroeber-trujillo-1926
    contested: false
  - year: 900
    type: reform
    name: A revolt of the artifacts
    changed: >-
      Polychrome murals uncovered on the inner walls of the Huaca de la
      Luna - first glimpsed by Eduard Seler in 1910 and much more fully
      exposed in 1925-26 - depict a battle between human figures and
      personified weapons and tools, a "revolt of the artifacts" myth
      also recorded elsewhere in ancient Mexico. Painted in red, yellow,
      pink and light blue on whitewashed adobe, the scenes are the
      clearest surviving record of Mochica narrative art on the walls
      of one of its own temples.
    source: kroeber-peru-1930
    contested: false

