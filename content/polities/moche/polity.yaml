# No source consulted for this record gives calendar dates for the Mochica
# period from stratigraphy or dynastic record; nothing of the kind survives
# for a nonliterate culture. collier-viru-1955 cites Wendell Bennett's 1949
# estimate - the working chronology of the field at the time of writing,
# arrived at from stratigraphic and geological evidence before radiocarbon
# dating was available - which places the Gallinazo and Mochica cultural
# period at approximately A.D. 300 to 1000.
span:
  start: { min: 300, max: 300, source: collier-viru-1955 }
  end: { min: 1000, max: 1000, source: collier-viru-1955 }

identity: >-
  The major culture of Peru's north coast before Chimor, known for two
  great earthen pyramids at the type site of Moche, polychrome murals of
  a myth in which weapons and tools rise up against their makers, and
  fine painted pottery depicting its own world in detail.

