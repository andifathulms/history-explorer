turning_points:
  - year: 1268
    type: treaty
    name: "The Talas agreement"
    changed: >-
      Qaidu, an Ögedeid prince with his own claim to the Great Khanship,
      offered peace to the defeated Chagatayid khan Baraq rather than
      finishing him - splitting Transoxiana's revenue between them and
      securing, in the same stroke, an implicit recognition from a reigning
      Chagatai khan that Qaidu himself was the Mongols' rightful sovereign.
      From Baraq's death a few years later until his own in 1301, Qaidu
      ruled the whole khanate through a rapid succession of client khans he
      installed and replaced himself.
    source: howorth-1876
    contested: false
  - year: 1306
    type: succession-crisis
    name: "Dua absorbs Chapar's own khanate"
    changed: >-
      Qaidu's own loyal partner for three decades turned on his patron's
      son within a year of managing his succession, destroyed Chapar's army
      in a coordinated attack with the Yuan he had once fought alongside
      Qaidu against, and quietly absorbed most of Chapar's own territory
      after receiving him as a defeated refugee. It ended the house of
      Ögödei as a territorial power and left the Chagatai line in sole
      possession of the throne Qaidu had spent a lifetime deciding who
      could sit on.
    source: howorth-1876
    contested: false
  - year: 1334
    type: succession-crisis
    name: "Tarmashirin deposed by the annual assembly"
    changed: >-
      Tarmashirin, a settled, law-abiding Muslim khan who governed
      from Transoxiana, abolished the annual assembly at which
      Chinggisid nobles reviewed the khan's own conduct and could
      depose him for breaking the yasak. The eastern amirs of the
      steppe did exactly what the abolished institution had once
      allowed them to do anyway: they assembled without him, deposed
      him, hunted him down and killed him. Not a religious quarrel -
      his own successors turned Muslim within a generation - but a
      verdict on governing from the wrong place, through the wrong
      people, in a way that made the amirs' own consent unnecessary.
    source: ibn-battuta-lee
    contested: false
  - year: 1347
    type: succession-crisis
    name: "Qazan Khan killed, the khanate splits for good"
    changed: >-
      Qazan Khan was killed in battle by his own amirs, and no khan
      afterward ruled both halves of the khanate again. In the west
      the amir Qazghan took power without the title, ruling through a
      Chinggisid figurehead - the arrangement Timur would later
      inherit and perfect. In the east the Dughlat amirs installed a
      boy said to be the old khan's own son and built Moghulistan
      around him. The fracture Tarmashirin's 1334 deposition had
      opened thirteen years earlier finally split the country in two.
    source: biran-1997
    contested: false

