id: atropatene
region: pre-islamic-iran

name:
  latin: Media Atropatene
  script: Ἀτροπατηνή
  script_lang: grc

span:
  start: { min: -323, max: -320, source: wiesehofer-1996 }
  end: { min: 226, max: 226, source: wiesehofer-1996 }

identity: >-
  The northern half of Media, kept by the Achaemenid satrap who was governing it
  when Alexander died and held by his descendants for five hundred years — and
  the country that gave Azerbaijan its name.

capitals:
  - { name: Ganzak, source: wiesehofer-1996 }

core_region: North-western Iran, from the Araxes to the Zagros

rulers:
  founder: { name: Atropates, source: wiesehofer-1996 }
  peak: { name: null, source: null }
  last: { name: null, source: null }

scripts_and_languages:
  administration: [Greek, Aramaic, Middle Persian]
  writing_system: Greek and Aramaic

ended:
  type: conquest
  by: [sasanian]
  year: 226
  source: wiesehofer-1996

institutions:
  # Null, for the same reason as the Persis record: nothing consulted describes
  # how the kingdom raised a force in terms this vocabulary could take. What is
  # recorded is that it supplied cavalry to Parthian armies and, in 36 BC,
  # fought a Roman one with them.
  military_basis: null
  revenue_basis: { values: [land-tax], source: wiesehofer-1996 }
  succession_rule: null
  # Descent from Atropates, an Achaemenid satrap of Media who was still in post
  # when Alexander died — which is a claim to be the surviving fragment of the
  # empire rather than a successor to it, and the only such claim in this
  # corpus.
  legitimation: { values: [descent], source: wiesehofer-1996 }

turning_points:
  # Not a battle or a proclamation: an Achaemenid satrap simply continued
  # governing the province after the empire that appointed him stopped
  # existing. -323 is coded because that is the year the settlement at
  # Babylon divided the satrapies and confirmed Atropates in the northern
  # half rather than replacing him; the turning point is the absence of a
  # replacement.
  - year: -323
    type: succession-crisis
    name: "The satrap who did not hand it over"
    changed: >-
      Alexander died and the settlement at Babylon divided Media between a
      Macedonian and Atropates, the Achaemenid satrap who had commanded the
      Median contingent against Alexander at Gaugamela and then submitted.
      He kept the northern half and never handed it over; his descendants
      ruled it for five hundred and fifty years, not as claimants to a dead
      empire but as a piece of its administration that had simply never
      been reassigned.
    source: wiesehofer-1996
    contested: false
  - year: -36
    type: battle
    name: "Antony in Atropatene"
    changed: >-
      Mark Antony invaded with a very large army, lost his siege train early to
      a Parthian and Atropatenian force, could not take the capital, and
      retreated through the mountains in winter with heavy losses. It ended the
      last serious Roman attempt to conquer Iran from the west for a hundred and
      fifty years, and it is the reason a small kingdom appears in Latin
      literature at all.
    source: wiesehofer-1996
    contested: false
  # Not a conquest in the ordinary sense: the fire and its custodians stayed
  # in place under the new dynasty. 226 is coded because that is when the
  # kingdom's own line ended, not because anything visible changed at the
  # sanctuary.
  - year: 226
    type: succession-crisis
    name: "Ardashir annexes the kingdom"
    changed: >-
      Ardashir took Atropatene two years after taking the Parthian empire it
      had been a client of, and it became a Sasanian province under an
      appointed marzban. The fire stayed where it was and the new kings of
      kings came to it exactly as the old ones had. A five-hundred-and-
      fifty-year dynasty ends in that one detail: nothing about the
      kingdom's actual purpose changed hands at all.
    source: wiesehofer-1996
    contested: false

