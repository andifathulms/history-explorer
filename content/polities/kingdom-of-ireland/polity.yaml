id: kingdom-of-ireland
region: the-british-isles

name:
  latin: Kingdom of Ireland
  script: Regnum Hiberniae
  script_lang: la

span:
  start: { min: 1541, max: 1541, source: bagwell-1885 }
  end: { min: 1800, max: 1800, source: barrington-1844 }

identity: >-
  The kingdom an Irish Parliament's vote created out of the medieval
  lordship in 1541, fought over through Cromwellian and Williamite
  reconquest and a brief span of legislative independence under
  Grattan, before its own Parliament voted itself into union with
  Great Britain in 1800.

capitals:
  - { name: Dublin, source: bagwell-1885 }

core_region: The whole island of Ireland, contested in practice between the crown administration at Dublin and Gaelic and Old English lordships until the end of the Nine Years' War

rulers:
  founder: { name: Henry VIII, reign: [1541, 1547], source: bagwell-1885 }
  # Elizabeth's reign saw the crown's authority pushed, at heavy cost,
  # into every corner of the island for the first time - the Nine
  # Years' War ending in the complete submission the earlier Tudor
  # monarchs had claimed but never actually achieved.
  peak: { name: Elizabeth I, reign: [1558, 1603], source: bagwell-1885 }
  last: { name: George III, reign: [1760, 1800], source: barrington-1844 }

scripts_and_languages:
  administration: [English, Latin, Irish]
  writing_system: Latin alphabet

institutions:
  military_basis: { values: [standing-professional], source: bagwell-1885 }
  revenue_basis: { values: [land-tax], source: bagwell-1885 }
  succession_rule: { values: [primogeniture], source: bagwell-1885 }
  legitimation: { values: [descent, divine-sanction], source: bagwell-1885 }

preceded_by_external: []

succeeded_by_external: []

ended:
  # As with the Lordship-to-Kingdom transition of 1541, no conquest,
  # dynasty change or fragmentation ended this kingdom - its own
  # Parliament voted itself out of existence into a new Parliament of
  # the United Kingdom. "Gradual absorption" is again the closest
  # available fit in the closed vocabulary, matching Scotland's own
  # 1707 union with England.
  type: gradual absorption
  by: []
  year: 1800
  source: barrington-1844

turning_points:
  - year: 1583
    type: catastrophe
    name: "Death of the Earl of Desmond"
    changed: >-
      Gerald FitzGerald, the fifteenth Earl of Desmond, was surprised
      and beheaded by the O'Moriartys in a Kerry glen after years as a
      hunted fugitive, ending the last great Geraldine rising. English
      colonists were brought in to settle his forfeited estates, and
      the plantation that resulted remade landholding across Munster
      more thoroughly than four decades of fighting had.
    source: bagwell-1885
    contested: false
  - year: 1598
    type: battle
    name: "Battle of the Yellow Ford"
    changed: >-
      Hugh O'Neill and Hugh O'Donnell destroyed an English relief
      column at a ford on the river Callan, killing the Crown's own
      marshal, Sir Henry Bagenal, in what became the costliest reverse
      the English crown had yet suffered on Irish soil. The victory
      touched off a general rising that spread the war far beyond
      Ulster for the first time.
    source: bagwell-1885
    contested: false
  - year: 1601
    type: battle
    name: "Battle of Kinsale"
    changed: >-
      A night attack meant to catch Mountjoy's besieging army between
      the Irish confederates and a besieged Spanish garrison collapsed
      into confusion after O'Donnell's own guides took a wrong turning
      in the dark; Tyrone's exposed vanguard was routed at daybreak, and
      the Irish lost some two thousand men against a single English
      fatality. The confederate army broke apart afterward and never
      reassembled.
    source: bagwell-1885
    contested: false
  - year: 1603
    type: treaty
    name: "Tyrone's submission at Mellifont"
    changed: >-
      Unaware that Elizabeth had already died six days earlier, Tyrone
      travelled to Mellifont and knelt in penitent submission for close
      to an hour, renouncing his old title and any dependence on Spain.
      He learned of the Queen's death, and of James's accession, only
      after he had already surrendered everything the old war had been
      fought over.
    source: bagwell-1885
    contested: false
  - year: 1607
    type: revolt
    name: "The Flight of the Earls"
    changed: >-
      Hugh O'Neill and the earl of Tyrconnell, Rory O'Donnell, sailed
      from Lough Swilly with some ninety-nine followers, never to return.
      O'Neill spent his final night in Ireland at the same house at
      Mellifont where he had once submitted to Mountjoy - and with his
      departure, no independent Gaelic lord of any standing remained
      anywhere on the island.
    source: ocianain-1916
    contested: false
  - year: 1649
    type: catastrophe
    name: "Storm of Drogheda"
    changed: >-
      Oliver Cromwell's army breached Drogheda's walls and, once inside,
      killed the garrison and an unknown number of townspeople under
      Cromwell's own direct order to spare no one found in arms - by
      his own estimate some two thousand dead. The massacre opened a
      campaign of reconquest that broke organized Catholic resistance
      across the country within four years.
    source: bagwell-1909
    contested: false
  - year: 1690
    type: battle
    name: "Battle of the Boyne"
    changed: >-
      William III forced a river crossing against James II's smaller
      army at Oldbridge, routing the Jacobite forces within a few hours
      despite being wounded by a cannon shot the day before. James fled
      to France; the war continued another year around Limerick, but
      the Boyne broke Jacobite Ireland's last real chance of reversing
      the Williamite settlement by force.
    source: bagwell-1909
    contested: false
  - year: 1691
    type: treaty
    name: "Treaty of Limerick, and its violation"
    changed: >-
      The treaty ending the war promised Irish Catholics the religious
      liberty they had held under Charles II. Parliament never ratified
      that promise; a new body of Penal Laws instead barred Catholics
      from land ownership, the professions, and public office within a
      few years of the ink drying; Patrick Sarsfield and thousands of
      soldiers sailed for French service rather than live under it.
    source: lecky-1892
    contested: false
  - year: 1782
    type: reform
    name: "Grattan's declaration of independence"
    changed: >-
      Under pressure from an armed Volunteer movement the government
      could not safely ignore, the British Parliament conceded
      legislative independence to its Irish counterpart. Escorted
      through the Volunteers' own ranks to move the declaration, Henry
      Grattan told the chamber "Ireland is now a nation" - the high
      point of the Protestant Ascendancy's own political self-rule,
      achieved without a shot fired.
    source: lecky-1871
    contested: false
  - year: 1798
    type: revolt
    name: "Rebellion and the Wexford Bridge massacre"
    changed: >-
      A rising organized by the United Irishmen took its strongest hold
      in Wexford, whose county town remained in rebel hands for several
      weeks. As government troops closed in, a mob dragged Protestant
      prisoners onto the town's own bridge and killed nearly a hundred
      of them with pikes before a priest halted the killing; the rising
      itself was crushed soon after, at a cost historians still dispute
      but which ran into the thousands on both sides.
    source: gordon-1801
    contested: true
  - year: 1800
    type: treaty
    name: "The Irish Parliament votes for Union"
    changed: >-
      Having failed on a first attempt in 1799, the government secured
      passage of the Act of Union the following year through what a
      contemporary member who voted against it later itemised as a
      vast sum of Irish money handed out among sitting members, plus a
      fresh batch of peerages for the compliant. The Irish Parliament
      dissolved itself, merging into Westminster's own enlarged body
      for the United Kingdom.
    source: barrington-1844
    contested: false

