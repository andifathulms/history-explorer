id: abbasid
region: caliphates

name:
  latin: Abbasid Caliphate
  script: العباسيون
  script_lang: ar

span:
  start: { min: 750, max: 750, source: bosworth-1996 }
  end: { min: 1258, max: 1258, source: bosworth-1996 }

identity: >-
  The caliphate that ruled from Baghdad, and then reigned from it for four
  centuries after it had stopped ruling anything.

capitals:
  - { name: Baghdad, script: بغداد, from: 762, source: iranica-abbasid-caliphate }
  - { name: Samarra, from: 836, to: 892, source: iranica-abbasid-caliphate }

core_region: Iraq

rulers:
  founder: { name: al-Saffah, reign: [750, 754], source: bosworth-1996 }
  peak: { name: Harun al-Rashid, reign: [786, 809], source: bosworth-1996 }
  last: { name: al-Musta'sim, reign: [1242, 1258], source: bosworth-1996 }

scripts_and_languages:
  administration: [Arabic]
  writing_system: Arabic

ended:
  type: conquest
  by: [mongol]
  year: 1258
  source: bosworth-1996

measures:
  reach_km2: { value: 11100000, at: 750, source: taagepera-1997 }
  peak_population: null
  influence:
    # As with the other two caliphates: no consulted source here attributes a
    # derived or newly adapted script to this polity. The adaptation of Arabic
    # to write Persian happened in the Abbasid east, but the sources read for
    # this corpus attribute it to no polity in particular, and the coding rules
    # exclude adaptations a source assigns elsewhere or not at all. Null.
    descendant_scripts: { count: null, items: [], source: null }
    religions_carried:
      count: 1
      items: [Islam]
      source: kennedy-2004
    # The Intermezzo dynasties named the Abbasid caliph in the khutba, but that
    # is subordination to a living contemporary, not a claim on a predecessor's
    # legitimacy, and it is not counted here. The shadow caliphate the Mamluks
    # installed at Cairo after 1261 is a claim, and is.
    successor_claims:
      count: 1
      items: [Abbasid Caliphate of Cairo]
      source: el-hibri-2021
