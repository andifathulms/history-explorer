id: abbasid
region: caliphates

name:
  latin: Abbasid Caliphate
  script: العباسيون
  script_lang: ar

span:
  start: { min: 750, max: 750, source: bosworth-1996 }
  end: { min: 1258, max: 1258, source: bosworth-1996 }

identity: >-
  The caliphate that ruled from Baghdad, and then reigned from it for four
  centuries after it had stopped ruling anything.

capitals:
  - { name: Baghdad, script: بغداد, from: 762, source: iranica-abbasid-caliphate }
  - { name: Samarra, from: 836, to: 892, source: iranica-abbasid-caliphate }

core_region: Iraq

rulers:
  founder: { name: al-Saffah, reign: [750, 754], source: bosworth-1996 }
  peak: { name: Harun al-Rashid, reign: [786, 809], source: bosworth-1996 }
  last: { name: al-Musta'sim, reign: [1242, 1258], source: bosworth-1996 }

scripts_and_languages:
  administration: [Arabic]
  writing_system: Arabic

ended:
  type: conquest
  by: [mongol]
  year: 1258
  source: bosworth-1996

banner:
  # The one polity in this region with both a cited description and a drawing
  # anyone can defend. Everything else here is a colour and a sentence.
  description: >-
    The imperial standard of the Abbasid caliphs was black, carrying the legend
    "Muhammad is the Apostle of God" in white. Black was the revolution's colour
    before it was the dynasty's: Abu Muslim raised two great banners in Khurasan,
    one black and one white inscribed with Qur'an 22:39. It then stayed the
    state's for five centuries, and did real administrative work — client rulers
    received a black banner from Baghdad as their sign of legitimacy and carried
    it beside their own dynastic standards, and opposition to Abbasid rule was
    expressed by discarding black. When al-Ma'mun named Ali al-Rida his heir he
    adopted green, the Alid colour, for his banners and his dress; he was accused
    of following Persian custom, and reverted to the official black.
  source: iranica-flags
  attested:
    - colour: black
      source: iranica-flags
      reported_from: "Margoliouth and Amedroz, Eclipse I, p. 199"
  image:
    file: abbasid.svg
    status: reconstruction
    credit: abbasid-caliphal-banner
    divergence: >-
      Iranica gives the legend in white; this drawing renders it gilded, after
      Nicolle. No Abbasid standard survives to settle the difference, which is
      the whole reason the label says reconstruction.

institutions:
  # Two arrangements, and the change between them is the polity's central
  # story. The revolution's Khurasani army was paid, permanent and commanded
  # from the centre; from 836 the caliphs replaced it with purchased Turkish
  # slave soldiers attached to themselves personally, and were being deposed by
  # them within thirty years.
  military_basis: { values: [standing-professional, slave-soldier], source: kennedy-2004 }
  # The Sawad — the irrigated alluvium of lower Iraq, taken at al-Qadisiyya on
  # this site's Rashidun page — is the tax base the whole arrangement sat on,
  # and losing control of provincial revenue is what the ninth century does to
  # this polity.
  revenue_basis: { values: [land-tax, poll-tax], source: kennedy-2004 }
  # The reigning caliph designated his heir. Harun designated two, with the
  # terms deposited at the Ka'ba, and the empire's two halves fought over it.
  succession_rule: { values: [nomination], source: el-hibri-2021 }
  # Descent from al-Abbas, the Prophet's uncle — the claim the revolution was
  # made in the name of, and the one that distinguishes them from the Alid
  # candidates their coalition had been imagining. Not divine-sanction: the
  # mihna chapter is about the Abbasids making that larger claim and losing it.
  legitimation: { values: [descent], source: kennedy-2004 }

turning_points:
  - year: 762
    type: capital-move
    name: "The founding of Baghdad"
    changed: >-
      An empty site was chosen for its rivers and for its distance from Kufa's
      politics, and within fifty years it was probably the largest city west of
      China. The caliphate's centre of gravity moved from Syria to Iraq and
      never moved back, which is why every polity in this site's Iranian
      Intermezzo holds its province from Baghdad rather than from Damascus.
    source: kennedy-2004
    contested: false
  - year: 813
    type: succession-crisis
    name: "The siege of Baghdad"
    changed: >-
      Harun had divided the succession between two sons with the terms
      deposited at the Ka'ba, and the empire's two halves fought it out with
      their own provincial armies: Baghdad was besieged and sacked by Khurasani
      troops and al-Amin killed. The capital's garrison was never trusted
      again, and every later attempt to solve the army problem starts here.
    source: el-hibri-2021
    contested: false
  - year: 833
    type: reform
    name: "The mihna"
    changed: >-
      The caliph claimed jurisdiction over a question of belief and required
      the religious professionals to accept his answer. Fifteen years later the
      policy was abandoned, and what had been settled was not the doctrine but
      who was entitled to determine it: after the mihna the definition of Islam
      belonged to the scholars, and the caliphate held a religious title with
      the content taken out of it.
    source: crone-hinds-1986
    contested: false
  - year: 836
    type: capital-move
    name: "The move to Samarra"
    changed: >-
      Baghdad's population and the new Turkish slave guard could not be kept
      in one city, so the whole apparatus went sixty miles up the Tigris to a
      planned caliphal city containing almost nobody the caliph had not
      brought there.
    source: el-hibri-2021
    contested: false
  - year: 861
    type: succession-crisis
    name: "The anarchy at Samarra"
    changed: >-
      Four caliphs were raised and destroyed by their own Turkish commanders
      in nine years, and the office never recovered its independence from the
      men who held its weapons; the army bought to free the caliphs from
      provincial politics became the only politics there was.
    source: el-hibri-2021
    contested: false

measures:
  reach_km2: { value: 11100000, at: 750, source: taagepera-1997 }
  peak_population: null
  influence:
    # As with the other two caliphates: no consulted source here attributes a
    # derived or newly adapted script to this polity. The adaptation of Arabic
    # to write Persian happened in the Abbasid east, but the sources read for
    # this corpus attribute it to no polity in particular, and the coding rules
    # exclude adaptations a source assigns elsewhere or not at all. Null.
    descendant_scripts: { count: null, items: [], source: null }
    religions_carried:
      count: 1
      items: [Islam]
      source: kennedy-2004
    # The Intermezzo dynasties named the Abbasid caliph in the khutba, but that
    # is subordination to a living contemporary, not a claim on a predecessor's
    # legitimacy, and it is not counted here. The shadow caliphate the Mamluks
    # installed at Cairo after 1261 is a claim, and is.
    successor_claims:
      count: 1
      items: [Abbasid Caliphate of Cairo]
      source: el-hibri-2021
