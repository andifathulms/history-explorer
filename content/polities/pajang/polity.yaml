id: pajang
region: java-and-bali

name:
  latin: The Kingdom of Pajang
  script: null
  script_lang: null

# The end date is genuinely disputed and both figures are kept. Ricklefs dates
# Senapati's taking of Pajang to 1586. de Graaf and Pigeaud, working from the
# Javanese chronicles, put Adiwijaya's death in 1587 and the expulsion of his
# successor Arya Pangiri in 1588. Nothing is averaged; the range is the range.
span:
  start: { min: 1568, max: 1568, source: ricklefs-2008 }
  end: { min: 1586, max: 1588, source: ricklefs-2008, max_source: graaf-pigeaud-1974 }

identity: >-
  The eighteen years in which the centre of Javanese power sat inland for the
  first time since Majapahit, between the sultanate of the north coast and the
  one that would hold the island for two hundred years.

capitals:
  - { name: Pajang, from: 1568, source: ricklefs-2008 }

core_region: The interior of central Java, around the middle Solo valley

rulers:
  founder: { name: Hadiwijaya, reign: [1568, 1582], source: ricklefs-2008 }
  peak: { name: Hadiwijaya, reign: [1568, 1582], source: ricklefs-2008 }
  last: { name: Arya Pangiri, reign: [1583, 1586], source: ricklefs-2008 }

scripts_and_languages:
  administration: [Javanese, Arabic]
  writing_system: Javanese script, with Pegon for Arabic-script Javanese

# Senapati of Mataram, Hadiwijaya's own vassal and foster-son, took the kingdom.
# See the span comment above for the two dates.
ended:
  type: conquest
  by: [mataram]
  year: 1586
  source: ricklefs-2008

institutions:
  military_basis: { values: [conscript], source: ricklefs-2008 }
  # Land tax alone. Demak had been a north-coast port living on its harbour as
  # well as its fields; Pajang sits up the Solo valley with no coast at all, and
  # Mataram after it is the same. The centre of Javanese power went inland in
  # 1568 and stayed there until the twentieth century.
  revenue_basis: { values: [land-tax], source: ricklefs-2008 }
  succession_rule: null
  # Descent, twice over and from opposite directions. Hadiwijaya claimed descent
  # from Trenggana of Demak, whose dynasty he had just finished off in a civil
  # war, and from the last king of Majapahit, whose kingdom Demak had absorbed.
  #
  # Demak had argued its own standing the same way. Two consecutive Javanese
  # kingdoms claimed descent from the thing their predecessor destroyed.
  legitimation: { values: [descent, divine-sanction], source: ricklefs-2008 }

turning_points:
  - year: 1581
    type: treaty
    name: The assembly at Giri
    changed: >-
      At the court of the aged Sunan Prapen of Giri, the rulers of Japan,
      Wirasaba, Kediri, Surabaya, Pasuruan, Madiun, Sidayu, Lasem, Tuban and Pati
      acknowledged Adiwijaya as Muslim king and sultan.
      It is the moment an inland kingdom was accepted as paramount by the coast
      and the east — by agreement, in a holy man's palace, without a campaign.
      It also shows what that paramountcy rested on, since none of the ten was
      conquered and none of them was bound to his successor.
    source: graaf-pigeaud-1974
    contested: false
  - year: 1586
    type: battle
    name: Senapati
    changed: >-
      Senapati, ruler of Mataram, a vassal territory Hadiwijaya had granted to
      his own foster-father, took Pajang. It is the third Javanese paramountcy in
      sixty years to pass from an overlord to his own subordinate, and the last
      for a long time: what Senapati founded held Java until 1755.
    source: ricklefs-2008
    contested: false

measures:
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: ricklefs-2008 }
    religions_carried: { count: 0, items: [], source: ricklefs-2008 }
    # One. Senapati's Mataram claimed Pajang's authority as well as taking it,
    # and the Javanese dynastic chronicles composed under Mataram put Hadiwijaya
    # in the line of transmission that reaches the Mataram sultans.
    successor_claims:
      count: 1
      items: [The Sultanate of Mataram]
      source: ricklefs-2008
