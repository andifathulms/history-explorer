id: aceh
region: sumatra-and-the-peninsula

name:
  latin: Aceh Darussalam
  # Written in Jawi, like Melaka's Malay, and null here for the reason that
  # record gives: a name in letters nobody on this project can proofread is a
  # decoration that reads as a citation.
  script: null
  script_lang: null

# Ali Mughayat Syah consolidated the northern Sumatran ports into one sultanate
# in the years around 1496. 1903 is the surrender of Sultan Muhammad Daud Syah
# to the Dutch, thirty years into a war that had already outlasted every other
# resistance to Dutch expansion in the archipelago.
span:
  start: { min: 1496, max: 1496, source: reid-2005 }
  end: { min: 1903, max: 1903, source: reid-2005 }

identity: >-
  The pepper sultanate at the northern tip of Sumatra, which took the trade
  Melaka lost, was called the veranda of Mecca, and spent its last thirty years
  fighting the longest war in Dutch colonial history.

capitals:
  - { name: Banda Aceh, from: 1496, source: reid-2005 }

core_region: The northern tip of Sumatra, with pepper ports down both coasts

rulers:
  founder: { name: Ali Mughayat Syah, reign: [1496, 1530], source: reid-2005 }
  peak: { name: Iskandar Muda, reign: [1607, 1636], source: reid-1988 }
  last: { name: Muhammad Daud Syah, reign: [1874, 1903], source: reid-2005 }

scripts_and_languages:
  administration: [Malay, Acehnese, Arabic]
  writing_system: Jawi — the Arabic script adapted for Malay

# The Dutch declared war in 1873, lost their first commander in the first month,
# and took thirty years to obtain a surrender. `by` is empty because the
# Netherlands is not a polity in this corpus; the prose on the page names the
# Dutch directly and does not mention the empty field.
ended:
  type: conquest
  by: []
  year: 1903
  source: reid-2005

# What actually came next. The Netherlands has no record here and never will —
# it is not the kind of thing this collection carries — but a reader asking what
# followed Aceh is asking a question about Sumatra, not about which pages exist,
# and the answer is the Dutch colonial state. Named here rather than left to an
# empty column. Not an edge: it joins nothing, is drawn by no thread, counts in
# no tally.
succeeded_by_external:
  - name: the Netherlands
    type: conquered by
    year: 1903
    note: >-
      The sultanate's territory was absorbed into the Netherlands East Indies
      after Sultan Muhammad Daud Syah's surrender, and the sultanate was not
      restored. Armed resistance in the countryside outlasted the surrender by
      years, and the uleebalang who had carried the war were confirmed in place
      as the colony's local administration — the same men, governing the same
      districts, for somebody else.
    source: reid-2005

institutions:
  # Null, and it is a real finding rather than an absence. The sources describe
  # two incompatible arrangements two generations apart. Iskandar Muda held a
  # force centred on the capital — war captives settled around it, an elephant
  # corps, and cannon, some of it Ottoman — precisely in order to be independent
  # of the territorial chiefs. After 1641 the uleebalang, those same chiefs,
  # recovered their levies and the capital's force decayed.
  #
  # Coding rule 7 asks for the rule rather than the outcome, and this record has
  # two rules in sequence with the machinery of the second built specifically to
  # undo the first. One value would be a claim about which century counts.
  military_basis: null
  # Pepper, and the state's cut of it. Aceh taxed the trade passing its ports
  # and held a royal monopoly over the pepper of the coasts it controlled, which
  # is the arrangement that made Iskandar Muda's reign possible and the one his
  # successors could not maintain once the Dutch began buying upcountry.
  revenue_basis: { values: [trade-toll, monopoly], source: reid-1988 }
  # Null. Between 1641 and 1699 Aceh was ruled by four women in succession, which
  # is the second-longest run of reigning queens in this corpus — the Patani
  # record, written later, has four queens across a hundred and four years from
  # 1584 — and it was not a rule of any kind. The orangkaya — the merchant aristocracy Iskandar Muda
  # had spent thirty years suppressing — elevated the first of them precisely
  # because a queen could be managed, and kept doing it for three more reigns
  # until the ulama produced a fatwa against female rule and it stopped.
  #
  # This site added `matrilineal` to the vocabulary for Ghana, Makuria and
  # Asante. Aceh is the case that shows why the value had to be defined by
  # descent rather than by the sex of the ruler: four queens in a row, and
  # nothing matrilineal anywhere near them.
  succession_rule: null
  # Descent, and God. Aceh was called the veranda of Mecca because it was where
  # the archipelago's pilgrims embarked, and its court kept scholars — Hamzah
  # Fansuri, Shams al-Din, Nur al-Din al-Raniri — whose work is the foundation of
  # Malay-language Islamic literature. The Bustan al-Salatin, written at this
  # court, is a book about what makes a ruler legitimate, produced by the ruler.
  legitimation: { values: [descent, divine-sanction], source: reid-2005 }

turning_points:
  - year: 1568
    type: treaty
    name: Istanbul
    # The rendered text says what happened. The coding argument that used to sit
    # here — why an Ottoman gift of ordnance is not investiture, unlike the Ming
    # reception of Melaka's founder — belongs in a comment, which is where it now
    # is: Aceh asked for a relationship of authority and received guns, and guns
    # are not a grant of authority, so `legitimation` carries no investiture value.
    changed: >-
      An Acehnese embassy sent to the Ottoman court some years earlier, asking
      for help against the Portuguese at Melaka, produced its result in this
      year: cannon arrived, with founders who could cast more and gunners who
      could work them. Acehnese artillery is attested in Portuguese accounts for
      the rest of the century. It is the longest-range military alliance either
      party ever attempted, between two states nine thousand kilometres apart
      that never shared a frontier and never met again.
    source: reid-2005
    contested: true
  - year: 1629
    type: siege
    name: Melaka
    changed: >-
      Iskandar Muda threw the largest fleet Aceh ever assembled at Portuguese
      Melaka and lost it — ships, men and the initiative, in one campaign.
      Aceh had besieged that city at least half a dozen times in a century
      without taking it. After 1629 it stopped trying, and never again mounted an
      offensive beyond its own coasts.
    source: reid-1988
    contested: false
  - year: 1641
    type: succession-crisis
    name: Safiatuddin
    changed: >-
      The throne passed to a queen, and then to three more. What changed was not
      the succession but the balance underneath it: the autocracy Iskandar Muda
      had built was dismantled inside a generation, and Aceh became in practice a
      federation of pepper chiefs with a court at its centre.
    source: reid-1988
    contested: false
  - year: 1873
    type: battle
    name: The first expedition
    changed: >-
      The Netherlands declared war, and the first Dutch expedition was driven off
      with its commander killed. The second took the capital. Neither took the
      country, and the thirty years that followed are the reason Aceh's end is
      dated three decades after its palace fell.
    source: reid-2005
    contested: false

measures:
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: reid-2005 }
    # One. Aceh carried Islam inland into Sumatra — the Gayo and Alas highlands,
    # and by way of its pepper ports down both coasts — and it was the point of
    # embarkation and return for the archipelago's pilgrimage, which is how
    # scholarship from the Hijaz reached the region. Rule 2 counts propagation
    # past a prior boundary; the boundary here is the coastline that Islam in
    # Sumatra had not previously crossed.
    religions_carried:
      count: 1
      items: [Sunni Islam]
      source: reid-2005
    # Zero. Aceh took Melaka's trade, its merchants and much of its position, and
    # this site records that as an edge rather than a claim, because taking a
    # city's business is not asserting its authority. Rule 1 wants a claim, and
    # Aceh's rulers claimed descent from their own line rather than from
    # Melaka's.
    successor_claims: { count: 0, items: [], source: reid-2005 }
