id: uyghur-khaganate
region: turkic-steppe

name:
  latin: Uyghur Khaganate
  script: Toquz Oghuz
  script_lang: otk

span:
  start: { min: 744, max: 744, source: golden-1992 }
  end: { min: 840, max: 840, source: golden-1992 }

identity: >-
  The steppe empire that propped up the Tang after An Lushan, and adopted
  Manichaeism as a state religion.

capitals:
  - { name: Ordu-Baliq, script: Ordu-Baliq, from: 744, source: golden-1992 }

core_region: The Mongolian steppe

rulers:
  founder: { name: Qutlugh Bilge Kol, reign: [744, 747], source: golden-1992 }
  peak: { name: Bogu Khagan, reign: [759, 779], source: golden-1992 }
  last: { name: Kchik Khagan, reign: [839, 840], source: golden-1992 }

scripts_and_languages:
  administration: [Old Turkic, Sogdian]
  writing_system: Old Turkic

ended:
  type: conquest
  # The Kyrgyz are not a polity on this site and are not in the reference set,
  # so they cannot be named here without inventing an id. Named in the prose.
  by: []
  year: 840
  source: golden-1992

# Two real successors, neither with a record here: the people who took the
# capital, and the kingdom the survivors built. Named rather than left as an
# absence. The second relation is none of the eight edge types, so `type` is
# omitted and the note carries it.
succeeded_by_external:
  - name: the Yenisei Kirghiz
    type: conquered by
    year: 840
    note: >-
      A forest people north-west of the Otukan, subjects first of the Turks and
      then of the Uyghurs, came down the valley after an Uyghur general defected
      to them, took Karabalgasun, killed the qaghan and burned the city. They
      did not stay: they went back north with what they had taken, and the
      Mongolian steppe was left without a central power until the Mongols.
    source: golden-1992
  - name: the kingdom of Qocho, in the Tarim
    year: null
    note: >-
      The largest group of survivors went south-west into the oasis towns around
      Turfan and stopped being nomads: irrigated farming, walled towns, a
      manuscript culture that turned from Manichaean to largely Buddhist, and
      the Sogdian-derived alphabet in place of the runiform script. They became
      the literate class every later steppe empire hired, and the Mongols took
      their letters to write Mongolian in.
    source: golden-1992

turning_points:
  - year: 762
    type: conversion
    name: "Bogu Khagan's adoption of Manichaeism"
    changed: >-
      A steppe empire took a persecuted Mesopotamian dualist faith as its
      state cult, the only state in history to have done so, and with it the
      Sogdian commercial network that was the medium of the choice and the
      literate administration that came through it.
    source: golden-1992
    contested: false

measures:
  reach_km2: { value: 3100000, at: 800, source: taagepera-1997 }
  peak_population: null
  influence:
    descendant_scripts: { count: null, items: [], source: null }
    religions_carried:
      count: 1
      items: [Manichaeism]
      source: golden-1992
    successor_claims: { count: null, items: [], source: null }
