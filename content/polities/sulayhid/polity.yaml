id: sulayhid
region: south-arabia

name:
  latin: Sulayhid Dynasty
  script: الصليحيون
  script_lang: ar

span:
  start: { min: 1047, max: 1047, source: daftary-2007 }
  end: { min: 1138, max: 1138, source: daftary-2007 }

identity: >-
  The Isma'ili state the Fatimid mission produced in Yemen, ruled for its last
  half-century by a queen who held religious rank in the hierarchy as well as
  political authority, and who chose the branch of Isma'ilism that survives.

capitals:
  - { name: Sana'a, script: صنعاء, from: 1047, source: daftary-2007 }
  - { name: Jibla, script: جبلة, from: 1087, source: daftary-2007 }

core_region: Yemen

rulers:
  founder: { name: Ali al-Sulayhi, source: daftary-2007 }
  # The first woman in any ruler slot on this site, and not by courtesy: Arwa
  # governed in her own name for about half a century and held the rank of
  # hujja in the Isma'ili hierarchy, which no other woman did.
  peak: { name: Arwa al-Sulayhi, reign: [1086, 1138], source: daftary-2007 }
  last: { name: Arwa al-Sulayhi, reign: [1086, 1138], source: daftary-2007 }

scripts_and_languages:
  administration: [Arabic]
  writing_system: Arabic

ended:
  type: fragmentation
  by: []
  year: 1138
  source: daftary-2007

institutions:
  military_basis: { values: [tribal-levy], source: daftary-2007 }
  # Yemen's terraced agriculture, and the customs of the Red Sea. Aden under
  # Sulayhid overlordship was the transfer point between the Indian Ocean and
  # the Egyptian route, and the Fatimids had every reason to want it in
  # friendly hands — the Karimi traffic this site's Mamluk page describes two
  # centuries later ran through the same port. Unranked.
  revenue_basis: { values: [land-tax, trade-toll], source: daftary-2007 }
  succession_rule: { values: [nomination], source: daftary-2007 }
  # Descent is not the claim here: the Sulayhids ruled in the Fatimid caliph's
  # name and their authority came from the mission that converted them. There
  # is no value for "authorised by a living caliph elsewhere" — the closest is
  # caliphal-investiture, and it is used in its exact sense.
  legitimation: { values: [caliphal-investiture], source: daftary-2007 }

turning_points:
  - year: 1067
    type: battle
    name: "The killing of Ali al-Sulayhi"
    changed: >-
      The founder was ambushed on the pilgrim road by the Najahids of Zabid,
      killed, and his wife carried off; his head was set up outside Zabid on a
      spear. His son recovered the position and the queen, but the state never
      again held all of Yemen or the Mecca amirate, and from that point it was
      a highland polity defending itself rather than a Fatimid arm reaching
      towards the holy cities.
    source: daftary-2007
    contested: false
  - year: 1087
    type: capital-move
    name: "Jibla"
    changed: >-
      Arwa moved the centre from Sana'a, which was exposed and contested by the
      Zaydi imams and the Najahids, to a defensible town in the southern
      highlands, and governed from it for fifty years. The state stopped trying
      to hold all of Yemen and held what it could, which is why it outlasted
      the man who had conquered the country.
    source: daftary-2007
    contested: false
  - year: 1094
    type: succession-crisis
    name: "Choosing between Cairo's claimants"
    changed: >-
      When the Fatimid succession split, Yemen followed the Musta'li line and
      then, on a second split, the Tayyibi one — and Arwa's court became the
      seat of a mission that Cairo could no longer direct. The da'wa she sent
      east put Isma'ilism into Gujarat, where the community that descends from
      it still is.
    source: daftary-2007
    contested: false
  - year: 1130
    type: succession-crisis
    name: "The Tayyibi decision"
    changed: >-
      On the second Fatimid succession dispute Arwa recognised the infant
      Tayyib as imam and declared him in concealment, which detached the Yemeni
      mission from Cairo permanently and put it under a line of her own
      appointing. The state lasted eight more years; the religious organisation
      that decision created has lasted nine hundred, and is the reason there
      are Isma'ilis in Gujarat.
    source: daftary-2007
    contested: false

