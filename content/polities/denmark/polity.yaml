id: denmark
region: scandinavia

name:
  latin: Kingdom of Denmark
  script: Danmark
  script_lang: da

span:
  # Saxo Grammaticus names fifty legendary kings before the Viking Age,
  # a king-list Stefánsson treats no differently from the invented
  # ancient pedigrees other early medieval kingdoms produced for
  # themselves. The first Danish ruler whose own words survive is Gorm
  # the Old, undated in this source beyond his son Harald Bluetooth's
  # own reign, given here as beginning in 940.
  start: { min: 940, max: 940, source: stefansson-denmark-1916 }
  # This record currently runs only to the 1536 Reformation act - the
  # last event it has sourced chapters for - not to the kingdom's
  # actual institutional end, since Denmark has none: it continues as a
  # sovereign state to the present day. `ended` below is null for that
  # reason as well as for the coverage reason.
  end: { min: 1536, max: 1536, source: stefansson-denmark-1916 }

identity: >-
  A Viking-age kingdom that ruled Norway and England together under
  Cnut the Great and bound Denmark, Norway and Sweden under one crown
  at Kalmar before Sweden's secession, and which then demoted Norway
  to a mere province and made its own church a national Protestant
  one in 1536.

capitals:
  - { name: Roskilde, source: stefansson-denmark-1916 }

core_region: Jutland and the Danish isles - Zealand, Funen and Scania

rulers:
  # No reign dates for Gorm survive in this source; his son Harald
  # Bluetooth's own reign is dated here as beginning in 940.
  founder: { name: Gorm the Old, source: stefansson-denmark-1916 }
  # Cnut ruled England, Denmark and Norway together - an
  # Anglo-Scandinavian empire with no real precedent in the North.
  # Valdemar II later built a Baltic dominion Stefánsson himself judges
  # the widest Denmark held since Cnut, but explicitly ranks it second
  # to Cnut's own reach. The Kalmar Union bound a larger area under one
  # crown for longer, but this source's own account treats it as an
  # unstable, unequal arrangement that "worked far otherwise" than its
  # theory of equal kingdoms and gradually broke up - not the kind of
  # unambiguous pinnacle Cnut's reign is given, so this field stands
  # confirmed now that the Union's full rise and fall are both in view.
  peak: { name: Cnut the Great, reign: [1016, 1035], source: stefansson-denmark-1916 }
  # No final ruler is asserted: this record's own coverage stops at the
  # 1536 Reformation act, well short of the present day, so there is no
  # "last" king of this record to name - and, since Denmark has never
  # institutionally ended, may never be one.
  last: null

scripts_and_languages:
  administration: [Old Norse, Latin]
  writing_system: Younger Futhark runes, later Latin alphabet

institutions:
  # Cnut sent most of his Danish army home once England was secured and
  # kept only his household troops, the housecarls - a standing force
  # of some three thousand men.
  military_basis: { values: [standing-professional], source: stefansson-denmark-1916 }
  # Sven Forkbeard's raids into England were bought off with Danegeld,
  # and English coins paid as tribute have been found in Denmark in
  # abundance from this period.
  revenue_basis: { values: [tribute, plunder], source: stefansson-denmark-1916 }
  # Cnut himself was "elected king by the Danish army" while still in
  # England, even as his brother Harald succeeded their father in
  # Denmark by simple primogeniture - both patterns attested within the
  # same generation of the dynasty.
  succession_rule: { values: [election, primogeniture], source: stefansson-denmark-1916 }
  legitimation: { values: [descent], source: stefansson-denmark-1916 }

preceded_by_external: []

succeeded_by_external: []

# Denmark did not end in 1035 - it has never institutionally ended, and
# remains a sovereign state to the present day. This record's own span
# ends where its sourced coverage currently stops, not because a
# conquest, dynastic replacement or fragmentation actually ended the
# kingdom there.
ended: null

turning_points:
  - year: 960
    type: conversion
    name: "Harald Bluetooth's baptism"
    changed: >-
      A German missionary priest, Poppo, is said to have carried
      glowing metal barehanded before King Harald without any mark of
      injury - a trial the king took as proof enough to accept baptism
      himself, making the Danish monarchy Christian for the first time
      rather than merely tolerating a foreign mission at its edges.
    source: stefansson-denmark-1916
    contested: true
  - year: 1016
    type: succession-crisis
    name: "Cnut secures England"
    changed: >-
      Two English kings, father and son, died within months of one
      another after a hard-fought two-year struggle, leaving a
      twenty-two-year-old Danish claimant in sole possession of the
      English throne - the foundation, though nobody could have known
      it yet, of a kingship that would come to span three crowns at
      once.
    source: stefansson-denmark-1916
    contested: false
  - year: 1030
    type: battle
    name: "The Battle of Stiklestad"
    changed: >-
      Norwegian farmers themselves killed the exiled King Olaf
      Haraldsson when he tried to fight his way back onto the throne
      Cnut had taken from him two years earlier without a battle -
      closing out Cnut's hold on Norway and completing, for a few
      years, an Anglo-Scandinavian empire ruled from Denmark.
    source: stefansson-denmark-1916
    contested: false
  - year: 1169
    type: siege
    name: "The storming of Arkona"
    changed: >-
      Valdemar I and his foster-brother Absalon, Bishop of Roskilde,
      stormed the Wends' fortress-temple on Rügen, destroyed the great
      wooden idol of Svantovit before hundreds of its own priests, and
      annexed the island to the Danish church - closing out a
      generation of Wendish raiding that had once left a third of
      Denmark wasted.
    source: stefansson-denmark-1916
    contested: false
  - year: 1219
    type: battle
    name: "Lyndanise and the Dannebrog"
    changed: >-
      A huge crusading armada under Valdemar II won a hard-fought
      battle near Reval after a red-and-white banner, by tradition
      fallen from the sky at the critical moment, rallied the Danish
      line - giving Denmark both a foothold in Estonia and the flag it
      has flown ever since.
    source: stefansson-denmark-1916
    contested: true
  - year: 1223
    type: catastrophe
    name: "The kidnapping on Lyø"
    changed: >-
      A disgruntled German vassal, Count Henry of Schwerin, surprised
      Valdemar II and his own eldest son during a night's hunting trip
      and dragged both off into a German dungeon, touching off a
      vassal revolt that kept the king in foreign captivity for well
      over two years and, in ransom, cost him nearly every conquest he
      had made.
    source: stefansson-denmark-1916
    contested: false
  - year: 1227
    type: battle
    name: "The Battle of Bornhöved"
    changed: >-
      Valdemar II's attempt to retrieve by force what his captivity had
      cost him ended in defeat and the loss of an eye, and the German
      territory he had once ruled as Lord of Northalbingia was signed
      away for good that same year - reducing a Baltic dominion that
      had briefly rivalled Cnut's own empire to the single island of
      Rügen.
    source: stefansson-denmark-1916
    contested: false
  - year: 1340
    type: succession-crisis
    name: "Valdemar IV ends the interregnum"
    changed: >-
      A Jutland nobleman's killing of the occupying Count Gerhard III
      of Holstein ended eight kingless years during which the realm sat
      divided among foreign creditors, and opened the way for
      Christopher II's youngest son to be elected king with nothing to
      his name but the revenue of a single county - and, within a
      decade, to have bought and fought back most of what his
      predecessors had signed away.
    source: stefansson-denmark-1916
    contested: false
  - year: 1370
    type: treaty
    name: "The Peace of Stralsund"
    changed: >-
      An alliance of dozens of Hanseatic trading cities, joined by
      Sweden, Mecklenburg and Holstein, forced Valdemar Atterdag abroad for
      three years and, on his return, into a humiliating peace granting
      the Hansa the revenues of West Scania for sixteen years and a
      veto over the election of any future Danish king.
    source: stefansson-denmark-1916
    contested: false
  - year: 1389
    type: battle
    name: "The Battle of Falköping"
    changed: >-
      Sweden's own discontented nobles had already offered Margaret
      their crown on onerous terms when her forces captured King
      Albrecht outright on the field at Falköping - leaving her, a
      childless widow with no formal claim of her own, ruling what
      contemporaries called the largest monarchy in Europe.
    source: stefansson-denmark-1916
    contested: false
  - year: 1397
    type: treaty
    name: "The Kalmar Union"
    changed: >-
      Margaret's grand-nephew Eric of Pomerania was crowned ruler of all
      three Scandinavian kingdoms in one ceremony at Kalmar, and the
      assembled lords of all three kingdoms spent weeks afterward
      drafting terms for a lasting union under one sovereign - though
      only the coronation document itself was ever fully sealed, the
      fuller constitutional draft left short of ratification by every
      Norwegian councillor present.
    source: stefansson-denmark-1916
    contested: false
  - year: 1520
    type: catastrophe
    name: "The Stockholm Bloodbath"
    changed: >-
      Days after a full amnesty secured Stockholm's surrender and his
      own coronation as hereditary King of Sweden, Christian II had
      dozens of Swedish nobles, clergy and councillors arrested on
      fabricated charges of heresy and publicly beheaded over two days
      - a massacre his own later, contradictory excuses to his Swedish
      subjects and to the Pope only made more damning.
    source: stefansson-denmark-1916
    contested: false
  - year: 1521
    type: battle
    name: "Gustaf Vasa's peasants break the Danes at Västerås"
    changed: >-
      A hunted fugitive turned rebel leader, Gustaf Eriksson Vasa
      rallied the Dalecarlian peasantry after the Stockholm massacre
      claimed his own father, and their pikemen broke a mounted Danish
      charge outright that April, capturing artillery the rebels had
      lacked until then - the victory that turned a local rising into a
      province-by-province revolt against Danish rule.
    source: stefansson-denmark-1916
    contested: false
  - year: 1523
    type: succession-crisis
    name: "Sweden elects Gustaf Vasa; Christian II flees"
    changed: >-
      A Jutland noble revolt drove Christian II into Dutch exile that
      April, and within weeks a Swedish assembly at Strängnäs proclaimed
      Gustaf Vasa king over his own objections, with Stockholm's
      starving garrison surrendering a fortnight later - closing, in
      every sense but name, the Kalmar settlement of 1397.
    source: stefansson-denmark-1916
    contested: false
  - year: 1534
    type: succession-crisis
    name: "The Count's War"
    changed: >-
      Frederick I's death split Denmark between rival successors, and
      a Lübeck-backed pretender's proxy war for the exiled Christian II
      overran eastern Denmark within weeks - a two-year civil war that
      Christian III, elected by Jutland's nobles, only won by crushing
      a peasant army at Aalborg and starving Copenhagen into surrender
      after a year-long siege.
    source: stefansson-denmark-1916
    contested: false
  - year: 1536
    type: reform
    name: "The Reformation act"
    changed: >-
      A single coordinated arrest of every bishop present in Copenhagen
      forced the kingdom's councillors to sign away the Church's civil
      power in a morning, and a national assembly that October made
      Denmark's a Protestant church with the king as its head - the
      same charter making Danish kingship hereditary in all but name
      and formally, if not yet effectively, reducing Norway from a
      kingdom to a Danish province.
    source: stefansson-denmark-1916
    contested: false

