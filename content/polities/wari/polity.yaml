id: wari
region: the-andes

name:
  latin: Wari
  script: null
  script_lang: null

span:
  start: { min: 600, max: 600, source: tung-2012 }
  end: { min: 1000, max: 1000, source: tung-2012 }

identity: >-
  A highland Andean state whose own political history survives nowhere
  in writing, known only through the ruins of an urban capital, a
  distinctive walled architecture built to restrict movement within its
  own compounds, and provincial centers that once linked much of the
  central Andes together along roads the Inca would later inherit and
  extend.

capitals:
  - { name: Huari, source: tung-2012 }

core_region: The Ayacucho basin, in the central Peruvian highlands

rulers:
  # No inscription, king-list or native chronicle naming a Wari ruler
  # has survived; everything known of its government comes from
  # archaeology alone.
  founder: null
  peak: null
  last: null

