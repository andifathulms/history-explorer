id: egypt-new-kingdom
region: ancient-egypt

name:
  latin: Egypt, New Kingdom
  script: 𓆎𓅓𓏏𓊖
  script_lang: egy

span:
  start: { min: -1550, max: -1550, source: shaw-2000 }
  end: { min: -1077, max: -1077, source: shaw-2000 }

identity: >-
  Egypt at its greatest territorial extent, holding Nubia and the Levant and
  corresponding with the other great powers as an equal.

capitals:
  - { name: Thebes, script: 𓋔𓏤, from: -1550, source: shaw-2000 }

core_region: The Nile valley, Nubia and the Levant

rulers:
  founder: { name: Ahmose I, reign: [-1550, -1525], source: shaw-2000 }
  peak: { name: Thutmose III, reign: [-1479, -1425], source: shaw-2000 }
  last: { name: Ramesses XI, reign: [-1107, -1077], source: shaw-2000 }

scripts_and_languages:
  administration: [Egyptian, Akkadian]
  writing_system: Hieroglyphic and hieratic

ended:
  type: fragmentation
  by: []
  year: -1077
  source: shaw-2000

# The predecessor now has its own record and the relationship is an edge
# there rather than an external note here; the Tanite kings still have
# none, so that direction stays external.
succeeded_by_external:
  - name: the Tanite kings and the High Priests of Amun
    year: 1077
    note: >-
      The kingdom did not fall to anybody. It divided: a Ramesside line at Tanis
      in the Delta holding the title, and the High Priest of Amun at Thebes
      holding the south with an army and the temple estates. Wenamun sailed for
      Byblos under that arrangement, with letters from the High Priest and no
      authority behind them.
    source: breasted-1912

institutions:
  # The New Kingdom is where Egypt acquires a permanent army. Divisions named
  # for gods, career soldiers, a chariot arm, and a command structure that
  # produced kings — and beside it the settlement of veterans on land in return
  # for continued obligation, which is `land-grant` and is the same institution
  # this corpus codes for the kleruchy, the katoikiai and the iqta'.
  military_basis: { values: [standing-professional, land-grant], source: shaw-2000 }
  # Three, unranked, and the third is why the Amarna letters are full of other
  # kings asking for presents. The land tax of the most productive agricultural
  # country in the ancient world; tribute from the Levantine vassals and Nubia;
  # and the Nubian gold mines, which made Egypt the only great power of the
  # period with a bullion surplus and are most of its diplomatic position.
  revenue_basis: { values: [land-tax, tribute, mining], source: kemp-2018 }
  # Hereditary in the male line with co-regency used to secure it, and the rule
  # was violated often enough to produce a woman on the throne as king, a
  # general, and at least one succession settled by a queen writing to a foreign
  # court for a husband. Coded by the rule, as coding rule 7 requires.
  succession_rule: { values: [primogeniture], source: shaw-2000 }
  # The most literal divine kingship in the corpus and the longest-running. The
  # king is Horus while living, the son of Ra, and Osiris when dead; the
  # titulary states it in five names; the temple reliefs show him alone among
  # the gods, at their scale, making offerings to them. `descent` is the second
  # value and it is descent from a god rather than from a dynasty.
  legitimation: { values: [divine-sanction, descent], source: kemp-2018 }

turning_points:
  - year: -1457
    type: battle
    name: "Megiddo"
    changed: >-
      What Megiddo actually established was a record-keeping habit as much as
      a frontier. The army's own day-books, kept for this campaign and cut
      onto the Karnak walls afterward, became the model for how every later
      Egyptian campaign was documented, which is why the sixteen campaigns
      that followed are known in far more tactical detail than anything from
      the Old or Middle Kingdom put together.
    source: shaw-2000
    contested: false
  - year: -1353
    type: conversion
    name: "Akhetaten"
    changed: >-
      What made the reversal total rather than partial was the theology's own
      design: access to the one god that mattered had been made to run
      through a single family, so when that family lost the throne there was
      no surviving constituency invested in keeping any part of the change.
      Every other religious innovation in three thousand years of Egyptian
      kingship added a cult without threatening the priesthoods already in
      place; this one removed their whole function, which is why it could
      not be met with reform and was instead met with erasure.
    source: kemp-2018
    contested: false
  - year: -1259
    type: treaty
    name: "The Egyptian-Hittite treaty"
    changed: >-
      A king could bind his own successors to peace only by making the oath a
      matter between one state's gods and another's, since neither monarchy
      had an institution above the throne capable of enforcing an agreement
      on the throne's behalf. That is a structural admission each side made
      about its own kingship as much as an agreement about the other's, which
      is why breaking the treaty was framed, in both surviving copies, as an
      offence against the witnessing gods rather than merely against the
      other king.
    source: shaw-2000
    contested: false
  - year: -1177
    type: battle
    name: "The Sea Peoples"
    changed: >-
      Surviving where every other Bronze Age power did not bought Egypt
      roughly a century more as a great power and nothing beyond that: the
      same invasions that ended Hatti, Ugarit and Mycenaean Greece outright
      left Egypt intact but broke the fiscal and military capacity that had
      made it a great power in the first place. Survival and continued
      strength turned out to be two different things, and the same battle
      only purchased one of them.
    source: shaw-2000
    contested: false

# Egypt's Old Kingdom, across the First Intermediate Period and the Middle
# Kingdom. The only one of the four pairs where a whole further kingdom sits in
# the gap, which is a reason to be careful with the claim and not a reason to
# refuse it: Egyptian kingship is one continuous institution in a way Babylonian
# kingship is not, and the New Kingdom's own archaism says so louder than this
# site could.
resumes: egypt-old-kingdom

measures:
  # Citation corrected from taagepera-1979 while the Hittite and Babylonian
  # figures were being entered from the same tables. taagepera-1979 covers
  # 600 BC to 600 AD by its own title and cannot contain a figure dated 1450 BC;
  # the tabulation that runs from 3000 BC is taagepera-1978b, which is what the
  # Akkadian record on this site already cited. The figure is unchanged.
  reach_km2: { value: 1000000, at: -1450, source: taagepera-1978b }
  peak_population: null
  influence:
    descendant_scripts: { count: null, items: [], source: null }
    religions_carried: { count: null, items: [], source: null }
    # One. The Kushite kings of the twenty-fifth dynasty took the full five-name
    # pharaonic titulature, restored temples this record's own chapters describe,
    # revived Middle Kingdom artistic and textual forms deliberately, and
    # presented themselves as restorers of an Egyptian order the delta princes
    # had let go. That is titulature publicly asserted, which is rule 1's
    # paradigm case, and it is asserted by a dynasty from upstream of the country
    # this record is about.
    #
    # It is counted here rather than on a later Egyptian record because there is
    # no later Egyptian record: this corpus carries the Old and New Kingdoms and
    # nothing between the twentieth dynasty and the Ptolemies.
    successor_claims:
      count: 1
      items: [Kingdom of Kush]
      source: welsby-1996
