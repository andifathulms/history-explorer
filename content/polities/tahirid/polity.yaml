id: tahirid
region: iranian-intermezzo
name:
  latin: Tahirid Dynasty
  script: طاهریان
  script_lang: fa

span:
  start: { min: 821, max: 821, source: bosworth-1996 }
  end: { min: 873, max: 873, source: bosworth-1996 }

identity: >-
  Abbasid governors of Khurasan who made the governorship hereditary without
  ever ceasing to be governors.

capitals:
  - { name: Merv, from: 821, to: 830, source: iranica-taherids }
  - { name: Nishapur, script: نیشابور, from: 830, source: iranica-taherids }

core_region: Khurasan

rulers:
  founder:
    name: Tahir I ibn al-Husayn
    script: طاهر بن الحسین
    reign: [821, 822]
    source: bosworth-1996
  peak:
    name: Abdallah ibn Tahir
    script: عبدالله بن طاهر
    reign: [828, 845]
    source: bosworth-1996
  last:
    name: Muhammad ibn Tahir
    script: محمد بن طاهر
    reign: [862, 873]
    source: bosworth-1996

scripts_and_languages:
  administration: [Arabic, Persian]
  writing_system: Perso-Arabic

ended:
  type: conquest
  by: [saffarid]
  year: 873
  source: iranica-taherids

institutions:
  # The Khurasani regiments the Abbasid revolution had been made with, which
  # Tahir commanded at Baghdad in 813 and which his family went on drawing on.
  # Not slave-soldier: the Tahirid army predates the Turkish guard and is the
  # thing al-Mu'tasim's purchases were meant to replace.
  military_basis: { values: [standing-professional], source: chi-4 }
  # Khurasan's land tax, and the Tahirid distinction is that they remitted it.
  # The sources suggest the province sent more to Baghdad under them than
  # before, which is why the caliphs kept reappointing the family.
  revenue_basis: { values: [land-tax], source: chi-4 }
  # In form the caliph appointed each governor; in practice he appointed the
  # last one's son, brother or nephew for fifty years. The first chapter is
  # about the gap between the two.
  #
  # The field now carries both, which it could not before. `external-nomination`
  # is the form the polity itself insisted on — the caliph appointing — and
  # `nomination` is what the appointment actually followed. Coding rule 7's note
  # on this value says to code both where both are attested, and this record is
  # the case that note was written from.
  succession_rule: { values: [nomination, external-nomination], source: iranica-taherids }
  legitimation: { values: [caliphal-investiture], source: iranica-taherids }

turning_points:
  - year: 822
    type: revolt
    name: "The name left out of the khutba"
    changed: >-
      Tahir omitted the caliph's name from the Friday sermon at Merv, which is
      the formal act by which a polity states whose authority it holds under.
      He was dead within days and no source connects the two. What followed
      settled the dynasty's method for fifty years: al-Ma'mun did not reclaim
      the province but appointed Tahir's son, and a governorship became
      hereditary without ever ceasing to be a governorship.
    source: iranica-taherids
    contested: true
  - year: 865
    type: siege
    name: "Baghdad besieged, and a caliph traded"
    changed: >-
      The Tahirid holding the security command of Baghdad sheltered the caliph
      al-Musta'in and held the city against the Samarra army for most of a
      year, then negotiated his abdication in exchange for keeping his own
      position. A provincial family was arbitrating the succession to the
      caliphate, which is as far as the arrangement could be taken and the last
      time it worked.
    source: chi-4
    contested: false

measures:
  # No consulted dataset gives a Tahirid extent. Taagepera's series does not
  # descend to the governorate scale, and computing one from a map polygon is
  # forbidden by hard rule 5. The axis is a gap.
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: iranica-taherids }
    # The Tahirids governed long-Muslim Khurasan. Maintaining an established
    # tradition inside already-held territory is not propagation under the
    # coding rules, so this is 0 rather than a gap.
    religions_carried: { count: 0, items: [], source: iranica-taherids }
    successor_claims: { count: 0, items: [], source: iranica-taherids }
