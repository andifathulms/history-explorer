id: greco-bactria
region: pre-islamic-iran

name:
  latin: Greco-Bactrian Kingdom
  script: Βακτριανή
  script_lang: grc

# 256 is the conventional date for Diodotus' secession from the Seleucids and is
# a range in the scholarship rather than a fixed year; 125 is the loss of
# Bactria to the Yuezhi, which is likewise approximate. Both ends of this span
# are reconstructions from coins.
span:
  start: { min: -256, max: -246, source: mairs-2014 }
  end: { min: -145, max: -125, source: mairs-2014 }

identity: >-
  A Greek kingdom on the Oxus, known almost entirely from its own coins and one
  excavated city, which held Bactria for a century and sent a branch of itself
  over the Hindu Kush into India.

capitals:
  - { name: Bactra, script: Βάκτρα, source: mairs-2014 }
  - { name: Ai-Khanoum, source: mairs-2014 }

core_region: Bactria and Sogdiana, between the Hindu Kush and the Oxus

rulers:
  founder: { name: Diodotus I, source: mairs-2014 }
  peak: { name: Eucratides I, source: mairs-2014 }
  # The last kings are known from coins and the sequence is disputed; this site
  # does not name one.
  last: { name: null, source: null }

scripts_and_languages:
  administration: [Greek, Aramaic]
  writing_system: Greek

# The Yuezhi, a confederation displaced westward out of the Chinese frontier by
# the Xiongnu, took Bactria in the 140s and 130s. They are not in this corpus —
# the Kushan record two regions over is descended from them a century and a half
# later — so `by` is empty rather than pointed at the wrong people.
ended:
  type: conquest
  by: []
  year: -125
  source: mairs-2014

institutions:
  # The Seleucid katoikiai continued. Greek and Macedonian settlers held land in
  # and around the city foundations on condition of military service, and this
  # kingdom is what those foundations became when the chain back to the
  # Mediterranean broke. `mercenary` beside it for the same reason as on the
  # Seleucid record: a small settler population in an enormous country hired
  # continuously.
  military_basis: { values: [land-grant, mercenary], source: mairs-2014 }
  # Bactria is irrigated country and among the most agriculturally productive in
  # Central Asia, and it sat on the routes between India, Iran and the steppe.
  # Unranked.
  revenue_basis: { values: [land-tax, trade-toll], source: mairs-2014 }
  # Null, and the reason is evidential. The dynastic sequence is reconstructed
  # from coin types, overstrikes and hoards, and it shows several kings issuing
  # simultaneously in different mints; whether they were co-rulers, rivals or
  # branch kings is exactly the argument. There is no rule to code because there
  # is barely a sequence.
  succession_rule: null
  # `conquest` and `divine-sanction`. The kings styled themselves Soter, Nikator,
  # Theos and Aniketos on the coinage, put Zeus and Herakles and Apollo on the
  # reverse, and one of them — Eucratides — struck the largest gold coin of the
  # ancient world with his own portrait on it. In the absence of any narrative
  # source the coins are the self-description, which is a thin basis for this
  # field and is the only one there is.
  legitimation: { values: [conquest, divine-sanction], source: mairs-2014 }

turning_points:
  - year: -206
    type: treaty
    name: "Euthydemus and Antiochus"
    changed: >-
      Besieged in Bactra by the Seleucid king come to take the province back,
      Euthydemus argued that he owed the throne to killing an earlier
      usurper's line rather than to seceding himself, and warned that a war
      between the two Greek kingdoms would open the frontier to the nomads
      behind him. Antiochus accepted, recognised him as king, and married his
      son to a Seleucid princess. It is the best-attested event in the
      kingdom's history and the clearest statement of what it understood
      itself to be threatened by — a warning that came true roughly sixty
      years later, on a longer delay than either man expected.
    source: polybius-shuckburgh
    contested: false
  - year: -180
    type: revolt
    name: "Over the Hindu Kush"
    changed: >-
      Demetrius and his successors took armies south through the passes into
      Gandhara and the Punjab, and within a generation the Greek presence in
      Asia was two kingdoms rather than one — a Bactrian half that was
      eventually overrun from the steppe and an Indian half that lasted almost
      two centuries longer. It also split the dynasty's attention at the moment
      its northern frontier began to matter.
    source: mairs-2014
    contested: false
  # No battle in any source and no year that can be securely given: the coins
  # simply stop through the 130s. -125 is coded to match ended.year, the
  # latest bound of the range the scholarship gives, not because that
  # specific year is attested as the year of an event.
  - year: -125
    type: catastrophe
    name: "What came out of the steppe"
    changed: >-
      The Xiongnu drove the Yuezhi off the Gansu frontier in the 170s BC; the
      Yuezhi displaced the Sakas into Bactria and beyond; and the Yuezhi
      followed them, arriving in a country the Greek kingdom could no longer
      hold. Ai-Khanoum was abandoned around 145, the northern mints stopped,
      and the last Bactrian Greek coin issues are of the 130s. Nobody appears
      to have taken the country from anybody in a single dateable act — a
      chain of displacements begun two thousand kilometres away simply
      arrived and the coinage stopped.
    source: mairs-2014
    contested: true

measures:
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: null, items: [], source: null }
    religions_carried: { count: null, items: [], source: null }
    successor_claims: { count: null, items: [], source: null }
