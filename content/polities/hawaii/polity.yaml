id: hawaii
region: pacific-islands

name:
  latin: Kingdom of Hawaii
  script: null
  script_lang: null

# fornander-1880 dates Kamehameha's first real territorial rule - a
# third of Hawaii Island, won at the battle of Mokuohai - to 1782,
# following the death of King Kalaniopuu and the succession dispute
# with Kalaniopuu's son Kiwalao that Kamehameha's own role in Captain
# Cook's 1779 death (covered in this record's first chapter) precedes
# as backstory rather than as the founding itself.
span:
  start: { min: 1782, max: 1782, source: fornander-1880 }
  # alexander-hawaii-1899 dates the Committee of Safety's proclamation
  # abolishing the monarchy to 17 January 1893, and Liliuokalani's own
  # surrender of authority to the same date - the end of the kingdom's
  # own independence, two years before Kamehameha I's own line had
  # even finished its first century of rule. The 1898 annexation to
  # the United States is covered as afterlife, beyond this span.
  end: { min: 1893, max: 1893, source: alexander-hawaii-1899 }

identity: >-
  A war god's guardian who won sole rule of Hawaii through battle,
  sacrifice and conquest, whose line ended without an heir two
  generations later, and whose elected successors lost the throne
  outright to a colony of residents backed by an American warship.

# fornander-1880 does not name a fixed capital for this period; power
# moved with Kamehameha's own court and campaigns between Kona,
# Kohala and, after 1795, Oahu.
capitals: []

core_region: The Hawaiian archipelago

rulers:
  founder: { name: "Kamehameha I", reign: [1782, 1819], source: alexander-hawaii-1899 }
  peak: { name: "Kamehameha I", reign: [1782, 1819], source: alexander-hawaii-1899 }
  # alexander-hawaii-1899 dates Liliuokalani's accession to 20 January
  # 1891 and her surrender of authority to 17 January 1893 - a reign
  # of just under two years, and the kingdom's last.
  last: { name: "Liliuokalani", reign: [1891, 1893], source: alexander-hawaii-1899 }

scripts_and_languages:
  administration: [Hawaiian]
  writing_system: null

institutions:
  military_basis: { values: [conscript, tribal-levy], source: fornander-1880 }
  revenue_basis: null
  # There was no fixed rule of succession beyond descent and the
  # favor of the ruling chief; Kalaniopuu's own division of authority
  # between his son Kiwalao and his nephew Kamehameha, and the war
  # that followed it, is the clearest evidence this source gives.
  succession_rule: { values: [factional], source: fornander-1880 }
  legitimation: { values: [descent, conquest, divine-sanction], source: fornander-1880 }

preceded_by_external: []

succeeded_by_external:
  - name: The Republic of Hawaii
    type: absorbed remnants of
    year: 1894
    note: >-
      The provisional government installed after Liliuokalani's
      overthrow was formally reconstituted as the Republic of Hawaii
      under President Sanford B. Dole in 1894, before itself seeking
      annexation to the United States - a government built from the
      outset to negotiate its own absorption rather than to govern
      independently.
    source: alexander-hawaii-1899

ended:
  type: internal usurpation
  by: []
  year: 1893
  source: alexander-hawaii-1899

turning_points:
  # Cook's 1779 death at Kealakekua Bay, covered in this record's first
  # chapter, is not listed as a turning point here: the span begins at
  # Kamehameha's own first rule in 1782, and 1779 falls outside it as
  # backstory rather than as an event in the polity's own history.
  - year: 1782
    type: battle
    name: "The battle of Mokuohai"
    changed: >-
      King Kiwalao was killed by the chief Keeaumoku after a land
      dispute drove several Kona chiefs into revolt, splitting Hawaii
      Island into three rival territories under Kamehameha,
      Keawemauhili and Keoua Kuahuula - Kamehameha's own first real
      rule, over a third of the island alone.
    source: fornander-1880
    contested: false
  - year: 1791
    type: treaty
    name: "Keoua killed at Puukohola"
    changed: >-
      Persuaded to travel to Kona for a reconciliation he seems to
      have half-expected would end in his own death, Keoua Kuahuula
      was speared by Keeaumoku the moment he stepped ashore and his
      body sacrificed at Kamehameha's newly finished war temple -
      ending the last rival claim to Hawaii Island and uniting it
      under one ruler for the first time since Mokuohai.
    source: fornander-1880
    contested: false
  - year: 1795
    type: battle
    name: "The battle of Nuuanu"
    changed: >-
      Kamehameha's forces broke Kalanikupule's Oahu army in the
      Nuuanu valley, driving a large part of it over the valley's own
      cliff face; the victory brought Hawaii, Maui, Kahoolawe, Lanai,
      Molokai and Oahu under a single government for the first time,
      and is treated by the source as the close of the old, disunited
      era of Hawaiian history.
    source: fornander-1880
    contested: false
  - year: 1810
    type: treaty
    name: "Kauai's peaceful cession"
    changed: >-
      Persuaded aboard ship by a trader's hostage and Kamehameha's own
      pledge of safety, Kaumuali'i of Kauai offered his islands
      outright and was allowed to keep them in fief for his own
      lifetime, on condition that Kamehameha's son Liholiho would
      inherit them - completing, for the first time, a single
      government over every inhabited island in the chain.
    source: alexander-hawaii-1899
    contested: false
  - year: 1819
    type: succession-crisis
    name: "Death of Kamehameha I"
    changed: >-
      Kamehameha died at Kailua on the 8th of May, at eighty-two,
      having refused a human sacrifice proposed to prolong his life
      with the words "the men are sacred to the king" - leaving the
      throne to his son Liholiho without a rival left alive to contest
      it.
    source: alexander-hawaii-1899
    contested: false
  - year: 1819
    type: reform
    name: "Abolition of the kapu system"
    changed: >-
      Liholiho's public breach of the eating taboo at Kailua, and the
      shout that followed it - "the gods are a lie" - brought down the
      whole structure of idol worship and taboo within days; a
      priest-backed rising in defense of the old order was crushed
      that December at the battle of Kuamo'o, ending organized
      resistance to the change.
    source: alexander-hawaii-1899
    contested: false
  - year: 1872
    type: succession-crisis
    name: "The Kamehameha line ends"
    changed: >-
      Kamehameha V died suddenly on the 11th of December without
      naming an heir, ending the dynasty founded by his great-uncle;
      the throne passed, for the first time, to a king chosen by vote
      of the legislature rather than by descent.
    source: alexander-hawaii-1899
    contested: false
  - year: 1893
    type: revolt
    name: "The Committee of Safety overthrows the monarchy"
    changed: >-
      A Committee of Safety, organized among the kingdom's resident
      merchants after Liliuokalani's own attempt to proclaim a new
      constitution, formed a provisional government with the backing
      of an American warship's landing force and proclaimed the
      monarchy abolished on the 17th of January; the queen surrendered
      her authority the same day rather than risk bloodshed.
    source: alexander-hawaii-1899
    contested: false

