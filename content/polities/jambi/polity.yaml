id: jambi
region: sumatra-and-the-peninsula

name:
  latin: Sultanate of Jambi
  # Written in Jawi, like Melaka's Malay, and null here for the reason
  # that record gives: a name in letters nobody on this project can
  # proofread is a decoration that reads as a citation.
  script: null
  script_lang: null

# jambi-penetration-2021 dates Sultan Abdul Kahar's own accession, as the
# first ruler to hold the title Sultan in Jambi, to 1615 - the same year
# the earliest Dutch trade contact was established there.
span:
  start: { min: 1615, max: 1615, source: jambi-penetration-2021 }
  end: { min: 1904, max: 1904, source: jambi-penetration-2021 }

identity: >-
  The upstream heir of old Melayu, a river sultanate that spent centuries
  as Palembang's rival and occasional ally over the same pepper and tin
  trade, prosperous enough by the 1670s to nearly destroy a Malay neighbor
  twice its own size.

capitals:
  - { name: "Jambi (on the Batang Hari river)", source: andaya-b-1993 }

core_region: The Batang Hari river basin, eastern Sumatra

rulers:
  founder: { name: "Sultan Abdul Kahar", reign: [1615, 1643], source: jambi-penetration-2021 }
  peak: { name: null, source: null }
  # Killed at Bedaro on 21 April 1904 while still pursuing his own
  # long-standing aim of driving the Dutch out of Jambi.
  last: { name: "Sultan Thaha Syaifuddin", source: jambi-penetration-2021 }

scripts_and_languages:
  administration: [Malay]
  writing_system: Jawi

institutions:
  military_basis: null
  revenue_basis: { values: [trade-toll], source: andaya-b-1993 }
  succession_rule: null
  legitimation: { values: [descent], source: andaya-b-1993 }

ended:
  type: conquest
  by: []
  year: 1904
  source: jambi-penetration-2021

preceded_by_external:
  - name: "Malayu (Jambi-Melayu)"
    year: null
    note: >-
      The same river system carried an older kingdom, Malayu, that
      succeeded Srivijaya's own position as the region's paramount trading
      power and that Singhasari's own Pamalayu expedition targeted in the
      thirteenth century - the ancient predecessor to the later Islamic
      sultanate governed from the same river.
    source: andaya-b-1993

succeeded_by_external: []

turning_points:
  - year: 1673
    type: siege
    name: "The sack of Johor Lama"
    changed: >-
      A Malay polity sacked another Malay polity outright, driving Johor's
      own court out of its river capital and into the Riau islands -
      a war over precedence and trade settled purely between two rival
      Sumatran and Malay courts, nobody else's fleet or garrison anywhere
      near it.
    source: andaya-b-1993
    contested: false
  - year: 1690
    type: succession-crisis
    name: "A prince crowns himself upstream"
    changed: >-
      After the Dutch arrested and exiled the sultan over the killing
      of their own trading-post chief and installed his son as a
      replacement ruler in his place, the rightful heir, Pangeran
      Ratu, refused to accept the substitution and had himself
      crowned instead at Muara Tebo as Sultan Sri Maharaja Batu, with
      Minangkabau backing and the recognition of the Minangkabau king
      at Pagaruyung - splitting the sultanate into rival upstream and
      downstream courts.
    source: jambi-penetration-2021
    contested: false
  - year: 1835
    type: treaty
    name: "The Sungai Baung agreements"
    changed: >-
      Sultan Muhammad Fachruddin's request for Dutch help against
      river pirates and a rebellious Palembang dependency in 1833 was
      answered with a price: agreements signed at Sungai Baung placed
      Jambi under formal Dutch protection, granted the Dutch excise
      and salt-monopoly rights, and bound the sultan and his heir to
      an annual stipend - the direct provocation that would define his
      son and successor Thaha Syaifuddin's own refusal to be bound by
      it.
    source: jambi-penetration-2021
    contested: false
  - year: 1858
    type: succession-crisis
    name: "The Dutch depose Sultan Thaha by decree"
    changed: >-
      Thaha Syaifuddin's outright refusal to honor his father's
      treaties, including a direct appeal to the Ottoman Sultan as
      Caliph to ban outside interference in Jambi, led the Dutch to
      declare him deposed on 25 September 1858 without any Jambi
      institution's involvement; an attack on the capital that
      November drove him into exile at Muara Tembesi, while the Dutch
      installed his own uncle as a replacement sultan in his place.
    source: jambi-penetration-2021
    contested: false

