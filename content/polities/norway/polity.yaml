id: norway
region: scandinavia

name:
  latin: Kingdom of Norway
  script: Norge
  script_lang: no

span:
  # Snorri Sturluson's Heimskringla traces the royal line back through a
  # saga genealogy of legendary Swedish kings descended from the god
  # Frey - foundation legend rather than history. The first ruler this
  # record treats as historical is Harald Fairhair, whose unification
  # of Norway is dated by the saga tradition to the Battle of Hafrsfjord
  # in 872.
  start: { min: 872, max: 872, source: boyesen-norway-1886 }
  # This record currently runs only to Haakon Haakonsson's death in the
  # Orkneys in 1263 - the last event it has sourced chapters for - not
  # to the kingdom's actual institutional end, since Norway has none:
  # it continues as a sovereign state to the present day. `ended` below
  # is null for that reason as well as for the coverage reason.
  end: { min: 1263, max: 1263, source: boyesen-norway-1886 }

identity: >-
  A collection of Norwegian petty kingdoms Harald Fairhair united by
  conquest at Hafrsfjord in 872, ruled at its medieval height by
  Haakon Haakonsson, whose diplomatic reach brought Iceland and
  Greenland under Norwegian overlordship before his death in Orkney
  in 1263.

capitals: []

core_region: The western and southwestern Norwegian coast and fjords, from Agder to Trøndelag

rulers:
  # Chapter heading dates give Harald's reign as 860-930; 872 is the
  # year of Hafrsfjord, the decisive battle within it, not his
  # accession.
  founder: { name: "Harald Fairhair (Harald Hårfagre)", reign: [860, 930], source: boyesen-norway-1886 }
  # Revised again: Magnus the Good's five years ruling Norway and
  # Denmark together was real but brief. Haakon Haakonsson's own reign
  # - forty-six years, a navy strong enough to force Denmark to terms
  # without a battle, a Papal invitation to stand as candidate for Holy
  # Roman Emperor, and the first-ever submission of Iceland and
  # Greenland to the Norwegian crown in 1261 - is a wider and far more
  # durable reach of authority than any king in this record, including
  # Magnus, has held.
  peak: { name: Haakon Haakonsson the Old, reign: [1217, 1263], source: boyesen-norway-1886 }
  last: null

scripts_and_languages:
  administration: [Old Norse]
  writing_system: Younger Futhark runes

institutions:
  # Harald's earls kept a third of the taxes they collected in exchange
  # for maintaining sixty warriors at the king's call, and their own
  # sub-vassals, the hersir, held royal estates on condition of keeping
  # twenty warriors ready - a fief-for-service arrangement built on the
  # conquered kingdoms' own land.
  military_basis: { values: [land-grant], source: boyesen-norway-1886 }
  # Harald declared all land the property of the crown and stripped the
  # peasantry of their former allodial (freehold) rights, reducing them
  # to tenants taxed on land they had once owned outright.
  revenue_basis: { values: [land-tax], source: boyesen-norway-1886 }
  succession_rule: null
  # Harald's own claim rested on conquest, province by province, over
  # kings who could not stand against him; the Yngling genealogy
  # tracing his line to the god Frey is the saga's own claim of descent.
  legitimation: { values: [conquest, descent], source: boyesen-norway-1886 }

preceded_by_external: []

succeeded_by_external: []

# Norway did not end with Harald Fairhair's unification - it continues
# as a sovereign state to the present day. This record's own span ends
# where its sourced coverage currently stops, not because a conquest,
# dynastic replacement or fragmentation actually ended the kingdom
# there.
ended: null

turning_points:
  - year: 872
    type: battle
    name: "The Battle of Hafrsfjord"
    changed: >-
      A coalition of Norwegian chieftains who had each separately lost
      to Harald combined their fleets in a last stand near modern
      Stavanger, and were broken when Harald's own berserkers stormed
      aboard their ships - the battle Snorri's saga remembers as
      Norway's greatest, and the one that left Harald with no rival
      left in the country.
    source: boyesen-norway-1886
    contested: true
  - year: 961
    type: battle
    name: "The Battle of Fitjar"
    changed: >-
      Haakon the Good, who had won the throne from his own tyrannical
      half-brother by promising to restore rights their father had
      taken away, died defending it against that brother's returning
      sons at Fitjar - refusing Christian burial in death as he had
      declined to force his own faith on his people in life, and asking
      with his last act that the men who had just tried to kill him
      take the kingdom he left without an heir.
    source: boyesen-norway-1886
    contested: false
  - year: 995
    type: succession-crisis
    name: "Olaf Tryggvason proclaimed at the Øre-thing"
    changed: >-
      An assassination plot against a returning grandson of Harald
      Fairhair backfired when Olaf Tryggvason found Trøndelag already
      in revolt against the unpopular Earl Haakon, who died in
      disgrace; the assembled chieftains and peasants proclaimed Olaf
      king at the Øre-thing, establishing Trøndelag's own lasting right
      to proclaim Norway's kings and Trondheim as their coronation site
      ever since.
    source: boyesen-norway-1886
    contested: false
  - year: 1000
    type: battle
    name: "The Battle of Svolder"
    changed: >-
      A conspiracy of Danish, Swedish and Norwegian rivals ambushed
      Olaf Tryggvason's fleet behind the island of Svolder with the
      connivance of his own escort; heavily outnumbered, his ships were
      cut off one by one until Olaf, his own flagship overwhelmed,
      went over the side in full armour rather than be taken - and the
      victors divided the kingdom he had briefly forced into Christian
      unity among themselves.
    source: boyesen-norway-1886
    contested: false
  - year: 1028
    type: succession-crisis
    name: "Cnut buys the Norwegian chiefs"
    changed: >-
      Years of bribery among disaffected Norwegian chieftains let Cnut
      the Great sail into Trondheim unopposed and take the crown for
      his own, installing a young nephew as his regent there and
      forcing Olaf Haraldsson - already weakened and without real
      support after a series of setbacks - into flight and, within a
      year, exile in Russia.
    source: boyesen-norway-1886
    contested: false
  - year: 1030
    type: battle
    name: "The Battle of Stiklestad"
    changed: >-
      Olaf Haraldsson's attempt to fight his way back from exile ended
      in defeat by a peasant army roughly twice the size of his own at
      Stiklestad, where he was struck down by two of his own former
      subjects with old grievances against him; a total solar eclipse
      that afternoon, which peasants took for divine anger, is a rare
      case where modern astronomical reckoning bears the saga's own
      account out, and his death did more than his life's own campaigns
      to root Christianity in Norway for good.
    source: boyesen-norway-1886
    contested: false
  - year: 1042
    type: succession-crisis
    name: "Magnus the Good becomes king of Denmark too"
    changed: >-
      An inheritance pact struck with Harthacnut of Denmark in 1038
      came due when Harthacnut died without an heir, and a Danish
      assembly recognized Magnus as its own new sovereign without a
      fight - the first time both Norse kingdoms answered to a single
      ruler at once, and a wider reach than Harald Fairhair's own
      descendants had held before.
    source: boyesen-norway-1886
    contested: false
  - year: 1066
    type: battle
    name: "The Battle of Stamford Bridge"
    changed: >-
      Harald Hardrada's invasion of England, launched at Earl Tostig's
      urging with a fleet larger than any the kingdom had sent abroad
      before, won an early victory at Fulford before an unarmoured camp at Stamford
      Bridge was caught entirely by surprise; Harald died with an arrow
      through the throat, Tostig fell fighting on after him, and what
      remained of the army straggled back to its ships under cover of
      dusk - the end, in most tellings, of the Viking Age itself.
    source: boyesen-norway-1886
    contested: false
  - year: 1181
    type: battle
    name: "The Battle of Nordnes"
    changed: >-
      Sverre Sigurdsson, standing exposed under a hail of missiles
      without a shield, sang a hymn through a naval battle he was
      losing until King Magnus Erlingsson was wounded and fell on his
      own blood-slicked deck; a commander who assumed the king dead cut
      his fleet's mooring ropes and fled, handing a battle Magnus had
      been on the point of winning to Sverre's own Birchlegs instead.
    source: boyesen-norway-1886
    contested: false
  - year: 1184
    type: battle
    name: "The Battle of Norefjord"
    changed: >-
      Fourteen Birchleg ships, caught by surprise while punishing a
      rebellious district, were surrounded by a royal fleet nearly
      twice their number under King Magnus - and won regardless, in
      fighting that ran past midnight and killed two thousand men
      including Magnus himself, who drowned rather than be taken;
      his death ended organized resistance to Sverre's own claim to a
      throne no one could ever prove or disprove he was born to.
    source: boyesen-norway-1886
    contested: false
  - year: 1261
    type: treaty
    name: "Iceland and Greenland submit"
    changed: >-
      Decades of feuding among its own leading families left Iceland's
      old commonwealth too exhausted to resist a foreign crown any
      longer, and its assembly accepted Haakon as overlord in exchange
      for tribute; distant Greenland followed the same year. Neither
      submission cost Norway a soldier - both were the product of a
      naval reputation strong enough to settle arguments before they
      became battles.
    source: boyesen-norway-1886
    contested: false
  - year: 1263
    type: battle
    name: "Largs and the death of Haakon the Old"
    changed: >-
      A dispute over Orkney and Shetland brought Haakon to Scotland in
      person, past fifty and fresh from a storm that wrecked part of
      his fleet, to fight an inconclusive battle at Largs that each
      side would later claim as its own victory; he wintered in Orkney
      afterward and died at Kirkwall that December while listening to
      his own family's sagas read aloud, expiring during the account of
      his grandfather Sverre's reign.
    source: boyesen-norway-1886
    contested: false

