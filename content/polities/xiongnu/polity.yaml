id: xiongnu
region: turkic-steppe

name:
  latin: Xiongnu Confederation
  script: 匈奴
  script_lang: zh

span:
  start: { min: -209, max: -209, source: di-cosmo-2002 }
  end: { min: 91, max: 91, source: di-cosmo-2002 }

identity: >-
  The first steppe confederation large enough to force a settled empire to
  negotiate, and the model every later one followed.

capitals:
  - { name: Longcheng, script: 龍城, from: -209, source: di-cosmo-2002 }

core_region: The Mongolian steppe

rulers:
  founder: { name: Modu Chanyu, reign: [-209, -174], source: di-cosmo-2002 }
  peak: { name: Modu Chanyu, reign: [-209, -174], source: di-cosmo-2002 }
  last: { name: Unknown, reign: [91, 91], source: di-cosmo-2002 }

scripts_and_languages:
  administration: [Xiongnu, Chinese]
  writing_system: None recorded

ended:
  type: fragmentation
  by: []
  year: 91
  source: di-cosmo-2002

# The power Modu displaced. A real predecessor with no record here, so it is
# named rather than left as an absence; not an edge, because an edge joins two
# records.
preceded_by_external:
  - name: the Yuezhi
    type: overthrew
    year: null
    note: >-
      The dominant power of the eastern steppe corridor before the
      confederation, and the people Touman sent his heir to as a hostage before
      attacking them in the hope of getting him killed. Modu broke them within a
      few years of taking the title and drove them west, in a migration that
      eventually put them in Bactria, where their descendants founded the Kushan
      empire.
    source: di-cosmo-2002

