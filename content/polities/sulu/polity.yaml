id: sulu
region: the-eastern-archipelago

name:
  latin: The Sultanate of Sulu
  script: null
  script_lang: null

# 1450 is the traditional founding under Sayyid Abu Bakr. 1915 is the Carpenter
# Agreement, under which the sultan renounced temporal sovereignty to the United
# States and kept his religious authority.
span:
  start: { min: 1450, max: 1450, source: majul-1973 }
  end: { min: 1915, max: 1915, source: majul-1973 }

identity: >-
  The sultanate of the archipelago between Borneo and Mindanao, which supplied
  the China trade with sea produce taken by other people's fleets and outlasted
  three empires before signing away its sovereignty to a fourth.

capitals:
  - { name: Jolo, from: 1450, source: majul-1973 }

core_region: The Sulu archipelago, with dependencies in north-east Borneo, Palawan and the Zamboanga coast of Mindanao

rulers:
  founder: { name: Sayyid Abu Bakr, source: majul-1973 }
  peak: { name: Azim ud-Din I, reign: [1735, 1773], source: majul-1973 }
  last: { name: Jamalul Kiram II, reign: [1894, 1936], source: majul-1973 }

scripts_and_languages:
  administration: [Tausug, Malay, Arabic]
  writing_system: Jawi — the Arabic script adapted for Tausug and Malay

# The 1915 agreement is a document rather than a defeat: the sultan gave up
# temporal sovereignty and kept his position as head of the Muslim community.
# `by` is empty because the United States is not in this corpus — the only record
# on this site to end that way, and the last by date of fourteen empty `by` fields
# across the archipelago.
ended:
  type: gradual absorption
  by: []
  year: 1915
  source: majul-1973

# Both ends. The datu polity the sultanate was grafted onto, and the power that
# took its sovereignty by document in 1915. Neither has a record here.
preceded_by_external:
  - name: the datus of the islands
    year: null
    note: >-
      The sultanate's own tradition is candid that it was built on something.
      Sayyid Abu Bakr arrived by way of Palembang and married the daughter of
      the ruling datu, and it is the marriage that the polity dates itself from —
      which concedes that the local house was there, was worth marrying into, and
      had a court to marry into. Maimbung, where several of the last sultans
      later held court, is supposed to have been the seat of the earliest
      non-Islamic rulers of the islands.
    source: majul-1973
succeeded_by_external:
  - name: the United States
    type: conquered by
    year: 1915
    note: >-
      Sovereignty passed by the Carpenter Agreement rather than by a campaign:
      the sultan renounced temporal power and kept the religious headship of the
      Muslims of Sulu, which his successors hold. The sultanate had already
      instructed its people not to fight the Americans in 1899, and its scholars
      afterwards reasoned their way to the position that the categories of the
      old wars no longer applied.
    source: majul-1973

institutions:
  # The raiding fleets of the Iranun and the Balangingi, who were clients and
  # allies of the sultanate rather than its subjects and who kept most of what
  # they took. It is the same relation this corpus's Srivijaya, Melaka and Johor
  # records carry with the orang laut, in a different sea and to a different
  # purpose: those fleets made a strait safe, and these ones made a region
  # dangerous on the sultanate's behalf.
  military_basis: { values: [client-levy], source: majul-1973 }
  # `trade-toll` and `plunder`, which is the coding this corpus's Champa record
  # carries and which no other record on this site does. Two polities six
  # thousand kilometres and a thousand years apart, on two coasts of the same
  # trade route, both selling what their hinterland produced and taking what
  # passed when selling was not enough.
  #
  # What Sulu sold was tripang, pearl shell, birds' nests and wax, all of it
  # wanted in Canton. What it took was people, in numbers, from the coasts of
  # the Philippines and eastern Indonesia — and the labour that gathered the sea
  # produce was largely the same people.
  revenue_basis: { values: [trade-toll, plunder], source: majul-1973 }
  succession_rule: null
  legitimation: { values: [descent, divine-sanction], source: majul-1973 }

turning_points:
  - year: 1578
    type: siege
    name: Jolo
    changed: >-
      Spain took Brunei's capital in the same campaign season and held it
      only weeks; Sulu it never took at all, opening a struggle that
      outlasted the Spanish empire's own presence in the Philippines by
      more than three centuries without either side ever declaring it
      settled.
    source: majul-1973
    contested: false
  - year: 1848
    type: battle
    name: Balangingi
    changed: >-
      A technology, not a treaty, is what finally broke three centuries of
      raiding the sultanate had depended on for both its wealth and its
      workforce: a navy no longer bound to the monsoon could reach a base
      in the one season it had always been safe, and the economy Sulu had
      run on never recovered from the loss of both revenue and labour at
      once.
    source: majul-1973
    contested: false
  - year: 1915
    type: treaty
    name: Carpenter
    changed: >-
      Sixteen years after instructing its own people not to fight the
      Americans, and after its own scholars had reasoned their way to the
      position that the old categories of holy war no longer applied, the
      sultanate gave up temporal rule by signature rather than by defeat -
      keeping a religious headship its successors hold to this day, over
      a state that no longer exists to be head of.
    source: majul-1973
    contested: false

measures:
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: majul-1973 }
    # One. Sulu carried Islam through the archipelago that bears its name and on
    # to the Zamboanga coast and the interior of Mindanao, and the boundary it
    # crossed is the one that still marks the southern Philippines. Brunei's
    # count is for Borneo and Manila bay; this one is for the islands between.
    religions_carried:
      count: 1
      items: [Sunni Islam]
      source: majul-1973
    successor_claims: { count: 0, items: [], source: majul-1973 }
