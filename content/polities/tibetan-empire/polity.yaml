id: tibetan-empire
region: inner-asia

name:
  latin: Tibetan Empire
  script: བོད་ཆེན་པོ
  script_lang: bo

span:
  start: { min: 618, max: 618, source: beckwith-1987 }
  end: { min: 842, max: 842, source: beckwith-1987 }

identity: >-
  The plateau empire that fought the Tang and the caliphate at the same
  time, and briefly held both Chang'an and the Silk Road oases.

capitals:
  - { name: Lhasa, script: ལྷ་ས, from: 618, source: beckwith-1987 }

core_region: The Tibetan plateau and the Tarim basin

rulers:
  founder: { name: Songtsen Gampo, reign: [618, 649], source: beckwith-1987 }
  peak: { name: Trisong Detsen, reign: [755, 797], source: beckwith-1987 }
  last: { name: Langdarma, reign: [838, 842], source: beckwith-1987 }

scripts_and_languages:
  administration: [Tibetan]
  writing_system: Tibetan

ended:
  type: fragmentation
  by: []
  year: 842
  source: beckwith-1987

# Both real, both without a record here. Nothing conquered or inherited the
# empire in 842, so the successor row omits `type` and lets the note carry the
# relation.
preceded_by_external:
  - name: Zhangzhung
    type: absorbed remnants of
    year: null
    note: >-
      The kingdom of the upper Sutlej and Ngari in western Tibet, with its own
      language, its own script and the Bon tradition attached to it. Songtsen
      Gampo married its ruler's sister, and the kingdom was absorbed into the
      empire during or shortly after his reign; its language survives in a
      handful of Dunhuang documents and in Bon texts.
    source: beckwith-1987

succeeded_by_external:
  - name: the kingdom of Guge, and the second transmission
    year: null
    note: >-
      No power took Tibet in 842 and none replaced the empire for four hundred
      years. A branch of the imperial line went west and founded Guge in Ngari,
      which paid for the second wave of Buddhist translation and invited Atisha
      from Bengal in the eleventh century; the monastic orders that dominate
      Tibetan history afterwards all form in that period, out of the books the
      empire had commissioned. When Tibet is next governed as a unit, in the
      thirteenth century, it is by the abbots of Sakya on behalf of the Mongols.
    source: beckwith-1987

measures:
  reach_km2: { value: 4600000, at: 800, source: taagepera-1997 }
  peak_population: null
  influence:
    descendant_scripts:
      count: 1
      items: [Tibetan script]
      source: beckwith-1987
    religions_carried:
      count: 1
      items: [Tibetan Buddhism]
      source: beckwith-1987
    successor_claims: { count: null, items: [], source: null }
