id: house-of-austria
region: bohemia

name:
  latin: The House of Austria
  script: Haus Österreich
  script_lang: de

# Coxe's own book dates "the foundation of the monarchy by Rhodolph of
# Hapsburgh" to his 1273 election as King of the Romans - the point at
# which a minor Swabian count became a crowned monarch at all, and the
# precondition for everything that followed. Austria and Styria did
# not become the family's own territory until Rudolf invested his sons
# with them at the Diet of Augsburg in December 1282; that acquisition
# is carried below as a turning point rather than the span's own start,
# following the source's own periodization.
span:
  start: { min: 1273, max: 1273, source: coxe-austria-1847 }
  # This record currently runs to the 1499 peace with Louis XII, which
  # settled the Burgundian dispute against Maximilian's own son and
  # left the Habsburg-Swiss standoff over imperial obedience just short
  # of open war - the last events its sourced chapters cover, not an
  # institutional end.
  #
  # SCOPE DECISION (revised - this record is now bounded at BOTH ends):
  # this is deliberately the medieval half of a two-record split, not
  # the whole dynasty. The single-record plan that once ran this page
  # to 1792/1804 grew too large next to the rest of the corpus (a
  # 70-chapter draft against a typical 5-18 elsewhere, Ottoman's own
  # 18 spanning 623 years the closest comparable ceiling) and mixed two
  # genuinely different eras under one name.
  #
  # This record - "The House of Austria" - covers the single Habsburg
  # line from Rudolf I's 1273 election through Maximilian I's death in
  # 1519, the last point the whole inheritance sits under one person
  # before it permanently forks between Charles V (Spain, Burgundy,
  # the Americas, the Imperial title - out of this region's scope) and
  # his brother Ferdinand (Austria itself, from the 1521-22 division of
  # the inheritance). Extend this record only as far as 1519; it is not
  # sourced past Maximilian's death and should not be.
  #
  # The composite Austria-Bohemia-Hungary state Ferdinand went on to
  # build - what historians actually mean by "the Habsburg Monarchy" -
  # is a separate record, id `habsburg-monarchy`, starting at the 1526
  # Battle of Mohács and running toward 1804 (Francis II's
  # self-coronation as Emperor of Austria; a second source will be
  # needed to reach that year, since coxe-austria-1847 stops at 1792).
  # The succession from this record to that one is a real edge in
  # edges.yaml, not succeeded_by_external, since both are records in
  # this collection. Target roughly 15-18 chapters for that record,
  # consolidated by era/reign rather than by individual battle, on the
  # Ottoman record's own model - not a continuation of this record's
  # original, much finer-grained chapter density.
  end: { min: 1499, max: 1499, source: coxe-austria-1847 }

identity: >-
  A minor Swabian count's family, raised to the German crown by
  electors who wanted a weak monarch, that briefly reunited Austria,
  Hungary and Bohemia under Albert V, lost Vienna to Matthias Corvinus,
  and under Maximilian I found a French king's conquest of Rome itself
  could not move a German diet.

capitals:
  - { name: Vienna, from: 1280, source: coxe-austria-1847 }

core_region: The Duchies of Austria, Styria, Carinthia (from 1335) and Tyrol (from 1363), along the middle Danube

rulers:
  # Coxe's own subtitle names Rudolf "the great founder of the House of
  # Austria," even though he never personally held the title Duke of
  # Austria - he settled the duchy on his sons Albert and Rudolph II by
  # investiture in 1282 and vested its sole administration in Albert
  # alone the following year, while he himself remained King of the
  # Romans, based elsewhere in the empire.
  founder: { name: "Rudolf I of Habsburg (Rhodolph of Hapsburgh)", source: coxe-austria-1847 }
  # Revised from Rudolf I: Albert held Austria, Hungary and Bohemia
  # simultaneously and was elected King of the Romans besides - the
  # first Habsburg since Rudolf I to hold the German crown, and the
  # first ever to combine it with two further kingdoms at once. His
  # reign lasted barely two years, but the reach itself, while it
  # lasted, exceeded any predecessor's on this record.
  peak: { name: "Albert V (Albert II of Germany)", reign: [1437, 1439], source: coxe-austria-1847 }
  last: null

scripts_and_languages:
  administration: [German, Latin]
  writing_system: Latin alphabet

institutions:
  military_basis: null
  revenue_basis: null
  succession_rule: null
  # Rudolf's own crown came from election, explicitly won through a
  # coalition of electors he cultivated by marrying his daughters to
  # their sons - "the electors, who desired an emperor, but dreaded a
  # master," per Coxe's own account. Austria and Styria, by contrast,
  # passed to his own sons by his personal investiture and grant, a
  # dynastic transfer rather than an elected one.
  legitimation: { values: [election, investiture], source: coxe-austria-1847 }

preceded_by_external: []

succeeded_by_external: []

# Null until this record's own chapters actually reach 1519 (see the
# span comment above). Once they do, this should become a real,
# sourced `ended` entry: type fragmentation, year 1519 or 1521/22 (the
# formal division of the inheritance between Charles V and Ferdinand),
# by: [habsburg-monarchy] - Ferdinand's own line, the only branch this
# corpus carries forward as a record. Charles V's own branch (Spain,
# Burgundy, the Americas, the Imperial title) is real but out of this
# region's scope and is not a record here, so it does not appear in
# `by`. Not a claim the House of Austria's own bloodline ended in
# 1519: it split rather than died out, which is exactly what
# `fragmentation` is for.
ended: null

# Trimmed from sixty-seven hinges to the ones that survive a chronicle
# compressed from seventy chapters to under thirty: one per chapter or
# consolidated chapter-group, tracing the family's own rise to Albert
# V's triple crown and its long, uneven aftermath, rather than every
# succession and battle the source narrates in full.
turning_points:
  - year: 1273
    type: succession-crisis
    name: "Rudolf's election as King of the Romans"
    changed: >-
      The electors passed over both favourites for the vacant German
      crown - Bohemia's own king among them - and settled instead on a
      minor Swabian count whose modest territories made him look easy
      to control, a calculation about to be proven badly wrong.
    source: coxe-austria-1847
    contested: false
  - year: 1278
    type: battle
    name: "The Battle of Marchfeld"
    changed: >-
      Rudolf's army broke Ottokar's forces near the March river after
      Ottokar refused every offer of peace, and Ottokar himself, unhorsed
      and overpowered after refusing to quit the field even as his army
      collapsed around him, was stripped of his armour and cut down in
      revenge by noblemen whose own families he had once destroyed.
    source: coxe-austria-1847
    contested: false
  - year: 1282
    type: reform
    name: "Austria and Styria settled on Rudolf's sons"
    changed: >-
      At a diet in Augsburg, Rudolf formally granted the conquered
      duchies of Austria and Styria to his own sons Albert and Rudolph
      II, converting territory he had won as King of the Romans into
      hereditary Habsburg family property for the first time - a
      separate act, years after his own election, that made Austria
      itself the family's own possession rather than a fief he merely
      administered.
    source: coxe-austria-1847
    contested: false
  - year: 1298
    type: battle
    name: "The Battle of Göllheim"
    changed: >-
      Passed over for the crown once already, Albert deposed his own
      electors' second choice for contumacy and killed him in single
      combat when the two kings met in battle near Speyer - then had
      the electors formally re-elect him anyway, unwilling to hold a
      throne people might call a battlefield prize rather than a lawful
      succession.
    source: coxe-austria-1847
    contested: false
  - year: 1314
    type: succession-crisis
    name: "Two kings crowned in a fortnight"
    changed: >-
      Rival electors crowned Frederick the Handsome and Louis of
      Bavaria within days of each other, each coronation looking
      equally legitimate, and opened eight years of civil war that
      cost the family a king's freedom at Mühldorf, over fifteen
      hundred men in a single ambush at Morgarten, and its last real
      claim on the German throne for more than a century.
    source: coxe-austria-1847
    contested: false
  - year: 1330
    type: treaty
    name: "The Peace of Hagenau"
    changed: >-
      Frederick's and Leopold's deaths removed the family's last
      rival claim on the imperial title, and the surviving brothers
      made peace with Louis of Bavaria at last - closing, at a stroke,
      a war the 1314 double election had opened sixteen years earlier
      and steadying the House of Austria more than either dead
      brother's reign ever had.
    source: coxe-austria-1847
    contested: false
  - year: 1369
    type: treaty
    name: "Tyrol secured at Scharding"
    changed: >-
      Three decades after a childless heiress's disputed marriages
      first drew Bavaria, Bohemia and Austria into a three-way contest
      for her inheritance, Emperor Charles IV mediated a settlement
      that closed the dispute for good: Bavaria gave up its claim
      outright for a cash payment, leaving Austria undisputed master
      of a mountain duchy rich in silver and command of the roads into
      Italy.
    source: coxe-austria-1847
    contested: false
  - year: 1386
    type: battle
    name: "The Battle of Sempach"
    changed: >-
      Confident nobles who dismissed the confederate army as an
      unarmed rabble pushed Leopold III into an immediate attack
      rather than wait for reinforcements, and a knight's
      self-sacrifice broke the Austrian line open; roughly two
      thousand men died, Leopold himself among them, closing out
      seventy years in which the family's Swiss patrimony was lost
      the same way every time - armoured cavalry sent into terrain
      that neutralised it, broken by a smaller force holding the
      high ground.
    source: coxe-austria-1847
    contested: false
  - year: 1406
    type: reform
    name: "The family splits into the Albertine and Leopoldine lines"
    changed: >-
      A cousin's sudden, childless death ended the joint guardianship
      that had briefly held the dynasty together, and the House of
      Austria broke permanently into an Albertine branch holding
      Austria for the child Albert V and a Leopoldine branch split
      three ways among Leopold III's own surviving sons - a family
      humbling itself through its own internal division, exactly as
      an earlier emperor had once wryly predicted it would.
    source: coxe-austria-1847
    contested: false
  - year: 1438
    type: succession-crisis
    name: "Albert elected King of the Romans"
    changed: >-
      With Germany still fractured by private feuds and church schism
      and the Ottomans pressing on Hungary's own frontier, the electors
      turned to the one prince already ruling three kingdoms at once;
      although never formally crowned, Albert became the first Habsburg
      to hold the German crown since Rudolf I, and the first ever to
      pair it with Austria, Hungary and Bohemia together.
    source: coxe-austria-1847
    contested: false
  - year: 1439
    type: catastrophe
    name: "The death of Albert V"
    changed: >-
      Struck by the same dysentery that had already forced an Ottoman
      army into retreat, Albert insisted on pressing toward Vienna
      rather than rest, and died in a village short of the city less
      than two years after becoming the first ruler in a century and a
      half to hold both the imperial crown and the House of Austria's
      own patrimony together - a reach no later Habsburg duke would
      match.
    source: coxe-austria-1847
    contested: false
  - year: 1457
    type: catastrophe
    name: "The death of Ladislaus Posthumus"
    changed: >-
      Struck down by sudden illness in Prague while preparing to marry
      a French princess, Ladislaus died within thirty-six hours at
      seventeen, ending the one reign since Albert V's own death that
      had briefly held Austria, Hungary and Bohemia together under a
      single king - and opening, in its place, decades of fraternal
      war, disputed regencies and Ottoman pressure that no single
      Habsburg duke would fully master again.
    source: coxe-austria-1847
    contested: false
  - year: 1477
    type: treaty
    name: "Maximilian marries Mary of Burgundy by proxy"
    changed: >-
      Against her own council's advice and the machinations of Louis
      XI of France, Mary chose Maximilian on the strength of her late
      father's praise for him and a token exchange of letters, joining
      the vast Burgundian inheritance - Flanders, Artois, Holland,
      Brabant and more - to the House of Austria for the first time,
      and opening a rivalry with the French crown that would outlast
      every ruler who lived through its opening decade.
    source: coxe-austria-1847
    contested: false
  - year: 1493
    type: catastrophe
    name: "The death of Frederick III"
    changed: >-
      A leg amputation he bore without complaint gave way to a fatal
      dysentery, brought on by an indulgence for melons that echoed the
      very habit that had ended his own son's life decades before;
      having already handed full administration of Austria and the
      empire to Maximilian, Frederick closed a fifty-three-year reign
      longer than any emperor's since Augustus.
    source: coxe-austria-1847
    contested: false
  - year: 1499
    type: treaty
    name: "Peace with France settles Burgundy against Philip"
    changed: >-
      After a Swiss-mercenary force sent to press Philip's claims
      collapsed through mutiny and bribery, Louis XII - his own
      attention already fixed on conquering Milan - offered terms
      Philip accepted at once: the three disputed towns restored, and
      the whole Burgundian question handed to the Parliament of Paris
      for a verdict everyone involved already knew how it would fall.
    source: coxe-austria-1847
    contested: false

