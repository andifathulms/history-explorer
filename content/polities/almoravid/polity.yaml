id: almoravid
region: islamic-west

name:
  latin: Almoravid Empire
  script: المرابطون
  script_lang: ar

span:
  start: { min: 1040, max: 1040, source: bennison-2016 }
  end: { min: 1147, max: 1147, source: bennison-2016 }

identity: >-
  A Saharan Berber movement that took Morocco and then al-Andalus, and put
  both shores of the strait under one ruler for the first time.

capitals:
  - { name: Marrakesh, script: مراكش, from: 1040, source: bennison-2016 }

core_region: Morocco and al-Andalus

rulers:
  founder: { name: Abd Allah ibn Yasin, reign: [1040, 1059], source: bennison-2016 }
  peak: { name: Yusuf ibn Tashfin, reign: [1061, 1106], source: bennison-2016 }
  last: { name: Ishaq ibn Ali, reign: [1146, 1147], source: bennison-2016 }

scripts_and_languages:
  administration: [Arabic]
  writing_system: Arabic

ended:
  type: conquest
  by: [almohad]
  year: 1147
  source: bennison-2016

institutions:
  # Sanhaja tribal contingents from the western Sahara, and from the 1080s a
  # paid guard of Black African and European slave soldiers and Christian
  # mercenaries around the amir — the usual sequence, arrived at within one
  # generation of leaving the desert.
  military_basis: { values: [tribal-levy, slave-soldier], source: bennison-2016 }
  # Control of both ends of the western gold road, taken before Morocco was:
  # Awdaghust in 1054 and Sijilmasa in 1055. The dinar that resulted circulated
  # in Christian Spain and was imitated there.
  revenue_basis: { values: [trade-toll, land-tax], source: bennison-2016 }
  succession_rule: { values: [nomination], source: bennison-2016 }
  # Not descent and not a caliphal grant: the claim was that the movement
  # enforced the law where existing rulers had abandoned it, and it was
  # certified by jurists — the fatwas from Cordoba and Baghdad authorising the
  # deposition of the taifa kings.
  legitimation: { values: [divine-sanction], source: bennison-2016 }

turning_points:
  - year: 1055
    type: siege
    name: "Both ends of the gold road"
    changed: >-
      Awdaghust in 1054 and Sijilmasa in 1055 were taken before Morocco was,
      which gave a desert movement a bullion supply before it had a country.
      Everything the dynasty did afterwards was paid for out of the trans-
      Saharan trade, and the resulting dinar was reliable enough to circulate
      in Christian Spain and be imitated there.
    source: bennison-2016
    contested: false
  - year: 1086
    type: battle
    name: "Sagrajas"
    changed: >-
      Yusuf ibn Tashfin beat Alfonso VI after the taifa kings invited him
      across the strait, then went home — and came back to depose the kings who
      had invited him, on a legal opinion that rulers paying tribute to
      Christians had forfeited authority. Al-Andalus was governed from
      Marrakesh for the next sixty years.
    source: bennison-2016
    contested: false

measures:
  # No cited km2 for this polity in the works consulted; Taagepera does not
  # tabulate it separately. The axis is empty rather than borrowed.
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: null, items: [], source: null }
    religions_carried:
      count: 1
      items: [Sunni Islam]
      source: bennison-2016
    successor_claims: { count: null, items: [], source: null }
