id: mughal
region: indian-sultanates

name:
  latin: Mughal Empire
  script: گورکانیان
  script_lang: fa

span:
  start: { min: 1526, max: 1526, source: richards-1993 }
  end: { min: 1857, max: 1857, source: richards-1993 }

identity: >-
  The Timurid dynasty that took northern India from the Delhi Sultanate and
  built the most centralised revenue state the subcontinent had seen.

capitals:
  - { name: Agra, script: آگره, from: 1526, source: richards-1993 }

core_region: The Indo-Gangetic plain and the Deccan

rulers:
  founder: { name: Babur, reign: [1526, 1530], source: richards-1993 }
  peak: { name: Akbar, reign: [1556, 1605], source: richards-1993 }
  last: { name: Bahadur Shah II, reign: [1837, 1857], source: richards-1993 }

scripts_and_languages:
  administration: [Persian]
  writing_system: Perso-Arabic

ended:
  type: conquest
  by: [british-empire]
  year: 1857
  source: richards-1993

turning_points:
  - year: 1526
    type: battle
    name: "Panipat"
    changed: >-
      Babur beat the last Lodi sultan of Delhi with artillery and a
      smaller army, taking the Delhi Sultanate's own capital and
      founding, almost as an afterthought to a career spent failing to
      hold Samarkand, the dynasty that would govern most of the
      subcontinent for the next two centuries.
    source: richards-1993
    contested: false
  - year: 1556
    type: reform
    name: "Akbar's mansabdari"
    changed: >-
      Akbar came to the throne at thirteen and spent fifty years
      building a single numerical rank system that bound every officer
      of the empire - Muslim, Hindu, Persian émigré, Rajput prince -
      to unheritable, rotated land assignments matched against a
      province-by-province revenue survey, solving for about a century
      the failure mode that had broken the Delhi Sultanate and every
      comparable state before it.
    source: richards-1993
    contested: false
  - year: 1658
    type: succession-crisis
    name: "Samugarh and the head in the box"
    changed: >-
      Shah Jahan's illness set his four sons to war before anyone could
      confirm he was still alive; Aurangzeb and Murad Bakhsh broke
      Dara Shikoh's army at Samugarh, Aurangzeb's own son seized the
      Agra citadel by trickery and imprisoned Shah Jahan in it, and
      Dara was captured, tried for apostasy and executed in 1659 - his
      head delivered to his own father sealed in a box.
    source: bernier-constable
    contested: false
  - year: 1679
    type: reform
    name: "The jizya reimposed"
    changed: >-
      Aurangzeb reversed the core of Akbar's religious settlement,
      reimposing the poll tax on non-Muslims his great-grandfather had
      abolished and patronising a stricter Sunni establishment - a
      reversal historians still weigh against the fiscal strain of the
      Deccan wars as a cause of the empire's later collapse, without
      settling which mattered more.
    source: richards-1993
    contested: true
  - year: 1707
    type: catastrophe
    name: "Aurangzeb dies, and the treasury with him"
    changed: >-
      The empire reached its greatest territorial extent under
      Aurangzeb and was insolvent when he died after forty-nine years
      on the throne, twenty-five of them spent campaigning in the
      Deccan; within fifty years its provinces governed themselves in
      practice while remitting nothing to a Delhi that kept only the
      ceremony of rule.
    source: richards-1993
    contested: false

