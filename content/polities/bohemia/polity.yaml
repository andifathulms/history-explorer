id: bohemia
region: bohemia

name:
  latin: Kingdom of Bohemia
  script: Čechy
  script_lang: cs

span:
  # The famous founding story - the princess-judge Libuše choosing the
  # ploughman Přemysl as her husband and king, his descendants promised
  # eternal rule - is a legend first written down centuries later by the
  # chronicler Cosmas of Prague, and Lützow treats it as such. The first
  # Přemyslid duke real evidence can attest to is Bořivoj I, whose
  # Christianization by followers of Methodius falls somewhere between
  # the 874 Treaty of Forchheim and Methodius's own death in 885.
  start: { min: 872, max: 885, source: lutzow-bohemia-1920 }
  end: { min: 1620, max: 1620, source: lutzow-bohemia-1920 }

identity: >-
  A Slavic kingdom and Imperial Elector whose reformer, Jan Hus, was
  burned at Constance in 1415, whose peasant armies broke a crusade
  under Žižka, and whose own elected Estates lost their constitutional
  kingdom to Habsburg conquest at the White Mountain in 1620.

capitals:
  - { name: Prague, source: lutzow-bohemia-1920 }

core_region: The Elbe and Vltava basins of Bohemia, later joined by Moravia, Silesia and Upper Lusatia

rulers:
  # No reign dates survive for Bořivoj I; even the fact of his baptism is
  # dated only within a decade.
  founder: { name: Bořivoj I, source: lutzow-bohemia-1920 }
  # Charles IV's own reign, which this record's chapters carry up to only
  # its opening years so far, made Prague an Imperial capital and Charles
  # himself Holy Roman Emperor - the furthest reach of authority any ruler
  # on this record has commanded.
  peak: { name: Charles IV, reign: [1346, 1378], source: lutzow-bohemia-1920 }
  # Elected by the rebel Estates in 1619 and deposed within a winter,
  # Frederick was the last king of the independent, constitutional
  # kingdom this record describes - not the last Habsburg claimant,
  # whose own line continued ruling Bohemia as a hereditary possession
  # after 1620.
  last: { name: "Frederick I (of the Palatinate)", reign: [1619, 1620], source: lutzow-bohemia-1920 }

scripts_and_languages:
  administration: [Czech, Latin, German]
  writing_system: Latin alphabet

institutions:
  military_basis: null
  revenue_basis: null
  # An assembly of Estates chose Přemysl himself in the founding legend,
  # and the Estates' right to elect a king was repeatedly reaffirmed even
  # after hereditary succession became the ordinary practice - most
  # explicitly at Charles IV's own 1348 Diet, which preserved the
  # Estates' elective right for the case of the royal line's extinction
  # while otherwise fixing succession by primogeniture.
  succession_rule: { values: [election, primogeniture], source: lutzow-bohemia-1920 }
  # Kings of Bohemia were repeatedly crowned in conjunction with the
  # German crown - Ottokar I at Mainz in 1198 alongside King Philip of
  # Germany - tying Bohemian kingship to external Imperial recognition
  # as well as to dynastic descent.
  legitimation: { values: [descent, investiture], source: lutzow-bohemia-1920 }

preceded_by_external: []

succeeded_by_external:
  - name: the Habsburg Monarchy
    type: conquered by
    year: 1620
    note: >-
      The White Mountain's victors did not merely install a new king:
      they revoked the Letter of Majesty and the elective constitution
      the Bohemian Estates had built up over two centuries, folding the
      kingdom into direct hereditary Habsburg rule for the next three
      hundred years.
    source: lutzow-bohemia-1920

# A Catholic League and Imperial army broke the army of the rebel
# Bohemian Estates and their elected king, Frederick of the Palatinate,
# in a few hours at the White Mountain outside Prague on 8 November
# 1620. The Habsburgs had already held the Bohemian crown since 1526,
# so this was not a change of dynasty; what ended was the kingdom's own
# elective constitution and the Letter of Majesty's religious
# settlement, both stripped away in the battle's aftermath, leaving
# Bohemia a hereditary Habsburg crown land rather than the
# self-governing kingdom this record describes. No successor polity
# has a record in this collection, so `by` is empty; the sourced
# sentence above carries the name.
ended:
  type: conquest
  by: []
  year: 1620
  source: lutzow-bohemia-1920

turning_points:
  - year: 885
    type: conversion
    name: "Bořivoj I's baptism"
    changed: >-
      Followers of Methodius, "the apostle of the Slavs," baptized the
      Bohemian duke Bořivoj I and his wife Ludmila somewhere in the years
      after a Frankish-Moravian peace freed Methodius to return to his
      mission - the point at which Bohemia's own ruling house enters
      Christian, and with it wider European, history.
    source: lutzow-bohemia-1920
    contested: false
  - year: 1278
    type: battle
    name: "The Battle of Dürnkrut (Marchfeld)"
    changed: >-
      Přemysl Ottokar II, who had made Bohemia the strongest power
      within the German Empire through marriage, election and conquest
      as far south as the Adriatic, was deserted by nobles he had
      alienated by favouring the towns, and died fighting after his
      army broke before Rudolph of Habsburg's forces - collapsing in a
      single afternoon a reach no Bohemian ruler had commanded before
      or matched since.
    source: lutzow-bohemia-1920
    contested: false
  - year: 1346
    type: battle
    name: "The blind King John dies at Crécy"
    changed: >-
      Already sightless, the Bohemian king had two knights bind his
      horse to theirs and lead him into the enemy's ranks rather than
      flee a battle already lost, and died there with fifty of his
      nobles around him - a defeat that cost Bohemia the flower of its
      aristocracy and passed the crown to his son Charles.
    source: lutzow-bohemia-1920
    contested: false
  - year: 1348
    type: reform
    name: "Charles IV's Diet and the founding of Prague's university"
    changed: >-
      Charles IV convened the Estates at Prague to confirm the kingdom's
      privileges, fix Moravia's, Silesia's and Upper Lusatia's place under
      the Bohemian crown, and settle succession by primogeniture with
      election reserved for the royal line's extinction - and in the same
      year announced the university that would make Prague, for the first
      time, a centre of learning to rival Paris.
    source: lutzow-bohemia-1920
    contested: false
  - year: 1415
    type: catastrophe
    name: "The burning of Jan Hus"
    changed: >-
      A safe-conduct from King Sigismund did not stop the Council of
      Constance from imprisoning the reformer Jan Hus, refusing him a
      real hearing, and burning him as a heretic when he would not
      recant teachings he held to be true - turning a theological
      dispute over Church corruption into a grievance the whole of
      Bohemia took as its own.
    source: lutzow-bohemia-1920
    contested: false
  - year: 1419
    type: revolt
    name: "The first defenestration of Prague"
    changed: >-
      A stone thrown at a Hussite procession from the New Town's town
      hall brought a crowd led by the royal courtier Jan Žižka storming
      the building; the burgomaster and his fellow councillors were cast
      down into the square below, and Bohemia's reform movement passed
      in an afternoon from preaching to open insurrection against the
      crown.
    source: lutzow-bohemia-1920
    contested: false
  - year: 1420
    type: battle
    name: "Sigismund's crusade breaks at Žižka's Hill"
    changed: >-
      A force gathered from nearly every corner of Latin Christendom
      under a papal crusading banner, put by contemporary estimate as
      high as 150,000 strong, besieged Prague and was thrown back from
      a hastily fortified hill east of the city by Žižka's wagon-forts
      - the first proof that a peasant army built around Hussite
      conviction could break a crusade sent to destroy it.
    source: lutzow-bohemia-1920
    contested: false
  - year: 1434
    type: battle
    name: "The Battle of Lipany"
    changed: >-
      Moderate Utraquist nobles who had made their own peace terms
      with Rome broke the radical Taborites in a single day near
      Lipany, using a feigned retreat to draw them from their own
      wagon-fort before cutting them off from it - killing both
      Prokop leaders and roughly thirteen thousand of their men in
      what Bohemian historians have since judged an extermination
      rather than a battle.
    source: lutzow-bohemia-1920
    contested: false
  - year: 1436
    type: treaty
    name: "The Compacts of Basel accepted at Jihlava"
    changed: >-
      Bohemian delegates at last put their names to the Council of
      Basel's terms, permitting communion in both kinds and ending
      Rome's excommunication of the whole kingdom, and King Sigismund -
      whose own broken promise had sent Hus to the stake two decades
      earlier - was at last received into his own capital as the
      Estates' undisputed and recognized sovereign.
    source: lutzow-bohemia-1920
    contested: false
  - year: 1618
    type: revolt
    name: "The second defenestration of Prague"
    changed: >-
      Protestant nobles under Count Thurn, confronting royal governors
      over violations of the 1609 Letter of Majesty, threw two of the
      king's councillors and a secretary from the windows of Prague
      Castle into the moat below - all three survived the fall, but the
      Estates' provisional government that formed within hours put
      Bohemia into open war against its own Habsburg king and touched
      off the conflict that would consume the whole continent for
      thirty years.
    source: lutzow-bohemia-1920
    contested: false
  - year: 1620
    type: battle
    name: "The Battle of the White Mountain"
    changed: >-
      An unpaid, mutinous Bohemian army under the Estates' elected king,
      Frederick of the Palatinate, broke within hours before the allied
      forces of the Catholic League and the Emperor outside Prague; Frederick fled
      the city within a day, and the kingdom's constitutional
      self-government did not survive the defeat.
    source: lutzow-bohemia-1920
    contested: false

