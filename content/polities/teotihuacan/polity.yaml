id: teotihuacan
region: mesoamerica

name:
  latin: Teotihuacan
  script: null
  script_lang: null

span:
  # Rapid population growth and monumental construction began in the
  # first or second century BCE.
  start: { min: -200, max: -100, source: cowgill-1997 }
  # The city's civic-religious core was burned and its political
  # importance ended sometime in the 600s or 700s; the archaeological
  # evidence does not fix a narrower date.
  end: { min: 600, max: 700, source: cowgill-1997 }

identity: >-
  A planned city in the highlands of central Mexico that grew, within two
  centuries, into the largest urban concentration the Americas had yet seen -
  built around the largest pyramids Mesoamerica ever raised, and destroyed at
  the end by its own people rather than any outside conqueror.

