turning_points:
  - year: -150
    type: reform
    name: "The city's population is concentrated"
    changed: >-
      Most of the population of the whole Basin of Mexico relocated into
      a single settlement within a few generations, and construction
      began on civic-religious structures - among them the Pyramid of
      the Sun - on a scale no earlier Mesoamerican city had attempted.
    source: cowgill-1997
    contested: false
  - year: 200
    type: catastrophe
    name: "Mass sacrifice dedicates the Feathered Serpent Pyramid"
    changed: >-
      Roughly two hundred people, many dressed as soldiers and
      dignitaries and arranged in patterns that appear tied to
      calendrical symbolism, were sacrificed as part of the dedication of
      a new pyramid honouring the Feathered Serpent - the clearest
      material evidence for the power a small number of early rulers
      held over the city and its religious life.
    source: cowgill-1997
    contested: false
  - year: 300
    type: revolt
    name: "The Feathered Serpent Pyramid is burned"
    changed: >-
      In a hot, deliberate fire, the pyramid and its temple were burned
      and partly dismantled rather than rebuilt on a grander scale as
      earlier structures had been - and the ruin was left visible rather
      than concealed, a change archaeologists read as a reaction, by
      elites or a successor ruler, against the excess of the sacrifices
      committed there.
    source: cowgill-1997
    contested: true
  - year: 650
    type: revolt
    name: "The city's core is burned"
    changed: >-
      Temples and elite residences along the city's own ceremonial
      avenue were deliberately and selectively burned and their idols
      smashed, leaving most of the wider settlement untouched - an act
      modern archaeology reads as directed squarely at the institutions
      of rule, whether carried out by insiders or by outsiders taking
      advantage of a weakened capital, rather than as a foreign conquest
      of the city as a whole.
    source: cowgill-1997
    contested: true

