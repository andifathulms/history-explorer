id: zulu-kingdom
region: southern-african-kingdoms

name:
  latin: Zulu Kingdom
  # bryant-zululand-1929 does not supply a script for isiZulu, which
  # had no indigenous writing system before missionary orthographies.
  script: null
  script_lang: null

# bryant-zululand-1929 traces the Zulu clan's own founding to a
# migration under Malandela around 1670, but the clan remained a
# minor chiefdom for six generations; the span below dates instead
# from Shaka's own 1816 accession, the point at which it became the
# regional power this record actually covers.
span:
  start: { min: 1816, max: 1816, source: bryant-zululand-1929 }
  # colenso-zulu-war-1880 dates Cetshwayo's capture, ending organized
  # Zulu resistance, to 28 August 1879. Between Shaka's 1828
  # assassination and this record's own resumption of the narrative in
  # 1856, Dingane's twelve-year reign, his war with the Voortrekkers
  # and the Battle of Blood River, and the first sixteen years of
  # Mpande's reign are not covered by any source consulted here - see
  # the rulers.last comment below.
  end: { min: 1879, max: 1879, source: colenso-zulu-war-1880 }

identity: >-
  A minor clan seized by an exiled, illegitimate son who built a
  military power that reordered southeastern Africa within a decade,
  survived his own murder by his brothers, and fought imperial Britain
  under a fourth king before its capital burned and its king was
  hunted down in a forest.

capitals:
  - { name: Bulawayo, source: bryant-zululand-1929 }
  - { name: Dukuza, source: bryant-zululand-1929 }

core_region: The Nguni-speaking territory of present-day KwaZulu-Natal, South Africa

rulers:
  # bryant-zululand-1929 names Malandela as the clan's traditional
  # founder around 1670, but codes Shaka here as founder in the sense
  # this record actually covers: the man who turned a minor chiefdom
  # into the regional power described in these chapters.
  founder: { name: Shaka, reign: [1816, 1828], source: bryant-zululand-1929 }
  peak: { name: Shaka, reign: [1816, 1828], source: bryant-zululand-1929 }
  # Dingane, one of Shaka's own assassins, took the throne after him
  # and reigned until 1840, when his own half-brother Mpande, backed
  # by Boer allies, overthrew him. Neither Dingane's reign nor the
  # first sixteen years of Mpande's is covered by a source consulted
  # here; colenso-zulu-war-1880 picks the narrative up with the 1856
  # civil war between Mpande's sons Cetshwayo and Mbulazi; Mpande
  # reigned on in name until his natural death in 1872, when Cetshwayo,
  # already the power behind the throne since 1856, was crowned king.
  last: { name: Cetshwayo, reign: [1872, 1879], source: colenso-zulu-war-1880 }

scripts_and_languages:
  administration: [isiZulu]
  writing_system: null

institutions:
  military_basis: { values: [conscript, tribal-levy], source: bryant-zululand-1929 }
  revenue_basis: { values: [tribute], source: bryant-zululand-1929 }
  # There was no right of primogeniture among the Nguni; the reigning
  # chief named his own preferred heir among his sons, or, as with
  # Shaka's own accession, an overlord claimed the right to choose in
  # a chief's default - contested violently in both cases this record
  # covers.
  succession_rule: { values: [factional], source: bryant-zululand-1929 }
  legitimation: { values: [descent, conquest], source: bryant-zululand-1929 }

preceded_by_external: []

# Not a succession to record here: every ruler through Cetshwayo held
# the same Zulu throne rather than founding a separate state, so
# Dingane's and Mpande's reigns are the kingdom's own continuation
# rather than a predecessor/successor relation - see the rulers.last
# comment for what of that continuation is and is not covered here.
# After Cetshwayo's capture Britain divided Zululand among thirteen
# appointed chiefs rather than annexing it outright; the kingdom was
# not formally annexed until 1887, a decade of further history not
# covered by a source consulted here.
succeeded_by_external: []

ended:
  type: conquest
  by: []
  year: 1879
  source: colenso-zulu-war-1880

turning_points:
  - year: 1816
    type: succession-crisis
    name: "Sigujana killed while bathing"
    changed: >-
      With Senzangakhona dead and no heir named, Dingiswayo backed his
      own protege Shaka for the Zulu throne; Shaka had his rival
      half-brother Sigujana speared to death while bathing and took
      the chieftainship without further opposition.
    source: bryant-zululand-1929
    contested: false
  - year: 1818
    type: catastrophe
    name: "Dingiswayo executed by Zwide"
    changed: >-
      Shaka's own patron and overlord was captured and killed by the
      rival Ndwandwe chief Zwide, removing the one authority Shaka
      still formally answered to and opening the way for Shaka to
      absorb the leaderless Mthethwa federation into his own growing
      kingdom.
    source: bryant-zululand-1929
    contested: false
  - year: 1827
    type: catastrophe
    name: "The mourning massacre for Nandi"
    changed: >-
      The death of Shaka's mother Nandi triggered a wave of public
      mourning that spiraled into a self-perpetuating massacre, an
      eyewitness trader estimating seven thousand dead within a single
      day - a spasm of violence Shaka's own killings had never before
      required a direct order to sustain, and one that turned private
      grief among his own kin into open conspiracy against him.
    source: bryant-zululand-1929
    contested: false
  - year: 1828
    type: succession-crisis
    name: "Shaka assassinated by his own brothers"
    changed: >-
      Convinced by their aunt Mkabayi that Shaka had deliberately
      killed his own mother, his half-brothers Dingane and Mhlangana,
      with the help of Shaka's own trusted servant Mbopa, ambushed and
      killed him at his Dukuza capital - ending, at forty-one, the
      reign of the king who had built the kingdom in the first place.
    source: bryant-zululand-1929
    contested: true
  - year: 1856
    type: revolt
    name: "Cetshwayo defeats Mbulazi at Tugela"
    changed: >-
      With the aging Mpande unwilling or unable to name an heir, his
      sons Cetshwayo and Mbulazi fought a civil war for the
      succession; Mbulazi was killed and his party routed with great
      slaughter, and although Cetshwayo neither deposed his father nor
      took the throne outright, from that year the real authority of
      the kingdom was his.
    source: colenso-zulu-war-1880
    contested: false
  - year: 1872
    type: succession-crisis
    name: "Mpande dies, Cetshwayo crowned"
    changed: >-
      Mpande died a natural death after decades of nominal rule,
      immobilized in his last years by his own great weight, and
      Cetshwayo - already the kingdom's effective ruler for sixteen
      years - was proclaimed king in name as well as fact.
    source: colenso-zulu-war-1880
    contested: false
  - year: 1879
    type: battle
    name: "Isandhlwana"
    changed: >-
      A Zulu force estimated at ten thousand or more overran the
      British camp at Isandhlwana on the 22nd of January, encircling
      and destroying the defending column in the single heaviest
      defeat a British army suffered at the hands of a colonized
      people in the nineteenth century - a victory that briefly halted
      the invasion of Zululand outright.
    source: colenso-zulu-war-1880
    contested: false
  - year: 1879
    type: siege
    name: "Ulundi burned"
    changed: >-
      A British square armed with artillery and Gatling guns broke a
      Zulu attack of an estimated fifteen to twenty thousand men on
      the 4th of July in barely half an hour; the royal capital of
      Ulundi was set alight the same day, and with it the organized
      military power the kingdom had maintained since Shaka's own
      reign.
    source: colenso-zulu-war-1880
    contested: false
  - year: 1879
    type: catastrophe
    name: "Cetshwayo captured"
    changed: >-
      Found sheltering in a kraal in the Ngome forest on the 28th of
      August, Cetshwayo was taken by a mounted patrol and delivered to
      the ruins of his own capital before being shipped into exile at
      Cape Town - ending organized resistance and the reign of the
      kingdom's last independent king.
    source: colenso-zulu-war-1880
    contested: false

measures:
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: bryant-zululand-1929 }
    religions_carried: { count: 0, items: [], source: bryant-zululand-1929 }
    successor_claims: { count: 0, items: [], source: bryant-zululand-1929 }
