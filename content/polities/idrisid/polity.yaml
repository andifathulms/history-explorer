id: idrisid
region: islamic-west

name:
  latin: Idrisid Dynasty
  script: الأدارسة
  script_lang: ar

span:
  start: { min: 788, max: 788, source: abun-nasr-1987 }
  end: { min: 974, max: 974, source: abun-nasr-1987 }

identity: >-
  The first Alid state in the Maghreb, founded by a fugitive from a failed
  rising near Mecca.

capitals:
  - { name: Fez, script: فاس, from: 788, source: abun-nasr-1987 }

core_region: Northern Morocco

rulers:
  founder: { name: Idris I, reign: [788, 791], source: abun-nasr-1987 }
  peak: { name: Idris II, reign: [803, 828], source: abun-nasr-1987 }
  last: { name: al-Hasan al-Hajjam, reign: [970, 974], source: abun-nasr-1987 }

scripts_and_languages:
  administration: [Arabic]
  writing_system: Arabic

# Not an edge: Idris arrived from Arabia as a fugitive from a failed rising and
# founded a state where there had been none, and what came after was a principle
# rather than a polity. Both rows record relations to things with no record here.
preceded_by_external:
  - name: the Alid rising at Fakhkh
    type: absorbed remnants of
    year: 786
    note: >-
      An Alid revolt near Mecca in 786 was crushed by the Abbasids. Idris ibn
      Abd Allah, a great-great-grandson of Ali, escaped and travelled the length
      of North Africa to a country where nobody had any prior reason to care
      about the family of the Prophet — arriving with no army, no money and
      nothing but a name, and being accepted by Berber tribes on the strength of
      it. He was poisoned about four years later, on the usual account by an
      Abbasid agent.
    source: abun-nasr-1987
    contested: false

succeeded_by_external:
  - name: the sharifian principle
    year: null
    note: >-
      What the dynasty left was not a successor state but a rule about who could
      claim one. Descent from the Prophet through Ali and Fatima became the most
      valuable political credential in Morocco and remained so for a thousand
      years: the Saadis who took the country in the sixteenth century were
      sharifs, the Alaouites who took it in the seventeenth were sharifs, and
      neither traced to Idris. The tomb of Idris II was found in Fez in 1437 and
      built into a sanctuary at the centre of the city, which is still there.
    source: abun-nasr-1987
    contested: false

ended:
  type: gradual absorption
  by: [fatimid, cordoba]
  year: 974
  source: abun-nasr-1987

institutions:
  # Berber tribal contingents, principally the Awraba who accepted Idris I and
  # the Zanata and others who followed; there was never a standing force
  # independent of the tribes, which is part of why the succession divided so
  # completely.
  military_basis: { values: [tribal-levy], source: abun-nasr-1987 }
  revenue_basis: null
  # Idris II divided among his sons at the first succession and the state did
  # not survive it. This site codes appanage on the Seljuks, Mongols, Ghurids
  # and Buyids; here it happens immediately, completely, and with nothing to
  # arrest it.
  succession_rule: { values: [appanage], source: abun-nasr-1987 }
  # Descent from Ali, publicly invoked as the whole basis of the right to rule
  # — which is what the coding rules require and what the fourth chapter on
  # this page is about.
  legitimation: { values: [descent], source: abun-nasr-1987 }

turning_points:
  - year: 818
    type: revolt
    name: "The Cordoba suburb, expelled"
    changed: >-
      Al-Hakam I crushed a rising in the suburb of Cordoba and expelled the
      survivors; several thousand came west and settled the right bank at Fez.
      Refugees from Kairouan settled the left bank six years later. A Berber
      country with no substantial city acquired one because the two established
      centres of the Islamic west produced displaced populations at the same
      moment.
    source: abun-nasr-1987
    contested: false
  - year: 828
    type: succession-crisis
    name: "Idris II divides among his sons"
    changed: >-
      The state effectively ended at its first succession, a century and a
      half before the conventional date. What followed was not decline but a family scattered
      across a country, subdividing further for a hundred years, with no
      mechanism to reassemble — which is why the tenth-century Fatimid and
      Umayyad proxy war found the far Maghreb already in pieces.
    source: abun-nasr-1987
    contested: false

measures:
  # No cited km2 for this polity in the works consulted; Taagepera does not
  # tabulate it separately. The axis is empty rather than borrowed.
  reach_km2: null
  peak_population: null
