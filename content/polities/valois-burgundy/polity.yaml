id: valois-burgundy
region: frankish-world

name:
  latin: Duchy of Burgundy
  script: null
  script_lang: null

span:
  # kirk-charlesbold-v1-1864 dates the assassination of John the
  # Fearless at Montereau, and Philip the Good's accession as duke in
  # his place, to 10 September 1419 - the point at which Burgundy's
  # break with France, and its alliance with England, became fixed
  # policy rather than open question.
  start: { min: 1419, max: 1419, source: kirk-charlesbold-v1-1864 }
  # kirk-charlesbold-v3-1864 dates the battle of Nancy, in which
  # Charles the Bold's army was destroyed and Charles himself killed,
  # to 5 January 1477.
  end: { min: 1477, max: 1477, source: kirk-charlesbold-v3-1864 }

identity: >-
  A French royal fief turned rival great power by an assassination its
  own duke set out to avenge, built through marriage and purchase into
  a state stretching from the Somme to the Zuiderzee, and destroyed in
  a single winter battle its final duke had no need to fight at all.

# Neither volume names a single fixed capital; the Burgundian court
# moved between Dijon, Brussels and, especially under Philip the Good,
# Bruges and Lille.
capitals: []

core_region: Burgundy, Flanders, Brabant, Hainaut, Holland and Luxembourg, astride the border of France and the Holy Roman Empire

rulers:
  founder: { name: "Philip the Good", reign: [1419, 1467], source: kirk-charlesbold-v1-1864 }
  peak: { name: "Philip the Good", reign: [1419, 1467], source: kirk-charlesbold-v1-1864 }
  last: { name: "Charles the Bold", reign: [1467, 1477], source: kirk-charlesbold-v3-1864 }

