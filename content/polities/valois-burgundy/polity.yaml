  revenue_basis: { values: [trade-toll, land-tax], source: kirk-charlesbold-v1-1864 }
  succession_rule: { values: [primogeniture], source: kirk-charlesbold-v1-1864 }
  legitimation: { values: [descent, investiture], source: kirk-charlesbold-v1-1864 }

preceded_by_external: []

succeeded_by_external:
  - name: The Habsburg Netherlands
    type: claimed legitimacy of
    year: 1477
    note: >-
      Charles the Bold's only child, Mary of Burgundy, inherited his
      Low Countries territories and married Maximilian of Habsburg the
      same year, carrying most of the Burgundian inheritance into the
      House of Habsburg; Louis XI of France seized the duchy of
      Burgundy itself and other border territories by right of their
      status as French fiefs.
    source: kirk-charlesbold-v3-1864

ended:
  type: conquest
  by: []
  year: 1477
  source: kirk-charlesbold-v3-1864

turning_points:
  - year: 1419
    type: catastrophe
    name: "John the Fearless assassinated at Montereau"
    changed: >-
      Meeting the dauphin under safe conduct on the bridge at
      Montereau to negotiate peace, John the Fearless was struck down
      by the dauphin's own men; his son Philip, learning of it at
      Ghent, told his wife "your brother has assassinated my father"
      and turned Burgundy toward the English alliance that would
      shape the whole of his reign.
    source: kirk-charlesbold-v1-1864
    contested: false
  - year: 1430
    type: reform
    name: "The Order of the Golden Fleece founded"
    changed: >-
      On his marriage to Isabella of Portugal, whose portrait he had
      commissioned from Jan van Eyck before agreeing to the match,
      Philip founded a new order of chivalry that soon outshone every
      comparable honor in Europe - dignity conferred by a vassal
      prince rather than a crowned one, and accepted as though it made
      no difference.
    source: kirk-charlesbold-v1-1864
    contested: false
  - year: 1435
    type: treaty
    name: "The Treaty of Arras"
    changed: >-
      After a great peace congress at Arras broke apart over England's
      refusal to give up its claim to the French crown, Philip made
      good on an earlier warning and went over to the French side,
      recognizing Charles VII as king in exchange for Auxerre, Macon,
      Peronne, Montdidier and the Somme towns, and a personal release
      from feudal homage to the crown he had just recognized. It
      reversed the English alliance that had opened his reign and
      helped bring down the English cause in France within a year.
    source: kitchin-1899
    contested: false
  - year: 1452
    type: revolt
    name: "Ghent crushed at Gavere"
    changed: >-
      Ghent, the leading city of a Flanders that had never fully
      accepted Burgundian rule, rose against Philip outright; he
      crushed the revolt on the field of Gavere, a defeat so complete
      that it marked the final subjection of the Flemish cities to
      ducal authority.
    source: kitchin-1899
    contested: false
  - year: 1467
    type: succession-crisis
    name: "Death of Philip the Good"
    changed: >-
      Philip died at Hinges in June, and Charles, arriving at Bruges
      so fast he outrode his own escort, wept at his father's bedside
      with a violence that startled those who knew him only as cold
      and exacting - before succeeding him as duke and turning
      Burgundy's still-considerable strength toward wars of his own
      choosing.
    source: kirk-charlesbold-v1-1864
    contested: false
  - year: 1477
    type: battle
    name: "The battle of Nancy"
    changed: >-
      Attempting to hold a siege against a relieving army of Lorrainers
      and Swiss more than twice the size of his own exhausted force,
      Charles was killed and his army destroyed; his body was found
      two days later, stripped and frozen into a ditch, mauled by
      wolves or dogs, and identified by his own physician, valet and
      laundress from old scars and uncut nails - ending, in one
      afternoon, the independent existence of the state he and his
      father had spent fifty-eight years building.
    source: kirk-charlesbold-v3-1864
    contested: false

