id: zanzibar
region: swahili-coast

name:
  latin: Sultanate of Zanzibar
  script: سلطنة زنجبار
  script_lang: ar

span:
  # lyne-1905 dates Lord Canning's Award separating Zanzibar from
  # Muscat to April 2, 1861, accepted by Seyyid Thuwaini on May 15 and
  # by Seyyid Majid on June 25 of that year - the point Zanzibar
  # became, for the first time, a sovereign state rather than the
  # richer half of a single Omani dominion.
  start: { min: 1861, max: 1861, source: lyne-1905 }
  # colonial-report-zanzibar-1946 was still describing Seyyid Khalifa
  # bin Harub - enthroned in 1911 - as "the reigning Sultan" thirty-
  # five years into his reign when it was written; 1946, the report's
  # own year, is the latest point either source used here can date the
  # sultanate to.
  end: { min: 1946, max: 1946, source: colonial-report-zanzibar-1946 }

identity: >-
  A sultanate carved from a larger Omani inheritance by a
  brother-against-brother dispute Britain was asked to settle - hinge
  of the East African slave and ivory trade before losing its mainland
  to partition and, in 1896, thirty-seven minutes of naval gunfire,
  then continuing for decades as a British protectorate.

capitals:
  - { name: Zanzibar Town, source: lyne-1905 }

core_region: Zanzibar and Pemba, with a mainland sphere from Cape Delgado to Somalia at its widest before German and British delimitation

rulers:
  # Reign given here from the 1861 Award, not from Majid's earlier,
  # unseparated governorship of Zanzibar under his father Seyyid Said
  # from 1856.
  founder: { name: "Seyyid Majid bin Said", reign: [1861, 1870], source: lyne-1905 }
  peak: { name: "Seyyid Barghash bin Said", reign: [1870, 1888], source: lyne-1905 }
  # colonial-report-zanzibar-1946 dates Khalifa bin Harub's accession
  # to 9 December 1911, after the throne had first been offered to and
  # declined by another candidate following Ali bin Hamoud's
  # abdication. His reign continued long past 1946, the report's own
  # year and the latest point either source used here reaches; he did
  # not in fact die until 1960.
  last: { name: "Seyyid Khalifa bin Harub", reign: [1911, 1946], source: colonial-report-zanzibar-1946 }

scripts_and_languages:
  administration: [Arabic, Swahili]
  writing_system: Arabic

institutions:
  military_basis: { values: [mercenary, standing-professional], source: lyne-1905 }
  revenue_basis: { values: [trade-toll, monopoly], source: lyne-1905 }
  succession_rule: { values: [factional], source: lyne-1905 }
  legitimation: { values: [descent, investiture], source: lyne-1905 }

preceded_by_external: []

succeeded_by_external: []

# Neither source used here narrates an institutional end. The
# sultanate outlived both of them: it continued as a British
# protectorate past 1946, reached independence in December 1963, was
# overthrown in the revolution of January 1964, and was joined to
# Tanganyika in April of that year to form Tanzania - none of it
# drafted from here, and none of it asserted.
ended: null

turning_points:
  - year: 1861
    type: treaty
    name: "The Canning Award"
    changed: >-
      Arbitrating a succession dispute between Sultan Said's sons
      Thuwaini in Muscat and Majid in Zanzibar, the Governor-General of
      India declared Majid sovereign ruler of Zanzibar and its African
      dominions in his own right, owing Muscat only an annual subsidy
      - separating, for the first time, the African and Arabian halves
      of Said's old dominion into two independent states.
    source: lyne-1905
    contested: false
  - year: 1873
    type: treaty
    name: "Frere's mission forces the sea trade closed"
    changed: >-
      Under the threat of a naval blockade, Sir Bartle Frere's mission
      compelled Seyyid Barghash to sign a treaty closing the sea route
      of the slave trade and shutting Zanzibar's own slave market - the
      commerce that had built the sultanate's wealth put, for the
      first time, under external and enforceable prohibition.
    source: lyne-1905
    contested: false
  - year: 1885
    type: treaty
    name: "The German surprise"
    changed: >-
      Commodore Paschen's German fleet entered the harbour on August 7
      and demanded Barghash recognise the Kaiser's protectorate over
      Usagara, Uzeguha, Nguru, Ukami and Witu and withdraw his own
      troops from them; lacking any force to answer the fleet with,
      Barghash submitted within the week, and the mainland empire the
      sultanate had spent decades building
      began coming apart at a speed no negotiation had prepared for.
    source: lyne-1905
    contested: false
  - year: 1890
    type: treaty
    name: "The British Protectorate proclaimed"
    changed: >-
      On the 4th of November, with France and Germany's supremacy
      claims waived in exchange for Madagascar and Heligoland,
      Zanzibar and Pemba were proclaimed a British Protectorate;
      within a year a constitutional government was established with
      a British Representative as First Minister, formalising an
      external control over the sultanate's own affairs that the 1896
      bombardment would later enforce by force rather than treaty.
    source: colonial-report-zanzibar-1946
    contested: false
  - year: 1896
    type: catastrophe
    name: "The bombardment"
    changed: >-
      When Khaled bin Barghash seized the palace within hours of Seyyid
      Hamid's death, a British ultimatum and, on its refusal, a
      thirty-seven-minute bombardment by three warships destroyed the
      palace, sank the sultanate's one warship, and installed a
      British-approved successor - after which no sultan of Zanzibar
      again acted against a British demand.
    source: lyne-1905
    contested: false
  - year: 1911
    type: succession-crisis
    name: "Khalifa bin Harub ascends the throne"
    changed: >-
      Ali bin Hamoud's abdication in 1911, after fifteen years in which
      the throne had already passed through three sultans, left the
      succession unsettled until the British Government's own choice,
      Khalifa bin Harub, was enthroned on the 9th of December - opening
      a reign that had already outlasted every one of his predecessors
      combined by the time either source used here stops.
    source: colonial-report-zanzibar-1946
    contested: false

