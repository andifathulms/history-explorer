id: great-zimbabwe
region: zimbabwe-and-the-coast

name:
  latin: Great Zimbabwe
  # The polity left no writing. Not an undeciphered script, as at Meroe — no
  # script at all, and no name for itself that anybody knows. Zimbabwe is from
  # the Shona dzimba dza mabwe, houses of stone. De Barros, printing in 1552
  # from Sofala reports, has it as a live administrative word: "the natives of
  # the country call all these edifices Symbaoe, which according to their
  # language signifies court, for every place where Benomotapa may be is so
  # called."'
  script: null
  script_lang: null

# Radiocarbon and imported ceramics. Occupation of the site begins earlier and
# the monumental building belongs to roughly the twelfth to fifteenth centuries;
# the abandonment is somewhere in the fifteenth. There are no dated events in
# this record's life because there is nothing that could date one.
span:
  start: { min: 1100, max: 1100, source: pikirayi-2001 }
  end: { min: 1450, max: 1450, source: pikirayi-2001 }

identity: >-
  The largest stone structures in Africa south of the pyramids, built without
  mortar by a state that left no writing and no name for itself.

capitals:
  - { name: Great Zimbabwe, from: 1100, source: pikirayi-2001 }

core_region: The Zimbabwe plateau between the Limpopo and the Zambezi

# All three null. No king of this polity is known — not a name, not a title, not
# a regnal length. The reason is not that the sources are silent about the
# rulers. There are no sources: no chronicle, no inscription, no literate
# neighbour within three thousand kilometres and no successor who wrote.
rulers:
  founder: { name: null, source: null }
  peak: { name: null, source: null }
  last: { name: null, source: null }

scripts_and_languages:
  administration: []
  writing_system: None

ended:
  type: gradual absorption
  by: []
  year: 1450
  source: pikirayi-2001

# Both real, both without a record here, and neither relationship is any of the
# eight edge types: nothing was inherited, claimed or conquered in either
# direction. `type` is omitted so the row prints the name and the note without
# asserting a verb the evidence will not carry.
preceded_by_external:
  - name: Mapungubwe
    year: null
    contested: true
    note: >-
      A capital on a sandstone hill above the Limpopo confluence from about 1075
      to 1220, doing the same things two hundred kilometres to the south: gold,
      imported celadon and glass beads, a royal residence on the summit and
      commoner settlement below. It declines as Great Zimbabwe rises, and
      whether the second grew out of the first, replaced it, or simply outlasted
      a climate shift is argued.
    source: pikirayi-2001

succeeded_by_external:
  - name: the Mutapa state, and the Torwa and Rozvi kingdoms
    year: null
    note: >-
      The court moved rather than ending. North on the Zambezi escarpment,
      Mutapa, which the Portuguese reached in the sixteenth century and whose
      ruler de Barros knew as Benomotapa; west, Khami and after it Danangombe
      and Naletale, building the same mortarless walls to a higher standard on a
      smaller scale. De Barros was told that zimbabwe was a live word in those
      states for a royal residence, each kept by a warden called the symbacayo,
      with some of the king's wives always in residence.
    source: theal-records-vi

institutions:
  military_basis: null
  # The one field that can be filled, and it is filled from other people's
  # rubbish and other people's coins. Gold from the plateau's reefs and alluvial
  # workings went east to Sofala and north from there on the monsoon, and Kilwa
  # held the last leg. Excavation here has produced Chinese celadon, Persian and
  # Syrian glazed wares, glass beads by the tens of thousands, and a coin of a
  # thirteenth-century Kilwan sultan.
  #
  # De Barros describes the working itself a century after the abandonment and
  # calls those fields the most ancient known in the country: alluvial washing,
  # ponds drained by gangs of two hundred, and the metal advanced against on
  # credit in cloth and beads by traders from the coast. Nothing here is coded
  # from a document; it is coded from the direction the imports came from and
  # the metal that paid for them.
  revenue_basis: { values: [mining, trade-toll], source: pikirayi-2001 }
  succession_rule: null
  legitimation: null

# Empty, and not for want of looking. A turning point is dated to a year and
# this polity has no years: radiocarbon ranges, a ceramic sequence and a
# construction phasing, and not one event that any source names on a date. An
# empty list is the truthful state of it and stays empty.
turning_points: []

measures:
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: pikirayi-2001 }
    religions_carried: { count: 0, items: [], source: pikirayi-2001 }
    successor_claims: { count: 0, items: [], source: pikirayi-2001 }
