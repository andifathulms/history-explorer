id: maurya
region: classical-india

name:
  latin: Maurya Empire
  script: मौर्य साम्राज्य
  script_lang: sa

span:
  start: { min: -322, max: -322, source: thapar-2002 }
  end: { min: -185, max: -185, source: thapar-2002 }

identity: >-
  The first empire to hold most of the subcontinent, and the one whose ruler
  renounced conquest in inscriptions still standing.

capitals:
  - { name: Pataliputra, script: पाटलिपुत्र, from: -322, source: thapar-2002 }

core_region: The Indo-Gangetic plain and the Deccan

rulers:
  founder: { name: Chandragupta Maurya, reign: [-322, -298], source: thapar-2002 }
  peak: { name: Ashoka, reign: [-268, -232], source: thapar-2002 }
  last: { name: Brihadratha, reign: [-187, -185], source: thapar-2002 }

scripts_and_languages:
  administration: [Prakrit, Sanskrit]
  writing_system: Brahmi

ended:
  type: internal usurpation
  by: [shunga]
  year: -185
  source: thapar-2002

# The Nanda and the Shunga, once named here in prose, now have full records of
# their own and the relationships are drawn as edges instead.
preceded_by_external: []
succeeded_by_external: []

institutions:
  # Megasthenes' six-committee army administration - separate boards for
  # infantry, cavalry, chariots, elephants, the navy and the commissariat -
  # describes a maintained, salaried force rather than an occasional levy.
  military_basis: { values: [standing-professional], source: megasthenes-mccrindle }
  # A quarter of the produce, on land the crown itself owned, with officers
  # who measured the fields and inspected the irrigation sluices.
  revenue_basis: { values: [land-tax], source: megasthenes-mccrindle }
  succession_rule: null
  # Devanampriya, "Beloved of the Gods," is Ashoka's own style throughout the
  # edicts - a claim of divine favour layered on top of a throne his
  # grandfather had already taken by force from the Nandas.
  legitimation: { values: [conquest, divine-sanction], source: asoka-hultzsch }

turning_points:
  - year: -298
    type: reform
    name: Bindusara succeeds Chandragupta
    changed: >-
      The throne passed, for the only time in the dynasty's history, without
      war, murder or coup - a quiet transition between a reign crowded with
      conquest and one that left no inscription of its own, in a dynasty
      whose other two transfers of power were a usurpation and an
      assassination.
    source: smith-1904
    contested: false
  - year: -260
    type: battle
    name: The conquest of Kalinga
    changed: >-
      Ashoka's own edicts count the campaign's dead and deported in numbers
      no other ancient ruler published about himself, and record his
      declared remorse in the same breath as a warning to the frontier
      forest peoples that he retained the power to do it again. Kalinga was
      the empire's last conquest; every edict issued afterward is about
      governing what already existed rather than adding to it.
    source: asoka-hultzsch
    contested: false
  - year: -185
    type: succession-crisis
    name: Pushyamitra's coup
    changed: >-
      The commander-in-chief killed the last emperor at a troop review and
      took the throne himself - no siege, no rival claimant, no invasion,
      only the ordinary vulnerability of a ruler standing in front of an
      army that answered to somebody else.
    source: thapar-2002
    contested: false

measures:
  reach_km2: { value: 3400000, at: -250, source: taagepera-1979 }
  peak_population: null
  influence:
    descendant_scripts: { count: null, items: [], source: null }
    religions_carried:
      count: 1
      items: [Buddhism]
      source: thapar-2002
    # Zero. The Mauryan wheel on the modern Indian flag is a twentieth-century
    # republic adopting a third-century-BC king as its constitutional ancestor,
    # which is a different thing from a successor dynasty claiming his
    # authority - and no dynasty did. The Guptas attempted an Indian empire
    # again five centuries later, but on their own titulature, not his.
    successor_claims: { count: 0, items: [], source: thapar-2002 }
