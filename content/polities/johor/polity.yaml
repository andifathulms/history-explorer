id: johor
region: sumatra-and-the-peninsula

name:
  latin: The Sultanate of Johor
  script: null
  script_lang: null

# 1528 is Alauddin Riayat Shah II, second son of Melaka's last sultan,
# establishing himself on the Johor river. 1699 is the killing of Mahmud Shah II
# and the end of the Melaka line.
#
# The name Johor continues past 1699 under the bendahara family and then under
# Bugis power until the Anglo-Dutch treaty of 1824 divides it. This record does
# not run there, for the reason this corpus's Dai Viet record gives on its own
# first page: a span that covers three dynasties and a partition is a country
# rather than a polity.
span:
  start: { min: 1528, max: 1528, source: reid-2005 }
  end: { min: 1699, max: 1699, source: andaya-1975 }

identity: >-
  The Melakan dynasty in exile, which held the strait for a hundred and
  seventy-one years after losing the city, wrote the Malay Annals, and was ended
  by its own nobles.

capitals:
  - { name: Johor Lama, from: 1540, source: reid-2005 }
  - { name: Riau, from: 1673, source: andaya-1975 }

core_region: The southern tip of the Malay peninsula, the Riau-Lingga archipelago and the Sumatran coast opposite

rulers:
  founder: { name: Alauddin Riayat Shah II, reign: [1528, 1564], source: reid-2005 }
  peak: { name: Abdul Jalil Shah III, reign: [1623, 1677], source: andaya-1975 }
  last: { name: Mahmud Shah II, reign: [1685, 1699], source: andaya-1975 }

scripts_and_languages:
  administration: [Malay, Arabic]
  writing_system: Jawi — the Arabic script adapted for Malay

# Mahmud Shah II was killed on his way to the mosque by his own nobles, and the
# bendahara took the throne. `ended.type` is `internal usurpation` and `by` is
# empty because what replaced the dynasty was its own chief minister's family,
# under the same name, which this site does not carry as a separate record.
#
# What ended in 1699 is bigger than the polity: it is the Melaka royal line,
# unbroken since about 1400, and the sultanates of the peninsula spent the next
# century arguing about who could claim it.
ended:
  type: internal usurpation
  by: []
  year: 1699
  source: andaya-1975

# What came next, named because the name Johor continues without the thing this
# record is about continuing. The bendahara sultans are the successor claim; this
# is what became of the state itself.
succeeded_by_external:
  - name: the bendahara sultans, and after them the Bugis at Riau
    year: 1699
    note: >-
      The chief minister's family took the throne under the same name, in the
      same place, with the same regalia. Within twenty years its standing was
      being contested by Raja Kecil of Siak, who claimed to be Mahmud Shah's
      posthumous son and took Johor on the strength of it in 1718, and by Bugis
      newcomers who made themselves the real power at Riau. Everyone involved
      argued their case in terms of a line that had stopped in 1699. The
      Anglo-Dutch treaty of 1824 then divided what was left between two European
      spheres, and the halves are now Johor in Malaysia and Riau in Indonesia.
    source: andaya-1975

institutions:
  # The orang laut, for the third time in this region. The sea peoples of the
  # straits and estuaries served Srivijaya, then Melaka, then this record — the
  # same arrangement on the same water across a thousand years, and the reason
  # Johor could enforce anything at sea with no fleet of its own.
  #
  # Their withdrawal after 1699 is the reason the killing mattered. Andaya's
  # account is that the orang laut were attached to the Melaka line personally
  # rather than to the office, and that when the nobles killed the last of it
  # they lost the instrument the sultanate had been running on.
  military_basis: { values: [client-levy], source: andaya-1975 }
  revenue_basis: { values: [trade-toll], source: andaya-1975 }
  succession_rule: null
  # Descent, and on this record that is not one value among several. Johor's
  # entire claim was that it was Melaka — the same dynasty, the same regalia, the
  # same court offices, in a different place. The Sejarah Melayu was composed
  # here to say so.
  legitimation: { values: [descent], source: brown-1970 }

turning_points:
  - year: 1641
    type: siege
    name: Melaka, from the other side
    changed: >-
      Johor supplied the ships and the men for the Dutch company's siege of
      Portuguese Melaka, ending a hundred and thirty years of Portuguese
      rule there in a campaign the exiled dynasty had every reason to
      think would finally bring the city home. It did not: a new occupier
      simply replaced the old one, and taxed the port as harshly as its
      predecessor ever had, driving the trade into Johor's own hands
      instead.
    source: andaya-1975
    contested: false
  - year: 1673
    type: siege
    name: Jambi
    changed: >-
      Jambi, on the Sumatran side, sacked Johor Lama and the court moved to the
      Riau islands. A Malay polity was nearly destroyed by another Malay polity
      in the middle of the period usually described as its recovery, which is a
      corrective to reading the seventeenth-century strait as a contest between
      Asians and Europeans.
    source: andaya-1975
    contested: false
  - year: 1699
    type: succession-crisis
    name: The killing of Mahmud Shah
    changed: >-
      A dynastic line that had outlasted the fall of Melaka, a Sumatran
      sack of its own capital and a century and a half of Portuguese and
      Dutch power in the strait was ended, in the end, not by any of them
      but by its own ministers - and took with it a naval arrangement that
      had already survived the fall of two earlier polities and could not
      survive the fall of this one.
    source: andaya-1975
    contested: false

measures:
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: andaya-1975 }
    religions_carried: { count: 0, items: [], source: andaya-1975 }
    # One. The bendahara family that killed Mahmud Shah II took the throne under
    # the same name, kept the regalia, kept the offices, and governed as Johor
    # for another century and a quarter. It is a successor claim made by the
    # people who created the vacancy, which rule 1 counts without comment.
    successor_claims:
      count: 1
      items: [The bendahara sultans of Johor]
      source: andaya-1975
