id: bone
region: the-eastern-archipelago

name:
  latin: Kingdom of Bone
  # Bugis chancery language was written in Lontara, its own script
  # derived from Brahmi rather than from Arabic - null for the same
  # reason as this region's Jawi-script records: a name in letters
  # nobody on this project can proofread is a decoration that reads
  # as a citation.
  script: null
  script_lang: null

# macknight-paeni-hadrawi-2020's own edition cross-checks the chronicle's
# internal reign-lengths against later Bone genealogies; the two available
# reconstructions place the founding tomanurung Matasilompo'é's own reign
# somewhere between the 1320s and 1360s, given here as a range reflecting
# that disagreement rather than false precision. Bone itself continued as a
# kingdom for centuries after 1696 - into the Dutch colonial period and
# beyond - but nothing consulted for this record follows it there.
span:
  start: { min: 1326, max: 1358, source: macknight-paeni-hadrawi-2020 }
  end: { min: 1696, max: 1696, source: andaya-1981 }

identity: >-
  A Bugis kingdom fought into Islam at spear-point by its own coastal
  neighbor, whose escaped, enslaved prince came back a generation later
  with a foreign fleet and made Bone the paramount power of the whole
  peninsula instead.

capitals:
  - { name: Watampone, source: andaya-1981 }

core_region: The eastern side of the South Sulawesi peninsula, Bugis-speaking territory

rulers:
  # No source consulted here names a Bone ruler before the Gowa conquest.
  # A tomanurung, "descended one" - a founding claim of heavenly rather
  # than ordinary human origin, matched by his own wife, a second
  # tomanurung from the neighboring settlement of Toro'.
  founder: { name: "Matasilompo'é", source: macknight-paeni-hadrawi-2020 }
  peak: { name: "Arung Palakka (La Tenritatta)", source: andaya-1981 }
  last: { name: "La Patau", source: andaya-1981 }

scripts_and_languages:
  administration: [Bugis]
  writing_system: "Lontara script"

institutions:
  military_basis: { values: [tribal-levy, client-levy], source: andaya-1981 }
  revenue_basis: null
  succession_rule: null
  legitimation: { values: [descent, conquest], source: andaya-1981 }

# No source consulted here dates or names a conquest ending Bone's own
# kingship; La Patau's own accession in 1696 is used as the point this
# record's own coverage ends, not a claim that Bone itself ended then.
ended:
  type: still contested
  by: []
  year: null
  source: andaya-1981

preceded_by_external: []
succeeded_by_external: []

turning_points:
  - year: 1340
    type: succession-crisis
    name: "The founding marriage of two tomanurung"
    changed: >-
      A ruler whose own claim to the throne rested on a descent from the
      sky married a second figure who made the identical claim at a
      neighboring settlement, joining two separately legitimated founding
      lines by union rather than by either one absorbing the other.
    source: macknight-paeni-hadrawi-2020
    contested: true
  - year: 1611
    type: conversion
    name: "Forced conversion and submission to Gowa"
    changed: >-
      Six years of campaigning by a rising coastal neighbor ended in Bone's
      own submission and conversion to Islam - not the arrival of a new
      religion through trade and marriage, as it had spread elsewhere in
      the archipelago, but a change imposed by an army on a kingdom that
      had fought hard against being told when and how to adopt it.
    source: andaya-1981
    contested: false
  - year: 1667
    type: battle
    name: "The Bongaya settlement"
    changed: >-
      A war two generations in the making, led by a Bone prince whose own
      people Gowa had once put to forced labor, forced Gowa's ruler to sign
      away his foreign allies, his dependencies and his fortifications - a
      treaty that did not end the fighting outright, but marked the point
      Bone's own reversal of the old subordination became unstoppable.
    source: andaya-1981
    contested: false
  - year: 1669
    type: siege
    name: "The fall of Sombaopu"
    changed: >-
      Gowa's own fortress fell after its four-metre walls had to be mined
      rather than breached, and the settlement that followed put the
      prince who had led the war against his own former overlord at the
      top of an arrangement no rival in the region could contest.
    source: andaya-1981
    contested: false
  - year: 1696
    type: succession-crisis
    name: "An unchallenged succession"
    changed: >-
      The ruler who had spent nearly three decades making sure no rival
      power remained anywhere in South Sulawesi died, and his own chosen
      successor took the throne without a single challenger - proof, after
      a reign built on breaking every possible rival, that the arrangement
      had genuinely outlasted the man who built it.
    source: andaya-1981
    contested: false

measures:
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: andaya-1981 }
    religions_carried: { count: 0, items: [], source: andaya-1981 }
    successor_claims: { count: 0, items: [], source: andaya-1981 }
