id: ikhshidid
region: central-lands

name:
  latin: Ikhshidid Emirate
  script: الإخشيديون
  script_lang: ar

span:
  start: { min: 935, max: 935, source: petry-1998 }
  end: { min: 969, max: 969, source: petry-1998 }

identity: >-
  The second autonomous Egyptian dynasty, holding Egypt and the holy cities
  against Fatimid pressure for a generation.

capitals:
  - { name: Fustat, script: الفسطاط, from: 935, source: petry-1998 }

core_region: Egypt, southern Syria and the Hijaz

rulers:
  founder: { name: Muhammad ibn Tughj al-Ikhshid, reign: [935, 946], source: petry-1998 }
  peak: { name: Muhammad ibn Tughj al-Ikhshid, reign: [935, 946], source: petry-1998 }
  last: { name: Abu al-Fawaris Ahmad, reign: [968, 969], source: petry-1998 }

scripts_and_languages:
  administration: [Arabic]
  writing_system: Arabic

ended:
  type: conquest
  by: [fatimid]
  year: 969
  source: brett-2017

institutions:
  military_basis: { values: [slave-soldier], source: petry-1998 }
  revenue_basis: { values: [land-tax], source: petry-1998 }
  # Designated within the family, and twice overtaken: Kafur was regent for
  # two of Ibn Tughj's sons and then ruled in his own name, with the khutba
  # pronounced for a purchased slave rather than for the house.
  succession_rule: { values: [nomination], source: petry-1998 }
  legitimation: { values: [caliphal-investiture], source: petry-1998 }

turning_points:
  - year: 936
    type: battle
    name: "The third Fatimid attempt fails"
    changed: >-
      A Fatimid army came east for the third time in twenty-two years and was
      beaten in the delta by the officer Baghdad had just granted the province
      to. It bought thirty years, during which the Friday sermon at Mecca and
      Medina was pronounced for the Abbasid caliph because an Egyptian governor
      kept the road open and fed the holy cities.
    source: petry-1998
    contested: false
  - year: 969
    type: treaty
    name: "The terms at Fustat"
    changed: >-
      After a low Nile, a famine and a divided court, the Fatimid general came
      east with grain and the Egyptian notables and jurists negotiated a
      written surrender: persons and property safe, the Sunni legal schools and
      their judges maintained, no forced conversion, endowments respected. The
      terms held in substance for two centuries, and the Hijaz went with Egypt
      inside a year.
    source: brett-2017
    contested: false

measures:
