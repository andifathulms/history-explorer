id: mutapa
region: zimbabwe-and-the-coast

name:
  latin: Mutapa Empire
  # theal-zambesi-1907 records "monomotapa" as the Portuguese rendering
  # of the paramount Makalanga chief's own title - a word the source
  # itself calls unattested in the modern Makalanga dialect, and of
  # uncertain original form. No script: the polity left no writing of
  # its own, as at Great Zimbabwe.
  script: null
  script_lang: null

# theal-zambesi-1907 dates the founding of the Portuguese fort and
# trading station at Sofala, the opening of sustained documentary
# contact with the Makalanga empire the Portuguese called
# monomotapa's, to 1505. The empire itself is older: theal-zambesi-1907
# gives no founding date of its own, and this record's own predecessor
# in this collection, great-zimbabwe, ends around 1450 without
# recording what replaced it. That gap is real, not filled here.
span:
  start: { min: 1505, max: 1505, source: theal-zambesi-1907 }
  # mudenge-1988 traces the founding, under Mutota and his son Matope,
  # to a Karanga migration and conquest out of the declining Great
  # Zimbabwe state, but is explicit that no reliable year survives for
  # either man's reign: the surviving king-lists name barely half the
  # rulers who probably reigned before 1490. 1505, the year Theal's
  # source begins its own documentary record at the Portuguese fort at
  # Sofala, remains the earliest confidently dated point.
  # mudenge-1988 traces the dynasty's own line of successors past
  # Domingos's 1670 murder, through progressive territorial loss, to
  # a fifty-second and final ruler, Chioko Dambamupute, whose death in
  # 1902 the source itself identifies as the end of "both the dream
  # and the reality of the historic Mutapa state."
  end: { min: 1902, max: 1902, source: mudenge-1988 }

identity: >-
  The Makalanga empire whose paramount title, monomotapa, gave
  Portuguese maps a name for the whole interior gold trade - never
  conquered outright, but reduced to a vassal after civil war, its
  baptised king murdered by his own captains eighteen years after he
  took a Christian name.

capitals:
  - { name: "Mount Fura (Mount Darwin), the monomotapa's great place", source: theal-zambesi-1907 }

core_region: The Zimbabwe plateau between the Zambesi and Sabi rivers, and the Manica goldfields

rulers:
  # theal-zambesi-1907 names no founding monomotapa; the founding of
  # the empire predates the Portuguese documentary record this source
  # is built from. See great-zimbabwe's own matching null founder.
  founder: { name: null, source: null }
  # mudenge-1988 credits Matope, Mutota's son and successor, with the
  # conquests - east to the Rwenya river and, through alliance and
  # conquest together, on to the Indian Ocean coast - that gave the
  # empire its greatest territorial reach; no reliable reign dates
  # survive for a founding-era ruler.
  peak: { name: Matope (Nyanhehwe), source: mudenge-1988 }
  # mudenge-1988's own numbered king-list runs to a fifty-second and
  # final ruler, Chioko Dambamupute, whose accession it dates only as
  # "post-1890" and whose death in 1902 the source treats as the end
  # of the historic Mutapa state; Domingos (1652-1670) was the last
  # monomotapa theal-zambesi-1907's own narrower documentary record
  # reaches, not the dynasty's actual last ruler.
  last: { name: Chioko Dambamupute, reign: [1890, 1902], source: mudenge-1988 }

scripts_and_languages:
  administration: [Karanga (Shona)]
  writing_system: null

institutions:
  military_basis: null
  revenue_basis: null
  # theal-zambesi-1907 records the throne changing hands by usurpation,
  # civil war and Portuguese-backed coup at least three times in the
  # narrative this record covers - Tshikanga's usurpation of Mokomba,
  # Kesarimyo's restoration, and Manuza's own proclamation as
  # monomotapa by a Portuguese-led army against the reigning
  # Kapranzine - rather than any single settled rule of succession.
  succession_rule: { values: [factional], source: theal-zambesi-1907 }
  legitimation: null

preceded_by_external: []

succeeded_by_external: []

# mudenge-1988 describes a centuries-long shrinkage - province after
# province (Guruuswa, Uteve, Barwe, Manyika, Dande) lost to the Rozvi,
# to Portuguese prazo estates and to internal breakaway, leaving only
# the district of Chidima by the late eighteenth century - rather than
# any single conquest. The Portuguese formally annexed the last of
# that territory in 1885; the dynasty's own final claimant, Chioko
# Dambamupute, died in 1902 leading a failed attempt to reverse that
# loss, which mudenge-1988 treats as the state's actual end.
ended:
  type: gradual absorption
  by: [portugal]
  year: 1902
  source: mudenge-1988

turning_points:
  - year: 1505
    type: treaty
    name: "The Portuguese fort at Sofala"
    changed: >-
      The construction of a Portuguese fort and trading station at
      Sofala opened sustained documentary contact between Europe and
      the Makalanga empire the Portuguese called monomotapa's - the
      beginning of the written record this account of the empire is
      built from, though the empire itself was already old by this
      date.
    source: theal-zambesi-1907
    contested: false
  - year: 1561
    type: catastrophe
    name: "The martyrdom of Fr Silveira"
    changed: >-
      After the Jesuit missionary Goncalo da Silveira baptised the
      monomotapa Negomo and hundreds of his court within weeks of
      arriving, an alliance of threatened Shona religious leaders and
      Muslim traders convinced Negomo that the priest was a sorcerer
      and a Portuguese spy; Negomo had him strangled on 15 March 1561
      and his body thrown into the Musengezi river. The killing became
      Portugal's own pretext for an armed expedition into the interior
      within a decade, and no monomotapa after Negomo risked so open an
      embrace of a single foreign faction again.
    source: mudenge-1988
    contested: false
  - year: 1629
    type: treaty
    name: "A monomotapa becomes a Portuguese vassal"
    changed: >-
      After a civil war in which a Portuguese-led force helped install
      Manuza as monomotapa against the reigning Kapranzine, Manuza
      signed a document on 24 May 1629 acknowledging himself a vassal
      of the king of Portugal - opening the country to missionaries and
      traders and promising not to shelter fugitives, the first formal
      subordination of the monomotapa's own throne to a European crown.
    source: theal-zambesi-1907
    contested: false
  - year: 1652
    type: conversion
    name: "The baptism of the monomotapa Domingos"
    changed: >-
      The reigning monomotapa was received into the Catholic church
      along with his principal wife and a multitude of sub-chiefs,
      taking the baptismal name Domingos - an event celebrated in Rome
      with special services and a Latin inscription on bronze, and the
      high point of Dominican missionary influence over the Makalanga
      throne before Domingos's own murder by his captains eighteen
      years later.
    source: theal-zambesi-1907
    contested: false
  - year: 1670
    type: succession-crisis
    name: "Domingos murdered by his own captains"
    changed: >-
      The monomotapa whose baptism had been celebrated in Rome with a
      bronze plate was killed by his own household eighteen years
      later - the same kind of internal violence that had already
      claimed Mokomba and unseated Kapranzine, not a conquering army.
      No single event ended the empire itself, which continued under
      reduced, vassal monomotapas for more than two further centuries,
      but this is where Theal's own documentary account closes.
    source: theal-zambesi-1907
    contested: false
  - year: 1885
    type: treaty
    name: "The annexation of Chidima"
    changed: >-
      Two centuries of province-by-province loss - Guruuswa, Uteve,
      Barwe, Manyika and finally Dande, each hiving off or falling to
      the Rozvi state or to Portuguese prazo landholders - had already
      reduced the dynasty to one district, Chidima, when Portuguese
      agents broke the power of its ruler Dzuda in 1884 and formally
      annexed the district the following year. For the first time in
      more than four centuries, a direct successor of Mutota and
      Matope held no territory of his own at all.
    source: mudenge-1988
    contested: false
  - year: 1902
    type: revolt
    name: "The death of Chioko Dambamupute"
    changed: >-
      Dzuda's successor Chioko Dambamupute spent the 1890s building an
      anti-Portuguese coalition that, by 1901, had very nearly turned
      the Tete district into a liberated zone and looked close to
      recreating the empire of Munhumutapa. Chioko was killed in 1902
      assisting the ruler of Barwe against the Portuguese; his heir
      never rebuilt the alliance, and with Chioko's death, mudenge-1988
      writes, "both the dream and the reality of the historic Mutapa
      state came to an end."
    source: mudenge-1988
    contested: false

