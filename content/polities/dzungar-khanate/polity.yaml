id: dzungar-khanate
region: mongol-world

name:
  latin: Dzungar Khanate
  script: ᠵᠡᠭᠦᠨ ᠭᠠᠷ
  script_lang: mn

# Howorth, following Pallas, has Kharakhula surviving until 1635, when Erdeni
# Baatur Khungtaiji succeeded him. The end is a range because the destruction
# took three years: the Ili was occupied and Dawachi taken in 1755, and the
# extermination of the four divisions and their twenty-one hordes was finished
# after Amursana's death in 1757-58.
span:
  start: { min: 1635, max: 1635, source: howorth-1876 }
  end: { min: 1755, max: 1758, source: howorth-1876 }

identity: >-
  The last nomad empire: a confederation of western Mongols on the Ili and the
  Irtysh who took Tibet, the Tarim and the Khalkha country without a drop of
  Chinggisid blood, and were exterminated by an emperor who wrote down that he
  had done it.

capitals:
  - { name: Ili, from: 1678, source: howorth-1876 }

core_region: Dzungaria — the Ili valley, the Black Irtysh and the Tarbagatai

rulers:
  founder: { name: Erdeni Baatur Khungtaiji, reign: [1635, 1653], source: howorth-1876 }
  peak: { name: Galdan Boshugtu, reign: [1671, 1697], source: howorth-1876 }
  last: { name: Dawachi, reign: [1752, 1755], source: howorth-1876 }

scripts_and_languages:
  administration: [Oirat Mongolian]
  writing_system: Uyghur-Mongolian

preceded_by_external:
  - name: the Four Oirats
    type: seceded from
    year: null
    note: >-
      The confederation of western Mongols that had held the steppe since the
      collapse of the Chinggisid khans in the fifteenth century, and whose
      greatest chief, Esen, captured a Chinese emperor in 1449 and was killed
      three years later for taking a title his descent did not entitle him to.
      Kharakhula led the Choros north of the Altai and settled them on the
      Irtysh; his son Erdeni Baatur Khungtaiji made the Dzungar Khanate out of
      the right wing of that confederation.
    source: howorth-1876

ended:
  type: conquest
  by: []
  year: 1758
  source: howorth-1876

succeeded_by_external:
  - name: the Qing dynasty
    type: conquered by
    year: 1758
    note: >-
      The Qianlong emperor took the Ili in 1755, installed four khans over the
      four Oirat divisions, found them all intractable, and destroyed them. The
      memoir he wrote about it says of one: I uprooted his race, I changed into
      a desert the unhappy country where the perfidious Choros formerly dwelt.
      The valley became a Chinese penal settlement, repopulated from Gansu with
      criminals and garrison colonists.
    source: howorth-1876

institutions:
  # The Oirat tümens under their taishis - Choros, Dörbet, Khoit and Khoshut -
  # under one over-khan. Breaking that supreme authority and putting the four
  # divisions back under four separate khans was the Qing settlement of 1755,
  # and the prelude to destroying all four.
  military_basis: { values: [tribal-levy], source: howorth-1876 }
  # Herds, the Irtysh salt, the caravan trade of the Ili, and after 1678 a
  # standing tribute of four hundred thousand tangas a month from the oasis
  # towns of the Tarim, whose internal government was left alone.
  revenue_basis: { values: [tribute, trade-toll, plunder], source: howorth-1876 }
  # Violent and unregulated. Galdan was a monk who took dispensation, killed his
  # brothers and declared himself taiji; his nephew fled with seven followers and
  # came back to destroy him; the last two rulers were a usurper and the man who
  # betrayed him.
  succession_rule: { values: [factional], source: howorth-1876 }
  # Not descent — the Choros were Oirats and no Chinggisids. What they had
  # instead was Lhasa. Galdan had been a lama in the Dalai Lama's own service,
  # and Howorth's explanation of his hold over the Kalmuks is that this made him
  # a considerable person entirely apart from being khan.
  legitimation: { values: [divine-sanction, investiture], source: howorth-1876 }

turning_points:
  - year: 1676
    type: battle
    name: "Lake Zaisan"
    changed: >-
      It made Galdan the undisputed head of the Oirats rather than one taishi
      among several, and it did so by destroying the senior Khoshut line. From
      this point the four divisions answered to one over-khan, which is the
      arrangement the Qing would spend eighty years trying to break and finally
      abolished by killing everyone who held it.
    source: howorth-1876
    contested: false
  - year: 1678
    type: battle
    name: "Little Bukharia"
    changed: >-
      A confederation that had lived on herds and tolls acquired a settled
      tributary population and a fixed monthly income, and stopped needing to
      raid to pay itself. It also acquired a religious clientele south of the
      mountains and a frontier with the Qing in the Tarim, both of which
      outlived it.
    source: howorth-1876
    contested: false
  - year: 1688
    type: battle
    name: "The Khalkha driven over the Gobi"
    changed: >-
      Galdan crossed into eastern Mongolia and dispersed the seven banners of the
      Khalkha — a hundred thousand men — in a single year. They fled south of the
      desert and submitted to the Manchus to survive, which brought the whole of
      northern Mongolia into the Qing empire and made the emperor and the Dzungars
      neighbours.
    source: howorth-1876
    contested: false
  - year: 1696
    type: battle
    name: "Jao Modo"
    changed: >-
      The Dzungars lost the herds rather than the men, and on that steppe the
      herds were the army. A power that had beaten the Khalkha, the Kazakhs and
      the Tarim in twenty years could not replace six thousand oxen and five
      thousand camels, and never again put a field army against the Qing.
    source: howorth-1876
    contested: false

