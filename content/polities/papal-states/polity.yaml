id: papal-states
region: italy

name:
  latin: Papal States
  script: Status Pontificius
  script_lang: la

span:
  # mann-1902's own footnote on the Lombard king Liutprand's 728
  # restitution of Sutri notes that "some see in it the beginning of the
  # temporal power" - a single town, restored rather than newly granted.
  # The far larger and better-attested Donation of Pepin, covering the
  # whole former Byzantine Exarchate of Ravenna, followed in 756. Both
  # dates are kept rather than averaged.
  start: { min: 728, max: 756, source: mann-1902 }
  end: { min: 1870, max: 1870, source: garofalo-2024 }

identity: >-
  The one government in Latin Christendom whose ruler was never a king's son -
  a state built by a Lombard's restitution of one captured town and a Frankish
  king's grant of a former Byzantine province, that went on to crown emperors
  and spend seventy years governing from exile.

capitals:
  - { name: Rome, source: mann-1902 }

core_region: Central Italy, from Rome north through Umbria, the Marche and the Romagna to the former Exarchate of Ravenna

rulers:
  founder: { name: "Pope Stephen II", reign: [752, 757], source: mann-1902 }
  # Excommunicated and deposed an emperor, then absolved him only after
  # three days of public penance in the snow at Canossa - the single
  # moment this record's own sources treat as the high-water mark of
  # papal authority over a temporal sovereign.
  peak: { name: "Pope Gregory VII", reign: [1073, 1085], source: gregorovius-1894 }
  # Still reigning as pope for another eight years after 1870, but as
  # ruler of a sovereign temporal state, his reign ended with the fall of
  # Rome. See the closing chapters.
  last: { name: "Pope Pius IX", reign: [1846, 1870], source: garofalo-2024 }

scripts_and_languages:
  administration: [Latin, Italian]
  writing_system: Latin

institutions:
  military_basis: null
  revenue_basis: null
  # The papacy was, and remained throughout this record's span, an
  # elective office - its temporal rule inseparable from an ecclesiastical
  # succession that never passed by birth.
  succession_rule: { values: [election], source: mann-1902 }
  # Papal authority rested on the office's own claimed divine institution
  # (the successor of St. Peter), and its temporal territory specifically
  # on the 756 grant of a Frankish king - an investiture in fact, if never
  # in the pope's own account of it.
  legitimation: { values: [divine-sanction, investiture], source: mann-1902 }

preceded_by_external: []

# Not absorbed and not conquered outright to extinction: the Kingdom of
# Italy took the papacy's territory by force in 1870, but the papacy
# itself survived as a religious institution and, in 1929, received
# sovereignty over a much smaller territory of its own.
succeeded_by_external:
  - name: The Kingdom of Italy
    type: conquered by
    year: 1870
    note: >-
      Victor Emmanuel II's army breached the Aurelian Walls at the Porta
      Pia on 20 September 1870 after a five-hour battle, ending the
      papacy's rule over central Italy and completing Italian
      unification. Pope Pius IX refused to recognize the loss, becoming
      the self-styled "prisoner of the Vatican" - a status his successors
      held until the Kingdom of Italy's own fascist government restored a
      small sovereign Vatican City State to the papacy by the 1929
      Lateran Treaty.
    source: garofalo-2024
    contested: false

ended:
  type: conquest
  by: []
  year: 1870
  source: garofalo-2024

turning_points:
  - year: 728
    type: treaty
    name: "Sutri is restored to the apostles"
    changed: >-
      A Lombard king who had seized the town of Sutri, under pressure of
      papal money and diplomacy alike, gave it back not to the Byzantine
      authorities who had once held it but directly to the papacy itself
      - a small, single-town restitution that later writers would debate
      as the true first grant of sovereign ground the papacy ever
      received.
    source: mann-1902
    contested: true
  - year: 751
    type: reform
    name: "Zachary sanctions a coup"
    changed: >-
      Asked by the Frankish nobility whether it was right that a man with
      no royal power should keep the name of king while another held the
      substance, Pope Zachary ruled that the one with the power should
      also hold the title - a papal judgment that deposed the last
      Merovingian king in all but name and cleared the way for the
      Carolingian line the papacy's own fortunes would soon become bound
      to.
    source: mann-1902
    contested: false
  - year: 756
    type: treaty
    name: "The Donation of Pepin"
    changed: >-
      After two campaigns forced the Lombard king to disgorge what he had
      seized, Pepin handed the recovered Byzantine province over to the
      papacy rather than returning it to Constantinople - conquered
      territory given away by its own conqueror, and the grant that
      turned a bishop of Rome into the sovereign of a real, continuous
      territorial state.
    source: mann-1902
    contested: false
  - year: 800
    type: reform
    name: "Charlemagne is crowned emperor"
    changed: >-
      Rising from prayer at St. Peter's on Christmas Day, Charlemagne
      found a crown placed on his own head by Pope Leo III before a
      crowd that hailed him emperor of the Romans - reviving a Western
      imperial title extinct for three centuries, in a ceremony arranged
      so that the pope who performed it, not the king who received it,
      would appear the arbiter of the transaction.
    source: gregorovius-1894
    contested: false
  - year: 928
    type: succession-crisis
    name: "Marozia imprisons Pope John X"
    changed: >-
      During a Roman revolt she was widely believed to have engineered,
      the Roman noblewoman Marozia had the Pope's own military support
      cut down in the Lateran and John X himself thrown into the Castel
      Sant'Angelo, where he died within the year - the clearest proof
      that the papal chair now depended on the favor of one Roman
      household rather than any wider consensus, ecclesiastical or
      imperial.
    source: gregorovius-1894
    contested: false
  - year: 962
    type: reform
    name: "Otto I crowned emperor, and the papacy bound to him"
    changed: >-
      Pope John XII crowned Otto I emperor at St Peter's, reviving
      Charlemagne's dormant title in exchange for a charter confirming
      the papacy's temporal claims across central Italy - a bargain that
      also bound the Romans and the Pope himself to oaths of fidelity to
      the new Emperor, folding the independence Alberic's regime had
      defended for two decades back into imperial tutelage within months
      of the coronation meant to secure it.
    source: gregorovius-1894
    contested: false
  - year: 1077
    type: reform
    name: "Canossa"
    changed: >-
      Excommunicated and declared deposed by Gregory VII, Henry IV
      crossed the Alps in winter and stood for three days outside a
      mountain fortress in a penitent's shirt before the pope would
      absolve him - forgiveness granted only on condition that Henry
      surrender his own royal authority until a council could judge him,
      the clearest demonstration Latin Christendom had yet seen that a
      pope could unmake as well as make an emperor.
    source: gregorovius-1894
    contested: false
  - year: 1250
    type: reform
    name: "Frederick II dies, and an age with him"
    changed: >-
      The death of the emperor who had spent three decades contesting
      papal authority across Italy left the empire without the one
      Hohenstaufen ruler strong enough to sustain that contest - closing,
      in the judgment of historians looking back on it, the whole medieval
      argument between universal empire and universal papacy in the
      papacy's own favor, decades before a French monarchy would take up
      the same argument on entirely different, national terms.
    source: gregorovius-1894
    contested: false
  - year: 1266
    type: battle
    name: "Benevento"
    changed: >-
      Charles of Anjou, granted Sicily on condition he first remove its
      reigning Hohenstaufen king, destroyed Manfred's army and killed him
      in the field - a French prince's conquest, financed and legitimized
      entirely by Rome, ending the same dynasty's hold on southern Italy
      that a whole generation of popes before Charles had failed to break
      by censure alone.
    source: gregorovius-1894
    contested: false
  - year: 1309
    type: capital-move
    name: "The move to Avignon"
    changed: >-
      Pressed by a French king he could not safely defy on the eve of a
      council that would try the Templars, Clement V moved the papal
      court to Avignon rather than returning it to a Rome he judged too
      dangerous and too poor to govern from - a relocation meant as
      temporary that lasted, in the end, for nearly seventy years.
    source: mollat-1963
    contested: false
  - year: 1378
    type: succession-crisis
    name: "The Western Schism begins"
    changed: >-
      A conclave held under mob pressure to elect a Roman pope produced
      Urban VI, whose harsh treatment of his own electors drove most of
      the cardinals to flee Rome within months and declare his election
      void; their rival election of Clement VII split Latin Christendom
      between two, and by 1409 briefly three, competing popes until the
      Council of Constance finally secured a single, uncontested
      election in 1417.
    source: creighton-1882
    contested: false
  - year: 1506
    type: siege
    name: "Julius II rides to war"
    changed: >-
      Leaving Rome at the head of an armed column at sixty-four, Julius
      II personally led the campaigns that absorbed Perugia and Bologna
      into direct papal government within weeks - the clearest
      demonstration in the Papal States' history that its own territory
      could be built by outright warfare rather than by donation or
      diplomacy alone.
    source: gregorovius-1894
    contested: false
  - year: 1527
    type: catastrophe
    name: "The Sack of Rome"
    changed: >-
      An unpaid, half-mutinous imperial army under the Duke of Bourbon
      stormed the Leonine walls and broke into St Peter's itself, forcing
      Clement VII to flee across a fortified passage to the Castel
      Sant'Angelo under a borrowed cloak while the city below was given
      over to weeks of looting and killing - the most catastrophic
      single blow the Papal States suffered between the Avignon
      relocation and Napoleon's own conquest.
    source: gregorovius-1894
    contested: false
  - year: 1809
    type: revolt
    name: "Pius VII abducted from the Quirinal"
    changed: >-
      Weeks after Pius VII had a bull of excommunication posted against
      the authors of French aggression against the Holy See, Napoleon's
      gendarmes scaled the walls of the Quirinal Palace and abducted the
      Pope from Rome by locked carriage; the Papal States were formally
      annexed to the French Empire, and Pius spent five years in
      successive confinement before Napoleon's own collapse freed him to
      return.
    source: pacca-1850
    contested: false
  - year: 1870
    type: siege
    name: "The Porta Pia breach"
    changed: >-
      Italian artillery opened a gap in the Aurelian Walls after a
      five-hour bombardment, and troops entered Rome over the rubble
      within hours - ending, in a single afternoon, eleven centuries of
      papal rule over the city the Donation of Pepin had first made a
      sovereign territory in its own right.
    source: garofalo-2024
    contested: false

