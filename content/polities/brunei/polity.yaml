id: brunei
region: the-eastern-archipelago

name:
  latin: The Sultanate of Brunei
  script: null
  script_lang: null

# 1368 is the accession of Muhammad Shah in the Brunei genealogies, the first
# ruler the sultanate counts as its own. Saunders is careful that the early
# king list is a claim rather than a chronology and this record follows him.
#
# 1888 is the protectorate treaty with Britain. Brunei exists today, and what
# ended in 1888 is its disposal of its own external relations — the same test
# this site applies to the two courts that came out of Mataram and declines to
# give them records for.
span:
  start: { min: 1368, max: 1368, source: saunders-1994 }
  end: { min: 1888, max: 1888, source: saunders-1994 }

identity: >-
  The sultanate on the north coast of Borneo that at its height claimed the whole
  island's coastline and installed a Muslim ruler at Manila, and that spent its
  last three centuries being given away in pieces.

capitals:
  - { name: Brunei, from: 1368, source: saunders-1994 }

core_region: The north-west coast of Borneo, with claims at their widest around most of the island and north to the Sulu archipelago and Manila bay

rulers:
  founder: { name: Muhammad Shah, reign: [1368, 1402], source: saunders-1994 }
  peak: { name: Bolkiah, reign: [1485, 1524], source: saunders-1994 }
  last: { name: Hashim Jalilul Alam Aqamaddin, reign: [1885, 1906], source: saunders-1994 }

scripts_and_languages:
  administration: [Malay, Arabic]
  writing_system: Jawi — the Arabic script adapted for Malay

# Not a conquest. Brunei's territory was ceded piece by piece over fifty years —
# Sarawak to James Brooke and his successors from 1841, North Borneo to a
# chartered company from 1881 — and the 1888 treaty made what was left a British
# protectorate. `by` is empty because none of those three has a page here, and
# one of them was a private individual.
ended:
  type: gradual absorption
  by: []
  year: 1888
  source: saunders-1994

# Both ends, named because they existed. Boni is Brunei's own earlier self as the
# Chinese records knew it; the three grants are what became of the sultanate's
# territory. Neither has a record here and neither needs one for a reader to be
# told about it.
preceded_by_external:
  - name: Boni
    year: null
    note: >-
      The polity Chinese records name on this coast from the tenth century,
      sending missions long before the sultanate's own genealogies begin -
      and, unlike Melaka's near-identical tribute mission a few years
      later, one that came home with nothing but a ruler's grave in a
      foreign capital rather than a seal his heirs could use. Whether
      Boni's own line and the sultanate's are the same sequence of people
      cannot be established from the evidence either side left behind.
    source: saunders-1994
succeeded_by_external:
  - name: the Brooke Raj, the North Borneo Company and the British protectorate
    year: 1888
    note: >-
      Sarawak was granted to James Brooke in 1841 and ruled by his family as a
      private kingdom until 1946; North Borneo went to a chartered company in
      1881; the protectorate treaty of 1888 covered the strip of coast left
      between them. Every one of those transfers was a legal act performed by
      the sultan. Nobody conquered Brunei — it was signed away in pieces, under
      pressure, by the people who held it.
    source: saunders-1994

institutions:
  # Fleets raised from the coastal peoples of Borneo and the islands. Nine of
  # the archipelago's twenty-two records are coded that way — Srivijaya, Melaka and
  # Johor on the strait, Ternate and Tidore in Maluku, Majapahit and Demak on
  # Java, Sulu in the north, and this one. It is the one thing that runs through
  # all three of the regions the archipelago was split into, and the commonest
  # military coding in any of them by a distance, and it has almost nothing to do
  # with the polities that used it: it is what the sea peoples of the archipelago
  # were, and states attached themselves to it rather than the reverse.
  military_basis: { values: [client-levy], source: saunders-1994 }
  revenue_basis: { values: [trade-toll, tribute], source: saunders-1994 }
  succession_rule: null
  legitimation: { values: [descent, divine-sanction], source: saunders-1994 }

turning_points:
  - year: 1521
    # `reform` again, and again it is the wrong value used deliberately. Nothing
    # was reformed in 1521. This site's Pasai record makes the same choice for
    # Ibn Battuta's visit in 1345 and says why: the nine turning-point types can
    # hold battles, treaties and conversions, and there is no value for "a
    # description of what was already there" — which for a polity with a thin
    # internal archive is often the most valuable dated evidence it has.
    #
    # Two records now carry that mismatch. It is worth recording as a pattern
    # rather than as two accidents.
    type: reform
    name: What Pigafetta found
    changed: >-
      A survivor of an expedition that had already lost its own commander
      and most of its ships gave Europe its first close look at a sultanate
      wealthy enough, and militarily equipped enough, that nobody who read
      the account back home could mistake it for an undeveloped coast
      waiting to be found.
    source: saunders-1994
    contested: false
  - year: 1578
    type: siege
    name: The Castilians
    changed: >-
      A war fought over a dynastic marriage rather than territory cost
      Brunei the whole of its Manila connection within a single decade,
      even though the occupying force itself held the capital for barely
      a matter of weeks before disease broke it - proof that a raid too
      short to count as a real conquest could still permanently sever a
      sphere of influence a fleet alone could never have held.
    source: saunders-1994
    contested: false
  - year: 1841
    type: treaty
    name: Sarawak
    changed: >-
      An English adventurer rewarded for putting down someone else's
      rebellion became the founder of a private hereditary kingdom carved
      out of Brunei's own territory - the first of three separate legal
      transfers, each signed by the sultan himself under pressure rather
      than forced by conquest, that between them handed away most of what
      Brunei still ruled.
    source: saunders-1994
    contested: false

measures:
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: saunders-1994 }
    # One. Brunei carried Islam along the coasts of Borneo and north to Manila
    # bay, where its dynasty had installed a related Muslim ruler before the
    # Spanish arrived in 1571 — which is the northern limit of the movement this
    # archipelago's other records trace, and the point at which it met a Christian one
    # coming the other way across the Pacific.
    religions_carried:
      count: 1
      items: [Sunni Islam]
      source: saunders-1994
    successor_claims: { count: 0, items: [], source: saunders-1994 }
