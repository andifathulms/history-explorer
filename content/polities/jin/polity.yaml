id: jin
region: china

name:
  latin: Jin Empire
  script: 大金
  script_lang: zh

span:
  start: { min: 1115, max: 1115, source: franke-twitchett-1994 }
  end: { min: 1234, max: 1234, source: franke-twitchett-1994 }

identity: >-
  The Jurchen empire that destroyed the Liao and took northern China, and
  was destroyed by the Mongols in turn.

capitals:
  - { name: Zhongdu, script: 中都, from: 1115, source: franke-twitchett-1994 }

core_region: Manchuria and northern China

rulers:
  founder: { name: Aguda, reign: [1115, 1123], source: franke-twitchett-1994 }
  peak: { name: Emperor Shizong, reign: [1161, 1189], source: franke-twitchett-1994 }
  last: { name: Emperor Modi, reign: [1234, 1234], source: franke-twitchett-1994 }

scripts_and_languages:
  administration: [Jurchen, Chinese]
  writing_system: Jurchen

ended:
  type: conquest
  by: [mongol]
  year: 1234
  source: franke-twitchett-1994

institutions:
  # The meng'an-mouke: Jurchen households organised in units of a hundred and a
  # thousand, moved south in the hundreds of thousands after the conquest and
  # settled on confiscated land in north China, holding it in exchange for
  # military service.
  #
  # It is the institution this record's second chapter is about, and it did what
  # such arrangements do: within three generations the settlers were landlords
  # who did not soldier, and the Jin fought the Mongols with hired troops.
  military_basis: { values: [tribal-levy, land-grant], source: franke-twitchett-1994 }
  revenue_basis: { values: [land-tax, poll-tax], source: franke-twitchett-1994 }
  succession_rule: null
  # Descent, and the Mandate — claimed explicitly and argued for in the Chinese
  # idiom, with the dynasty assigning itself an element in the cycle of dynastic
  # virtues and a formal succession from the Northern Song.
  legitimation: { values: [descent, divine-sanction], source: franke-twitchett-1994 }

turning_points:
  - year: 1127
    type: siege
    name: Jingkang
    changed: >-
      A dynasty that had existed for twelve years destroyed the ruling house of
      the oldest state in East Asia and took its capital. The Song did not end -
      a surviving prince carried it south of the Yangtze - but the Jin had shown
      every court on its frontier, Song included, exactly what the destruction of
      the Liao had already shown the Jin: that nothing in north China could stop
      it.
    source: franke-twitchett-1994
    contested: false
  - year: 1141
    type: treaty
    name: Shaoxing
    changed: >-
      The Southern Song accepted the Huai river as the border, acknowledged the
      Jin emperor as its superior, and agreed to annual payments in silver and
      silk. It was the same arrangement the Liao had extracted from the Song a
      century earlier, with the parties changed and the terms worse — and the
      Jin, who had received those Liao payments from the Song's other side a
      generation before, were now on the collecting end of an institution they
      had inherited from the empire they destroyed.
    source: franke-twitchett-1994
    contested: false
  - year: 1214
    type: capital-move
    name: South to Kaifeng
    changed: >-
      The court gave up the one thing a conquest dynasty cannot give up and still
      remain one: the ground its own conquerors came from. Abandoning Zhongdu for
      Kaifeng meant abandoning the settled Jurchen population of the north as
      well as the homeland behind it, in exchange for a defensible line on the
      Yellow River that held for less than a generation.
    source: franke-twitchett-1994
    contested: false

measures:
  reach_km2: { value: 2300000, at: 1150, source: taagepera-1997 }
  peak_population: null
  influence:
    descendant_scripts:
      count: 1
      items: [Jurchen script]
      source: franke-twitchett-1994
    religions_carried: { count: 0, items: [], source: franke-twitchett-1994 }
    # One, and the gap is three hundred and eighty-two years.
    #
    # In 1616 Nurhaci declared a state in the same forests this dynasty came out
    # of and called it the Later Jin, claiming descent from it. His son renamed
    # the dynasty Qing in 1636 and it took China in 1644.
    #
    # This corpus's Ming record names the Qing in its `ended.by`. That id is a
    # backdrop entry in the reference set rather than a full record here, which
    # is why this is a count and not an edge.
    successor_claims:
      count: 1
      items: [qing]
      source: franke-twitchett-1994
