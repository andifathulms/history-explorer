id: zayyanid
region: islamic-west

name:
  latin: Zayyanid Kingdom of Tlemcen
  script: الزيانيون
  script_lang: ar

# 1551 is the Ottoman capture of Tlemcen and 1556 the absorption of the
# territory into the Regency of Algiers as a beylik; the dynasty ends at the
# first and the kingdom at the second.
span:
  start: { min: 1235, max: 1235, source: abun-nasr-1987 }
  end: { min: 1551, max: 1556, source: abun-nasr-1987 }

identity: >-
  The middle one: a Zenata kingdom on the trade crossroads of the central
  Maghreb, besieged, occupied and restored by its larger neighbours for three
  centuries, and rich the whole time.

capitals:
  - { name: Tlemcen, script: تلمسان, from: 1235, source: abun-nasr-1987 }

core_region: The central Maghreb, between the Moulouya and the Chelif

rulers:
  founder: { name: Yaghmurasan ibn Zayyan, reign: [1235, 1283], source: abun-nasr-1987 }
  peak: { name: Abu Hammu Musa II, reign: [1359, 1389], source: abun-nasr-1987 }
  last: { name: Hasan ibn Abdallah, source: abun-nasr-1987 }

scripts_and_languages:
  administration: [Arabic]
  writing_system: Arabic

ended:
  type: conquest
  by: [ottoman]
  year: 1551
  source: abun-nasr-1987

institutions:
  military_basis: { values: [tribal-levy, mercenary], source: abun-nasr-1987 }
  # The crossing point of two trade systems: the east-west road between
  # Morocco and Ifriqiya, and the north-south route from the ports to the
  # Sudan. The kingdom's entire strategic value to everyone else was that it
  # sat on both, and its revenue was the customs.
  revenue_basis: { values: [trade-toll, land-tax], source: abun-nasr-1987 }
  succession_rule: { values: [nomination], source: abun-nasr-1987 }
  legitimation: { values: [conquest], source: abun-nasr-1987 }

turning_points:
  # Ibn Khaldun gives the founding as a confirmation rather than a revolt: the
  # Almohad caliph al-Rashid sent Yaghmurasan a diploma appointing him at
  # Tlemcen, and he outlived the authority that issued it.
  - year: 1236
    type: treaty
    name: "A diploma from Marrakesh"
    changed: >-
      Yaghmurasan took over the command at Tlemcen when his brother died and
      was confirmed in it by the Almohad caliph, then spent forty years turning
      the appointment into a kingdom — buying Tenes outright from a losing
      faction of the family that held it, and taking the Maghrawa by making
      their chief his subordinate. Asked about a genealogy tracing him to
      Idris, he said that if it were true it would profit them with God, but
      that in this world they would owe their success only to their swords.
    source: ibn-khaldun-de-slane
    contested: false
  - year: 1299
    type: siege
    name: "The eight-year siege"
    changed: >-
      The Marinids invested Tlemcen for eight years and, rather than assault
      it, built a walled city outside the walls — al-Mansura, with its own
      mosque, baths and palaces — to take over the trade the siege was
      strangling. They withdrew in 1307 when their sultan was murdered, and the
      Zayyanids came out and demolished it. Almost every siege is a contest for
      a place; this one was a contest for a route, and the method was to offer
      the merchants a better address.
    source: abun-nasr-1987
    contested: false
  - year: 1337
    type: siege
    name: "Tlemcen taken"
    changed: >-
      Abu al-Hasan of Fez took the city and held it for eleven years, and took
      it again in 1352 for another seven. The kingdom was extinguished twice
      and restored twice by the collapse of the power that had extinguished it,
      which is the pattern of its whole existence.
    source: abun-nasr-1987
    contested: false
  - year: 1359
    type: succession-crisis
    name: "Abu Hammu Musa II retakes Tlemcen"
    changed: >-
      A refugee prince who had spent years at the Hafsid court in Tunis
      returned with Dawawida Arab backing, routed the Marinid garrison's
      reinforcements, besieged Tlemcen for three days and took it by
      force on the fourth - restoring Zayyanid rule after the Marinid
      occupation and opening the thirty-year reign the dynasty's own
      medieval power is measured against.
    source: ibn-khaldun-de-slane
    contested: false
  - year: 1389
    type: succession-crisis
    name: "Abu Hammu Musa II assassinated"
    changed: >-
      A plot set in motion by Hilal, a freedman Abu Hammu had once
      favored and later given to his own son Abu Tashfin, killed the
      king who had restored the dynasty thirty years earlier. Abu
      Tashfin succeeded his father and kept the same freedman as his
      chamberlain - a bloody transition that closed the reign
      Ibn Khaldun himself had witnessed from inside the court.
    source: ibn-khaldun-de-slane
    contested: false
  - year: 1551
    type: siege
    name: "Ottomans take Tlemcen"
    changed: >-
      A kingdom that had spent a century as a tributary of the Hafsids, the
      Marinids and the Crown of Aragon in turn was taken by the Ottomans, and
      the last Zayyanid fled to Spanish Oran, was baptised, and lived out his
      life there as Carlos. By 1556 the territory was a beylik of the
      Regency of Algiers - the same fate Tunis was living through in the same
      years, ending the three-way Almohad-successor division that had held,
      roughly along the lines of modern Morocco, Algeria and Tunisia, for
      over three centuries.
    source: abun-nasr-1987
    contested: false

