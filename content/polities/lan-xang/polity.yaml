id: lan-xang
region: mainland-southeast-asia

# wood-1926 gives no date for Lan Xang's own founding (traditionally
# credited to Fa Ngum in 1353) and this record does not assert one; its
# own narrative opens with King Jai Jett'a's (Setthathirath's) 1547
# succession to the Luang Prabang throne, already an established kingdom,
# and follows it through the Siamese conquest of Wiengchan in 1779.
name:
  latin: Lan Xang (Luang Prabang and Vientiane)
  script: null
  script_lang: null

span:
  start: { min: 1547, max: 1547, source: wood-history-of-siam-1926 }
  end: { min: 1779, max: 1779, source: wood-history-of-siam-1926 }

identity: >-
  The Lao kingdom of the middle Mekong, ruled from Luang Prabang and then
  Wiengchan (Vientiane), which fought Burma to a standstill under King Jai
  Jett'a, lost him without a trace in a Cambodian jungle, passed through
  Burmese vassalage and back to independence, and fell to a Siamese army
  that emptied its capital of plunder, including the Emerald Buddha its
  own king had once carried off from Chiengmai.

capitals:
  - { name: Luang Prabang, from: null, source: wood-history-of-siam-1926 }
  - { name: "Wiengchan (Vientiane)", from: null, source: wood-history-of-siam-1926 }

core_region: The middle Mekong valley, present-day Laos

rulers:
  founder: { name: null, source: null }
  # wood-1926 centers its Lao narrative on King Jai Jett'a (Setthathirath),
  # who fought off repeated Burmese invasions, moved the capital to
  # Wiengchan, and remains the dynasty's best-attested king.
  peak: { name: "Jai Jett'a (Setthathirath)", reign: [1547, 1571], source: wood-history-of-siam-1926 }
  # wood-1926 names Prince Bun San (Ong Boun) as ruler of Wiengchan when
  # Taksin's army besieged and captured the city in 1779.
  last: { name: "Bun San", source: wood-history-of-siam-1926 }

scripts_and_languages:
  administration: [Lao]
  writing_system: null

institutions:
  military_basis: { values: [tribal-levy], source: wood-history-of-siam-1926 }
  revenue_basis: null
  succession_rule: null
  # wood-1926 records the Burmese king, after a Lao succession dispute
  # arising from Jai Jett'a's 1571 disappearance, forcing the abdication
  # of a regent and installing Jai Jett'a's own brother on the Wiengchan
  # throne as a vassal (1574) - external investiture layered over the
  # ordinary hereditary claim.
  legitimation: { values: [descent, investiture], source: wood-history-of-siam-1926 }

preceded_by_external: []

succeeded_by_external:
  - name: Siam (under King Taksin of Thonburi)
    type: conquered by
    year: 1779
    note: >-
      A Siamese army under Chao Phya Chakri (later King Rama I) besieged
      and captured Wiengchan in 1779, in reprisal for the execution of a
      rebel noble who had submitted to Siam; the city was thoroughly
      looted, including the Emerald Buddha King Jai Jett'a had carried off
      from Chiengmai over two centuries before, and Luang Prabang and
      Wiengchan both became Siamese dependencies until the French
      protectorate of 1893.
    source: wood-history-of-siam-1926

ended:
  type: conquest
  by: []
  year: 1779
  source: wood-history-of-siam-1926

turning_points:
  - year: 1547
    type: succession-crisis
    name: "Jai Jett'a returns from Chiengmai with Buddha images"
    changed: >-
      Crowned Maharaja of Chiengmai shortly after his father's death, Jai
      Jett'a chose to return to Luang Prabang instead to fight his own
      younger brother for their father's throne, carrying with him the
      Emerald Buddha, the crystal Buddha of Lamp'un and other images sacred
      to Chiengmai - none of which he ever returned. Chiengmai's nobles,
      finding the Chiangmai throne he had abandoned, summoned a rival
      prince to fill it instead.
    source: wood-history-of-siam-1926
    contested: false
  - year: 1566
    type: siege
    name: "Jai Jett'a besieges P'itsanulok"
    changed: >-
      Invited by a disaffected Siamese official to intervene against a
      pro-Burmese governor, Jai Jett'a marched a large army to the Siamese
      border town of P'itsanulok and laid siege to it, briefly threatening
      to draw Lan Xang into a direct contest for influence over Siam's own
      northern provinces before a relieving Burmese force compelled his
      retreat.
    source: wood-history-of-siam-1926
    contested: false
  - year: 1571
    type: catastrophe
    name: "Jai Jett'a lost in the Cambodian jungle"
    changed: >-
      While campaigning in Cambodia, Jai Jett'a became separated from his
      forces in the jungle and was never seen again, leaving no adult heir;
      an infant son was proclaimed king under a regent, a succession too
      fragile to resist the pressure that followed from Burma.
    source: wood-history-of-siam-1926
    contested: false
  - year: 1574
    type: succession-crisis
    name: "Burma installs Jai Jett'a's brother as vassal king"
    changed: >-
      The Burmese king demanded the regent's abdication in favor of one of
      Jai Jett'a's own brothers, a prisoner in Burma since an earlier
      invasion; when the regent refused, a Burmese army invaded, captured
      the infant king's guardian, and placed the brother on the Wiengchan
      throne as a tributary ruler - the furthest extent of Burmese power
      over the kingdom.
    source: wood-history-of-siam-1926
    contested: false
  - year: 1595
    type: revolt
    name: "Wiengchan throws off the Burmese yoke"
    changed: >-
      After two decades as a Burmese tributary, Wiengchan renounced its
      vassalage and re-established independent rule, ending the period of
      Burmese overlordship that had begun with the installation of Jai
      Jett'a's brother twenty-one years before.
    source: wood-history-of-siam-1926
    contested: false
  - year: 1779
    type: battle
    name: "Wiengchan captured and emptied"
    changed: >-
      A Siamese army of twenty thousand, joined by the rival prince of
      Luang Prabang, besieged and after several months captured Wiengchan,
      terrorizing the countryside with boatloads of severed heads offered
      for sale outside a neighboring town and stripping the captured
      capital of everything of value, the Emerald Buddha included. Luang
      Prabang and Wiengchan both became Siamese dependencies from that
      year.
    source: wood-history-of-siam-1926
    contested: false

