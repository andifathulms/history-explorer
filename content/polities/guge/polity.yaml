id: guge
region: tibet

name:
  latin: Kingdom of Guge
  script: གུ་གེ
  script_lang: bo

# Founding: Kyide Nyima-gon, of the old Tibetan royal line displaced when
# Langdarma was assassinated (bell-1924, c. 842), established the western
# Tibetan kingdoms his own sons and grandsons later divided among
# themselves; jahoda-2019-nyarma names his son dPal-gyi-mgon inheriting Mar
# yul specifically.
span:
  start: { min: 930, max: 930, source: jahoda-2019-nyarma }
  # jahoda-2019-nyarma documents Guge's formative religious history only
  # through Rinchen Zangpo's 1055 death, not the kingdom's own political
  # end - an earlier version of this record used that year as a
  # provisional endpoint for lack of anything better. wessels-1924
  # supplies what was missing: the actual collapse of the kingdom in
  # 1630, when a revolt backed by Ladakh forced the surrender of
  # Tsaparang and the capture of its last king. See the closing
  # chapters and `ended` below.
  end: { min: 1630, max: 1630, source: wessels-1924-jesuit-travellers }

identity: >-
  A refuge kingdom the old Tibetan royal line built in the far west after
  its dynasty collapsed at home, best remembered for one king's
  decade-long temple-building campaign that helped restart Buddhism on
  the plateau, and ended nearly six centuries later when a rejected
  second marriage dragged it into a war with Ladakh it did not survive.

capitals:
  - { name: "Tsaparang (with a major religious center at Tholing)", source: jahoda-2019-nyarma }

core_region: Ngari, the far western Tibetan region around the upper Sutlej valley

rulers:
  founder: { name: "Kyide Nyima-gon", source: jahoda-2019-nyarma }
  # Yeshe-O's own building program - the temple at Tholing alone took eight
  # years - and his patronage of translators make his reign the
  # best-documented moment in either source consulted for this record.
  peak: { name: "Yeshe-O (lha bla ma Ye shes 'od)", source: jahoda-2019-nyarma }
  # Missionary correspondence names him Chodapo or Chodagpo, a title
  # rather than a personal name; later scholarship (A. H. Francke, cited
  # in wessels-1924) identified him with two votive inscriptions naming
  # a King Khri-bkra-shis-grangs-pa-lde reigning at Tsaparang c. 1600-30,
  # almost certainly the same king Andrade met in 1624 and who was
  # captured when the kingdom fell in 1630.
  last: { name: "Khri-bkra-shis-grangs-pa-lde", reign: [1600, 1630], source: wessels-1924-jesuit-travellers }

scripts_and_languages:
  administration: [Tibetan]
  writing_system: Tibetan script

institutions:
  military_basis: null
  revenue_basis: null
  succession_rule: null
  legitimation: { values: [descent, divine-sanction], source: jahoda-2019-nyarma }

ended:
  type: conquest
  by: []
  year: 1630
  source: wessels-1924-jesuit-travellers

preceded_by_external: []

# The Kingdom of Ladakh, which backed the 1630 revolt and absorbed
# Tsaparang once the king was captured, has no record of its own in
# this collection.
succeeded_by_external:
  - name: The Kingdom of Ladakh
    type: conquered by
    year: 1630
    note: >-
      A revolt by Guge's own military commanders, backed by an
      invading Ladakhi army, forced Tsaparang's surrender after a
      month-long siege; the king and his family were carried off to
      Leh and the kingdom passed under Ladakhi rule.
    source: wessels-1924-jesuit-travellers
    contested: false

turning_points:
  - year: 996
    type: reform
    name: "The founding of Tholing"
    changed: >-
      A king who had inherited a small refuge kingdom committed it to a
      building project on a scale that kingdom had never attempted, and to
      an educational investment - drawing recruits from every valley under
      his own influence rather than relying on whatever talent happened to
      be local - that would define the religious character of the whole
      western Tibetan region for generations.
    source: jahoda-2019-nyarma
    contested: false
  - year: 1004
    type: reform
    name: "The consecration and the temple network"
    changed: >-
      An eight-year construction effort closed with a three-week
      celebration and left behind not one monument but a whole regional
      infrastructure of shrines, statues and murals - proof that the king's
      own ambition had been institutional from the start, not a single
      building meant to outshine his predecessors.
    source: jahoda-2019-nyarma
    contested: false
  - year: 1630
    type: siege
    name: "The fall of Tsaparang"
    changed: >-
      A revolt by Guge's own military commanders, advised by the
      king's brother the Chief-Lama, invited an invading Ladakhi army
      to besiege Tsaparang; after a month the king surrendered on a
      promise of tribute-and-withdrawal that the king of Ladakh did
      not honor, and the king and his family were carried off to Leh
      in captivity. A kingdom whose stated end date had, for lack of
      any source that followed its politics past 1055, defaulted to a
      translator's death actually ended here - in a succession
      dispute, a rejected second marriage, and a month-long siege more
      than five and a half centuries later.
    source: wessels-1924-jesuit-travellers
    contested: false

measures:
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: jahoda-2019-nyarma }
    religions_carried: { count: 1, items: [Buddhism], source: jahoda-2019-nyarma }
    successor_claims: { count: 0, items: [], source: jahoda-2019-nyarma }
