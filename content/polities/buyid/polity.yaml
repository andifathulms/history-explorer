id: buyid
region: iranian-intermezzo
name:
  latin: Buyid Confederation
  script: آل بویه
  script_lang: fa

span:
  start: { min: 934, max: 934, source: bosworth-1996 }
  end: { min: 1055, max: 1062, source: bosworth-1996, max_source: iranica-al-e-buya }

identity: >-
  A Daylamite family from the Caspian highlands that took Baghdad, kept the
  Abbasid caliph, and ruled in his name as Shi'i amirs over a Sunni caliphate.

capitals:
  - { name: Shiraz, script: شیراز, from: 934, source: iranica-al-e-buya }
  - { name: Rayy, script: ری, from: 943, source: iranica-al-e-buya }
  - { name: Baghdad, script: بغداد, from: 945, source: busse-1975 }

core_region: Fars, Jibal and Iraq

rulers:
  founder:
    name: Ali ibn Buya, Imad al-Dawla
    script: عماد الدوله
    reign: [934, 949]
    source: bosworth-1996
  peak:
    name: Adud al-Dawla
    script: عضد الدوله
    reign: [949, 983]
    source: bosworth-1996
  last:
    name: Abu Nasr al-Malik al-Rahim
    script: الملک الرحیم
    reign: [1048, 1055]
    source: bosworth-1996

scripts_and_languages:
  administration: [Arabic, Persian]
  writing_system: Perso-Arabic

ended:
  type: conquest
  by: [great-seljuk]
  year: 1055
  source: busse-1975

institutions:
  # Two values and the change between them is the polity. The family arrived as
  # Daylami mercenary captains for hire; the state they built paid its soldiers
  # by assigning them the revenue of districts, which is the iqta and is what
  # `land-grant` covers.
  military_basis: { values: [mercenary, land-grant], source: chi-4 }
  # The Sawad, the alluvium of lower Iraq — assigned out as iqta rather than
  # collected centrally, and declining under the arrangement.
  revenue_basis: { values: [land-tax], source: chi-4 }
  # Three amirates held by different members of the house under a senior amir,
  # with lands divided among sons at each death. It is the same patrimonial
  # logic this site codes on the Seljuks, Ayyubids, Mongols and Ghurids, and
  # here it produced a hundred years of family war after 983.
  succession_rule: { values: [appanage], source: chi-4 }
  legitimation: { values: [titulature], source: busse-1975 }

turning_points:
  - year: 962
    type: reform
    name: "Ashura in the streets of Baghdad"
    changed: >-
      Mu'izz al-Dawla licensed the public observance of Ashura and Ghadir Khumm
      in the caliph's own city. Shi'i practice became visible, funded and
      official in the Sunni imperial centre — and produced Sunni
      counter-processions and periodic rioting, which is part of how two
      positions in an argument became two separable traditions.
    source: busse-1975
    contested: false
  - year: 983
    type: succession-crisis
    name: "The death of Adud al-Dawla"
    changed: >-
      The one Buyid who had held the whole domain as a single thing died, and
      it was never held that way again. A confederation of cousins with no
      succession law, no capital and no mechanism for producing another Adud
      al-Dawla produced a hundred years of family war instead.
    source: busse-1975
    contested: false

measures:
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: iranica-al-e-buya }
    # Buyid patronage built durable Twelver institutions — the shrine cities,
    # the public Ashura and Ghadir observances at Baghdad, the scholarly
    # establishment around Shaykh al-Mufid — in territory that had not held
    # them. That is institution-building, not confessional posture, so it
    # counts under the coding rules.
    religions_carried:
      count: 1
      items: [Twelver Shi'ism]
      source: busse-1975
    successor_claims: { count: 0, items: [], source: busse-1975 }
