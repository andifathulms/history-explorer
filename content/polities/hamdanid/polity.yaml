id: hamdanid
region: jazira

name:
  latin: Hamdanid Dynasty
  script: الحمدانيون
  script_lang: ar

span:
  start: { min: 890, max: 890, source: kennedy-2004 }
  end: { min: 1004, max: 1004, source: kennedy-2004 }

identity: >-
  An Arab dynasty of the Jazira whose Aleppo branch fought Byzantium on the
  frontier and kept the most celebrated court of the century.

capitals:
  - { name: Aleppo, script: حلب, from: 890, source: kennedy-2004 }

core_region: The Jazira and northern Syria

rulers:
  founder: { name: Hamdan ibn Hamdun, reign: [890, 895], source: kennedy-2004 }
  peak: { name: Sayf al-Dawla, reign: [945, 967], source: kennedy-2004 }
  last: { name: Sa'd al-Dawla, reign: [967, 991], source: kennedy-2004 }

scripts_and_languages:
  administration: [Arabic]
  writing_system: Arabic

ended:
  type: gradual absorption
  by: [fatimid]
  year: 1004
  source: kennedy-2004

institutions:
  # Taghlibi Arab tribal manpower, which is what makes them unusual in a
  # century when almost every effective force in the Islamic world was Turkish,
  # Daylami or Berber, with ghulams and Bedouin allies alongside it.
  military_basis: { values: [tribal-levy, slave-soldier], source: kennedy-2004 }
  revenue_basis: { values: [land-tax, tribute], source: kennedy-2004 }
  succession_rule: { values: [appanage], source: kennedy-2004 }
  # A caliphal grant, held from an institution the family briefly had in its
  # own keeping at Baghdad in the 940s — which is the sharpest illustration in
  # this corpus of what the investiture had become.
  legitimation: { values: [caliphal-investiture], source: kennedy-2004 }

turning_points:
  - year: 942
    type: reform
    name: "Two titles in one day"
    changed: >-
      The caliph al-Muttaqi granted two brothers of the Banu Hamdan the
      titles champion and sword of the empire, thirteen years after their
      father died defending a previous caliph at Baghdad. It was a
      settlement of accounts rather than a gift — the caliphate could no
      longer pay what it owed the family in anything but words — and it
      marks the point the family's local standing became a formally
      recognised dynasty, two years before the brothers split the north
      between them.
    source: ibn-khallikan
    contested: false
  - year: 944
    type: siege
    name: "Aleppo taken"
    changed: >-
      Sayf al-Dawla took the city and turned a Jaziran family's western holding
      into a frontier emirate facing Byzantium. It gave the Islamic world a
      symbol of the frontier war at exactly the moment the caliphate had
      stopped being able to prosecute one, and it is the reason a minor dynasty
      is remembered at all.
    source: kennedy-2004
    contested: false
  - year: 945
    type: battle
    name: "The Buyids take Baghdad from Mosul"
    changed: >-
      The Hamdanids of Mosul, who had briefly held the Abbasid caliph in the
      chaos of the 940s and were the last Arab dynasty to hold the caliphate
      in its own hands, lost Baghdad to the Buyids, who kept it for a
      hundred and ten years. Mosul itself survived as a tributary emirate
      for another forty-five years, paying to be left alone.
    source: kennedy-2004
    contested: false
  - year: 969
    type: treaty
    name: "The treaty of Safar"
    changed: >-
      After Antioch fell, Aleppo was made a Byzantine tributary rather than
      annexed: it kept its ruler and its religion and paid. The emirate spent
      its last thirty-five years paying Constantinople and looking to Fatimid
      Cairo, and looking back to Constantinople when Cairo pressed. It is the
      standard position of a small state between two large ones that both want
      it and neither can hold cheaply.
    source: kennedy-2004
    contested: false
  - year: 990
    type: battle
    name: "The Uqaylids remove the Mosul branch"
    changed: >-
      The Uqaylids, another Arab tribal dynasty, took Mosul from the
      Hamdanid branch that had governed it as a Buyid tributary since 945.
      It ended the family's presence in the city its founder had first
      governed a century earlier, fourteen years before the Fatimids did
      the same thing to the Aleppo branch.
    source: kennedy-2004
    contested: false
  - year: 1004
    type: succession-crisis
    name: "The last Hamdanid of Aleppo deposed"
    changed: >-
      The Fatimids deposed the last Hamdanid ruler of Aleppo and the
      emirate passed to one of its own officers, ending the family's
      presence in the city thirty-five years after the treaty of Safar and
      a hundred years after two brothers were given their titles on the
      same day. The frontier they had fought on outlasted them by less than
      seventy years: it stopped existing after Manzikert in 1071.
    source: kennedy-2004
    contested: false

