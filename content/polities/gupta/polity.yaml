id: gupta
region: classical-india

name:
  latin: Gupta Empire
  script: गुप्त साम्राज्य
  script_lang: sa

span:
  start: { min: 320, max: 320, source: thapar-2002 }
  end: { min: 550, max: 550, source: thapar-2002 }

identity: >-
  The northern Indian empire whose court culture became the classical
  reference point for Sanskrit literature, art and mathematics.

capitals:
  - { name: Pataliputra, script: पाटलिपुत्र, from: 320, source: thapar-2002 }

core_region: The Gangetic plain

rulers:
  founder: { name: Chandragupta I, reign: [320, 335], source: thapar-2002 }
  peak: { name: Chandragupta II, reign: [375, 415], source: thapar-2002 }
  last: { name: Vishnugupta, reign: [540, 550], source: thapar-2002 }

scripts_and_languages:
  administration: [Sanskrit]
  writing_system: Brahmi

ended:
  type: fragmentation
  by: []
  year: 550
  source: thapar-2002

# Both real, both without records here. The Guptas dissolved rather than being
# conquered, so the successor row omits `type`.
preceded_by_external:
  - name: the Kushan and Saka rulers of the north, and the tribal republics
    year: null
    note: >-
      Northern India between the Kushan decline and the Gupta rise was held by
      no paramount power: Kushano-Sasanian and Saka rulers in the north-west,
      Naga dynasties in the middle Ganges, and the old tribal republics — the
      Malavas, Yaudheyas, Arjunayanas — still minting their own coin. The
      Allahabad pillar lists them by name as the powers Samudragupta
      exterminated, subordinated or received homage from, which is the fullest
      surviving account of what was there before.
    source: fleet-cii-iii

succeeded_by_external:
  - name: the Maukharis, the Maitrakas and the later regional kingdoms
    year: null
    note: >-
      No single power replaced the Guptas. The Hunas took the north-west, a
      reduced Gupta line continued in Magadha into the sixth century, and the
      territory that had been imperial or client resolved into regional
      dynasties — the Maukharis of Kanauj, the Maitrakas of Valabhi, and the
      successors of the Vakatakas in the Deccan. Harsha assembled a paramount
      authority in northern India again in the 600s and it did not outlive him.
    source: thapar-2002

institutions:
  # Faxian: "the king's body-guards and attendants all have salaries" - a
  # paid establishment at the centre, in an account otherwise notable for how
  # little the state visibly did.
  military_basis: { values: [standing-professional], source: faxian-legge }
  # Faxian describes revenue drawn from crown land rather than a general
  # assessment; the Allahabad pillar describes an outer ring of subordinate
  # kings rendering tribute rather than being taxed directly. Both were true
  # at once, at different distances from Pataliputra.
  revenue_basis: { values: [land-tax, tribute], source: fleet-cii-iii }
  succession_rule: null
  # Chandragupta I married into the Licchavi lineage and struck coins naming
  # his queen, a descent-claim the dynasty repeated in its own titulature for
  # generations; his grandson's Allahabad pillar sets that beside an explicit
  # conquest record.
  legitimation: { values: [descent, conquest], source: fleet-cii-iii }

turning_points:
  - year: 320
    type: reform
    name: Chandragupta I takes the title Maharajadhiraja
    changed: >-
      A provincial lord who had held only the modest title maharaja married
      into the old Licchavi lineage and, on the strength of that alliance,
      styled himself supreme king of great kings - the point the dynasty's
      own era counts from, on the reasoning that a title backed by a
      prestigious marriage was worth dating a calendar to.
    source: fleet-cii-iii
    contested: false
  - year: 530
    type: battle
    name: Mihirakula defeated
    changed: >-
      Beating a common invader as one member of a coalition, rather than as
      the power the coalition assembled around, is how a dynasty finds out
      in public that it is no longer the paramount one.
    source: thapar-2002
    contested: false
measures:
  reach_km2: { value: 3500000, at: 400, source: taagepera-1979 }
  peak_population: null
  influence:
    descendant_scripts: { count: null, items: [], source: null }
    religions_carried: { count: null, items: [], source: null }
    # Zero. Harsha assembled a comparable paramount authority in northern India
    # in the 600s, but on his own titulature; nobody claimed to be continuing
    # the Guptas specifically.
    successor_claims: { count: 0, items: [], source: thapar-2002 }
