id: rashidun
region: caliphates

name:
  latin: Rashidun Caliphate
  script: الخلافة الراشدة
  script_lang: ar

span:
  start: { min: 632, max: 632, source: kennedy-2004 }
  end: { min: 661, max: 661, source: kennedy-2004 }

identity: >-
  The caliphate of the four successors elected at Medina, under whom the Arab
  conquests took Syria, Iraq, Egypt and the Iranian plateau in a generation.

capitals:
  - { name: Medina, script: المدينة, from: 632, to: 656, source: kennedy-2004 }
  - { name: Kufa, script: الكوفة, from: 656, to: 661, source: kennedy-2004 }

core_region: Arabia, Syria, Iraq and Egypt

rulers:
  founder: { name: Abu Bakr, reign: [632, 634], source: kennedy-2004 }
  peak: { name: Umar ibn al-Khattab, reign: [634, 644], source: kennedy-2004 }
  last: { name: Ali ibn Abi Talib, reign: [656, 661], source: madelung-1997 }

scripts_and_languages:
  administration: [Arabic, Greek, Middle Persian]
  writing_system: Arabic

ended:
  type: dynastic replacement
  by: [umayyad]
  year: 661
  source: madelung-1997

institutions:
  # Raised through tribal contingents that Medina directed rather than created —
  # the ridda demonstrated the capability and the conquests used it. The diwan
  # made those men salaried, which is a fact about revenue and not about
  # recruitment, so it is coded on the revenue field and not here.
  military_basis: { values: [tribal-levy], source: donner-1981 }
  # Plunder is coded because a source treats campaign proceeds as structural
  # income here rather than as something armies did: the stipend roll was
  # written on the assumption that conquest continued, and the crisis under
  # Uthman is what happened when it slowed.
  revenue_basis: { values: [land-tax, poll-tax, plunder], source: kennedy-2004 }
  # Four successions, three procedures, in twenty-nine years: Abu Bakr
  # acclaimed at Saqifa, Umar nominated by his predecessor, Uthman chosen by a
  # council, Ali acclaimed at Medina. Coding all three is the honest reading —
  # the rule in force changed every time, which is the polity's central
  # constitutional fact and not a brief experiment.
  succession_rule: { values: [acclamation, nomination, election], source: madelung-1997 }
  # Election, and descent in the restricted sense the rules require: the
  # argument that carried Saqifa was publicly a claim about Quraysh, invoked as
  # the qualification to rule. Not caliphal-investiture — this is the office
  # that later polities sought investiture from.
  legitimation: { values: [election, descent], source: madelung-1997 }

turning_points:
  - year: 632
    type: revolt
    name: "The ridda"
    changed: >-
      Medina answered the withholding of zakat by calling it apostasy, which
      asserted that the agreements had been made with a permanent polity and
      not with Muhammad personally — and the concentration of armed force
      assembled to enforce that claim was still assembled, and unpaid, when
      the fighting inside Arabia ran out of enemies.
    source: donner-1981
    contested: false
  - year: 636
    type: battle
    name: "The Yarmuk"
    changed: >-
      The Byzantine field army in Syria was destroyed and Heraclius withdrew
      behind the Taurus, conceding the empire's richest provinces rather than
      raising a second army for them; Syria was never seriously contested
      again. Al-Qadisiyya, its Sasanian counterpart, is not recorded here
      because it is already an edge between two polities on this site.
    source: donner-1981
    contested: false
  - year: 656
    type: revolt
    name: "The killing of Uthman"
    changed: >-
      Mutineers from the Egyptian and Iraqi garrisons besieged the caliph in
      his own house at Medina and killed him over the distribution of stipends
      and governorships, and every subsequent claimant inherited the
      accusation of having benefited from a murder he had not prevented.
    source: madelung-1997
    contested: false
  - year: 657
    type: treaty
    name: "The arbitration at Siffin"
    changed: >-
      Ali agreed to arbitrate with Mu'awiya rather than settle the war in the
      field, and the agreement split his own army: the faction holding that
      submitting God's judgement to human arbitrators was itself the sin
      became the Kharijites, and one of them killed him at Kufa in 661.
    source: madelung-1997
    contested: false

measures:
  reach_km2: { value: 6400000, at: 655, source: taagepera-1997 }
  # McEvedy & Jones give regional populations, not a figure for this polity at
  # its peak. Deriving one would mean adding regions across a date the atlas
  # does not tabulate, which is hard rule 2. Null, and the gap is drawn.
  peak_population: null
  influence:
    # No source consulted here addresses a script derived or newly adapted
    # under the Rashidun. The Arabic script's dotting and vocalisation belong to
    # the Umayyad period, and in any case are not a descendant script under the
    # coding rules: same script, same language, written better. Null, because
    # nobody looked, rather than 0, which would claim they did.
    descendant_scripts: { count: null, items: [], source: null }
    religions_carried:
      count: 1
      items: [Islam]
      source: donner-1981
    successor_claims:
      count: 2
      items: [umayyad, abbasid]
      source: kennedy-2004
