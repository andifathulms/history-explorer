id: angkor
region: mainland-southeast-asia

name:
  latin: The Khmer Empire
  script: null
  script_lang: null

# 802 is the consecration of Jayavarman II on Mahendraparvata as universal
# monarch, which is the event the later inscriptions treat as the founding and
# which is known only from an inscription carved two hundred and fifty years
# afterwards. 1431 is the Ayutthayan capture of the capital, after which the
# court moved south and did not come back.
span:
  start: { min: 802, max: 802, source: coedes-1968 }
  end: { min: 1431, max: 1431, source: coedes-1968 }

identity: >-
  Six centuries of Khmer kings on the Cambodian plain, who built the largest
  religious structure on earth and a hydraulic capital that supported a
  population no other pre-industrial city in the region came near.

capitals:
  - { name: Hariharalaya, from: 802, source: coedes-1968 }
  - { name: Yasodharapura, from: 889, source: higham-2001 }

core_region: The Cambodian plain around the Tonle Sap, with dependencies across the lower Mekong, the Khorat plateau and much of the Chao Phraya basin

rulers:
  founder: { name: Jayavarman II, reign: [802, 835], source: coedes-1968 }
  peak: { name: Jayavarman VII, reign: [1181, 1218], source: higham-2001 }
  last: { name: Ponhea Yat, reign: [1432, 1463], source: coedes-1968 }

scripts_and_languages:
  administration: [Old Khmer, Sanskrit]
  writing_system: Khmer script, derived from a South Indian Brahmi

# Ayutthaya took the city in 1431 and the Khmer court relocated south toward
# Phnom Penh. This is a `conquest` and the conqueror has a page, which makes it
# the rarer kind of ending on this site — and the ending is still not quite what
# the type says, because what stopped was the capital rather than the dynasty.
# Ponhea Yat reigned for thirty years after 1431, somewhere else.
ended:
  type: conquest
  by: [ayutthaya]
  year: 1431
  source: coedes-1968

# A real predecessor with no record here. Jayavarman II's consecration in 802 is
# conventionally the founding, and what he unified had been there for centuries.
preceded_by_external:
  - name: Chenla, and Funan before it
    type: absorbed remnants of
    year: null
    note: >-
      The Chinese sources describe a state they call Funan in the Mekong delta
      from the first century, trading with India and with China, and a successor
      or overlord they call Chenla inland from it which had divided into
      "land Chenla" and "water Chenla" by the eighth century. What Jayavarman II
      consecrated himself over in 802 was the reunification of those pieces, and
      the Khmer language, the Sanskrit court culture and the temple-building
      were all in the country before him.
    source: coedes-1968

institutions:
  # Corvée. The inscriptions record populations assigned to temples and to the
  # state in units of people, and the armies were raised the same way — through
  # the officials who held the assignment rather than through payment or land
  # grants held in return for service.
  military_basis: { values: [conscript], source: higham-2001 }
  # Rice, and the labour that grew it. The foundation inscriptions of the great
  # temples list the villages, the fields and the numbers of people made over to
  # support them, which is a tax system recorded from the receiving end.
  #
  # Not `tribute`, though the outer provinces sent it, and not `trade-toll`,
  # which is the striking thing about this record. Angkor is the largest polity
  # in either of this site's Southeast Asian regions and it is the one furthest
  # from the sea route the other region is named for.
  revenue_basis: { values: [land-tax], source: higham-2001 }
  # Null, and this one needs the caution stated rather than left in the field.
  #
  # Angkorian succession was contested to a degree that is unusual even among
  # the records here that are null for chaos: the throne was taken by force
  # repeatedly, and several kings whose reigns the inscriptions record at length
  # were not sons of their predecessors and said so.
  #
  # What they said instead is the reason for the caution. Khmer royal
  # inscriptions establish a claimant's right through elaborate genealogies that
  # frequently run through women, and some scholarship reads that as evidence of
  # a matrilineal element in Khmer kingship. This site added `matrilineal` to
  # its vocabulary for Ghana, Makuria and Asante, where a rule is stated, and
  # the rulebook carries a caution against extending it to cases where descent
  # through women is visible in the record and no rule is. This is that case,
  # and the field stays null.
  succession_rule: null
  # The devaraja, and descent. What the term meant is argued over — a god-king,
  # a royal god, a cult of the royal linga — and the argument does not change
  # the coding, because every reading of it is a claim to sanction from a god.
  legitimation: { values: [divine-sanction, descent], source: coedes-1968 }

turning_points:
  - year: 1113
    type: succession-crisis
    name: Suryavarman II
    changed: >-
      A king who killed his own rival in single combat on the field of
      battle spent his reign losing most of the wars he started against
      Vietnam and Champa alike - and still left behind, built during his
      own lifetime as his funerary temple, the largest religious structure
      the kingdom or the world would ever see it build.
    source: coedes-1968
    contested: false
  - year: 1177
    type: siege
    name: The Chams in the city
    changed: >-
      A capital whose population no other settlement in the region
      approached fell to seaborne raiders from ports a fraction its size -
      a defeat humiliating enough that the dynasty which avenged it spent
      the next generation building monuments that would not let anyone
      forget who had finally won.
    source: coedes-1968
    contested: false
  - year: 1181
    type: conversion
    name: Jayavarman VII
    changed: >-
      A ruler who took the throne well past the age most kings of his era
      even reached spent his remaining years converting a three-century
      Shaivite kingdom to Mahayana Buddhism and building on a scale no
      predecessor or successor matched - a whole dynasty's worth of temple
      construction folded into one exceptionally long reign, with nothing
      of comparable ambition attempted again.
    source: higham-2001
    contested: false
  - year: 1431
    type: siege
    name: Ayutthaya
    changed: >-
      Ayutthaya took Angkor and the court moved south, but the working
      apparatus of Angkorian kingship did not disappear with it - it went
      north with the victors, and a Siamese court that had just destroyed
      Angkor's political power spent the next four centuries ruling under
      its ritual vocabulary.
    source: coedes-1968
    contested: false

measures:
  # Taagepera 1997, appendix, series "Khmer": 800 -> .65 (foundation),
  # 1140 -> .8, 1290 -> 1.0, 1415 -> .4, 1760 -> .25, 1880 -> .0.
  reach_km2: { value: 1000000, at: 1290, source: taagepera-1997 }
  peak_population: null
  influence:
    # One. The Thai script devised at Sukhothai in the late thirteenth century
    # is an adaptation of the Khmer script to a language of a different family
    # with tones the Khmer script had no signs for, and the signs were invented.
    # Coding rule 3 counts exactly that, on the record of the script that was
    # adapted, which is this one.
    #
    # This is the first time on this site that the rule has landed the count on
    # the parent's page and the parent has been present to receive it. The
    # Hittite, Elamite and Urartian claims all landed on records of polities
    # whose own scripts came from somewhere else on this site; the Cham, Burmese
    # and Jawi claims all land on parents with no page at all.
    descendant_scripts:
      count: 1
      items: [The Thai script]
      source: coedes-1968
    # Zero. Angkor was Shaivite, then Mahayana Buddhist, then Theravada, and it
    # was on the receiving end each time. Coding rule 2 counts propagation past a
    # boundary, and this record has none to show.
    religions_carried: { count: 0, items: [], source: coedes-1968 }
    # One, and it is the polity that destroyed it. Ayutthaya took Angkor's
    # brahmans and its court ritual in 1431 and governed with Angkorian
    # titulature and an Angkorian legal vocabulary for four centuries. Coding
    # rule 1 counts a later polity asserting an earlier one's authority and does
    # not require the two to have been friendly.
    successor_claims:
      count: 1
      items: [Ayutthaya]
      source: baker-pasuk-2017
