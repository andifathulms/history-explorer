id: srivijaya
region: sumatra-and-the-peninsula

name:
  latin: Srivijaya
  script: ᬰ᭄ᬭᬷᬯᬶᬚᬬ
  script_lang: sa

span:
  start: { min: 671, max: 671, source: hall-2011 }
  end: { min: 1275, max: 1275, source: hall-2011 }

identity: >-
  A thalassocracy on the Melaka and Sunda straits, whose power came from
  controlling a passage rather than holding territory.

capitals:
  - { name: Palembang, script: Palembang, from: 671, source: hall-2011 }

core_region: Sumatra and the straits

# `last` was entered as a ruler named Unknown with a one-year reign, which is a
# placeholder wearing the shape of a fact — the same defect the Aksum record
# carried and for the same reason. Null is what the schema provides and what the
# evidence supports: no ruler of this polity is named in anything after the
# eleventh century.
rulers:
  founder: { name: Dapunta Hyang Sri Jayanasa, reign: [671, 702], source: hall-2011 }
  peak: { name: Balaputradewa, reign: [835, 860], source: hall-2011 }
  last: { name: null, source: null }

scripts_and_languages:
  administration: [Old Malay, Sanskrit]
  writing_system: Pallava-derived

ended:
  type: gradual absorption
  by: []
  year: 1275
  source: hall-2011

# What Srivijaya was built on top of. Malayu has no record here, and a reader
# asking what came before Srivijaya is asking about Sumatra rather than about
# which pages exist. Year is null deliberately: Coedes gives the absorption as
# "between 689 and 692", and picking one of those would be inventing a precision
# the source does not offer.
preceded_by_external:
  - name: Malayu
    type: absorbed remnants of
    year: null
    note: >-
      Malayu, on the east coast of Sumatra and centred on Jambi, sent its first
      embassy to the Chinese court in 644-45 and was the established power of the
      region when Yijing stopped there in 671. Between 689 and 692 it was
      absorbed by Srivijaya. The arrangement did not hold forever: after the
      Chola raid the centre of the straits trade shifted back up the coast to
      Jambi-Melayu, and it was Melayu, not Srivijaya, that the Javanese
      expedition of 1275 was finally sent against.
    source: coedes-1968

institutions:
  # Crews, not soldiers. The orang laut — the sea peoples of the straits and the
  # river mouths — were the polity's navy, and the arrangement was that they
  # raided for Srivijaya rather than against it. A power on a strait cannot
  # garrison a coastline; it binds the people who would otherwise be the
  # pirates, which is what the oath inscriptions in the fourth chapter are for.
  military_basis: { values: [client-levy], source: hall-2011 }
  # Tolls and nothing else. Srivijaya belongs to the small class of polities that
  # lived entirely on a chokepoint — Palmyra, Characene, Derbend, the Nabataeans
  # and a few others — and it is the largest of them by the volume of trade
  # passing, and the only one whose chokepoint was a strait rather than a road.
  revenue_basis: { values: [trade-toll], source: hall-2011 }
  succession_rule: null
  # `divine-sanction`, and the evidence is the curse. The Telaga Batu oath binds
  # the ruler's subordinates under a supernatural penalty administered through
  # water poured over an inscribed stone and drunk — the king's authority is
  # stated as a power that can reach a man who breaks his word anywhere. Beside
  # it Mahayana patronage on a scale that made Palembang a place Chinese and
  # Indian monks came to study, which the third chapter is about.
  legitimation: { values: [divine-sanction], source: hall-2011 }

turning_points:
  - year: 1025
    type: siege
    name: The Chola raid
    changed: >-
      A Chola fleet crossed the Bay of Bengal, took the ports of the strait
      including the capital, and went home without occupying anything. What it
      destroyed was not the polity but the premise the polity sold: that this was
      the one safe way through. Two centuries of decline follow, with no single
      further event in them.
    source: kulke-2009
    contested: false
  - year: 1079
    type: capital-move
    name: Jambi
    changed: >-
      A capital that had given the whole polity its name for four centuries
      stopped being where the polity actually was, and nobody recorded why
      - only that the tribute missions and the trade now answered to a
      different port, run by people the sources never bother to name.
    source: hall-2011
    contested: true
  - year: 1275
    type: battle
    name: Pamalayu
    changed: >-
      A Javanese expedition sent against the successor that had been
      running Srivijaya's old position found nothing left to annex when it
      arrived - no garrison installed, no tribute list drawn up - because
      the thing it had come to conquer had already stopped functioning as
      an independent power on its own.
    source: hall-2011
    contested: false

measures:
  # Taagepera does not tabulate a maritime polity whose power was over sea
  # lanes rather than land. No cited km2, and computing one from the map
  # polygon is forbidden by hard rule 5.
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: null, items: [], source: null }
    religions_carried:
      count: 1
      items: [Mahayana Buddhism]
      source: hall-2011
    # One, and it is Melaka. The Sejarah Melayu routes the Melakan dynasty back
    # through Palembang to the kings of Srivijaya, and the edge in edges.yaml has
    # carried that claim since it was written — while this count stayed null,
    # which is the mismatch part one of the coding rules says is a bug worth
    # finding. Null means nobody looked; a sourced edge proves somebody did.
    # Contested, because the genealogy was composed nearly six centuries after
    # the last Srivijayan ruler anyone can name, by a court writing in exile.
    successor_claims: { count: 1, items: [Sultanate of Melaka], source: brown-1970 }
