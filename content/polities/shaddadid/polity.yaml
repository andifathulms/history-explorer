id: shaddadid
region: caucasus

name:
  latin: Shaddadid Emirate
  script: الشدادية
  script_lang: ar

# 951 is Muhammad ibn Shaddad establishing himself at Dvin; 1199 is the Georgian
# capture of Ani, where the last branch of the house was ruling. The Ganja line
# had ended in 1075.
span:
  start: { min: 951, max: 951, source: minorsky-1953 }
  end: { min: 1199, max: 1199, source: minorsky-1953 }

identity: >-
  A Kurdish dynasty at Ganja and then at Ani, which governed the Armenian royal
  capital for a hundred and twenty-six years — and out of whose service Saladin's
  family came.

capitals:
  - { name: Ganja, script: گنجه, from: 971, source: minorsky-1953 }
  - { name: Ani, script: Անի, from: 1072, source: minorsky-1953 }

core_region: Arran and the Armenian highland, between the Kura and the Araxes

rulers:
  founder: { name: Muhammad ibn Shaddad, source: minorsky-1953 }
  peak: { name: Fadl I, reign: [985, 1031], source: minorsky-1953 }
  last: { name: null, source: null }

scripts_and_languages:
  administration: [Arabic, Persian]
  writing_system: Perso-Arabic

# The Sallarids have no record here, so the predecessor is named rather than
# edged. No year: the Shaddadids did not take Arran in one act. Muhammad ibn
# Shaddad established himself at Dvin around 951 and his sons took Ganja in 971,
# and Sallarid authority was failing across the whole interval.
preceded_by_external:
  - name: the Sallarid emirate
    type: absorbed remnants of
    year: null
    note: >-
      The Sallarids — the Daylami dynasty also called the Musafirids — had held
      Arran and Adharbayjan since the 940s and were losing their grip on both by
      the middle of the century. Muhammad ibn Shaddad established himself at
      Dvin around 951 while they still nominally held it; his sons took Ganja
      from them in 971, and the Shaddadids inherited the position rather than
      conquering it in a campaign.
    source: minorsky-1953

ended:
  type: conquest
  by: [georgia]
  year: 1199
  source: minorsky-1953

institutions:
  military_basis: { values: [tribal-levy], source: minorsky-1953 }
  # The land of Arran, which is good country, and the customs of two cities on
  # the road between Iran, the Caucasus and Anatolia. Unranked.
  revenue_basis: { values: [land-tax, trade-toll], source: minorsky-1953 }
  # The house divided: Ganja and then Dvin and then Ani were held by different
  # members of it, which is the patrimonial division `appanage` names and which
  # is why the two halves of this record have different end dates.
  succession_rule: { values: [appanage], source: minorsky-1953 }
  # `conquest` for the Ganja line, and `investiture` for the Ani branch, which
  # held its city as a grant from Alp Arslan after the Seljuks took it in 1064.
  # Both values on one record is the ordinary case for a coded set and it is
  # doing real work here: two branches of one family, two different public
  # grounds, forty years apart.
  legitimation: { values: [conquest, investiture], source: minorsky-1953 }

turning_points:
  - year: 1045
    type: battle
    name: "Abu'l-Aswar holds Dvin"
    changed: >-
      A Byzantine lieutenant, having subdued Armenia after Ani's own
      surrender the same year, marched on Dvin; Abu'l-Aswar fought him at
      the city gate and killed Vahram, the great prince of Armenia, who
      died in Byzantine service fighting the emir his own family had
      married into. It is one of only three mentions the fullest
      contemporary Armenian chronicle gives this dynasty at all - a house
      visible mainly through what its neighbors happened to record while
      it held its walls and outlasted them.
    source: aristakes-bedrosian
    contested: false
  - year: 1072
    type: treaty
    name: "Ani granted"
    changed: >-
      Alp Arslan had taken and sacked Ani eight years earlier; the Seljuks now
      handed the ruined Armenian royal capital to a Kurdish emir to hold for
      them. A Muslim dynasty governed the seat of the Bagratid kingdom for the
      following hundred and twenty-six years, maintaining its churches and its
      Armenian population even as the dynasty's own centre of gravity shifted
      from Arran into Armenia.
    source: minorsky-1953
    contested: false
  - year: 1199
    type: siege
    name: "Tamar takes Ani"
    changed: >-
      Georgian forces under Tamar's generals, the Zakarid brothers,
      captured Ani from the last Shaddadid emir - almost the only
      instance in a thousand years of Caucasus history in which one
      polity of the region ended another rather than being ended from
      outside it. The dynasty invented no script, propagated no religion
      and left no one claiming to be its heir; what it left was a
      position, and a family that had departed its service a century
      earlier and taken Egypt.
    source: minorsky-1953
    contested: false

measures:
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: null, items: [], source: null }
    religions_carried: { count: null, items: [], source: null }
    successor_claims: { count: null, items: [], source: null }
