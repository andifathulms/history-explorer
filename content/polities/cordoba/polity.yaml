id: cordoba
region: caliphates

name:
  latin: Umayyad Caliphate of Cordoba
  script: الخلافة الأموية في الأندلس
  script_lang: ar

span:
  start: { min: 756, max: 929, source: kennedy-1996 }
  end: { min: 1031, max: 1031, source: kennedy-1996 }

identity: >-
  The Umayyad survivor state in al-Andalus, which ruled as an emirate for
  173 years and then claimed the caliphal title outright.

capitals:
  - { name: Cordoba, script: قرطبة, from: 756, source: kennedy-1996 }

core_region: Al-Andalus

rulers:
  founder: { name: Abd al-Rahman I, reign: [756, 788], source: kennedy-1996 }
  peak: { name: Abd al-Rahman III, reign: [912, 961], source: kennedy-1996 }
  last: { name: Hisham III, reign: [1027, 1031], source: kennedy-1996 }

scripts_and_languages:
  administration: [Arabic]
  writing_system: Arabic

ended:
  type: fragmentation
  by: []
  year: 1031
  source: kennedy-1996

institutions:
  # Deliberately not an Arab tribal levy: saqaliba slaves of European origin
  # and Berber contingents brought from the Maghreb, paid from the treasury.
  # Troops with no local kin had no local faction, which is what a caliph who
  # had spent twenty years fighting local factions wanted — and what the men
  # who captured the state afterwards used it for.
  military_basis: { values: [slave-soldier, mercenary], source: kennedy-1996 }
  # Null, and deliberately. The chapters here describe a treasury paying for
  # troops in Cordoba and allegiances in the Maghreb, but no source read for
  # this polity is cited on where that revenue came from, and coding land-tax
  # because it is the obvious answer is exactly what coding rule 9 forbids.
  revenue_basis: null
  succession_rule: { values: [nomination], source: kennedy-1996 }
  # Descent from the Umayyad house is the whole basis of the emirate: they were
  # the family the Abbasids had displaced, which is legitimacy the eastern
  # governors could not claim. Titulature is the 929 act, and it agrees with
  # the single successor claim counted on this site's Umayyad Caliphate page —
  # coding rule 8 asks for that check, and here it passes.
  legitimation: { values: [descent, titulature], source: kennedy-1996 }

turning_points:
  - year: 929
    type: reform
    name: "Taking the caliphal title"
    changed: >-
      After 173 years of ruling a detached province without formally denying
      that a caliphate existed, Abd al-Rahman III took the titles caliph and
      amir al-mu'minin. The provocation was the Fatimid claim recruiting Berber
      clients across the strait, and the effect was that from 929 there were
      three caliphs in the Islamic world and al-Andalus was nobody's province.
    source: kennedy-1996
    contested: false
  - year: 939
    type: battle
    name: "Simancas"
    changed: >-
      The defeat did not cost what defeats usually cost: Christian kings kept
      sending embassies seeking Cordoba's friendship in the years after, proof
      that a caliphate's standing in this period ran on treasury and court as
      much as on its last battle. What changed was policy rather than power —
      the caliph withdrew his own person from the risk of the field for good,
      a separation between the man and the army no earlier amir of Cordoba
      had made.
    source: kennedy-1996
    contested: false
  - year: 976
    type: succession-crisis
    name: "Hisham II's minority"
    changed: >-
      Every earlier Umayyad succession at Cordoba had passed to an adult. This
      one did not, and the difference exposed what thirty years of a
      personally run administration had never had to test: whether the state
      could survive a caliph too young to use the power his father had
      concentrated. It could, and it did — just not in his own name.
    source: kennedy-1996
    contested: false
  - year: 1009
    type: revolt
    name: "The fitna of al-Andalus"
    changed: >-
      What ended thirty years of stability was not weakness discovered under
      strain but a single word said aloud: when the chamberlain's brother
      asked Hisham to name him successor to the caliphate itself, every party
      that had tolerated a chamberlain ruling through a caliph lost its reason
      to keep tolerating it. The regiments that fought over the wreckage were
      the ones the arrangement itself had recruited and armed, which is why no
      faction that won a battle in the years afterward could also rebuild a
      state the others would accept.
    source: kennedy-1996
    contested: false

measures:
  # Taagepera 1997, appendix: Cordoba 1000 -> .6 Mm2, "Entire Iberia
  # held". His 756 row is .5 at the secession from the Caliphate.
  reach_km2: { value: 600000, at: 1000, source: taagepera-1997 }
  peak_population: null
  influence:
    # Arabic in al-Andalus was the inherited script writing an inherited
    # language, extended to nothing new by this polity; and the Latin-script
    # traditions around it are not derived from it. No consulted source
    # addresses the question, so null rather than 0.
    descendant_scripts: { count: null, items: [], source: null }
    # This polity received a conversion rather than propagating one. The
    # Andalusi population became Muslim over generations under its rule, which
    # the coding rules exclude — adoption inside the borders is not carrying —
    # and no source read here describes Cordoban state action propagating
    # beyond them. Null, because the question has not been put to a source.
    religions_carried: { count: null, items: [], source: null }
    # The taifa kings who divided al-Andalus after 1031 ruled the ground and
    # mostly did not claim the house, and no later polity here takes the
    # Cordoban caliphate as the ground of its own authority. Null rather than
    # 0: no source consulted for this polity was asked the question.
    successor_claims: { count: null, items: [], source: null }
