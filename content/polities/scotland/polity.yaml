id: scotland
region: the-british-isles

name:
  latin: Kingdom of Scotland
  script: Alba
  script_lang: gla

span:
  # The Chronicle of the Kings of Alba, the only native narrative source
  # for this period, dates Kenneth's receipt of Dál Riata to 840/1 and
  # the start of his sixteen-year rule over "this Pictland" to 842/3.
  # Brown's own history is explicit that only the general trend of
  # events, not precise dates, can be established with confidence for
  # this reign, and Broun (2015) cautions against reading a securely
  # dated, centrally governed unification out of the surviving evidence.
  start: { min: 842, max: 843, source: alba-chronicle }
  end: { min: 1707, max: 1707, source: brown-1899 }

identity: >-
  A northern kingdom whose own founding union of Picts and Scots is
  attested only by a scant native chronicle, independent for the wars
  Wallace and Bruce fought to keep it, until its own parliament voted
  itself out of existence into a union with England in 1707.

capitals:
  - { name: Scone, source: brown-1899 }
  - { name: Edinburgh, source: brown-1899 }

core_region: The mainland between the Forth and the Pentland Firth, with the Hebrides and Northern Isles absorbed over time

rulers:
  founder: { name: Kenneth MacAlpin (Cináed mac Ailpín), reign: [843, 858], source: alba-chronicle }
  # Robert I's victory at Bannockburn in 1314 secured, in practice if not
  # yet in treaty, the independence the Wars of Independence had been
  # fought over since Wallace's rising in 1297.
  peak: { name: Robert I "the Bruce", reign: [1306, 1329], source: maxwell-1897 }
  last: { name: Anne, reign: [1702, 1707], source: brown-1899 }

scripts_and_languages:
  administration: [Latin, Scots, Scottish Gaelic]
  writing_system: Latin alphabet

institutions:
  military_basis: null
  # A land tax assessed by the "davoch" and later feudal units funded
  # the crown; by the seventeenth century, customs and excise had
  # become central to royal revenue as well, though this record's
  # sources speak mainly to the land-based assessment.
  revenue_basis: { values: [land-tax], source: brown-1899 }
  succession_rule: { values: [primogeniture], source: brown-1899 }
  legitimation: { values: [descent, divine-sanction], source: brown-1899 }

preceded_by_external:
  - name: the Pictish kingdom and Dál Riata
    type: absorbed remnants of
    year: 843
    note: >-
      Kenneth first took the Dál Riatan throne, then extended his own
      authority over Pictish territory a couple of years afterward -
      though the sole surviving native account of this transition gives
      no detail of how the union of the two peoples was actually
      accomplished, and later medieval writers filled the gap with
      elaborate and largely unverifiable stories of conquest and
      betrayal.
    source: alba-chronicle

succeeded_by_external: []

ended:
  type: gradual absorption
  by: []
  year: 1707
  source: brown-1899

turning_points:
  - year: 843
    type: reform
    name: "Kenneth's rule over Pictland begins"
    changed: >-
      Having already received the kingship of Dál Riata two years
      earlier, Kenneth began what the Chronicle records as sixteen years
      of rule over the Picts as well - the earliest point at which one
      king is attested governing both peoples, whatever the true
      circumstances of how that came about.
    source: alba-chronicle
    contested: true
  - year: 1057
    type: succession-crisis
    name: "Malcolm III kills Macbeth"
    changed: >-
      Duncan I's son, old enough at last to press his own claim, defeated
      and killed Macbeth - probably in open battle at Lumphanan - ending a
      seventeen-year reign later chroniclers would recast as a monstrous
      usurpation to preserve the fiction of an unbroken royal line. Malcolm
      Canmore's own reign, oriented toward England by his marriage to the
      Saxon princess Margaret, began the reorientation of the Scottish
      court that his sons would complete.
    source: brown-1899
    contested: false
  - year: 1138
    type: battle
    name: "The Battle of the Standard"
    changed: >-
      David I's invasion of England, pressed deep into Yorkshire, broke
      against an English army fighting under a ship's mast mounted on a
      wagon and topped with the consecrated host. The defeat cost Scotland
      nothing lasting - England's own civil war left the victors unable to
      press the advantage, and David extracted a more favorable peace
      within a year - but it is the clearest single demonstration of the
      composite, feudalized kingdom his own reign had built: Normans,
      Saxons, Scots, Norwegians and Galwegian Picts fighting under one
      Scottish king.
    source: brown-1899
    contested: false
  - year: 1292
    type: succession-crisis
    name: "Edward I awards the crown to Balliol"
    changed: >-
      The death of the child queen Margaret, Maid of Norway, at sea in
      1290 left no undisputed heir; the Scottish guardians' invitation to
      Edward I of England to arbitrate the succession let him extract
      recognition as feudal overlord of Scotland from every claimant
      before he ruled, at Berwick in November 1292, in favor of John
      Balliol. Balliol was the first Scottish king crowned on the
      strength of an English king's judgment rather than Scottish consent
      alone - the arrangement Edward would spend the following years
      turning into direct rule, and that Wallace's own rising would
      answer five years later.
    source: brown-1899
    contested: false
  - year: 1297
    type: battle
    name: "Battle of Stirling Bridge"
    changed: >-
      William Wallace's forces destroyed an English army at the
      crossing of the Forth, reviving armed resistance to Edward I's
      claim of overlordship after the kingdom's own nobility had largely
      submitted the year before.
    source: murison-1900
    contested: false
  - year: 1314
    type: battle
    name: "Battle of Bannockburn"
    changed: >-
      Robert I's army destroyed an English relief force sent to break
      the siege of Stirling Castle, the king himself opening the
      engagement by killing an English knight, Henry de Bohun, in single
      combat before the main armies closed. The victory did not by
      itself end the war, but it secured Bruce's own throne and the
      practical independence the peace of 1328 would formally recognize.
    source: maxwell-1897
    contested: false
  - year: 1346
    type: battle
    name: "David II captured at Neville's Cross"
    changed: >-
      Campaigning in England at France's urging while Edward III besieged
      Calais, David II was routed and taken prisoner - the start of eleven
      years' captivity that left Robert the Steward governing in his
      place and burdened the kingdom with a ransom it had not finished
      paying by David's own death. The captivity set up the Stewart
      succession: David's late secret offer to disinherit his own family
      in England's favor came to nothing, and the throne passed in 1371
      to his nephew, Robert II, the first Stewart king.
    source: brown-1899
    contested: false
  - year: 1437
    type: succession-crisis
    name: "James I murdered at Perth"
    changed: >-
      A conspiracy led by his own kinsman the Earl of Atholl killed James
      I in his own lodging, ending eighteen years of rule so determined
      to break noble power - executions, forfeitures, the mass arrest of
      Highland chiefs - that it provoked the very conspiracy that killed
      him. The pattern repeated across the century: James II died when
      his own artillery exploded beside him in 1460, and James III was
      killed in the chaos following a revolt his own son led against him
      in 1488 - three consecutive Stewart kings whose reigns ended in
      violence their own methods of rule had provoked.
    source: brown-1899
    contested: false
  - year: 1513
    type: battle
    name: "Flodden"
    changed: >-
      James IV's invasion of England, undertaken to honor Scotland's
      French alliance while Henry VIII campaigned in France, ended in the
      worst single military disaster in Scottish history: the king
      himself killed fighting in his own line, along with twelve earls,
      fourteen lords and most of the kingdom's higher clergy. Edinburgh
      built its first town wall in the aftermath, expecting an invasion
      that Surrey's own exhausted army never delivered.
    source: brown-1899
    contested: false
  - year: 1542
    type: battle
    name: "Solway Moss, and the death of James V"
    changed: >-
      Drawn into war with England again by the same French alliance that
      had killed his father, James V watched his own nobles refuse to
      invade at Fala Moor, then saw a second army collapse almost without
      a fight at Solway Moss. He died within days of the defeat, having
      just learned of the birth of his own daughter and heir, Mary - an
      infant queen inheriting a kingdom for the second time in three
      generations.
    source: brown-1899
    contested: false
  - year: 1560
    type: conversion
    name: "The Reformation Parliament"
    changed: >-
      With French forces withdrawn under an English-backed treaty and
      the regent Mary of Guise recently dead, the Scottish Parliament
      renounced papal authority and endorsed a new statement of Reformed
      belief - a change the kingdom's own historian later contrasted with
      the bloodshed that accompanied the same transition elsewhere in
      Europe, noting that Scottish Protestants carried out not one
      execution for religion, even at their most dominant.
    source: brown-1899
    contested: false
  - year: 1603
    type: succession-crisis
    name: "Union of the Crowns"
    changed: >-
      News that Elizabeth of England had died reached James VI at
      Holyrood within three days, and the English Privy Council
      proclaimed him her successor soon after. He set out for London
      that spring having pledged regular visits home, a pledge he kept
      only once across the rest of his reign. Scotland kept its own
      parliament and law, but ceased that same season to have an
      independent foreign policy or a resident king.
    source: brown-1899
    contested: false
  - year: 1700
    type: catastrophe
    name: "Collapse of the Darien scheme"
    changed: >-
      A Scottish colonial venture on the isthmus of Panama, into which
      much of the country's available capital had been poured, collapsed
      under Spanish attack and tropical disease; of the emigrants who
      had sailed out with high hopes, only a fraction ever saw Scotland
      again. The financial wreck it left behind became one of the
      strongest arguments the Union's supporters had.
    source: brown-1899
    contested: false
  - year: 1707
    type: treaty
    name: "The Treaty of Union ratified"
    changed: >-
      After nearly three months of debate, the Scottish Parliament gave
      final sanction to the Treaty of Union on 16 January, its
      chief architect, the Earl of Stair, having collapsed and died of
      apoplexy just eight days before. The Parliaments of Scotland and
      England both dissolved into a new Parliament of Great Britain -
      not, by the treaty's own terms, one kingdom's absorption into the
      other, though its actual architects were denounced by their own
      countrymen as hirelings rather than thanked as statesmen.
    source: brown-1899
    contested: false

