id: kushan
region: classical-india

name:
  latin: Kushan Empire
  script: Κοϸανο
  script_lang: xbc

span:
  start: { min: 30, max: 30, source: thapar-2002 }
  end: { min: 375, max: 375, source: thapar-2002 }

identity: >-
  The empire on the trade routes between India, Iran and China, and the
  medium by which Buddhism reached Central Asia.

capitals:
  - { name: Purushapura, script: पुरुषपुर, from: 30, source: thapar-2002 }

core_region: Bactria, Gandhara and northern India

rulers:
  founder: { name: Kujula Kadphises, reign: [30, 80], source: thapar-2002 }
  peak: { name: Kanishka I, reign: [127, 150], source: thapar-2002 }
  last: { name: Vasudeva II, reign: [290, 375], source: thapar-2002 }

scripts_and_languages:
  administration: [Bactrian, Prakrit]
  writing_system: Greek and Kharosthi

ended:
  type: conquest
  by: [sasanian]
  year: 375
  source: daryaee-2009

# A real predecessor with no record here: the Greek kingdom the Yuezhi took
# Bactria from, whose alphabet and coinage the Kushans then used.
preceded_by_external:
  - name: the Greco-Bactrian kingdom
    type: overthrew
    year: null
    note: >-
      The Greek kingdom north of the Hindu Kush, descended from Alexander's
      colonists and independent of the Seleucids for about a century, which the
      Yuezhi took in the 130s BC. The Kushans kept its alphabet — adapted, with
      an added letter, to write their own Iranian language — and their earliest
      coins imitate its types, because a dynasty establishing itself on somebody
      else's currency begins by being recognisable.
    source: thapar-2002

