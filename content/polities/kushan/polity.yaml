id: kushan
region: classical-india

name:
  latin: Kushan Empire
  script: Κοϸανο
  script_lang: xbc

span:
  start: { min: 30, max: 30, source: thapar-2002 }
  end: { min: 375, max: 375, source: thapar-2002 }

identity: >-
  The empire on the trade routes between India, Iran and China, and the
  medium by which Buddhism reached Central Asia.

capitals:
  - { name: Purushapura, script: पुरुषपुर, from: 30, source: thapar-2002 }

core_region: Bactria, Gandhara and northern India

rulers:
  founder: { name: Kujula Kadphises, reign: [30, 80], source: thapar-2002 }
  peak: { name: Kanishka I, reign: [127, 150], source: thapar-2002 }
  last: { name: Vasudeva II, reign: [290, 375], source: thapar-2002 }

scripts_and_languages:
  administration: [Bactrian, Prakrit]
  writing_system: Greek and Kharosthi

ended:
  type: conquest
  by: [sasanian]
  year: 375
  source: daryaee-2009

# A real predecessor with no record here: the Greek kingdom the Yuezhi took
# Bactria from, whose alphabet and coinage the Kushans then used.
preceded_by_external:
  - name: the Greco-Bactrian kingdom
    type: overthrew
    year: null
    note: >-
      The Greek kingdom north of the Hindu Kush, descended from Alexander's
      colonists and independent of the Seleucids for about a century, which the
      Yuezhi took in the 130s BC. The Kushans kept its alphabet — adapted, with
      an added letter, to write their own Iranian language — and their earliest
      coins imitate its types, because a dynasty establishing itself on somebody
      else's currency begins by being recognisable.
    source: thapar-2002

institutions:
  military_basis: null
  # Kushan gold was struck to a weight matching the Roman aureus closely
  # enough to circulate against it - the signature of a state living on the
  # trade crossing at the junction of the Chinese, Iranian and Indian routes.
  revenue_basis: { values: [trade-toll], source: thapar-2002 }
  succession_rule: null
  # Kanishka's own coin legends carry three imperial vocabularies at once:
  # shaonanoshao, "king of kings," Iranian; maharaja, Indian; and devaputra,
  # "son of god," a translation of the Chinese tianzi - divine sanction
  # asserted in three traditions simultaneously to three different subject
  # populations.
  legitimation: { values: [divine-sanction, titulature], source: thapar-2002 }

turning_points:
  - year: 90
    type: battle
    name: Defeat on the Pamirs, conquest in India
    changed: >-
      An ambition to be treated as China's equal was answered instead with
      proof of exactly the opposite, and the redirected energy that followed
      did more to fix the empire's lasting shape than the original quarrel
      with the Han court was ever going to.
    source: smith-1904
    contested: false
  - year: 127
    type: reform
    name: Kanishka's accession
    changed: >-
      A dating problem serious enough that it functions as the working
      definition of how thin Kushan political chronology actually is:
      almost everything else in the dynasty's internal history is pinned,
      directly or indirectly, to wherever this one year is eventually
      settled.
    source: thapar-2002
    contested: true
  - year: 375
    type: catastrophe
    name: The last rump falls
    changed: >-
      The junction that four separate trading and political systems had met
      inside for three and a half centuries stopped being anyone's junction
      to hold, and no successor inherited the whole of it at once.
    source: thapar-2002
    contested: false

measures:
  reach_km2: { value: 2000000, at: 200, source: taagepera-1979 }
  peak_population: null
  influence:
    descendant_scripts: { count: null, items: [], source: null }
    religions_carried:
      count: 1
      items: [Mahayana Buddhism]
      source: thapar-2002
    successor_claims: { count: null, items: [], source: null }
