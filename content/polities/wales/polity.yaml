turning_points:
  - year: 1255
    type: battle
    name: "The battle of Bryn Derwin"
    changed: >-
      A quarrel over the partition of Gwynedd between Llywelyn and his
      brothers Owain and Dafydd was settled by battle at Bryn Derwin;
      in the space of one hour Llywelyn defeated both and took them
      prisoner, securing for himself the sole lordship of Anglesey and
      Snowdonia and the standing to act as leader of Wales as a whole.
    source: lloyd-wales-v2-1912
    contested: false
  - year: 1267
    type: treaty
    name: "The Treaty of Montgomery"
    changed: >-
      After eleven years of intermittent war, King Henry III agreed
      terms that met Llywelyn's own demands in full; on the 29th of
      September the prince did homage and swore fealty at the ford of
      Montgomery, and a formal document recognized him as Prince of
      Wales - a title and a recognition no Welsh ruler had secured
      from the English crown before him.
    source: lloyd-wales-v2-1912
    contested: false
  - year: 1282
    type: catastrophe
    name: "Death at the Irfon"
    changed: >-
      Attempting to raise the south against Edward I while his brother
      Dafydd held Snowdonia, Llywelyn was cut off from his own troops
      near the river Irfon and killed by an English soldier who did
      not recognize him; his head was sent to Edward and displayed
      before being sent on to London, and with his death the Welsh
      cause lost the one leader capable of sustaining it.
    source: lloyd-wales-v2-1912
    contested: false

