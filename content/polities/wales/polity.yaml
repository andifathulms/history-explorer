id: wales
region: the-british-isles

name:
  latin: Principality of Wales
  script: null
  script_lang: null

span:
  # lloyd-wales-v2-1912 dates the battle of Bryn Derwin, in which
  # Llywelyn ap Gruffudd defeated and captured his own brothers and
  # secured sole rule of Gwynedd, to the summer of 1255.
  start: { min: 1255, max: 1255, source: lloyd-wales-v2-1912 }
  # lloyd-wales-v2-1912 dates Llywelyn's death near the Irfon to 11
  # December 1282, and treats it as the decisive turning point of the
  # war; mopping-up fighting and the capture and execution of his
  # brother Dafydd continued into 1283, but the source's own account
  # frames Llywelyn's death as the point after which the Welsh cause
  # could not be carried on.
  end: { min: 1282, max: 1282, source: lloyd-wales-v2-1912 }

identity: >-
  A prince who won Gwynedd by defeating his own brothers in an hour,
  forced an English king to recognize him as Prince of Wales by
  treaty, and died almost by accident, struck down by a soldier who
  did not know him, in a skirmish he had no need to join.

# lloyd-wales-v2-1912 names no single fixed capital; Llywelyn's own
# power was seated in Gwynedd and the mountain stronghold of Snowdonia
# (Eryri), to which he and his brother Dafydd were driven back in the
# final war.
capitals: []

core_region: Gwynedd and Snowdonia, with overlordship extended across most of native Wales at its widest reach

