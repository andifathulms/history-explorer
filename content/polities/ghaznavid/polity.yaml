id: ghaznavid
region: iranian-intermezzo
name:
  latin: Ghaznavid Empire
  script: غزنویان
  script_lang: fa

# 962 is Alptigin's seizure of Ghazna; 977 is Sebuktigin's accession, from which
# Bosworth dates the dynasty proper. Alptigin founded a garrison lordship, not a
# dynasty, and the two dates answer different questions, so both are kept.
span:
  start: { min: 962, max: 977, source: bosworth-1963, max_source: bosworth-1996 }
  end: { min: 1186, max: 1186, source: bosworth-1977 }

identity: >-
  A dynasty founded by a Samanid Turkic slave-general at Ghazna, which took
  Khurasan from its former masters and carried a Persianate court into northern
  India.

capitals:
  - { name: Ghazna, script: غزنه, from: 962, to: 1163, source: iranica-ghaznavids }
  - { name: Lahore, script: لاهور, from: 1163, source: bosworth-1977 }

core_region: Eastern Afghanistan, Khurasan and the Punjab

rulers:
  founder:
    name: Sebuktigin
    script: سبکتگین
    reign: [977, 997]
    source: bosworth-1996
  peak:
    name: Mahmud of Ghazna
    script: محمود غزنوی
    reign: [998, 1030]
    source: bosworth-1963
  last:
    name: Khusrau Malik
    script: خسرو ملک
    reign: [1160, 1186]
    source: bosworth-1977

scripts_and_languages:
  administration: [Persian, Arabic]
  writing_system: Perso-Arabic

ended:
  type: conquest
  by: [ghurid]
  year: 1186
  source: bosworth-1977

institutions:
  military_basis: { values: [slave-soldier], source: bosworth-1963 }
  revenue_basis: { values: [plunder, land-tax], source: bosworth-1963 }
  # Sebuktigin designated Mahmud's brother and Mahmud took the throne anyway;
  # Mahmud designated Muhammad and Mas'ud took it from him within months. The
  # rule was designation by the reigning sultan and it was overturned by the
  # army at the first two successions, which is the pattern rather than the
  # exception — but it is the rule that was in force, and coding rule 7 asks
  # for the rule and not the outcome.
  succession_rule: { values: [nomination], source: bosworth-1963 }
  legitimation: { values: [caliphal-investiture], source: bosworth-1963 }

turning_points:
  - year: 999
    type: treaty
    name: "The Oxus agreed as a frontier"
    changed: >-
      With Bukhara falling to the Karakhanids, Mahmud was governing Khurasan in
      Samanid name and did not march north to save his overlords. He kept
      Khurasan, settled the Oxus as a boundary with the men who had destroyed
      them, and turned south — which partitioned the Samanid inheritance
      between two dynasties that had both come out of it.
    source: bosworth-1963
    contested: false
  - year: 1040
    type: battle
    name: "Dandanaqan"
    changed: >-
      Mas'ud lost Khurasan to the Seljuks in a single engagement and the
      western half of the empire was gone within a year. What is unusual is
      that the dynasty then lasted another century and a half, its centre
      drifting steadily towards the Indian provinces that had begun as a
      raiding ground.
    source: bosworth-1977
    contested: false

measures:
  reach_km2: { value: 3400000, at: 1029, source: taagepera-1997 }
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: iranica-ghaznavids }
    # Conquest in the Punjab followed by durable institutions — the Lahore
    # establishment, endowed mosques, a permanent administration — which is the
    # combination the coding rules require. Raiding alone would not have counted.
    religions_carried:
      count: 1
      items: [Sunni Islam]
      source: bosworth-1963
    successor_claims: { count: 0, items: [], source: bosworth-1977 }
