id: siak
region: sumatra-and-the-peninsula

name:
  latin: Sultanate of Siak Sri Indrapura
  # Written in Jawi, like Melaka's Malay, and null here for the reason
  # that record gives: a name in letters nobody on this project can
  # proofread is a decoration that reads as a citation.
  script: null
  script_lang: null

# Johor's own record (andaya-1975) dates Raja Kecil's seizure of Johor's
# throne to 1718, the event this record's own span starts from since it is
# the same claim of descent that later founds Siak itself. His own
# kingdom on the Siak river is dated to 1723 by siak-sistem-pemerintahan-2021.
# Between that founding and Sultan Sjarif Kasim II's 1946 dissolution of
# the sultanate lies a stretch of nearly two centuries - roughly 1725 to
# 1908 - that no source consulted here covers; only the founding and the
# closing decades are narrated.
span:
  start: { min: 1718, max: 1718, source: andaya-1975 }
  end: { min: 1946, max: 1946, source: khairiah-siak-education-2024 }

identity: >-
  A kingdom founded on a claim rather than a conquest - a posthumous
  prince's disputed birthright to Johor's throne, converted into a
  separate sultanate once that claim failed - that outlasted Dutch
  rule and ended when its last sultan handed its treasury to a new
  republic.

capitals:
  - { name: "Siak Sri Indrapura", source: andaya-1975 }

core_region: The Siak river basin on the eastern coast of Sumatra, opposite the Malay peninsula

rulers:
  founder: { name: "Raja Kecil (Sultan Abdul Jalil Rahmat Shah)", source: andaya-1975 }
  peak: { name: null, source: null }
  # Twelfth and last sultan, who directed the sultanate's own treasury
  # toward independent schools under Dutch rule and, in 1945, gave that
  # same treasury to the new Republic of Indonesia rather than negotiate
  # a separate settlement for his own line.
  last: { name: "Sultan Sjarif Kasim II", source: khairiah-siak-education-2024 }

scripts_and_languages:
  administration: [Malay]
  writing_system: Jawi

institutions:
  military_basis: null
  revenue_basis: null
  # A council of four hereditary datuk (Tanah Datar, Limapuluh, Pesisir
  # and Kampar) chose each new sultan by consensus rather than by a
  # stated order of birth; no fixed term bound a sultan once chosen.
  succession_rule: { values: [election], source: siak-sistem-pemerintahan-2021 }
  # Raja Kecil's entire claim to rule rested on his own contested descent,
  # not on any office, election or conquest of a rival's own capital -
  # descent was the argument itself, not merely its justification.
  legitimation: { values: [descent], source: andaya-1975 }

# Sultan Sjarif Kasim II gave the sultanate's own treasury to the new
# Republic of Indonesia in 1945 rather than negotiate a separate future
# for his own line; the sultanate itself is dated to have ended in 1946.
# `gradual absorption` is the closest fit in the closed vocabulary - the
# act itself was immediate, but it was the sultan's own choice rather
# than a conquest, a usurpation or a dynastic replacement.
ended:
  type: "gradual absorption"
  by: []
  year: 1946
  source: siak-sistem-pemerintahan-2021

preceded_by_external: []
succeeded_by_external: []

turning_points:
  - year: 1718
    type: succession-crisis
    name: "Raja Kecil's seizure of Johor"
    changed: >-
      A claimant to a slain sultan's own bloodline took Johor's throne by
      force rather than by proof, aiming his claim precisely at the one
      weakness a chief minister's family could never fully answer for -
      that it was not, whatever else it was, the blood that had made the
      kingship legitimate for three centuries.
    source: andaya-1975
    contested: true
  - year: 1723
    type: revolt
    name: "The founding of Siak"
    changed: >-
      Driven back out of Johor by the bendahara line he had briefly
      displaced, the same claimant established an entirely new capital on
      unclaimed ground instead of continuing to contest an inheritance he
      could no longer make stick - the same descent claim that had won
      him a throne once now founding a separate one.
    source: andaya-1975
    contested: false
  - year: 1917
    type: reform
    name: "Madrasah Taufiq Alhasjimiah founded"
    changed: >-
      Dissatisfied that the Dutch-run school he had helped establish two
      years earlier taught Siak's own children little of their religion
      or their own nationality, Sultan Sjarif Kasim II founded an
      independent school for boys using the sultanate's own funds - the
      first in a series of schools, including two founded for girls
      within the next two decades, that became the one arena where the
      sultan could still exercise real authority under Dutch rule.
    source: khairiah-siak-education-2024
    contested: false
  - year: 1946
    type: treaty
    name: "The telegram to Sukarno"
    changed: >-
      On hearing of Indonesia's 1945 declaration of independence, Sultan
      Sjarif Kasim II pledged the new republic his moral, political and
      material support and handed over the whole of the sultanate's own
      treasury to the Indonesian state, closing out the sultanate at his
      own initiative rather than under outside compulsion.
    source: siak-sistem-pemerintahan-2021
    contested: false

measures:
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: andaya-1975 }
    religions_carried: { count: 0, items: [], source: andaya-1975 }
    successor_claims: { count: 0, items: [], source: andaya-1975 }
