id: rustamid
region: islamic-west

name:
  latin: Rustamid Imamate
  script: الرستميون
  script_lang: ar

span:
  start: { min: 776, max: 776, source: abun-nasr-1987 }
  end: { min: 909, max: 909, source: abun-nasr-1987 }

identity: >-
  An Ibadi Kharijite imamate in the central Maghreb, elected rather than
  inherited, and the longest-lived Kharijite state.

capitals:
  - { name: Tahert, script: تاهرت, from: 776, source: abun-nasr-1987 }

core_region: The central Maghreb

rulers:
  founder: { name: Abd al-Rahman ibn Rustam, reign: [776, 788], source: abun-nasr-1987 }
  peak: { name: Aflah ibn Abd al-Wahhab, reign: [823, 872], source: abun-nasr-1987 }
  last: { name: Yaqzan ibn Muhammad, reign: [894, 909], source: abun-nasr-1987 }

scripts_and_languages:
  administration: [Arabic]
  writing_system: Arabic

ended:
  type: conquest
  by: [fatimid]
  year: 909
  source: halm-1996

institutions:
  # Berber tribal contingents, principally Nafusa and Zanata, and never a
  # standing force: an imamate whose ruler could in principle be deposed by the
  # scholars did not build an army that answered only to him.
  military_basis: { values: [tribal-levy], source: abun-nasr-1987 }
  revenue_basis: { values: [trade-toll], source: abun-nasr-1987 }
  succession_rule: { values: [election], source: abun-nasr-1987 }
  legitimation: { values: [election], source: abun-nasr-1987 }

turning_points:
  - year: 784
    type: succession-crisis
    name: "The Nukkar refuse"
    changed: >-
      A faction rejected the succession of the founder's son on the grounds
      that the choice had been made by too narrow a circle and that hereditary
      succession was what the doctrine existed to prevent. The split is
      permanent and Ibadism has been divided along it since — a schism about
      whether an election was properly conducted, which is a rarer kind of
      division than this corpus otherwise records.
    source: abun-nasr-1987
    contested: false
  - year: 909
    type: siege
    name: "Tahert taken"
    changed: >-
      The Kutama army raised by the Isma'ili mission destroyed the city in the
      same campaign that ended the Aghlabids. The imamate stopped; the
      community withdrew south into the pre-Saharan steppe and eventually the
      Mzab, and reconstituted itself under a council of scholars with no ruler
      at all, which Ibadi law provides for.
    source: halm-1996
    contested: false

measures:
  # No cited km2 for this polity in the works consulted; Taagepera does not
  # tabulate it separately. The axis is empty rather than borrowed.
  reach_km2: null
  peak_population: null
  influence:
