id: almohad
region: islamic-west

name:
  latin: Almohad Caliphate
  script: الموحدون
  script_lang: ar

span:
  start: { min: 1121, max: 1121, source: bennison-2016 }
  end: { min: 1269, max: 1269, source: bennison-2016 }

identity: >-
  A Berber religious movement that declared its founder the mahdi, took the
  caliphal title, and ruled the whole Maghreb and al-Andalus.

capitals:
  - { name: Marrakesh, script: مراكش, from: 1147, source: bennison-2016 }

core_region: The Maghreb and al-Andalus

rulers:
  founder: { name: Ibn Tumart, reign: [1121, 1130], source: bennison-2016 }
  peak: { name: Abu Yusuf Ya'qub al-Mansur, reign: [1184, 1199], source: bennison-2016 }
  last: { name: Idris II al-Wathiq, reign: [1266, 1269], source: bennison-2016 }

scripts_and_languages:
  administration: [Arabic, Berber]
  writing_system: Arabic

ended:
  type: fragmentation
  by: []
  year: 1269
  source: bennison-2016

institutions:
  # Masmuda and other Berber tribal contingents enrolled into the movement
  # collectively, with a paid guard and Christian mercenaries around the caliph
  # from the later twelfth century.
  military_basis: { values: [tribal-levy, mercenary], source: bennison-2016 }
  revenue_basis: { values: [land-tax, trade-toll], source: bennison-2016 }
  succession_rule: { values: [nomination], source: bennison-2016 }
  # Not descent, not investiture, not conquest. Abd al-Mu'min took the caliphal
  # title on the authority of a mahdi — the Maghreb produced its own caliphate
  # on doctrine rather than lineage, which is the only such case in this
  # corpus.
  legitimation: { values: [divine-sanction], source: bennison-2016 }

turning_points:
  - year: 1121
    type: conversion
    name: "The mahdi proclaimed at Tinmal"
    changed: >-
      Ibn Tumart's followers proclaimed him the rightly guided one, which made
      the movement's founder infallible and its enemies unbelievers rather than
      rivals. It authorised a war against a Muslim dynasty, it produced the only
      caliphate in this corpus founded on doctrine rather than descent, and it
      is the claim whose failure at Las Navas the last chapter is about.
    source: bennison-2016
    contested: false
  - year: 1160
    type: siege
    name: "Mahdia"
    changed: >-
      Abd al-Mu'min turned an army round at Sale that had been raised for Spain,
      marched it the length of North Africa, took Mahdia back from the Sicilians
      and then collected Ifriqiya's towns one at a time from the families that
      had helped themselves to them. It is the point at which the whole Islamic
      west was under one ruler, which had not happened before and did not happen
      again.
    source: ibn-khaldun-de-slane
    contested: false
  - year: 1212
    type: battle
    name: "Las Navas de Tolosa"
    changed: >-
      The field army was destroyed and with it the Almohad ability to hold al-
      Andalus: Cordoba fell in 1236 and Seville in 1248. The caliphate rested
      on Ibn Tumart's status as infallible mahdi, and his successors quietly
      abandoned the doctrine rather than defend it against a visible
      judgement, which removed the argument for their own authority.
    source: bennison-2016
    contested: false
  # The bargain with Castile and the terms of it are in de Slane's footnote to
  # this passage, from the sources he names there.
  - year: 1229
    type: reform
    name: "The Mahdi struck off the coinage"
    changed: >-
      Al-Ma'mun crossed from Spain with twelve thousand Castilian cavalry lent
      on written conditions, executed about a hundred of the leading Almohad
      shaykhs at Marrakesh, and then ordered every city of the empire to remove
      Ibn Tumart's name from the coins, from the Friday prayer and from the
      Berber portion of the call to prayer. The empire kept its territory a
      while longer and lost, in one year, the reason anyone was obliged to obey
      it.
    source: ibn-khaldun-de-slane
    contested: false

