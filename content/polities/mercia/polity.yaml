id: mercia
region: the-british-isles

name:
  latin: Kingdom of Mercia
  script: null
  script_lang: null

span:
  # stenton-1947-2ed dates Aethelbald's murder and the civil war
  # between Beornred and Offa to 757, with Offa driving Beornred into
  # exile before the year was out.
  start: { min: 757, max: 757, source: stenton-1947-2ed }
  # stenton-1947-2ed dates the battle of Ellendun, in which Egbert of
  # Wessex defeated Beornwulf of Mercia, to 825, and states plainly
  # that with it "the ascendancy of the Mercian kings came to an end."
  end: { min: 825, max: 825, source: stenton-1947-2ed }

identity: >-
  A midland kingdom seized after a bodyguard's assassination of its
  king, built by its new ruler into the dominant power of England
  through Welsh conquest, a two-hundred-mile earthwork, and marriage
  diplomacy that made client kings of Wessex and Northumbria alike -
  undone within thirty years of its founder's death.

# No source consulted here names a single fixed royal seat; Offa's
# own rival archbishopric was raised at Lichfield, but the court
# itself moved with the king.
capitals: []

core_region: The English midlands, with dependencies extending to Kent, East Anglia and the Welsh march

rulers:
  founder: { name: "Offa", reign: [757, 796], source: stenton-1947-2ed }
  peak: { name: "Offa", reign: [757, 796], source: stenton-1947-2ed }
  last: { name: "Beornwulf", source: stenton-1947-2ed }

