id: habsburg-monarchy
region: bohemia

name:
  latin: The Habsburg Monarchy
  script: Habsburgermonarchie
  script_lang: de

# The second half of a two-record split (see house-of-austria's own
# span comment for the full reasoning). This record is the composite
# Austria-Bohemia-Hungary state historians actually mean by "the
# Habsburg Monarchy" - not the medieval House of Austria that
# preceded it, which ran 1273-1519 under a single line before
# permanently forking between Charles V (Spain, Burgundy, the
# Americas, the Imperial title - out of this region's scope) and his
# brother Ferdinand, who took the Austrian hereditary lands in the
# 1521-22 division of the inheritance.
#
# This record starts at the Battle of Mohács (29 August 1526), where
# the death of the childless King Louis II of Bohemia and Hungary
# opened both thrones to Ferdinand's own claim - the actual founding
# moment of the composite state, distinct from the earlier division
# of the Austrian lands themselves.
span:
  start: { min: 1526, max: 1526, source: coxe-austria-1847 }
  # This record currently runs Ferdinand I's own founding all the way
  # through coxe-austria-1847's own endpoint: the Ottoman wars and the
  # 1545 and 1562 truces; Ferdinand's own 1547 crushing of the Bohemian
  # estates and the end of their elective crown; Maximilian II's
  # toleration and the 1566 death of Süleyman at Szigetvár; Rudolf II's
  # decline, Matthias's usurpation, and the 1609 Letter of Majesty; the
  # 1618 Defenestration of Prague and the Thirty Years' War down to the
  # 1648 Peace of Westphalia; Leopold I's own Ottoman wars, closing with
  # the 1683 Siege of Vienna and the 1699 Peace of Karlowitz; the War of
  # the Spanish Succession and Charles VI's Pragmatic Sanction; Maria
  # Theresa's wars and reforms; Joseph II's enlightened absolutism; and
  # Leopold II's own brief, stabilising reign, down to his 1792 death
  # and Francis II's accession - not an institutional end. A second
  # source, still to be opened, will be needed to carry the record from
  # 1792 to Francis II's 1804 self-coronation as Emperor of Austria,
  # since coxe-austria-1847 stops in 1792.
  end: { min: 1792, max: 1792, source: coxe-austria-1847 }

identity: >-
  The composite Austria-Bohemia-Hungary state Ferdinand I built from a
  dead king's crowns at Mohács, contested from its first year by a
  rival king backed by the Ottoman sultan who threatened to march the
  keys of Hungary's own fortresses to Vienna's gates.

capitals:
  - { name: Vienna, source: coxe-austria-1847 }

core_region: Austria, Bohemia and Hungary, from the Alps to the Carpathians

rulers:
  # Ferdinand claimed both crowns by family compact and by marriage to
  # Louis II's own sister, but - aware Bohemians and Hungarians valued
  # their own right of election - stood for election in both kingdoms
  # rather than simply asserting inheritance. Elected King of Bohemia
  # on 26 October 1526; crowned King of Hungary at Székesfehérvár after
  # a contested double election against John Zápolya the same year.
  founder: { name: "Ferdinand I", reign: [1526, 1564], source: coxe-austria-1847 }
  # Provisional. Charles VI held the broadest territory of any ruler
  # this record covers - Leopold I's reconquered Hungary, plus the
  # former Spanish Netherlands and Habsburg Italy gained at Utrecht -
  # before Maria Theresa lost Silesia to Prussia within weeks of her
  # own accession. A later measures.reach_km2 figure, once a cited
  # source publishes one, may yet move this field.
  peak: { name: "Charles VI", reign: [1711, 1740], source: coxe-austria-1847 }
  last: null

scripts_and_languages:
  administration: [German, Latin, Czech, Hungarian]
  writing_system: Latin alphabet

institutions:
  military_basis: null
  revenue_basis: null
  succession_rule: null
  # Ferdinand's own claim rested on two grounds at once: family
  # compacts entailing the succession on the House of Austria in
  # default of Louis II's own male heirs, and his marriage to Anne,
  # the dead king's sister - but he chose to stand for election in
  # both kingdoms rather than rest on inheritance alone, aware how
  # closely Bohemians and Hungarians guarded their own elective right.
  legitimation: { values: [descent, election], source: coxe-austria-1847 }

# Both predecessors here are records in this collection, so they are
# edges in edges.yaml rather than this field: the Kingdom of Bohemia's
# own 1620 conquest already pointed at this record's id before this
# record existed to receive it; the Kingdom of Hungary's own 1526
# fragmentation now carries a matching edge to this record alongside
# its existing edge to Transylvania.
preceded_by_external: []

succeeded_by_external: []

ended: null

turning_points:
  - year: 1526
    type: battle
    name: "The Battle of Mohács"
    changed: >-
      Pressed into a battle his own council had counselled against,
      the young King Louis II watched his outnumbered army destroyed
      by Süleyman the Magnificent's forces and drowned fleeing the
      field when his own armored horse collapsed into a marsh - dying
      without an heir, and leaving his two kingdoms' own crowns open
      to Ferdinand's own claim.
    source: coxe-austria-1847
    contested: false
  - year: 1526
    type: succession-crisis
    name: "Ferdinand elected King of Bohemia, contested in Hungary"
    changed: >-
      Bohemia's own electoral committee chose Ferdinand on 26 October
      with only token opposition, but Hungary split between his own
      claim and John Zápolya, who had his own large following crowned
      him separately at Székesfehérvár - opening a rival kingship that
      would draw the Ottoman sultan directly into Habsburg affairs
      within three years.
    source: coxe-austria-1847
    contested: false
  - year: 1529
    type: siege
    name: "The first Ottoman siege of Vienna"
    changed: >-
      Süleyman the Magnificent's army reached Vienna's own walls after
      an almost unopposed advance through Hungary, and was turned back
      after thirty days by a dilapidated garrison under Nicholas of
      Salm, helped by the loss of the Turkish siege artillery to the
      Pressburg garrison - the young composite state's first proof
      that it could survive an existential Ottoman campaign rather
      than simply lose Hungary to one.
    source: coxe-austria-1847
    contested: false
  - year: 1532
    type: siege
    name: "Güns, and Süleyman's second withdrawal"
    changed: >-
      An eight-hundred-man garrison at Güns held Süleyman's renewed
      invasion for nearly a month, giving Charles V time to gather a
      combined Catholic-Protestant army of well over a hundred thousand
      at Vienna - a mobilisation of the whole empire behind the young
      state's own defence that Süleyman chose not to test, turning
      back to Graz and then home without a second attempt on the
      capital.
    source: coxe-austria-1847
    contested: false
  - year: 1541
    type: siege
    name: "The fall of Buda"
    changed: >-
      Süleyman took Buda by stratagem while relieving Bishop
      Martinuzzi's regency government from Ferdinand's own siege,
      installed a janissary garrison in the citadel, and kept the
      captured queen and infant king in his own hands - converting a
      contested Hungarian succession into direct Ottoman possession of
      the kingdom's own capital and the Danube corridor it commanded.
    source: coxe-austria-1847
    contested: false
  - year: 1545
    type: treaty
    name: "The five-year truce"
    changed: >-
      Exhausted by two decades of intermittent war and unable to
      recover Buda, Ferdinand accepted a truce that bound him to pay
      an annual tribute of thirty thousand ducats and hold what
      remained of royal Hungary as an Ottoman fief - settling, for the
      time being, the three-way partition of the old Hungarian kingdom
      between Habsburg, Ottoman and Transylvanian rule that would
      outlast his own reign.
    source: coxe-austria-1847
    contested: false
  - year: 1547
    type: revolt
    name: "The Bloody Diet"
    changed: >-
      Ferdinand crushed a Bohemian confederacy raised to defend the
      kingdom's elective constitution, executing and imprisoning its
      leaders and stripping Prague's own towns of their arms and
      privileges - a reckoning that let him convert Bohemia's crown
      from elective to hereditary within his own lifetime, secured
      formally by his son Maximilian's 1562 coronation as heir.
    source: coxe-austria-1847
    contested: false
  - year: 1609
    type: reform
    name: "The Letter of Majesty"
    changed: >-
      Facing an armed Bohemian confederacy his own brother Matthias's
      rival claim left him no means to resist, Rudolf II granted full
      Protestant freedom of worship and a standing right of armed
      defenders to enforce it - a concession torn up within a decade,
      but which set the terms the 1618 revolt would be fought over.
    source: coxe-austria-1847
    contested: false
  - year: 1618
    type: revolt
    name: "The Defenestration of Prague"
    changed: >-
      Protestant nobles threw two royal councillors and a secretary
      from a window of Prague Castle over a disputed church closure,
      an act that revived Bohemia's old confederacy, deposed Ferdinand
      II in favour of the Calvinist Frederick V, and opened the war
      that would run for three decades across the whole empire.
    source: coxe-austria-1847
    contested: false
  - year: 1620
    type: battle
    name: "The Battle of White Mountain"
    changed: >-
      Ferdinand II's Catholic League army broke Frederick V's forces
      outside Prague in a single afternoon; the "Winter King" fled the
      city by night, and the reprisal that followed - mass executions,
      confiscations, and the effective abolition of the Letter of
      Majesty - fixed Bohemia's Counter-Reformation settlement for the
      remainder of Habsburg rule.
    source: coxe-austria-1847
    contested: false
  - year: 1648
    type: treaty
    name: "The Peace of Westphalia"
    changed: >-
      Signed at Osnabrück and Münster after three decades of war that
      had long outgrown its Bohemian origins, the peace ceded Alsace
      to France and territory to Sweden, gave Calvinists legal standing
      equal to Lutherans, and froze the ownership of disputed church
      property to its 1624 pattern - ending the empire's bloodiest
      religious war without settling it by victory for either faith.
    source: coxe-austria-1847
    contested: false
  - year: 1683
    type: siege
    name: "The second Ottoman siege of Vienna"
    changed: >-
      A Grand Vizier's army invested Vienna for two months while
      Leopold I fled the capital; a relief force under John Sobieski of
      Poland broke the siege from the Kahlenberg heights on 12
      September, and the campaign that followed pushed Ottoman power
      out of most of Hungary within a generation, ending in the 1699
      Peace of Karlowitz.
    source: coxe-austria-1847
    contested: false
  - year: 1713
    type: treaty
    name: "The Peace of Utrecht"
    changed: >-
      Charles VI's own decade-long war to claim the Spanish throne
      ended with Spain itself going to his Bourbon rival, but left him
      the former Spanish Netherlands and Habsburg territory in Italy as
      compensation - the broadest territorial extent the monarchy would
      reach under his reign, achieved only after the war that had put
      him on the Austrian throne cost him the Spanish one he had fought
      a decade to reach.
    source: coxe-austria-1847
    contested: false
  - year: 1718
    type: reform
    name: "The Pragmatic Sanction"
    changed: >-
      Charles VI reordered the Habsburg succession to favour his own
      daughters over his late brother's, then spent two decades buying
      every major European power's formal guarantee of it - a
      guarantee Prussia tested within weeks of his death by invading
      Silesia, proving how little the paper commitment was worth
      without an army to back it.
    source: coxe-austria-1847
    contested: false
  - year: 1740
    type: catastrophe
    name: "The loss of Silesia"
    changed: >-
      Frederick II's invasion, launched weeks after Charles VI's death,
      opened the War of the Austrian Succession and cost Maria Theresa
      the province permanently despite the war's own guarantees; she
      held the rest of the Pragmatic Sanction's promise intact, but the
      loss reoriented Habsburg policy around recovering Silesia for the
      next generation.
    source: coxe-austria-1847
    contested: false
  - year: 1781
    type: reform
    name: "Joseph II's Edict of Toleration and the abolition of serfdom"
    changed: >-
      Joseph II extended legal worship rights to Protestants, Orthodox
      Christians and Jews in Catholic-only hereditary lands and freed
      peasants from bondage to their lords' own soil - sweeping reforms
      issued and revised faster than the monarchy's institutions could
      absorb them, and resisted outright by Hungary's own nobility and
      the Austrian Netherlands alike.
    source: coxe-austria-1847
    contested: false

