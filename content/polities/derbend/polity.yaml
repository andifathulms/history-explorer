id: derbend
region: caucasus

name:
  latin: Emirate of Derbend
  script: باب الأبواب
  script_lang: ar

span:
  start: { min: 869, max: 869, source: minorsky-1958 }
  end: { min: 1077, max: 1077, source: minorsky-1958 }

identity: >-
  The gate of gates: a walled pass three kilometres wide between the mountains
  and the Caspian, and the emirate that lived on taxing everything that went
  through it.

capitals:
  - { name: Derbend, script: دربند, from: 869, source: minorsky-1958 }

core_region: The Caspian Gates and their hinterland, between the eastern Caucasus and the sea

rulers:
  founder: { name: Hashim ibn Suraqa, source: minorsky-1958 }
  # The local chronicle names emirs continuously and the works consulted do not
  # identify one as the height or the last; this site does not appoint them.
  peak: { name: null, source: null }
  last: { name: null, source: null }

scripts_and_languages:
  administration: [Arabic, Persian]
  writing_system: Perso-Arabic

ended:
  type: conquest
  by: [great-seljuk]
  year: 1077
  source: minorsky-1958

institutions:
  # Null, and for the reason this site's Mirdasid record gives about Aleppo's
  # ahdath. Derbend's fighting strength was the city itself — a frontier ribat
  # settled with ghazi volunteers endowed to hold the pass, plus the armed
  # quarters under their own leaders, plus highland allies hired or persuaded
  # for a season. The emir commanded a retinue and negotiated with the rest.
  # None of the seven values describes a city that arms itself, and coding
  # `conscript` would assert an administrative levy that did not exist.
  military_basis: null
  # The pass, and only the pass. Derbend controlled the one practicable land
  # route between the steppe and Iran, three kilometres wide, and took a share
  # of everything that used it. The only other polity in this corpus coded on
  # tolls alone is Palmyra, which taxed a road across a desert for the same
  # reason: the ground produced nothing and the position produced everything.
  revenue_basis: { values: [trade-toll], source: minorsky-1958 }
  # The emirate was hereditary in the Hashimid family and its holder was
  # repeatedly deposed, exiled, recalled and killed by the city's own notables
  # and its rais. Nothing consulted describes that as a rule rather than as
  # what kept happening, so the field is null rather than `factional`.
  succession_rule: null
  legitimation: { values: [caliphal-investiture], source: minorsky-1958 }

# Not empty after all, and the comment below is kept because the narrower claim
# it argues for is still true. Coding rule 4.3 covers this case and names
# Srivijaya for it: a polity whose power was a standing arrangement over a
# strait rather than a sequence of decisive days. That holds for the two
# centuries in the middle of this record — the pass taxed, the city deposing
# its emir, the Shirvanshahs and the highland principalities manoeuvring, and
# no dated event in the works consulted that altered what the emirate was
# subsequently able to do during that stretch. It does not hold for the two
# hinges below: one is a demonstrated vulnerability the emirate's own economics
# absorbed rather than answered, and the other is the emirate's actual end.
turning_points:
  - year: 913
    type: revolt
    name: "A Rus fleet passes the Gate by sea"
    changed: >-
      A Rus fleet came down the Volga and out onto the Caspian - a sea no
      hostile fleet had ever used before - passed Derbend's wall entirely
      by water, and raided both coasts of it for as long as it chose. The
      wall had been built and maintained for four centuries against
      exactly the overland approaches it still controlled completely; a
      standing arrangement does not stop being profitable because someone
      has proved it can be bypassed, but it does stop being the answer to
      the question it was built to answer, and the emirate went on taxing
      the pass for another century and a half regardless.
    source: masudi-sprenger
    contested: false
  - year: 1077
    type: siege
    name: "The Seljuks take Derbend"
    changed: >-
      A wall built and maintained for four centuries to stop
      Turkic-speaking peoples from the northern steppe entering the lands
      south of the Caucasus was taken by Turkic-speaking peoples who came
      from the south instead, having reached the region by way of Iran
      rather than through the gate at all. The Hashimid emirate ended; the
      fortress did not, and went on being held by one power after another
      - Shirvanshahs, Mongols, Safavids, Ottomans, Afsharids, finally
      Russia - for the ground's own value rather than for any dynasty's.
    source: minorsky-1958
    contested: false

