  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: epstein-1996 }
    religions_carried: { count: 0, items: [], source: epstein-1996 }
    successor_claims: { count: 0, items: [], source: epstein-1996 }
