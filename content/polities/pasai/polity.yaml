id: pasai
region: sumatra-and-the-peninsula

name:
  latin: Samudera Pasai
  script: null
  script_lang: null

# 1267 is the conventional founding under Merah Silu, who took the name Malik
# al-Salih; his gravestone is dated 1297 and is the earliest dated Muslim royal
# gravestone in Southeast Asia. 1524 is Aceh taking the town from the
# Portuguese, who had taken it three years earlier.
span:
  start: { min: 1267, max: 1267, source: ricklefs-2008 }
  end: { min: 1524, max: 1524, source: reid-2005 }

identity: >-
  The first Muslim state in Southeast Asia, on the north Sumatran coast, which
  converted Melaka by marriage and was absorbed by the sultanate that grew up
  forty miles along the same shore.

capitals:
  - { name: Pasai, from: 1267, source: ricklefs-2008 }

core_region: The north coast of Sumatra at the entrance to the strait

rulers:
  founder: { name: Malik al-Salih, reign: [1267, 1297], source: ricklefs-2008 }
  peak: { name: Al-Malik al-Zahir, reign: [1326, 1345], source: gibb-battuta }
  # Null. Pasai's later sultans are known and its succession in the fifteenth
  # century was violent, and this site has not opened a source that puts a name
  # and a reign to the ruler in place when the Portuguese arrived. Thirty-six
  # records here carry a null in at least one of the three ruler slots, and the
  # position is always the same: a name with an invented reign reads on the page
  # exactly like a sourced one.
  last: { name: null, source: null }

scripts_and_languages:
  administration: [Malay, Arabic]
  writing_system: Jawi — the Arabic script adapted for Malay

# Portugal took Pasai in 1521; Ali Mughayat Syah of Aceh took it from the
# Portuguese in 1524 and absorbed its territory into the sultanate he was
# assembling forty miles up the same coast.
ended:
  type: conquest
  by: [aceh]
  year: 1524
  source: reid-2005

# What was on this coast first. Perlak has no record here, and a reader asking
# what preceded Pasai is asking about north Sumatra rather than about which
# pages exist. No `type`: Perlak was not conquered, absorbed or succeeded — it
# was simply there before, and forcing a succession type would assert a relation
# nobody recorded.
preceded_by_external:
  - name: Perlak
    year: null
    note: >-
      The Muslim port that came first. Krom records a tradition that Perlak was
      founded before Samudera, and when Marco Polo passed along this coast in
      1292 he listed six kingdoms in northern Sumatra and reported that of them
      only Perlak had converted — "on account of the Saracen traders who frequent
      the kingdom with their ships", and only in the town, the people of the
      mountains being another matter entirely. Pasai's achievement was not being
      first to Islam on this coast. It was being the port where Islam first held
      a throne that mattered beyond its own harbour.
    source: coedes-1968

institutions:
  military_basis: null
  # `trade-toll` and nothing else. Five polities on this one strait lived that
  # way across a thousand years — Srivijaya, Melaka, Pasai, Johor and Patani —
  # which is the densest concentration of the arrangement anywhere.
  #
  # Pasai's hinterland grew pepper, and the sultanate that took it in 1524 built
  # a royal monopoly on that pepper which is half of its own revenue coding. This
  # record does not carry the monopoly, because nothing consulted describes Pasai
  # operating one — what the sources describe is a port taking a share of what
  # called there.
  revenue_basis: { values: [trade-toll], source: ricklefs-2008 }
  succession_rule: null
  legitimation: { values: [descent, divine-sanction], source: ricklefs-2008 }

turning_points:
  - year: 1345
    type: reform
    name: What Ibn Battuta found
    changed: >-
      Ibn Battuta spent a fortnight at Pasai and left the only inside description
      of the court that exists. Nothing was reformed in 1345; what the date marks
      is the moment the polity becomes visible in detail rather than through
      gravestones and other people's tribute lists.
    source: gibb-battuta
    contested: false
  - year: 1414
    type: treaty
    name: The marriage
    changed: >-
      The ruler of Melaka married a princess of Pasai, converted, and took the
      name Iskandar Shah. Melaka went on to carry Islam to the ports of the
      eastern archipelago; this marriage is where Melaka got it. Contested,
      because the account comes from a chronicle written a century later at a
      court in exile.
    source: ricklefs-2008
    contested: true
  - year: 1524
    type: siege
    name: Aceh
    changed: >-
      The Portuguese had held the town for three years. Ali Mughayat Syah took it
      from them and absorbed the territory, and the oldest Muslim throne in
      Southeast Asia became a district of a sultanate forty miles up the coast
      that was two decades old.
    source: reid-2005
    contested: false

measures:
  reach_km2: null
  peak_population: null
  influence:
    # Zero. Jawi adapts the Arabic script rather than descending from Pasai's
    # own, so the count belongs to Arabic and not here.
    #
    # What a script count cannot register is the thing that actually mattered:
    # some of the earliest Islamic literature in Malay was produced at this
    # court, and Malay became the language Islam was carried in across the
    # archipelago partly because Pasai used it that way first. That belongs in
    # the chapters, and it is there.
    descendant_scripts: { count: 0, items: [], source: ricklefs-2008 }
    # One, and it is the head of a chain this site already had the middle and end
    # of.
    #
    # Islam reached these ports through traders over the preceding century.
    # Pasai is where it first held a throne in Southeast Asia, and what it then
    # did was convert Melaka by marriage in 1414 — after which the Melaka record
    # carries the same count for the ports of the eastern archipelago, Ternate's
    # for the far eastern end of that reach, Aceh's for the Sumatran highlands
    # and the pilgrimage, and Demak's for taking Islam inland across Java by
    # force.
    #
    # Ten polities in the archipelago carry a count of one for this religion, and
    # Pasai is upstream of the other nine. Rule 2 counts propagation past a prior
    # boundary, and each of the ten crossed a different one.
    religions_carried:
      count: 1
      items: [Sunni Islam]
      source: ricklefs-2008
    # Zero. Aceh took Pasai's territory, its coast and its position, and did not
    # claim to be its continuation — Aceh's sultans traced their own line and
    # built their legitimacy out of their own court. Taking what a polity had is
    # not asserting that you are it.
    successor_claims: { count: 0, items: [], source: reid-2005 }
