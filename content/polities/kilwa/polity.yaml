id: kilwa
region: zimbabwe-and-the-coast

name:
  latin: Kilwa Sultanate
  # Swahili was written in the Arabic script with added letters — an adaptation
  # of somebody else's writing system rather than a script of Kilwa's own, and
  # the field would in any case need a form of the name in that script that
  # nobody here can proofread.
  script: null
  script_lang: null

# The Kilwa Chronicle puts the founding dynasty's arrival in the late tenth
# century and the archaeology has occupation on the island earlier than that, so
# the range is the gap between a tradition and a stratigraphy. 1505 is the
# Portuguese sack.
span:
  start: { min: 957, max: 1000, source: horton-middleton-2000 }
  end: { min: 1505, max: 1505, source: horton-middleton-2000 }

identity: >-
  The city-state that held the gold of Sofala by making every ship going south
  stop at its harbour, and minted its own coin for five hundred years.

capitals:
  - { name: Kilwa Kisiwani, from: 1000, source: horton-middleton-2000 }

core_region: An island off the Tanzanian coast, with dependencies from Sofala to the Comoros

rulers:
  founder: { name: Ali ibn al-Hasan, source: horton-middleton-2000 }
  # The sultan Ibn Battuta met in 1331, and the builder of Husuni Kubwa.
  peak: { name: al-Hasan ibn Sulaiman, reign: [1310, 1333], source: horton-middleton-2000 }
  last: { name: Ibrahim ibn Sulaiman, source: horton-middleton-2000 }

scripts_and_languages:
  administration: [Arabic, Swahili]
  writing_system: Arabic

# Francisco de Almeida took the town in July 1505 with a fleet and about five
# hundred men, sacked it, built a fort, and installed a puppet. Barbosa says the
# fort was pulled down "as its maintenance was of no value nor profit to him".
# What did not come back was the trade.
ended:
  type: conquest
  by: []
  year: 1505
  source: horton-middleton-2000

# The power that took the town has no record here, so it is named rather than
# left as an absence. Not an edge: an edge joins two records.
succeeded_by_external:
  - name: the Portuguese crown
    type: conquered by
    year: 1505
    note: >-
      Almeida sacked the town, installed a sultan of his own choosing and built
      a fort dismantled within a few years; the following year Portugal
      took Sofala directly and began buying the gold at its source, which
      removed the reason ships had ever stopped at Kilwa. Barbosa, writing about
      1518, says the formerly great trade was ruined by the attempt to regulate
      it.
    source: barbosa-dames

# The island was inhabited and governed before the sultanate: the excavation
# shows continuous local Iron Age settlement, and the dynasty's own foundation
# story concedes the point by having the founder buy the island rather than take
# it. No name survives for whoever sold it.
preceded_by_external:
  - name: the island's own rulers before the dynasty
    year: null
    note: >-
      The Kilwa Chronicle, as de Barros printed it in 1552, says the founder
      chose the isle of Kilwa and purchased it from its inhabitants — which is a
      claim of legitimate acquisition rather than of conquest, and concedes that
      somebody was already there to sell it. The archaeology agrees: the town
      grows out of local Iron Age settlement in continuous occupation, with
      material culture that develops in place. No ruler of it is named in any
      source.
    source: barbosa-dames

institutions:
  # Null, and it is a finding rather than a gap. There is no Kilwan army in the
  # sources or in the ground: no fortifications facing the sea until the
  # Portuguese built one, no standing force, no military titles in the
  # chronicle, and no recorded campaign against another coastal town. A city
  # whose position rested on being where ships had to stop did not need one, and
  # in 1505 it did not have one.
  military_basis: null
  # Customs, and a chokehold. Kilwa produced nothing:
  # the gold came from the Zimbabwe plateau to Sofala, sixteen hundred kilometres
  # south, and the reason it went through Kilwa is the monsoon. A ship out of
  # Arabia or India could reach Kilwa and return within one year's winds and
  # could not reach Sofala and return, so the last leg was Kilwa's and Kilwa
  # priced it.
  #
  # The second value is the transshipment monopoly rather than a commodity: what
  # Kilwa sold was the right to pass, and it enforced that by owning the vessels
  # that made the run to Sofala. Barbosa confirms the mechanism from the other
  # side in about 1518: "no ships passed towards Sofala without first coming to
  # this island", and before the Portuguese came, Sofala, Cuama, Angoya and
  # Mozambique were all subject to the king of Kilwa.
  revenue_basis: { values: [trade-toll, monopoly], source: horton-middleton-2000 }
  succession_rule: null
  # Descent from a prince of Shiraz, asserted in the Kilwa Chronicle and on the
  # coast generally — the Shirazi tradition, which several dynasties from
  # Mogadishu to the Comoros claimed and which almost certainly did not happen.
  #
  # Horton and Middleton read it as an African mercantile elite acquiring a
  # pedigree its trading partners would recognise, in a world where Islamic
  # descent was commercial standing. A claim is coded as the claim that was
  # made, not as the claim that was true; whether the family came from Shiraz
  # has no bearing on what the sultans said they were.
  legitimation: { values: [descent], source: horton-middleton-2000 }

turning_points:
  - year: 1277
    type: succession-crisis
    name: The Mahdali
    changed: >-
      The Shirazi line was displaced by a family from southern Arabia claiming
      descent from the Prophet, and the new dynasty rebuilt the town on a
      different scale — the Great Mosque enlarged with domes and vaulting, and
      Husuni Kubwa on the cliff above the harbour, a palace and warehouse
      complex with something over a hundred rooms and an octagonal bathing pool.
      The change of dynasty is when Kilwa's hold on the Sofala gold becomes
      total, and the buildings are the evidence for what it was worth.
    source: horton-middleton-2000
    contested: false
  # Da Gama's tribute is three years before Almeida, and Barbosa's editor calls
  # the ruler who paid it a usurper.
  - year: 1502
    type: treaty
    name: The tribute
    changed: >-
      Vasco da Gama, on his second voyage, extracted two thousand mithqals of
      gold from a sultan who had taken the throne by force and whose own people
      would not fight for him, and Kilwa was thereafter held in Lisbon to be
      tributary to the crown of Portugal. The sultanate had agreed to pay an
      annual sum to a power that had called twice and could not be reached, and
      the argument about whether it would go on paying is what brought the
      fleet of 1505.
    source: barbosa-dames
    contested: false
  - year: 1505
    type: siege
    name: The Portuguese
    changed: >-
      Almeida took the town with about five hundred men and no serious fighting,
      installed a puppet, and built a fort the Portuguese abandoned within eight
      years. What did not come back was the trade: Portugal took Sofala
      directly the following year and Kilwa's grip on the monsoon gold traffic
      stopped existing. The town survived and the sultanate did not matter
      again.
    source: horton-middleton-2000
    contested: false

measures:
  reach_km2: null
  peak_population: null
  influence:
    descendant_scripts: { count: 0, items: [], source: horton-middleton-2000 }
    religions_carried: { count: 0, items: [], source: horton-middleton-2000 }
    successor_claims: { count: 0, items: [], source: horton-middleton-2000 }
