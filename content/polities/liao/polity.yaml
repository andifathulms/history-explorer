id: liao
region: china

name:
  latin: Liao Empire
  script: 大遼
  script_lang: zh

span:
  start: { min: 916, max: 916, source: franke-twitchett-1994 }
  end: { min: 1125, max: 1125, source: franke-twitchett-1994 }

identity: >-
  The Khitan empire of the northern frontier, which governed steppe and
  farmland through two separate administrations at once.

capitals:
  - { name: Shangjing, script: 上京, from: 916, source: franke-twitchett-1994 }

core_region: Manchuria and the northern steppe

rulers:
  founder: { name: Abaoji, reign: [916, 926], source: franke-twitchett-1994 }
  peak: { name: Emperor Shengzong, reign: [982, 1031], source: franke-twitchett-1994 }
  last: { name: Emperor Tianzuo, reign: [1101, 1125], source: franke-twitchett-1994 }

scripts_and_languages:
  administration: [Khitan, Chinese]
  writing_system: Khitan

ended:
  type: conquest
  by: [jin]
  year: 1125
  source: franke-twitchett-1994

# A real predecessor with no record here: the settled kingdom the Liao annexed
# in its founding decade, whose administration it then used.
preceded_by_external:
  - name: Bohai
    type: absorbed remnants of
    year: 926
    note: >-
      A settled kingdom in eastern Manchuria and northern Korea, three centuries
      old, literate, organised on Tang lines with five capitals and a full
      bureaucracy. Abaoji destroyed it in about three months, renamed it Dongdan
      and installed his eldest son as its king, and died on the way home from
      the campaign. What his successors inherited was therefore a steppe
      confederation, a settled Chinese farming population in walled towns, and
      an entire conquered kingdom with a working Chinese-style administration
      already in it — which is the problem the two-administration system was
      built to solve.
    source: franke-twitchett-1994

institutions:
  # The ordo — a standing household guard raised for each emperor from tribal
  # levies and inherited by his tomb establishment rather than his successor —
  # on top of the ordinary tribal cavalry. It is a military institution designed
  # so that no emperor inherits his predecessor's army.
  military_basis: { values: [tribal-levy], source: franke-twitchett-1994 }
  # Two values where this record used to carry one. `tribute` was here for the
  # Song payments, which the second chapter is about, and it left out the other
  # half of the arrangement the first chapter describes: the Southern
  # Administration taxed a settled Chinese and Bohai population on agricultural
  # land, in the ordinary way, and that population was the majority of the
  # empire's people.
  #
  # A record whose whole subject is governing two things at once should not have
  # been coded for only one of them.
  revenue_basis: { values: [tribute, land-tax], source: franke-twitchett-1994 }
  # Null. Khitan succession was contested at almost every transition, with the
  # empress dowagers of the Xiao consort clan — which supplied every Liao empress
  # and much of the officer corps — deciding several of them by force. There is a
  # Chinese-style heir apparent in the record and there is a steppe assembly
  # behind it, and the sources do not let this site say which was the rule.
  succession_rule: null
  legitimation: { values: [descent, divine-sanction], source: franke-twitchett-1994 }

turning_points:
  - year: 947
    type: capital-move
    name: The name Liao
    changed: >-
      A Khitan army took Kaifeng, the capital of the Chinese dynasty then holding
      the north, could not hold the city, and withdrew — but on the way the
      emperor adopted a Chinese dynastic name, Liao, and the apparatus that went
      with it.
      It is the point at which a steppe confederation started claiming to be a
      Chinese dynasty as well, keeping both sets of books — and the Jurchen and
      the Mongols after them took the arrangement over intact.
    source: franke-twitchett-1994
    contested: true
  - year: 1005
    type: treaty
    name: "The Treaty of Chanyuan"
    changed: >-
      The Song paid an annual sum in silver and silk and the frontier stayed
      quiet for a hundred and twenty years. The two courts addressed each
      other as formal equals with negotiated borders, which no Chinese
      diplomatic template provided for, and the border markets it opened
      profited both economies.
    source: franke-twitchett-1994
    contested: false
  - year: 1114
    type: revolt
    name: The Jurchen
    changed: >-
      A vassal people of the north-eastern forests revolted, and eleven years
      later the Liao empire did not exist. The dynasty that took it is this
      corpus's Jin record, and the pattern repeats exactly a century later when
      the Jin are taken by the Mongols — each time by a subject population of the
      forest or steppe margin that the empire had been extracting from.
    source: franke-twitchett-1994
    contested: false

measures:
  reach_km2: { value: 2600000, at: 947, source: taagepera-1997 }
  peak_population: null
  influence:
    descendant_scripts:
      count: 2
      items: [Khitan large script, Khitan small script]
      source: franke-twitchett-1994
    religions_carried: { count: null, items: [], source: null }
    successor_claims: { count: null, items: [], source: null }
