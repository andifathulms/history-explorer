id: konbaung
region: mainland-southeast-asia

name:
  latin: Konbaung Dynasty (Alaungpaya Dynasty)
  script: ကုန်းဘောင်ခေတ်
  script_lang: my

# harvey-1925 dates the fall of Ava, and the beginning of Alaungpaya's
# own resistance at his home village of Moksobomyo (Shwebo), to 1752.
span:
  start: { min: 1752, max: 1752, source: harvey-burma-1925 }
  # The coverage now runs through six reigns - Alaungpaya, Naungdawgyi,
  # Hsinbyushin, Singu, Bodawpaya and Bagyidaw - to the outbreak of the
  # First Anglo-Burmese War in March 1824, which is where harvey-1925
  # itself stops ("to 10 March 1824, the beginning of the English
  # conquest"). This is still not an institutional end: the dynasty
  # fought two further wars with Britain and endured until the
  # annexation of Upper Burma in 1885. A later source covering 1824-85
  # would be needed to carry this record the rest of the way.
  end: { min: 1824, max: 1824, source: harvey-burma-1925 }

identity: >-
  A village headman's dynasty, raised from a stockade of felled toddy
  trees against a Talaing army that had just burned the old Burmese
  capital, that went on to sack Ayutthaya, repel four Chinese
  invasions and conquer Arakan under its founder's own sons - before a
  later king, certain that one Burman was worth four Englishmen,
  marched into a war with the East India Company his own court had no
  accurate idea how to measure.

capitals:
  - { name: Shwebo (Moksobomyo), from: 1752, source: harvey-burma-1925 }

core_region: Upper Burma, expanding under its founder to Lower Burma and briefly into Siam

rulers:
  # harvey-1925 dates Alaungpaya's own birth to 1714 at Shwebo, his
  # rising against the Talaings to 1752, and his death, on the retreat
  # from Ayutthaya, to 11 May 1760.
  founder: { name: Alaungpaya, reign: [1752, 1760], source: harvey-burma-1925 }
  # harvey-1925 calls Bodawpaya, on the chronicles' own judgment, the
  # most powerful king to rule Burma with the possible exception of
  # Bayinnaung (1551-81) - a thirty-seven-year reign that added Arakan
  # outright and left the kingdom at its largest territorial extent of
  # the reigns covered so far.
  peak: { name: Bodawpaya, reign: [1782, 1819], source: harvey-burma-1925 }
  # Provisional, not a claim that the dynasty ended here. Coverage
  # currently stops in March 1824 with Bagyidaw still on the throne
  # and the First Anglo-Burmese War just beginning; the dynasty's
  # actual last king, Thibaw, was deposed by the British in 1885.
  last: { name: null, source: null }

scripts_and_languages:
  administration: [Burmese]
  writing_system: Burmese script

institutions:
  military_basis: null
  revenue_basis: null
  succession_rule: null
  # harvey-1925 records Alaungpaya claiming descent from a fifteenth-
  # century Ava commandant, Nawrahta, though the source calls the
  # genealogy unproved; his own real authority rested on his standing
  # as hereditary myothugyi (headman) of Shwebo and the loyalty his
  # own resistance to the Talaings earned from neighbouring villages.
  legitimation: { values: [descent, conquest], source: harvey-burma-1925 }

preceded_by_external:
  - name: the restored Mon kingdom of Pegu
    type: overthrew
    year: 1752
    note: >-
      Alaungpaya rose from the village of Moksobomyo after Talaing
      (Mon) forces occupying Ava dismissed his village's resistance as
      not worth pursuing; he went on to drive the occupiers out of
      upper Burma and, within a few years, out of Pegu itself,
      founding the Konbaung dynasty on the strength of that campaign.
    source: harvey-burma-1925
    contested: false

succeeded_by_external: []

ended: null

turning_points:
  - year: 1752
    type: revolt
    name: "The stockade at Shwebo"
    changed: >-
      Rather than submit to the victorious Talaings as his own father
      urged, Alaungpaya fortified his village with a stockade of
      felled toddy trees and a moat, ambushed the Talaing detachment
      sent to collect his family's homage, and destroyed a much larger
      punitive force soon after in a night sortie that Burmese
      soldiers credited to the spirit Rider of the White Horse fighting
      at their side - the start of an uprising that drew fighters from
      across Upper Burma within months.
    source: harvey-burma-1925
    contested: false
  - year: 1753
    type: siege
    name: "Alaungpaya camps under the walls of Ava"
    changed: >-
      Within eighteen months of the Talaing sack of Ava, Alaungpaya's
      own forces had reversed the position entirely, camping under the
      city's own walls and beating back Talaing attempts to dislodge
      them - a reversal harvey-1925 credits to the willingness of
      rival Upper Burma leaders, men "who had not to go back nine
      generations to claim royal blood," to place their own forces
      under Alaungpaya rather than compete with him.
    source: harvey-burma-1925
    contested: false
  - year: 1760
    type: catastrophe
    name: "Death on the retreat from Ayutthaya"
    changed: >-
      A siege of the Siamese capital Ayutthaya, launched too late in
      the dry season and undermined by dysentery in his own camp,
      forced Alaungpaya into retreat; already ill, he died at dawn on
      11 May 1760 during the withdrawal, his death kept secret by his
      own attendants - who continued issuing orders in his name from
      his curtained litter - until the crown prince could be secured
      on the throne at Shwebo.
    source: harvey-burma-1925
    contested: false
  - year: 1767
    type: siege
    name: "The fall of Ayutthaya"
    changed: >-
      After a fourteen-month siege that outlasted both of its own
      commanders, Hsinbyushin's army breached the walls of the Siamese
      capital on 28 March 1767, burning it beyond rebuilding and
      carrying its population north - even as Qing China invaded Upper
      Burma in the same years, forcing the victorious armies to rush
      home and fight a second war they had not chosen the timing of.
    source: harvey-burma-1925
    contested: false
  - year: 1782
    type: succession-crisis
    name: "The massacre of the kinsmen"
    changed: >-
      A midnight coup replaced the drunken, erratic Singu with a
      puppet cousin who reigned seven days before Bodawpaya, senior of
      Alaungpaya's surviving sons, took the throne himself and
      executed every rival claimant along with their households -
      restoring, by force, the rule that royal brothers should succeed
      each other in order of seniority, which Hsinbyushin had broken
      by naming his own son heir a generation before.
    source: harvey-burma-1925
    contested: false
  - year: 1785
    type: treaty
    name: "The conquest of Arakan"
    changed: >-
      Bodawpaya annexed the war-weakened coastal kingdom of Arakan,
      giving his own kingdom, for the first time, a land border with
      territory the English East India Company governed directly in
      Bengal - a frontier that would spend the next four decades
      turning refugee crossings and border skirmishes into the spark
      for a war with Britain neither side yet had reason to expect.
    source: harvey-burma-1925
    contested: false
  - year: 1824
    type: battle
    name: "The king decides on war"
    changed: >-
      Convinced by decades of unbroken victories over neighbours no
      other power respected that one Burman was worth four
      Englishmen, Bagyidaw's court and army together pushed the king
      into a war with the East India Company; Burmese troops crossed
      into British territory in January 1824, and the Governor-General
      of India proclaimed a state of war on 5 March, opening a
      conflict the Burmese court had no accurate means of measuring
      the size of the power it had just challenged.
    source: harvey-burma-1925
    contested: false

