id: merovingian
region: frankish-world

name:
  latin: Regnum Francorum
  script: null
  script_lang: null

span:
  # Childeric I died in 481 and his sixteen-year-old son Clovis succeeded
  # him as king of the Salian Franks around Tournai.
  start: { min: 481, max: 481, source: sergeant-1898 }
  # Pope Zachary's sanction for Childeric III's deposition was given
  # shortly before Zachary's own death in March 752; Childeric was
  # actually deposed, tonsured and sent to a monastery in 751.
  end: { min: 751, max: 751, source: einhard-turner }

identity: >-
  The Frankish kingdom that outlasted the western Roman Empire it grew up
  inside of - founded by a warlord who eliminated every rival of his own
  blood, reunited more than once after being carved apart by its own
  inheritance custom, and finally emptied of power by its hereditary
  officials.

capitals:
  - { name: Paris, from: 486, source: gregory-brehaut }

core_region: Gaul, from the Rhine to the Pyrenees

rulers:
  founder: { name: Clovis I, reign: [481, 511], source: sergeant-1898 }
  # The last Merovingian to hold genuine personal power rather than being
  # a figurehead for his own mayor of the palace.
  peak: { name: Dagobert I, reign: [629, 639], source: fredegar-wallace-hadrill }
  last: { name: Childeric III, reign: [743, 751], source: einhard-turner }

scripts_and_languages:
  administration: [Latin]
  writing_system: Latin

institutions:
  # Frankish armies were raised from the free landholding population
  # obliged to appear armed when the king summoned them, alongside the
  # armed retinues - the trustis - that bound individual warriors
  # personally to a king or a great lord.
  military_basis: { values: [tribal-levy, client-levy], source: wickham-2009 }
  # Merovingian kings, unlike their Roman predecessors, had no general
  # land tax or assessment; royal income came overwhelmingly from the
  # king's own vast estates, from tolls, and from the plunder and
  # tribute a successful campaign produced.
  revenue_basis: { values: [plunder, tribute], source: wickham-2009 }
  # Frankish custom, unlike Roman practice, treated the kingdom as
  # partible property to be divided among a king's surviving sons - the
  # single fact that explains most of this record's own turning points.
  succession_rule: { values: [appanage], source: gregory-brehaut }
  legitimation: { values: [descent, divine-sanction], source: gregory-brehaut }

preceded_by_external: []

succeeded_by_external: []

ended:
  type: dynastic replacement
  by: [carolingian]
  year: 751
  source: einhard-turner

turning_points:
  - year: 486
    type: battle
    name: "Clovis defeats Syagrius at Soissons"
    changed: >-
      Clovis destroyed the last organized Roman military authority left
      in northern Gaul, executed its commander in secret once Soissons
      was his, and claimed for himself the territory that Roman rule had
      still nominally governed.
    source: gregory-brehaut
    contested: false
  - year: 496
    type: conversion
    name: "Clovis is baptized at Reims"
    changed: >-
      Clovis abandoned the traditional Frankish gods for Catholic
      Christianity - a choice, unlike the Arian creed most other Germanic
      kings in the west had adopted, that put him on the same side of a
      live theological divide as the Gallo-Roman bishops and population
      he now ruled. Gregory of Tours, writing decades later, places the
      conversion here; other reconstructions of the chronology put it as
      much as a decade later.
    source: gregory-brehaut
    contested: true
  - year: 507
    type: battle
    name: "Clovis defeats the Visigoths at Vouillé"
    changed: >-
      Clovis killed the Visigothic king Alaric II in battle near
      Poitiers and took most of Aquitaine from Visigothic rule, pushing
      the Visigoths' own kingdom back into Spain and leaving Frankish
      power dominant across nearly all of Gaul.
    source: gregory-brehaut
    contested: false
  - year: 511
    type: succession-crisis
    name: "The kingdom is divided among four sons"
    changed: >-
      Clovis's death triggered a custom that would repeat for generations
      afterward: the kingdom was treated as inheritable property, to be
      split between his four surviving heirs rather than kept whole under
      one of them, setting a pattern of division and reunification among
      rival Frankish courts that shaped everything the dynasty did next.
    source: gregory-brehaut
    contested: false
  - year: 575
    type: catastrophe
    name: "Sigebert I is assassinated"
    changed: >-
      Sigebert of Austrasia, on the point of being acclaimed king over
      his own murdered brother Chilperic's Neustrian throne as well,
      was cut down by two poisoned blades sent, Gregory of Tours states
      plainly, at Queen Fredegund's own order - opening decades of open
      war between the Austrasian and Neustrian courts.
    source: gregory-brehaut
    contested: false
  - year: 584
    type: catastrophe
    name: "Chilperic I is murdered"
    changed: >-
      Chilperic of Neustria, whom Gregory of Tours calls the Nero and
      Herod of his age, was stabbed to death returning from a hunt,
      leaving his infant son Chlothar II under his mother Fredegund's
      own regency and the war with Austrasia still unresolved.
    source: gregory-brehaut
    contested: false
  - year: 613
    type: succession-crisis
    name: "Brunhild is executed and the kingdom reunited"
    changed: >-
      Chlothar II, Fredegund's own son, captured his lifelong rival and,
      before his own assembled nobles, laid a whole generation's worth of
      royal deaths at her door, then had her tortured for days and
      finally torn apart by a horse - closing four decades of feuding
      between two royal courts and putting the entire Frankish
      inheritance back under a single crown.
    source: fredegar-wallace-hadrill
    contested: false
  - year: 639
    type: succession-crisis
    name: "Dagobert I dies at Saint-Denis"
    changed: >-
      The king later tradition would remember as the last Merovingian
      who genuinely ruled rather than merely reigned died of illness at
      the abbey he had spent his reign enriching, commending his young
      son and widow to his own chief adviser - a deathbed arrangement
      that left the realm's actual governance to trusted officials even
      before any child-king could take the throne.
    source: fredegar-wallace-hadrill
    contested: false
  - year: 687
    type: battle
    name: "The Battle of Tertry"
    changed: >-
      Pepin of Herstal, mayor of the palace in Austrasia, crushed the
      Neustrian king's own mayor near Saint-Quentin and took possession
      of the defeated king's person and treasury - the point after which
      one family's mayors, not the kings whose name they governed in,
      ran the whole Frankish realm without serious rival.
    source: fredegar-wallace-hadrill
    contested: false
  - year: 751
    type: reform
    name: "Childeric III is deposed"
    changed: >-
      Pepin the Short put a loaded question to the Pope - whether real
      authority or the bare name of king ought to decide who wore the
      crown - got the answer he had engineered, had Childeric III
      tonsured and shut in a monastery, and was raised up himself in his
      place, ending the rule of a dynasty that had, by then, been reduced
      to riding an ox-cart to its own assemblies.
    source: einhard-turner
    contested: false

