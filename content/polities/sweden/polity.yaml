id: sweden
region: scandinavia

name:
  latin: Kingdom of Sweden
  script: Sverige
  script_lang: sv

span:
  # Snorri Sturluson traces the early Swedish kings back to a legendary
  # Yngling line descended from the god Frey's own son - foundation
  # legend rather than history. The first Swedish king this record
  # treats as historical is Eric the Victorious, whose defeat of his own
  # nephew Styrbjörn at the Battle of Fyrisvellen, near Uppsala, is
  # dated by the sources only approximately, to around 983.
  start: { min: 983, max: 983, source: stefansson-denmark-1916 }
  # This record now runs to the Act of Union with Norway in 1815 - the
  # last event it has sourced chapters for - not to the kingdom's
  # actual institutional end, since Sweden has none: it continues as a
  # sovereign state to the present day. `ended` below is null for that
  # reason as well as for the coverage reason.
  end: { min: 1815, max: 1815, source: stefansson-denmark-1916 }

identity: >-
  A Norse kingdom raised to a European great power under Gustavus
  Adolphus, reduced by Charles XII's wars to a weak oligarchy, and
  twice restored to real monarchy by force before losing Finland to
  Russia and gaining Norway instead in 1814.

capitals:
  - { name: Uppsala, source: stefansson-denmark-1916 }

core_region: The Mälaren valley and Uppland, centred on Uppsala

rulers:
  # Reign dates are the sources' own approximations - "about 983" to
  # "about 993" - for a king dated more precisely nowhere in this
  # source.
  founder: { name: "Eric the Victorious (Eric Segersäll)", reign: [983, 993], source: stefansson-denmark-1916 }
  # Revised again: Gustav Vasa refounded the Swedish state, but his
  # grandson Gustavus Adolphus is named outright by this source as the
  # greatest figure in Swedish history - the king whose victory at
  # Breitenfeld in 1631 broke the supposedly invincible Imperial army
  # and raised Sweden, for the first time, to the rank of a European
  # great power, a reach no earlier Swedish king approached.
  peak: { name: Gustavus Adolphus, reign: [1611, 1632], source: stefansson-denmark-1916 }
  last: null

scripts_and_languages:
  administration: [Old Norse]
  writing_system: Younger Futhark runes

institutions:
  military_basis: null
  revenue_basis: null
  # Election by assembly - Birger Jarl's own son in 1250, Gustav Vasa
  # himself in 1523 - was the rule for most of this record's coverage,
  # but the grateful Estates that met at Västerås in 1544 declared the
  # crown hereditary in Gustav's own family and male descendants,
  # ending that tradition for good.
  succession_rule: { values: [primogeniture], source: stefansson-denmark-1916 }
  # Descent and election both mattered across this record's history -
  # the Yngling genealogy for the earliest kings, the Estates' judgment
  # of merit for Gustav Vasa's own 1523 election - but from 1544 the
  # Vasa family's own hereditary right, granted by that same Estates,
  # became the crown's legitimating claim in its own right.
  legitimation: { values: [descent, election], source: stefansson-denmark-1916 }

preceded_by_external: []

succeeded_by_external: []

# Sweden did not end in 1008 - it continues as a sovereign state to the
# present day. This record's own span ends where its sourced coverage
# currently stops, not because a conquest, dynastic replacement or
# fragmentation actually ended the kingdom there.
ended: null

turning_points:
  - year: 983
    type: battle
    name: "The Battle of Fyrisvellen"
    changed: >-
      Eric the Victorious broke an invading force of mercenary raiders
      from Jomsborg and their Danish allies near Uppsala, cutting down
      his own sister's son, who had led them against him - a triumph
      tradition attributes to a pledge that Eric would offer his own
      life to Odin within a decade, a bargain he is said to have
      honoured when he died around 993.
    source: stefansson-denmark-1916
    contested: true
  - year: 1000
    type: battle
    name: "The Battle of Svolder"
    changed: >-
      Olof Skötkonung, allied with his own new stepfather-by-marriage
      Sweyn Forkbeard of Denmark, helped defeat and kill Norway's own
      king in the naval ambush off Svolder, and the two victors split
      Norway's overlordship between them for the next fifteen years,
      until a Norwegian claimant reclaimed it outright.
    source: stefansson-denmark-1916
    contested: false
  - year: 1008
    type: conversion
    name: "Olof's baptism at Husaby"
    changed: >-
      An English missionary named Sigfrid baptized Olof Skötkonung at a
      royal estate in West Götaland - making him the first Swedish king to
      accept Christianity, even though the old religion centred on
      Uppsala's own temple would take generations longer to lose its
      hold over most of his subjects.
    source: stefansson-denmark-1916
    contested: false
  - year: 1249
    type: conversion
    name: "Birger Jarl's crusade to Finland"
    changed: >-
      Answering a papal call to defend Christian settlements around
      Åbo from Karelian and Russian pressure, Birger Jarl led a crusade
      into Tavastland, conquered and Christianized it, and built the
      fortress of Tavastehus to secure his gains - bringing
      Finland under lasting Swedish rule and expanding a kingdom his
      own regency for a child king already governed in all but name.
    source: stefansson-denmark-1916
    contested: false
  - year: 1397
    type: treaty
    name: "The Kalmar Union crowned"
    changed: >-
      After defeating and capturing Sweden's own puppet king Albrecht
      of Mecklenburg at Falköping and finally taking Stockholm from
      his German garrison, Margaret of Denmark had her grand-nephew
      crowned with a single triple crown representing Denmark, Norway
      and Sweden at once - a coronation held at Kalmar rather than in
      any one kingdom's own capital, so that none could claim
      precedence over the others. The union's written terms promised
      each kingdom continued independence; Margaret never actually
      promulgated them, and Danish officials placed in Swedish offices
      would define the union's real character for the century that
      followed far more than the terms signed at Kalmar did.
    source: stefansson-denmark-1916
    contested: false
  - year: 1436
    type: revolt
    name: "Engelbrekt's rebellion deposes King Eric"
    changed: >-
      A Dalecarlian rebellion against Eric of Pomerania's absentee,
      extractive rule - led by Engelbrekt Engelbrektsson after his own
      repeated appeals to the king went nowhere - freed nearly all of
      Sweden from Danish officials within four months and forced the
      state council to depose Eric outright, electing Engelbrekt
      regent at the first Swedish parliament ever to include burgesses
      and peasants. Engelbrekt's own murder by a rival noble's son
      within the year did not undo what the rising had proven: that a
      provincial peasant army could force the union's own hand, a
      precedent Gustav Vasa's rebellion would draw on directly less
      than a century later.
    source: stefansson-denmark-1916
    contested: false
  - year: 1523
    type: succession-crisis
    name: "Gustav Vasa elected at Strängnäs"
    changed: >-
      With Christian II driven from Denmark and no clear ruler left to
      claim Sweden, an assembly at Strängnäs unanimously chose Gustaf
      Eriksson as king over his own genuine objections that an older
      Council noble would serve better - ending, in the same act,
      Danish overlordship and opening the reign of a new royal line.
    source: stefansson-denmark-1916
    contested: false
  - year: 1531
    type: revolt
    name: "The third Dalecarlian rebellion"
    changed: >-
      The Dalecarlians who had once made Gustav Vasa their king rose
      against him for a third time, first over a church-bell
      levy to pay Sweden's war debt and, before that, over his own
      sympathy for Lutheran reform - and were made to kneel through a
      day-long royal harangue threatening to lay their country waste if
      they defied him again, a final breach between the king and the
      power base that had made him.
    source: stefansson-denmark-1916
    contested: false
  - year: 1544
    type: reform
    name: "The Diet of Västerås"
    changed: >-
      A grateful Estates, meeting at Västerås once the last peasant
      revolt was crushed, declared the Swedish crown hereditary in
      Gustav Vasa's own family and completed the kingdom's Lutheran
      Reformation, replacing chapter-elected bishops with crown-
      appointed superintendents - ending centuries of elective kingship
      and putting more than twelve thousand church estates under royal
      control by the end of the reign.
    source: stefansson-denmark-1916
    contested: false
  - year: 1611
    type: succession-crisis
    name: "Gustavus Adolphus inherits three wars at once"
    changed: >-
      Not yet seventeen when his father died, Gustavus Adolphus
      inherited a kingdom fighting Russia, wary of an expansionist
      Poland far larger than itself, and struggling even to hold its
      own against Denmark - and secured the nobility's loyalty by
      granting a royal charter that bound his own hand on taxation,
      lawmaking, war and peace alike.
    source: stefansson-denmark-1916
    contested: false
  - year: 1631
    type: battle
    name: "The Battle of Breitenfeld"
    changed: >-
      Gustavus Adolphus broke Tilly's supposedly invincible Imperial
      army outside Leipzig using shallow infantry lines, light muskets
      and mobile field artillery against the old massed Spanish square
      formation - a tactical revolution that killed or captured twelve
      thousand Imperial troops for seven hundred Swedish dead, and put
      Sweden, overnight, among the great powers of Europe.
    source: stefansson-denmark-1916
    contested: false
  - year: 1632
    type: battle
    name: "The Battle of Lützen"
    changed: >-
      Riding to rescue his own overwhelmed cavalry wing in heavy fog,
      Gustavus Adolphus was wounded, separated from all but a handful
      of attendants, and killed by pursuing Croatian horsemen; his
      riderless, blood-soaked horse running back through the Swedish
      lines announced his death to an army that broke Wallenstein's own
      line in a final vengeful charge before the field of Lützen fell
      quiet.
    source: stefansson-denmark-1916
    contested: false
  - year: 1700
    type: battle
    name: "The Battle of Narva"
    changed: >-
      Charles XII marched fewer than eight thousand exhausted men to
      relieve a Russian siege of Narva and threw them straight into the
      Tsar's entrenchments during a snowstorm the moment they arrived,
      taking more prisoners than his own army numbered - a victory that
      made his name across Europe and left him fatally contemptuous of
      Russia as a serious opponent.
    source: stefansson-denmark-1916
    contested: false
  - year: 1709
    type: battle
    name: "The Battle of Poltava"
    changed: >-
      An invasion of Russia that survived the coldest winter in living
      memory only to be halved by cold and hunger met its end at
      Poltava, where a miscommunication sent Sweden's elite Guards
      forward alone into massed Russian artillery fire the powder-
      starved Swedes could not answer; the army collapsed, fourteen
      thousand men surrendered days later, and Charles fled into
      Ottoman territory with fifteen hundred survivors.
    source: stefansson-denmark-1916
    contested: false
  - year: 1718
    type: catastrophe
    name: "The death of Charles XII"
    changed: >-
      Inspecting the siege works at Fredriksten in Norway as he always
      did, exposed and unarmoured, Charles XII was struck through both
      temples by a cannon shot and died instantly, his corpse found
      still upright with a fixed grip on its own drawn blade; his own
      minister Görtz, who had propped up the king's crumbling position
      for years by claims of unwritten royal authority, was arrested
      the next day and beheaded within two months.
    source: stefansson-denmark-1916
    contested: false
  - year: 1720
    type: reform
    name: "The constitution of the Age of Liberty"
    changed: >-
      Ulrica Leonora's abdication in her husband's favour came bundled
      with a new frame of government that left the throne almost
      powerless - unable even to pick its own Council - and put the
      House of Nobles' Secret Committee in charge of Sweden for the
      next half-century.
    source: stefansson-denmark-1916
    contested: false
  - year: 1721
    type: treaty
    name: "The Peace of Nystad"
    changed: >-
      With Sweden's coasts burned by unopposed Russian raids and no
      help forthcoming from an inactive British fleet in the Baltic,
      Sweden gave up nearly all its remaining eastern Baltic
      territories to Russia outright, closing twenty-one years of war
      and, in the same stroke, the absolute personal monarchy that had
      ruled Sweden since Charles XI's own reign.
    source: stefansson-denmark-1916
    contested: false
  - year: 1772
    type: revolt
    name: "Gustavus III's coup"
    changed: >-
      Acting alone in Stockholm after word of his own conspirators'
      plans leaked to the Council, Gustavus III seized the capital in a
      single day with the Guards' support, forced a paralysed
      parliamentary oligarchy to accept a new frame of government
      without debate, and put the throne back in charge of its own
      officials, treaties and soldiers.
    source: stefansson-denmark-1916
    contested: false
  - year: 1792
    type: catastrophe
    name: "The assassination of Gustavus III"
    changed: >-
      Shot at a masked ball by aristocratic conspirators still
      resentful of the power he had taken from them twenty years
      earlier, Gustavus III lingered for twelve days, forgave the plot
      openly, and left the throne to a son whose own reign would end
      far less mercifully.
    source: stefansson-denmark-1916
    contested: false
  - year: 1809
    type: succession-crisis
    name: "The arrest of Gustavus IV"
    changed: >-
      Officers who had fought and lost Finland under his command
      arrested Gustavus IV in his own palace to stop him dragging the
      country into a two-front war it could not survive; the Estates
      declared his entire line forfeit of the crown and adopted the
      constitution that still governs Sweden today.
    source: stefansson-denmark-1916
    contested: false
  - year: 1809
    type: treaty
    name: "The Treaty of Fredrikshamn"
    changed: >-
      With Russian troops having crossed the frozen sea to Sweden's own
      shore on foot, the kingdom gave up Finland entirely, along with
      the Åland Islands and its Lapland holdings east of the Tornea
      river, surrendering in one stroke a province the crown had
      governed since the thirteenth century.
    source: stefansson-denmark-1916
    contested: false
  - year: 1814
    type: treaty
    name: "The Peace of Kiel and the union with Norway"
    changed: >-
      A French marshal elected Crown Prince six years after Sweden lost
      Finland forced Denmark to cede Norway instead, and after a brief
      war and the Convention of Moss, Norway's own parliament accepted
      union under the Swedish crown while keeping its own laws, army
      and constitution.
    source: stefansson-denmark-1916
    contested: false

