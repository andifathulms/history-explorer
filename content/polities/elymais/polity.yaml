id: elymais
region: pre-islamic-iran

name:
  latin: Elymais
  script: Ἐλυμαΐς
  script_lang: grc

span:
  start: { min: -147, max: -147, source: wiesehofer-1996 }
  end: { min: 224, max: 224, source: wiesehofer-1996 }

identity: >-
  The last kingdom of Elam: temple country in the Zagros above Susa, rich enough
  that two Seleucid kings died trying to rob it, and known now almost entirely
  from coins and rock reliefs.

capitals:
  - { name: Seleucia on the Hedyphon, source: wiesehofer-1996 }

core_region: Khuzistan and the Zagros foothills above Susa

rulers:
  founder: { name: Kamnaskires I, source: wiesehofer-1996 }
  peak: { name: null, source: null }
  last: { name: null, source: null }

scripts_and_languages:
  administration: [Greek, Aramaic]
  writing_system: Greek, and later Aramaic

ended:
  type: conquest
  by: [sasanian]
  year: 224
  source: wiesehofer-1996

institutions:
  military_basis: null
  # The Susiana plain is irrigated and productive and the kingdom lived on it.
  # What the sources actually talk about is the temple treasuries, which were
  # famous, were repeatedly robbed, and are not a revenue basis in any sense
  # this vocabulary has — an accumulated hoard is a stock rather than an income,
  # and coding `mining` or `tribute` for it would be false. The second chapter
  # is about the gap.
  revenue_basis: { values: [land-tax], source: wiesehofer-1996 }
  succession_rule: null
  # Null. The coins carry royal portraits, Greek epithets and later Aramaic
  # legends, and nothing consulted describes a ground on which these kings
  # asserted a right to rule. The corpus does not read a claim off an epithet
  # when it has nothing else — which is a line the Greco-Bactrian record crosses
  # deliberately and explains, and which this record declines to cross because
  # it has less.
  legitimation: null

turning_points:
  # Antiochus III died attempting the same temples in 187 and Antiochus IV in
  # 164, both before the Kamnaskirid kingdom itself existed (it dates from
  # about 147); their deaths are named here rather than given their own
  # entries because a turning point has to fall inside a polity's own span,
  # and both predate this one.
  - year: -139
    type: siege
    name: "Mithridates in the temples"
    changed: >-
      The Parthian king took Elymais and plundered its sanctuaries himself,
      succeeding where two Seleucid kings had died trying: Antiochus III at
      the same temples in 187, and Antiochus IV, driven off from an attempt
      at one remove, at Gabae in 164 — a death the Jewish tradition read as
      judgment for his persecution of Judaea. Mithridates was not driven off,
      and the kingdom was a Parthian vassal for the rest of its life. It also
      removed the accumulated treasure that had made all three attempts worth
      making, which is the only period in which this small kingdom was of
      consequence to anybody outside it.
    source: wiesehofer-1996
    contested: false
  - year: 224
    type: battle
    name: "The set completed"
    changed: >-
      Ardashir took Elymais on his way to everything else — Fars first, then
      Kerman, then Elymais and the Gulf coast, then Ctesiphon and the empire
      itself. It was one of six Parthian vassal kingdoms that fell to him in
      the same sequence, identical in structure to the other five and at the
      bottom of their range of consequence: Armenia still exists, Persis
      produced the dynasty that replaced the whole arrangement, and Elymais
      had temples somebody robbed.
    source: wiesehofer-1996
    contested: false

